<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Assisted Spreadsheet and Data Cleaning Tools (Practical) | MTTI Artificial Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #00695C 0%, #1A237E 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 24px; }
        .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 6px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .scenario { background: rgba(255,255,255,0.14); backdrop-filter: blur(10px); border-radius: 16px; padding: 16px 22px; margin-bottom: 20px; border-left: 5px solid #ffd54f; font-size: 0.95em; line-height: 1.55; }
        .task { background: #fff; color: #333; border-radius: 20px; padding: 24px; margin-bottom: 16px; box-shadow: 0 14px 40px rgba(0,0,0,0.25); }
        .task-num { display: inline-block; width: 28px; height: 28px; background: linear-gradient(135deg, #00695C 0%, #1A237E 100%); color: #fff; border-radius: 50%; text-align: center; line-height: 28px; font-family: 'Fredoka', sans-serif; font-weight: 600; margin-right: 8px; }
        .task h3 { font-family: 'Fredoka', sans-serif; font-size: 1.05em; display: inline; }
        .options { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 12px 16px; border-radius: 10px; cursor: pointer; transition: all 0.2s; font-family: 'Space Mono', monospace; font-size: 0.92em; text-align: left; }
        .option:hover:not(.disabled) { background: #e0f2f1; border-color: #00695C; }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; }
        .feedback { margin-top: 14px; padding: 12px 16px; border-radius: 10px; font-size: 0.9em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .done-banner { text-align: center; padding: 20px; color: #fff; font-family: 'Fredoka', sans-serif; font-size: 1.1em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 8 &middot; Lesson 8.2 &middot; Practical</div>
            <h1>AI-Assisted Spreadsheet and Data Cleaning Tools</h1>
        </div>
        <div class="scenario">Brian is cleaning a spreadsheet of sales transactions for a client with several branches, and the branch-name column is full of spelling and formatting variants.</div>
        <div id="tasks"></div>
        <div class="done-banner" id="doneBanner" style="display:none;">&#9989; Practical complete &mdash; you can move to the quiz.</div>
    </div>
    <script>
        const tasks = [
            {
                "prompt": "The AI feature suggests grouping 'Eldoret Town', 'eldoret twon' and 'ELDORET-TOWN' under one label. What should Brian do first?",
                "options": ["Apply it to the whole column immediately without looking", "Quickly check a few of the actual rows to confirm the grouping is accurate, then apply it", "Ignore the suggestion entirely, it's never useful", "Delete all three variants from the data"],
                "correct": 1,
                "explanation": "The suggestion saves Brian from spotting the pattern manually, but he still confirms it's correct before applying it at scale."
            },
            {
                "prompt": "The AI flags one transaction of 950,000 in a column where nearly every other entry is between 900 and 9,500. What does this flag most likely indicate?",
                "options": ["Definitely a fraud case that needs the police", "A possible data-entry error, like a misplaced decimal, worth checking against the original source", "Nothing — large numbers are always correct", "That the spreadsheet software is broken"],
                "correct": 1,
                "explanation": "An outlier flag is a prompt to check the source data, not an automatic verdict of fraud or a software fault."
            },
            {
                "prompt": "Brian describes in plain language what he wants and the AI suggests a formula. What should he do before using it across the whole sheet?",
                "options": ["Apply it to every row immediately", "Test it on a handful of rows and confirm the result matches what he expects", "Ignore the suggestion since formulas must always be typed manually", "Ask the client to test it instead"],
                "correct": 1,
                "explanation": "Testing on a sample first confirms the suggested formula actually does what Brian intended before it's trusted at scale."
            }
        ];
        function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
        function render(){
            const c = document.getElementById('tasks');
            c.innerHTML = tasks.map((t,i)=>`
                <div class="task" id="task-${i}">
                    <div><span class="task-num">${i+1}</span><h3>${escapeHtml(t.prompt)}</h3></div>
                    <div class="options">
                        ${t.options.map((o,j)=>`<button class="option" onclick="answer(${i},${j})">${escapeHtml(o)}</button>`).join('')}
                    </div>
                </div>`).join('');
        }
        function answer(i,j){
            const task = tasks[i];
            const el = document.getElementById('task-'+i);
            const btns = el.querySelectorAll('.option');
            if (btns[0].classList.contains('disabled')) return;
            btns.forEach(b=>b.classList.add('disabled'));
            btns[task.correct].classList.add('correct');
            const right = j === task.correct;
            if (!right) btns[j].classList.add('wrong');
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right?'correct':'wrong');
            fb.innerHTML = '<strong>' + (right?'✅ Correct.':'❌ Not quite.') + '</strong><br>' + escapeHtml(task.explanation);
            el.appendChild(fb);
            if (i === tasks.length-1) document.getElementById('doneBanner').style.display='block';
        }
        render();
    </script>
</body>
</html>
