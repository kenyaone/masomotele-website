<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervised vs Unsupervised Learning | MTTI Artificial Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #4527A0 0%, #6A1B9A 100%); min-height: 100vh; padding: 20px; color: #fff; }
.container { max-width: 900px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 30px; }
.header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
.header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
.score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
.score-item { text-align: center; }
.score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
.score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
.progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
.exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
.scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
.question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
.options { display: flex; flex-direction: column; gap: 12px; }
.option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
.option:hover:not(.disabled) { background: #f3e5f5; border-color: #6A1B9A; transform: translateX(4px); }
.option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
.option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
.option.disabled { cursor: not-allowed; opacity: 0.85; }
.feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
.feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
.feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
.next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #4527A0 0%, #6A1B9A 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
.results { text-align: center; padding: 25px 15px; }
.results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
.results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #6A1B9A; margin: 20px 0; }
.results p { color: #555; margin-bottom: 12px; }
.badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 2 · Topic 2.1 · Quiz</div>
            <h1>Supervised vs Unsupervised Learning</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"Brian is reviewing a Rafiki Insights client's request: predict which of next month's invoices will be paid late, using five years of invoices that are each already marked 'on time' or 'late'.","question":"What type of learning problem is this?","options":["Unsupervised learning","Supervised learning, since every past invoice already has a known correct outcome","Not a machine learning problem at all","It cannot be determined without more information"],"correct":1,"explanation":"Every training example already has the correct outcome (on time or late) attached, which is the defining feature of supervised learning."},{"scenario":"A different client wants Brian to explore its customer purchase data to see if any natural customer segments exist, with no predefined categories at all.","question":"What type of learning problem is this?","options":["Supervised learning","Unsupervised learning, since there is no known label to predict","The same type of problem as predicting late invoices","A data entry problem, not a learning problem"],"correct":1,"explanation":"With no labels or predefined outcome to predict, the task is to discover structure in the data on its own \u2014 this is unsupervised learning."},{"scenario":"Brian explains to a client that a model 'learned' which loan applications tend to default by studying thousands of past applications, each already marked as 'defaulted' or 'repaid'.","question":"What is the label in this example?","options":["The applicant's name","Whether the past loan was defaulted or repaid","The size of the dataset","The bank's location"],"correct":1,"explanation":"The label is the known outcome the model is trying to predict \u2014 here, whether the loan was defaulted or repaid."},{"scenario":"A Rafiki Insights client says: 'We don't have any past outcomes recorded, we just want to know what natural groups exist among our suppliers.'","question":"Which approach fits this request?","options":["Supervised learning, since suppliers are being analyzed","Unsupervised learning, since there is no known outcome to predict","This cannot be studied with data","Supervised learning, but only with more suppliers"],"correct":1,"explanation":"Since there is no known, correct outcome to predict, only patterns to discover, this fits unsupervised learning."},{"scenario":"Brian is deciding how to describe supervised learning to a client who has never heard the term.","question":"Which explanation is most accurate?","options":["A model that is manually operated by a person at all times","A model trained on past examples that already include the correct answer for each one","A model that only works with images","A model that requires no data at all"],"correct":1,"explanation":"Supervised learning specifically means training on examples that already include known, correct answers (labels)."},{"scenario":"A client asks Brian whether unsupervised learning can be used to predict next month's exact sales figure for each customer.","question":"Is this an appropriate use of unsupervised learning?","options":["Yes, unsupervised learning is ideal for predicting specific known outcomes","No \u2014 predicting a specific known outcome from labeled history is a supervised learning task, not unsupervised","Yes, but only for very small businesses","It depends only on the number of customers"],"correct":1,"explanation":"Predicting a specific, known outcome using historical labeled examples is a supervised learning task. Unsupervised learning is for finding structure with no labels."},{"scenario":"Brian is training a model on past sales data where each past sale is already labeled with whether it was 'profitable' or 'unprofitable'.","question":"What role does the 'profitable / unprofitable' label play here?","options":["It is irrelevant background information","It is the known answer the model learns to predict for new sales","It is only used for record-keeping, not learning","It replaces the need for any other data"],"correct":1,"explanation":"The label is precisely the known answer that supervised learning trains a model to predict for new, unseen cases."},{"scenario":"A Rafiki Insights client wants to segment its customer base into groups for a marketing campaign but has no existing definition of what the groups should be.","question":"Which type of learning best fits this open-ended exploration?","options":["Supervised learning, because marketing always needs labels","Unsupervised learning, because the groupings are not predefined and must be discovered","Neither type applies to marketing data","Supervised learning, but only with customer names removed"],"correct":1,"explanation":"Discovering groupings that were not predefined, from data with no labels, is exactly what unsupervised learning (such as clustering) is used for."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
function updateScoreboard() {
    document.getElementById('score').textContent = score;
    document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
    document.getElementById('total').textContent = exercises.length;
    document.getElementById('streak').textContent = streak;
    document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
}
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function renderQuestion() {
    answered = false;
    const q = exercises[currentQuestion];
    let html = '';
    if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
    html += `<div class="question">${escapeHtml(q.question)}</div>`;
    html += '<div class="options">';
    q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
    html += '</div>';
    document.getElementById('exerciseCard').innerHTML = html;
    updateScoreboard();
}
function selectAnswer(i) {
    if (answered) return;
    answered = true;
    const q = exercises[currentQuestion];
    const btns = document.querySelectorAll('.option');
    btns.forEach(b => b.classList.add('disabled'));
    btns[q.correct].classList.add('correct');
    const right = i === q.correct;
    if (!right) btns[i].classList.add('wrong');
    if (right) { score += 10; streak += 1; } else { streak = 0; }
    const fb = document.createElement('div');
    fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
    fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
    document.getElementById('exerciseCard').appendChild(fb);
    const nb = document.createElement('button');
    nb.className = 'next-btn';
    nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
    nb.onclick = nextQuestion;
    document.getElementById('exerciseCard').appendChild(nb);
    updateScoreboard();
}
function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
function showResults() {
    document.getElementById('progress').style.width = '100%';
    const total = exercises.length * 10;
    const pct = Math.round(score / total * 100);
    if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
    let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this topic.';
    if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
    else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
    document.getElementById('exerciseCard').innerHTML = `
        <div class="results">
            <span class="badge">${badge}</span>
            <h2>Quiz Complete</h2>
            <div class="final-score">${score} / ${total}</div>
            <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
            <p>${msg}</p>
            <button class="restart-btn" onclick="restart()">Try again 🔁</button>
        </div>`;
}
function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }
renderQuestion();
    </script>
</body>
</html>
