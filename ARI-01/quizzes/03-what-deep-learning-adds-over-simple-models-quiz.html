<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Deep Learning Adds Over Simple Models | MTTI Artificial Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #4A00E0 0%, #8E2DE2 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #f0e8fc; border-color: #8E2DE2; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #4A00E0 0%, #8E2DE2 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #4A00E0; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Neural Networks &amp; Deep Learning · Topic 3 of 3 · Quiz</div>
            <h1>What Deep Learning Adds Over Simple Models</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [
        {"scenario":"A client asks Brian to explain, in one sentence, what the word 'deep' means in 'deep learning'.","question":"Which explanation is correct?","options":["It refers to a network having many stacked hidden layers, rather than just one or two","It means the network deliberately thinks longer before answering","It refers to how much money the client has spent on the project","It means the training data goes back many decades"],"correct":0,"explanation":"'Deep' is a structural description — many stacked hidden layers — not a claim about deeper reasoning or anything else."},
        {"scenario":"Brian is comparing an older, simpler loan-risk model to a deep network for the same task.","question":"In the simpler model, where do the model's input features typically come from?","options":["A person (an analyst) hand-picks which signals, like average monthly deposit, to feed in","The model invents entirely random signals with no human input","The features are physically measured with a ruler","There are never any features in a simple model"],"correct":0,"explanation":"Simpler models usually rely on a person choosing which features matter in advance — that hand-crafting is one of their defining traits."},
        {"scenario":"A colleague asks how a deep network's later layers relate to its earlier layers.","question":"What is the accurate description?","options":["Each layer works completely independently and never uses information from earlier layers","Later layers combine what earlier layers picked up into new, increasingly abstract patterns","Later layers only repeat exactly what the very first layer produced, unchanged","Layers are shuffled randomly and have no consistent order"],"correct":1,"explanation":"Depth is exactly what allows increasingly abstract features to be built up — each layer builds on the patterns the previous layer found."},
        {"scenario":"A retail client has only a few hundred rows of historical sales data and wants demand forecasting.","question":"What is the most sensible consideration for Brian to raise?","options":["Data size never matters for any kind of model","Deep learning typically needs much more data to learn reliable features on its own, so a simpler model may suit this client better","Deep learning requires zero training data by design","The client should collect no more data and use only pen and paper"],"correct":1,"explanation":"With limited data, a deep network may not have enough examples to learn good features, making a simpler, hand-crafted-feature model more practical."},
        {"scenario":"A client asks whether a deep network typically needs more or less computing power than a simpler model to train well.","question":"What is the accurate answer?","options":["Far more, generally, because learning features from scratch across many layers is computationally demanding","Far less, always, regardless of the task","Exactly the same, with no difference at all","Computing power is irrelevant to training any kind of model"],"correct":0,"explanation":"Training many stacked layers to discover good features from scratch is generally much more computationally demanding than training a simpler model on a small set of hand-picked features."},
        {"scenario":"Brian is asked what the main advantage of a deep network's self-discovered features is, compared to a simpler model's hand-crafted ones.","question":"What is the best answer?","options":["It can often find useful, increasingly abstract patterns on its own from rawer data, without needing a person to decide every signal in advance","It guarantees a perfect result on any dataset, no matter how small","It removes the need for any training at all","It means the model never makes mistakes"],"correct":0,"explanation":"The core advantage is reduced reliance on a person hand-picking every feature — the network can discover useful structure in rawer data by itself."},
        {"scenario":"A client asks whether choosing deep learning is always the right call for every business problem.","question":"What is the balanced, accurate answer?","options":["Yes, deep learning is always superior no matter the situation","Not necessarily — it depends on how much data and computing power is available; a simpler model can be the more practical choice for smaller datasets","No, deep learning should never be used for any business problem","The choice has nothing to do with data size or computing resources"],"correct":1,"explanation":"The right choice depends on context — deep learning's advantages come with real data and compute costs, so a simpler model is sometimes the more sensible fit."},
        {"scenario":"Brian is asked to summarise this whole topic for his manager in one line before the client meeting.","question":"Which summary best captures it?","options":["Deep learning is just marketing language with no real technical meaning","'Deep' means many stacked layers, letting a network learn increasingly abstract features on its own instead of relying on hand-crafted ones — at the cost of needing much more data and computing power","Deep learning and simple models are identical in every respect","Deep learning removes the need for any data whatsoever"],"correct":1,"explanation":"This captures the whole topic: depth enables self-discovered, increasingly abstract features, but that capability comes with a real data and compute cost compared to simpler, hand-crafted-feature models."}
        ];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }
        renderQuestion();
    </script>
</body>
</html>
