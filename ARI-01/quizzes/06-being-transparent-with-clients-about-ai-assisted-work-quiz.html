<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Being Transparent With Clients About AI-Assisted Work | MTTI Artificial Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #2575fc 0%, #6a11cb 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #eef1fb; border-color: #6a11cb; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #6a11cb; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 6 · Lesson 6.3 · Quiz</div>
            <h1>Being Transparent With Clients About AI-Assisted Work</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"Brian used an AI tool to help draft the executive summary of a client report, and is deciding whether to mention this to the client.","question":"What is the most professional approach?","options":["Say nothing, since mentioning it might make the report look less impressive","Briefly disclose where AI assistance was used, since the client has a reasonable interest in knowing how the work was produced","Only admit it if directly asked, and deny it otherwise","Claim a colleague wrote that section instead"],"correct":1,"explanation":"Disclosure is about honesty regarding how work was produced. Clients hire Rafiki Insights for trustworthy judgment, and hiding AI involvement risks that trust more than admitting it."},{"scenario":"An AI tool drafted a growth statistic for a client report, and Brian is deciding whether to send it as is.","question":"What should happen before that statistic reaches the client?","options":["Nothing, AI-generated numbers can be trusted as accurate","Brian should check the statistic against the client's actual sales data before it is included in the final report","The statistic should be rounded to a nicer-looking number","The statistic should be doubled to be safe"],"correct":1,"explanation":"AI tools can state incorrect figures confidently. Any number in a client deliverable needs to be verified against real data before Brian relies on it."},{"scenario":"A wrong statistic that an AI tool generated ends up in a report Brian sent to a client without review.","question":"Whose responsibility is that error?","options":["The AI tool's, since it produced the number","Brian's, because he included AI-generated content in a client deliverable without verifying it","The client's, for trusting the report","No one's, since errors are unavoidable with any tool"],"correct":1,"explanation":"Whoever puts AI-generated content in front of a client without checking it owns the resulting mistake \\u2014 the tool does not sign off on the report, Brian does."},{"scenario":"Brian is weighing whether disclosing AI assistance will make Rafiki Insights look less capable to a client.","question":"Which view best matches how disclosure actually tends to affect trust?","options":["Disclosure always damages a client's confidence in the firm","Disclosure, done honestly alongside solid review, tends to build trust because the client sees how the work was actually produced","Disclosure is irrelevant to trust either way","Clients never care how a report was produced"],"correct":1,"explanation":"Being upfront about AI involvement, combined with visible quality control, generally reinforces a client's trust rather than eroding it \\u2014 hiding it and getting caught is the real trust risk."},{"scenario":"Brian treats every AI-generated draft paragraph as ready to send directly to a client without any further check.","question":"What is the main risk with this habit?","options":["There is no risk, AI drafts are always publication-ready","AI can produce confident-sounding but incorrect content, so skipping review risks sending errors straight to the client under Rafiki Insights' name","It wastes too much of Brian's time to review anything","AI drafts are always too short to contain errors"],"correct":1,"explanation":"AI output can be fluent and confident while still being wrong. Treating it as finished without review risks delivering errors to the client as if they were verified facts."},{"scenario":"Brian is building a habit of noting, in a short line at the end of a report, where AI tools contributed to drafting.","question":"What is this habit primarily meant to protect?","options":["Brian's typing speed record","The honesty and clarity of what the client is told about how the report was produced","The AI tool's reputation","The length of the report"],"correct":1,"explanation":"A short disclosure note protects the client's ability to trust an accurate account of how the work was actually done \\u2014 that is the core purpose of transparency here."},{"scenario":"A junior colleague argues that reviewing AI output before sending it to a client is only a technical nicety, not something that really matters professionally.","question":"Is this view accurate?","options":["Yes, review is purely a technical step with no professional weight","No \\u2014 skipping review of client-facing AI content is a professional risk, since Brian is accountable for what gets delivered under Rafiki Insights' name","Yes, because AI tools are always technically correct","No, but only because reviewing takes too long"],"correct":1,"explanation":"Review is a professional responsibility, not just a technical step \\u2014 whatever leaves Rafiki Insights under its name is Brian's accountability, AI-assisted or not."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }
        renderQuestion();
    </script>
</body>
</html>
