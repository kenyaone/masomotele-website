<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy, Consent and Data Protection When Using AI Tools | MTTI Artificial Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #2575fc 0%, #6a11cb 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #eef1fb; border-color: #6a11cb; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #6a11cb; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 6 · Lesson 6.2 · Quiz</div>
            <h1>Privacy, Consent and Data Protection When Using AI Tools</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"Brian receives a client's spreadsheet of customer names, phone numbers, and purchase history to analyse for buying trends.","question":"What is the safest way to handle this data if Brian wants quick help from a public AI chatbot?","options":["Paste the whole spreadsheet in as-is to save time","Remove or replace identifying details like names and phone numbers first, or confirm the client has agreed to this specific use","Only remove the phone numbers, names are fine to share","Ask the AI tool to promise it will delete the data after"],"correct":1,"explanation":"Anonymizing identifying details before use, or getting explicit client consent for that specific tool and purpose, are the two safe options before client data touches an AI tool."},{"scenario":"A colleague says, \\"It's fine to paste client data into a free AI chatbot, we're only using it internally.\\"","question":"Is this reasoning sound?","options":["Yes, internal use is always exempt from privacy concerns","Not necessarily \\u2014 many public AI tools may store or log what is typed in, so the data has still left the client's control without their agreement","Yes, because free tools never store anything","No, but only because free tools are unreliable"],"correct":1,"explanation":"\\"Internal use\\" does not change the fact that data typed into a public AI tool may be stored or logged by that tool \\u2014 it has left the client's control regardless of intent."},{"scenario":"Brian wants to ask an AI tool to help summarise trends in a client's sales data.","question":"What does \\"anonymizing\\" the data before using it mean in this context?","options":["Deleting the data entirely so it cannot be used at all","Removing or replacing identifying details (names, exact contacts, ID numbers) so useful patterns remain but no individual can be identified","Changing the file format only","Printing it on paper instead of using a spreadsheet"],"correct":1,"explanation":"Anonymizing means stripping or replacing identifying details while keeping the useful patterns \\u2014 the goal is that no real person can be picked out from what remains."},{"scenario":"A client shared a spreadsheet for analysis but never mentioned AI tools in any conversation.","question":"What should Brian assume about consent to use an external AI tool on that data?","options":["That being hired for analysis automatically covers any tool Brian chooses to use","That nothing specific was agreed, so Brian should ask before sending identifying client data to an external AI tool","That consent is not needed if the tool is well known","That consent only applies to government agencies"],"correct":1,"explanation":"Consent needs to be reasonably specific. Being hired to analyse data does not automatically authorise sending identifying details to an external AI tool \\u2014 Brian should ask first."},{"scenario":"Brian is deciding between two AI tools to help analyse an anonymized version of a client dataset.","question":"What is a reasonable thing to check before choosing either tool?","options":["Which tool has the nicer looking interface","What each tool's privacy terms say about storing, logging, or reusing what is typed into it","Which tool is used by the most people worldwide","Nothing, since the data is already anonymized"],"correct":1,"explanation":"Even with anonymized data, checking a tool's privacy and data-handling terms is a reasonable, responsible habit before relying on it regularly for client work."},{"scenario":"A client's spreadsheet includes a column of national ID numbers, which Brian does not actually need for the requested sales-trend analysis.","question":"What is the best practice here?","options":["Include the ID numbers anyway, since more data cannot hurt","Leave out or remove the ID numbers entirely since they are not needed for the analysis and add unnecessary privacy risk","Ask the client to email the ID numbers again to double-check them","Share the ID numbers with a colleague for a second opinion"],"correct":1,"explanation":"A basic data-protection habit is only handling the data actually needed for the task \\u2014 unnecessary identifying details like ID numbers should be dropped rather than carried along."},{"scenario":"Brian anonymizes a customer dataset by replacing names with \\"Customer A,\\" \\"Customer B,\\" and so on, but leaves each customer's exact home address in place.","question":"Is this dataset properly anonymized?","options":["Yes, removing names alone is always enough","Not fully \\u2014 an exact address can still identify a specific real person even without a name attached","Yes, because addresses are considered public information","No, because Customer A and Customer B are not real names"],"correct":1,"explanation":"Anonymization has to consider all identifying details together. An exact address can still single out a real individual even if their name has been replaced."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }
        renderQuestion();
    </script>
</body>
</html>
