<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporting and Escalating Concerns | MTTI Caregiving</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Space Mono', monospace; background:linear-gradient(135deg,#387633 0%,#259BD7 100%); min-height:100vh; padding:20px; color:#fff; }
.container { max-width:720px; margin:0 auto; }
.header { text-align:center; margin-bottom:16px; }
.lesson-tag { display:inline-block; background:rgba(255,255,255,0.2); padding:6px 16px; border-radius:999px; font-size:0.85em; margin-bottom:10px; }
.header h1 { font-family:'Fredoka', sans-serif; font-size:1.7em; margin-bottom:4px; text-shadow:2px 2px 0 rgba(0,0,0,0.2); }
.progress { text-align:center; margin-bottom:14px; font-size:0.9em; opacity:0.9; }
.card { background:#fff; color:#333; border-radius:20px; padding:26px; box-shadow:0 16px 40px rgba(0,0,0,0.25); }
.scenario { background:linear-gradient(135deg,#fff8e1 0%,#ffecb3 100%); border-left:5px solid #ffc107; padding:16px 20px; border-radius:12px; margin-bottom:18px; font-size:0.95em; line-height:1.55; }
.category-options { display:flex; gap:10px; margin:14px 0; flex-wrap:wrap; }
.cat-btn { flex:1; min-width:140px; padding:12px; border-radius:10px; border:2px solid #e5e7f0; background:#f5f7fb; cursor:pointer; font-family:'Space Mono', monospace; font-size:0.85em; text-align:center; }
.cat-btn:hover:not(.disabled) { background:#e8f5e9; }
.cat-btn.correct { background:#d4edda; border-color:#28a745; }
.cat-btn.wrong { background:#f8d7da; border-color:#dc3545; }
.cat-btn.disabled { cursor:not-allowed; }
.feedback { margin-top:10px; padding:14px 18px; border-radius:10px; font-size:0.9em; line-height:1.5; }
.feedback.correct { background:#d4edda; color:#155724; border-left:4px solid #28a745; }
.feedback.wrong { background:#f8d7da; color:#721c24; border-left:4px solid #dc3545; }
h3.step { font-family:'Fredoka', sans-serif; font-size:1em; margin:16px 0 8px; color:#387633; }
textarea { width:100%; min-height:110px; padding:12px; border:2px solid #e5e7f0; border-radius:10px; font-family:'Space Mono', monospace; font-size:0.9em; resize:vertical; }
.btn { background:linear-gradient(135deg,#387633 0%,#259BD7 100%); color:#fff; border:none; padding:12px 26px; border-radius:10px; font-size:0.95em; cursor:pointer; font-family:'Fredoka', sans-serif; box-shadow:0 6px 16px rgba(0,0,0,0.15); margin-top:4px; }
.model-note { background:#eef6ff; border-left:4px solid #259BD7; padding:14px 18px; border-radius:10px; margin-top:14px; font-size:0.88em; line-height:1.55; }
.model-note h4 { font-family:'Fredoka', sans-serif; margin-bottom:8px; color:#1565C0; }
.checklist { margin-top:10px; padding-left:18px; }
.checklist li { margin-bottom:4px; }
.hidden { display:none; }
.done-banner { text-align:center; padding:20px; font-family:'Fredoka', sans-serif; font-size:1.1em; }
</style>
</head>
<body>
<div class="container">
<div class="header">
  <div class="lesson-tag">Module 9 · Practical</div>
  <h1>Reporting and Escalating Concerns</h1>
</div>
<div class="progress">Case <span id="caseNum">1</span> of <span id="caseTotal">3</span></div>
<div class="card" id="caseCard"></div>
<div class="done-banner hidden" id="doneBanner">All three cases complete - you have practised judging urgency and writing a report for a routine, a watch-closely, and an urgent observation.</div>
</div>

<script>
const cases = [
  {
    scenario: "Bibi Achieng seems a little quieter than usual this morning. She mentions she did not sleep well last night, but she is eating breakfast normally and moving around the house as usual.",
    category: "routine",
    modelNote: "08:30 - Bibi Achieng slightly quieter than usual, reports poor sleep last night. Eating and moving normally, no other change noted. No action needed beyond routine daily observation; will mention briefly in the daily log. - Njeri"
  },
  {
    scenario: "Bwana Otieno mentions feeling a little dizzy when he stands up quickly. It passes within a few seconds and he says this has happened occasionally before, though not for a couple of weeks.",
    category: "watch",
    modelNote: "11:15 - Bwana Otieno reports brief dizziness on standing, resolving within seconds. States this has happened occasionally before, most recently a couple of weeks ago. Not an acute emergency, but a recurring pattern worth tracking. Will monitor closely, note frequency going forward, and mention to supervisor if it becomes more frequent or lasts longer. - Njeri"
  },
  {
    scenario: "Bibi Wangari suddenly complains of severe chest pain and appears pale and sweaty, gripping the arm of her chair.",
    category: "report",
    modelNote: "15:50 - Bibi Wangari reports sudden severe chest pain, appears pale and sweaty, gripping chair for support. Possible cardiac event. Called for emergency medical help immediately at 15:51 and stayed with her, keeping her calm and seated. Family notified. - Njeri"
  }
];

let current = 0;
let categoryChosen = false;

function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render() {
  categoryChosen = false;
  const c = cases[current];
  document.getElementById('caseNum').textContent = current + 1;
  document.getElementById('caseCard').innerHTML = `
    <div class="scenario"><strong>Scenario.</strong> ${escapeHtml(c.scenario)}</div>
    <h3 class="step">Step 1 - How urgent is this?</h3>
    <div class="category-options">
      <button class="cat-btn" onclick="chooseCategory('routine')">Routine - note it, no other action</button>
      <button class="cat-btn" onclick="chooseCategory('watch')">Watch Closely</button>
      <button class="cat-btn" onclick="chooseCategory('report')">Report Immediately</button>
    </div>
    <div id="categoryFeedback"></div>
    <div id="noteSection" class="hidden">
      <h3 class="step">Step 2 - Write your report</h3>
      <textarea id="noteText" placeholder="Write what you observed and what you are doing about it..."></textarea>
      <button class="btn" onclick="revealModel()" style="margin-top:10px;">Compare to a model note</button>
      <div id="modelSection"></div>
    </div>
    <div id="nextSection" class="hidden" style="text-align:center;margin-top:18px;">
      <button class="btn" onclick="nextCase()">${current === cases.length - 1 ? 'Finish' : 'Next case &rarr;'}</button>
    </div>
  `;
}

function chooseCategory(choice) {
  if (categoryChosen) return;
  categoryChosen = true;
  const c = cases[current];
  const btns = document.querySelectorAll('.cat-btn');
  btns.forEach(b => b.classList.add('disabled'));
  const labels = { routine: 'Routine - note it, no other action', watch: 'Watch Closely', report: 'Report Immediately' };
  btns.forEach(b => { if (b.textContent.trim() === labels[c.category]) b.classList.add('correct'); });
  const right = choice === c.category;
  if (!right) btns.forEach(b => { if (b.textContent.trim() === labels[choice]) b.classList.add('wrong'); });

  const explanations = {
    routine: "A normal daily variation with no other concerning signs, and the client is otherwise functioning as usual, fits routine documentation - not an escalation.",
    watch: "A symptom that resolves on its own but has happened before, and could be part of a developing pattern, calls for closer tracking and a mention if it recurs or worsens - not full escalation, but not silence either.",
    report: "Sudden, severe symptoms with signs of real physical distress need immediate escalation - this is not something to simply note and monitor."
  };
  document.getElementById('categoryFeedback').innerHTML = `<div class="feedback ${right ? 'correct' : 'wrong'}">
    <strong>${right ? 'Correct.' : 'Not quite - correct answer highlighted above.'}</strong><br>${explanations[c.category]}
  </div>`;
  document.getElementById('noteSection').classList.remove('hidden');
}

function revealModel() {
  const c = cases[current];
  document.getElementById('modelSection').innerHTML = `
    <div class="model-note">
      <h4>Model note for comparison</h4>
      <p>${escapeHtml(c.modelNote)}</p>
      <p style="margin-top:10px;"><strong>Self-check your own note against this checklist:</strong></p>
      <ul class="checklist">
        <li>Did you include roughly when this happened?</li>
        <li>Did you describe specifically what you observed, not just "something seemed off"?</li>
        <li>Does your note match the urgency you chose in Step 1?</li>
        <li>Did you state what you actually did (or plan to do) about it?</li>
      </ul>
    </div>`;
  document.getElementById('nextSection').classList.remove('hidden');
}

function nextCase() {
  current++;
  if (current >= cases.length) {
    document.getElementById('caseCard').classList.add('hidden');
    document.querySelector('.progress').classList.add('hidden');
    document.getElementById('doneBanner').classList.remove('hidden');
    return;
  }
  render();
}

render();
</script>
</body>
</html>
