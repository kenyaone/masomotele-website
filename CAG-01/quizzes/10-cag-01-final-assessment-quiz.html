<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAG-01 Final Assessment | MTTI Computer Applications</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #eef1fb; border-color: #667eea; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #667eea; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Final Assessment · Quiz</div>
            <h1>CAG-01 Final Assessment</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"Njeri finds a client who is coughing forcefully and can still make sound after a piece of food went down the wrong way.","question":"What does this indicate about the severity of the choking, and what should Njeri do?","options":["Severe obstruction \u2014 begin abdominal thrusts immediately","This is not choking and needs no response","Mild obstruction \u2014 encourage continued coughing and watch closely in case it worsens","Severe obstruction \u2014 call emergency services but take no other action"],"correct":2,"explanation":"The ability to cough forcefully and make sound is the defining sign of a mild obstruction \u2014 encouraging continued coughing, not physical intervention, is correct here."},{"scenario":"A client is unresponsive but is breathing normally when Njeri checks.","question":"What is the appropriate response?","options":["Elevating the client's legs only","CPR","The recovery position","No response is needed"],"correct":2,"explanation":"Unresponsive but breathing normally calls for the recovery position, not CPR, which is reserved for when normal breathing is absent."},{"scenario":"Njeri charts a client's vitals: Temp 39.2\u00b0C, Pulse 118bpm, Resp 26\/min, BP 90\/58mmHg \u2014 all clearly outside normal ranges together.","question":"How should this combination generally be categorised?","options":["Normal \u2014 routine documentation only","No action is needed since each value alone might have an explanation","Watch Closely \u2014 recheck in a few hours","Report Immediately"],"correct":3,"explanation":"Multiple vital signs clearly outside safe ranges together \u2014 high temperature, high pulse, high respiration, and low blood pressure \u2014 call for immediate escalation, not routine monitoring."},{"scenario":"Njeri notices a client's known allergy is missing from an admission form.","question":"What should she do?","options":["Assume someone else will notice eventually","Fill it in herself without telling anyone","Say nothing since it is not her form","Raise it clearly with staff, since missing safety information could cause real harm"],"correct":3,"explanation":"A caregiver who knows a safety-relevant detail should always raise it \u2014 an incomplete record risks real harm."},{"scenario":"A client says, 'I feel like such a burden on my family now,' and Njeri responds, 'That sounds really hard to sit with \u2014 needing more help can feel like a big change.'","question":"What kind of response is this?","options":["Dismissing the feeling","Sympathy","Empathy \u2014 genuinely trying to understand and reflect the feeling","Rushing to fix the problem"],"correct":2,"explanation":"Reflecting back and genuinely trying to understand the specific feeling, rather than feeling sorry from the outside, is empathy."},{"scenario":"A client with dementia insists it is a different year than it actually is.","question":"What is generally the more supportive approach?","options":["Arguing until she agrees with the correct year","Gently redirecting rather than insisting on correction, since arguing facts can cause distress without changing the belief","Firmly correcting her with the actual facts, repeatedly","Refusing to engage with her at all"],"correct":1,"explanation":"Gentle redirection is generally more supportive than repeated factual correction for a client with dementia."},{"scenario":"Njeri wipes a door handle with just water and it looks clean.","question":"Does visible cleanliness alone confirm the surface is properly disinfected?","options":["Disinfecting is never actually necessary","Yes, appearance is a complete indicator","Not necessarily \u2014 cleaning removes visible dirt, but disinfecting is a separate step to actually kill germs","Only colour indicates hygiene level"],"correct":2,"explanation":"Cleaning and disinfecting are distinct steps \u2014 a visibly clean surface may still need disinfecting."},{"scenario":"A bedridden, incontinent client and a fully mobile client both need their bed linens managed.","question":"Should linen-change frequency be identical for both?","options":["Frequency does not matter either way","The mobile client always needs more frequent changes","Yes, always identical regardless of condition","No \u2014 frequency should match actual need, generally more frequent for the bedridden, incontinent client"],"correct":3,"explanation":"Matching change frequency to actual condition and need is the appropriate approach, not a fixed schedule for everyone."},{"scenario":"A recruiter tells Njeri not to bother reading her overseas employment contract carefully since it is \"all standard.\"","question":"What should she do?","options":["Ask a friend to sign on her behalf","Refuse to consider the job at all","Read the full written contract herself before signing, regardless of any verbal reassurance","Sign quickly since the recruiter said it is standard"],"correct":2,"explanation":"Verbal reassurance is not a substitute for actually reading and understanding a written contract before signing."},{"scenario":"An employer abroad wants to hold Njeri's passport indefinitely with no clear reason given.","question":"What does this suggest?","options":["This is completely normal and expected everywhere","A serious warning sign \u2014 legitimate arrangements generally let the worker hold their own documents","Employers are always required to hold passports by law","This detail is unimportant as long as pay is on time"],"correct":1,"explanation":"Unexplained, prolonged document confiscation is a recognised warning sign of possible exploitation."},{"scenario":"Njeri needs to transfer a client whose weight and current cooperation level genuinely require two people, but only Njeri is available.","question":"What is the appropriate response?","options":["Ask the client to do more of the work themselves regardless of their condition","Attempt the transfer alone to avoid delay","Get a second person before attempting the transfer, since attempting it alone would be a real, avoidable risk","Postpone the transfer indefinitely with no plan"],"correct":2,"explanation":"Attempting a genuinely two-person transfer alone is an avoidable risk to both the caregiver and the client."},{"scenario":"A staff member is present when Njeri's special-needs client, who is capable of answering, is asked a question directly.","question":"What is the appropriate caregiver behaviour if the client can answer for themselves?","options":["Interrupt with unrelated information","Answer immediately on the client's behalf","Let the client answer, stepping in only if genuinely needed","Leave the room during the conversation"],"correct":2,"explanation":"Respecting a capable client's ability to answer for themselves is the correct approach, supporting their autonomy."},{"scenario":"Njeri uses the same cutting board for raw chicken and then immediately for salad vegetables without cleaning it.","question":"What risk does this create?","options":["Cross-contamination, since bacteria from raw meat could transfer to food that will not be cooked further","No risk, cutting boards do not transfer bacteria","This risk only applies to poultry, not other meats","This only matters if the vegetables are visibly dirty"],"correct":0,"explanation":"Using an uncleaned surface for raw meat and then uncooked food creates a genuine cross-contamination risk."},{"scenario":"An AI assistant confidently states a specific caregiving fact that turns out, on closer inspection, to be outdated and incorrect.","question":"What does this illustrate?","options":["This situation could never actually occur with AI tools","Confidence and accuracy are the same thing","Confident wording from AI always indicates accuracy","AI can state information confidently regardless of whether it is actually correct, making independent verification essential"],"correct":3,"explanation":"AI-generated answers do not carry a different tone when incorrect \u2014 confidence and correctness are separate qualities, which is why verification matters."},{"scenario":"Njeri is reflecting on what ties together everything covered in this course \u2014 First Aid, documentation, communication, hygiene, migration preparation, special needs care, nutrition, and AI use.","question":"What common thread runs through nearly all of these units?","options":["Memorising facts with no practical application","Working alone with no communication needed","Careful observation, sound judgement about severity or appropriate response, and clear communication with others involved in the client's care","Following a fixed script with no judgement required"],"correct":2,"explanation":"Across every unit \u2014 clinical, domestic, administrative, or technological \u2014 the recurring skill is observing carefully, judging the right level of response, and communicating it clearly to others."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }
        renderQuestion();
    </script>
</body>
</html>
