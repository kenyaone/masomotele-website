<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Placement and Coverage Planning | MTTI CCTV Installation</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #C31432 0%, #240B36 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #fdeaea; border-color: #C31432; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #C31432 0%, #240B36 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #C31432; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Unit 2 &middot; Lesson 2.2 &middot; Quiz</div>
            <h1>Camera Placement and Coverage Planning</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"Dennis is planning camera positions for a small retail client with a limited camera budget.","question":"Which areas should get first claim on the available cameras?","options":["Random spots the client happens to like the look of","Entrances, exits, tills and high-value stock areas identified in the survey","The ceiling above the staff break room only","Areas furthest from any door or window"],"correct":1,"explanation":"Priority areas — entrances, exits, tills and high-value stock — should always get first claim on limited camera positions."},{"scenario":"Two proposed cameras would both point at the same quiet, low-risk corridor with almost identical views.","question":"What does this represent, and what should Dennis do?","options":["Good practice, since more coverage is always better","Wasteful overlap — one camera should be repositioned to cover an actual gap instead","A requirement of every CCTV design","Something that should be doubled further with a third camera"],"correct":1,"explanation":"Duplicate coverage of a low-risk area wastes a camera that could be covering a genuine blind spot elsewhere."},{"scenario":"A client insists every single camera be mounted as high as physically possible on the building.","question":"What should Dennis explain about mounting height?","options":["Higher is always strictly better with no downsides","Height should balance tamper resistance and field of view against the need for useful facial detail","Mounting height has no effect on image usefulness","Cameras should only ever be mounted at ground level"],"correct":1,"explanation":"Very high mounting can sacrifice facial detail; a sensible height balances tamper resistance and coverage with image usefulness."},{"scenario":"A proposed entrance camera is aimed directly at a large glass window that lets in strong daylight.","question":"What problem is likely, and what should be done?","options":["No problem, backlighting never affects footage","People entering may appear as dark silhouettes; the camera should be repositioned or re-angled away from the light source","The window should be painted over entirely","The camera should be switched off during the day"],"correct":1,"explanation":"A camera facing directly into strong backlight will silhouette subjects — repositioning or re-angling is the correct fix."},{"scenario":"Dennis is deciding on camera count for a warehouse client with a fixed number of cameras in the budget.","question":"What guiding principle should drive where each camera goes?","options":["Cameras should be spread evenly regardless of risk","Each camera should cover an area of genuine need identified in the survey, not just fill space","Cameras should all point at the same high-value area for redundancy","The cheapest positions to install should always be chosen first"],"correct":1,"explanation":"Every camera should earn its position by covering a real need from the survey — not simply be spread out or duplicated for its own sake."},{"scenario":"An outdoor perimeter camera is being planned for a warehouse yard.","question":"Compared to an indoor entrance camera, what is a reasonable expectation for its mounting height?","options":["It should be mounted lower than any indoor camera","It is often mounted higher (roughly 3-4m) trading some facial detail for wider coverage and vandalism resistance","Outdoor mounting height makes no difference at all","It must be mounted at exactly the same height as indoor cameras"],"correct":1,"explanation":"Outdoor cameras are commonly mounted higher than indoor ones, trading some facial detail for a wider field of view and better resistance to tampering."},{"scenario":"Dennis is reviewing a draft layout and notices a side door with no coverage while three cameras cluster around one open area.","question":"What should Dennis recommend?","options":["Leave the layout unchanged since three cameras is impressive","Reposition at least one clustered camera to cover the uncovered side door","Add a fourth camera to the already-covered area for extra certainty","Remove the side door from consideration entirely"],"correct":1,"explanation":"Coverage gaps at entry points should be prioritised over redundant clustering in already well-covered areas."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? 'Correct.' : 'Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> &middot; Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }
        renderQuestion();
    </script>
</body>
</html>
