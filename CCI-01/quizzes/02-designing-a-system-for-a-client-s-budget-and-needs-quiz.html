<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designing a System for a Client's Budget and Needs | MTTI CCTV Installation</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #C31432 0%, #240B36 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #fdeaea; border-color: #C31432; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #C31432 0%, #240B36 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #C31432; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Unit 2 &middot; Lesson 2.3 &middot; Quiz</div>
            <h1>Designing a System for a Client's Budget and Needs</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"Dennis is preparing a quote for Kerio Corner Shop, a small shop with a tight budget and low footfall.","question":"What should guide the system he recommends?","options":["The most expensive package available, regardless of fit","The shop's actual risk level and budget, focusing on covering the till and entrance well","Whatever system was sold to the last client","A system identical to a large warehouse's, regardless of size"],"correct":1,"explanation":"Recommendations should always be matched to the specific client's real risk and budget, not copied from unrelated jobs or upsold by default."},{"scenario":"Rift Valley Hardware Warehouse holds high-value stock overnight and has several access points.","question":"Compared to a small shop, how should its system generally differ?","options":["It should be identical since all CCTV systems are the same","It may justify a more comprehensive system, reflecting its higher risk and value at stake","It should always be smaller than a shop's system","Budget and risk should not factor into warehouse designs"],"correct":1,"explanation":"A site with higher-value stock and more access points can genuinely justify a more comprehensive system than a small, low-risk shop."},{"scenario":"A client on a strict budget asks Dennis to explain the trade-off between higher resolution and longer storage retention.","question":"What is a reasonable way to frame this trade-off?","options":["There is no trade-off, both can always be maximised for any budget","Higher resolution typically uses more storage, so within a fixed budget there is a trade-off against how many days of footage can be kept","Storage length never depends on resolution","Only resolution matters; storage length is irrelevant"],"correct":1,"explanation":"Within a fixed budget, higher resolution footage takes up more storage, so there is a genuine trade-off with how many days of recordings can be retained."},{"scenario":"A shop owner with modest needs is being offered a premium 4K week-long-retention package they did not ask for and do not need.","question":"What is the ethical concern here?","options":["There is no concern, offering more is always fine","This risks overselling equipment the client does not need, which can damage trust and reputation","Clients always want the most expensive option secretly","Only the price matters, not whether it fits the client's needs"],"correct":1,"explanation":"Overselling unnecessary equipment can damage client trust and SafeView's reputation, even if it increases the immediate sale value."},{"scenario":"A warehouse client wants to spend the absolute minimum, even if that means leaving a higher-risk loading bay uncovered.","question":"What is the professional way for Dennis to handle this?","options":["Silently design the system with the gap and say nothing","Clearly explain the risk of the gap, then let the informed client decide how to proceed","Refuse to provide any quote at all","Add the coverage anyway without telling the client about the added cost"],"correct":1,"explanation":"Giving the client clear, honest information about risk versus budget trade-offs allows them to make their own informed decision."},{"scenario":"A client requests an extra camera purely because a nearby competitor has one in a similar spot, even though the area shows negligible risk in the survey.","question":"How should Dennis respond?","options":["Add it immediately without discussion since the client is paying","Explain that the area shows low risk and suggest the budget be used where it matters more","Insist the client must always match competitors exactly","Refuse to discuss the request"],"correct":1,"explanation":"Recommendations should be driven by actual survey findings and risk, not by copying a competitor's choices regardless of fit."},{"scenario":"Dennis is comparing a small shop system and a large warehouse system he has both just designed.","question":"What is the underlying principle that should explain any difference between the two designs?","options":["Bigger buildings should always get identical designs to smaller ones","Each design should reflect that client's own risk, needs and budget, not a fixed one-size-fits-all package","The most expensive design should always be used for every client","Design differences should be based on which client complained the most"],"correct":1,"explanation":"Good system design is driven by the specific client's actual risk, needs and budget — never a fixed package applied regardless of context."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? 'Correct.' : 'Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> &middot; Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }
        renderQuestion();
    </script>
</body>
</html>
