<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using AI Chat Tools to Troubleshoot Faults Faster | MTTI CCTV Installation</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #360033 0%, #0b8793 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #eef1fb; border-color: #0b8793; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #360033 0%, #0b8793 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #0b8793; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 6 · Lesson 6.2 · Quiz</div>
            <h1>Using AI Chat Tools to Troubleshoot Faults Faster</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"A SafeView Security Systems client calls Dennis about a fault while he is still at the office.","question":"What is the most useful first step Dennis can take before driving to the site?","options":["Describe the exact symptom to an AI chat tool to get a quick first-pass checklist of likely causes","Drive out immediately with no preparation","Tell the client to try unplugging everything and hope it fixes itself","Wait a few days to see if the client calls back"],"correct":0,"explanation":"A clear description to an AI chat tool can produce a useful checklist to bring along, saving time versus arriving with no plan at all."},{"scenario":"Dennis is deciding how to phrase his question to the AI assistant about a client's fault.","question":"Which approach will get him the most useful response?","options":["A vague one-line message like \"camera broken\"","A specific description including the symptom, which cameras/channels are affected, and anything that changed recently","No description at all, just asking for a general list of every possible camera fault","Asking about a completely different, unrelated brand of camera"],"correct":1,"explanation":"Specific details about the actual symptom and recent changes let the AI tool give a genuinely relevant, targeted checklist."},{"scenario":"The AI tool gives Dennis a checklist that includes checking the PoE switch's power budget as one likely cause.","question":"How should Dennis treat this suggestion?","options":["As one of several leads worth checking on site, to be confirmed with an actual test rather than assumed","As a guaranteed, confirmed diagnosis that needs no further checking","As something to ignore completely since it came from an AI tool","As proof that the client's whole network needs replacing"],"correct":0,"explanation":"An AI-generated checklist gives good starting leads, but each one still needs to be verified on site before Dennis acts on it."},{"scenario":"Dennis wants to know which kinds of faults this quick pre-visit checklist approach works best for.","question":"Which is the best answer?","options":["Common, well-understood fault patterns like PoE budget issues, IR filter faults, or cable runs beyond rated distance","Faults involving physical damage that can only be seen on site","Faults that depend entirely on details unique to that specific property","Anything involving electrical safety risks"],"correct":0,"explanation":"Well-understood, common textbook fault patterns are exactly where a pre-visit AI checklist saves the most time; site-specific or safety-critical issues still need hands-on checks."},{"scenario":"A colleague asks Dennis whether getting a checklist from an AI tool means he no longer needs to visit the client's site.","question":"What is the accurate answer?","options":["Correct, the AI checklist fully replaces any need for a site visit","No — the checklist is a preparation step; the actual testing and fix still happen on site","Only true for cameras made by one specific manufacturer","True only if the client agrees to it in writing first"],"correct":1,"explanation":"The AI-generated checklist helps Dennis prepare, but confirming the fault and applying the fix still requires an actual site visit."},{"scenario":"Dennis gets a fault report that mentions an electrical smell coming from near the DVR.","question":"How should Dennis treat an AI chat tool's suggestions in this situation?","options":["As a good starting checklist, but this kind of safety-related issue still needs a proper hands-on, cautious check on site regardless of what the tool suggests","As a complete substitute for any physical inspection, since the smell was already described","As something to dismiss completely, since AI cannot mention safety topics","As a reason to tell the client it is not urgent"],"correct":0,"explanation":"Anything involving a possible electrical or safety issue always needs careful hands-on assessment on site — an AI checklist can still help with preparation, but not as a substitute for the physical check."},{"scenario":"Dennis compares two ways he could have handled a recent fault call: driving out immediately with no information, versus spending two minutes describing the symptom to an AI tool first.","question":"What is the main benefit of the second approach?","options":["It guarantees the fault will be instantly fixed with no further work","It lets Dennis arrive with a short list of likely causes and the right tools, instead of discovering what he needs partway through the visit","It removes the need to ever speak to the client again","It means the fault report no longer needs to be accurate"],"correct":1,"explanation":"A brief AI-assisted checklist beforehand helps Dennis prepare properly, saving time on site even though the actual diagnosis and fix still happen there."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }
        renderQuestion();
    </script>
</body>
</html>
