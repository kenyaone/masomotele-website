<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulas and Basic Functions | MTTI Computer Applications</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Space Mono', monospace; background:linear-gradient(135deg,#387633 0%,#259BD7 100%); min-height:100vh; padding:20px; color:#fff; }
.container { max-width:900px; margin:0 auto; }
.header { text-align:center; margin-bottom:24px; }
.lesson-tag { display:inline-block; background:rgba(255,255,255,0.2); padding:6px 16px; border-radius:999px; font-size:0.85em; margin-bottom:12px; }
.header h1 { font-family:'Fredoka', sans-serif; font-size:2em; margin-bottom:6px; text-shadow:3px 3px 0 rgba(0,0,0,0.2); }
.scenario { background:rgba(255,255,255,0.14); backdrop-filter:blur(10px); border-radius:16px; padding:16px 22px; margin-bottom:20px; border-left:5px solid #ffd54f; font-size:0.95em; line-height:1.55; }
.task { background:#fff; color:#333; border-radius:20px; padding:24px; margin-bottom:16px; box-shadow:0 14px 40px rgba(0,0,0,0.25); }
.task-num { display:inline-block; width:28px; height:28px; background:linear-gradient(135deg,#387633 0%,#259BD7 100%); color:#fff; border-radius:50%; text-align:center; line-height:28px; font-family:'Fredoka', sans-serif; font-weight:600; margin-right:8px; }
.task h3 { font-family:'Fredoka', sans-serif; font-size:1.05em; display:inline; }
.options { margin-top:14px; display:flex; flex-direction:column; gap:10px; }
.option { background:#f5f7fb; border:2px solid transparent; padding:12px 16px; border-radius:10px; cursor:pointer; transition:all 0.2s; font-family:'Space Mono', monospace; font-size:0.92em; text-align:left; }
.option:hover:not(.disabled) { background:#e8f5e9; border-color:#387633; }
.option.correct { background:#d4edda; border-color:#28a745; color:#155724; }
.option.wrong { background:#f8d7da; border-color:#dc3545; color:#721c24; }
.option.disabled { cursor:not-allowed; }
.feedback { margin-top:14px; padding:12px 16px; border-radius:10px; font-size:0.9em; line-height:1.5; }
.feedback.correct { background:#d4edda; color:#155724; border-left:4px solid #28a745; }
.feedback.wrong { background:#f8d7da; color:#721c24; border-left:4px solid #dc3545; }
.done-banner { text-align:center; padding:20px; color:#fff; font-family:'Fredoka', sans-serif; font-size:1.1em; }
</style>
</head>
<body>
<div class="container">
<div class="header"><div class="lesson-tag">Module 2 · Lesson 2.2 · Practical</div><h1>Formulas and Basic Functions</h1></div>
<div class="scenario">Brenda has a week of daily sales figures in B2:B8 and needs the week&#039;s total, average, and best day.</div>
<div id="tasks"></div>
<div class="done-banner" id="doneBanner" style="display:none;">✅ Practical complete — you can move to the quiz.</div>
</div>
<script>
const tasks = [{"prompt":"Brenda typed \"SUM(B2:B8)\" into a cell without a leading equals sign, and it just displayed as text. What is wrong?","options":["SUM only works on whole columns","A formula must start with =","B2:B8 is not a valid range","Nothing is wrong, this is correct"],"correct":1,"explanation":"Without the leading =, Excel treats the entry as plain text rather than a formula to calculate."},{"prompt":"She wants the single busiest sales day from B2:B8. Which function finds it?","options":["=SUM(B2:B8)","=MAX(B2:B8)","=COUNT(B2:B8)","=AVERAGE(B2:B8)"],"correct":1,"explanation":"MAX returns the largest value in the given range \u2014 exactly the busiest day's figure."},{"prompt":"A formula in Brenda's sheet shows #DIV/0!. What should she check first?","options":["Whether the cell font is too small","Whether the formula is dividing by a cell that is zero or empty","Whether the file is saved","Whether AutoCorrect is enabled"],"correct":1,"explanation":"#DIV/0! specifically means the formula attempted a division where the denominator was zero or blank."}];
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(){
  const c = document.getElementById('tasks');
  c.innerHTML = tasks.map((t,i)=>`
    <div class="task" id="task-${i}">
      <div><span class="task-num">${i+1}</span><h3>${escapeHtml(t.prompt)}</h3></div>
      <div class="options">
        ${t.options.map((o,j)=>`<button class="option" onclick="answer(${i},${j})">${escapeHtml(o)}</button>`).join('')}
      </div>
    </div>`).join('');
}
function answer(i,j){
  const task = tasks[i];
  const el = document.getElementById('task-'+i);
  const btns = el.querySelectorAll('.option');
  if (btns[0].classList.contains('disabled')) return;
  btns.forEach(b=>b.classList.add('disabled'));
  btns[task.correct].classList.add('correct');
  const right = j === task.correct;
  if (!right) btns[j].classList.add('wrong');
  const fb = document.createElement('div');
  fb.className = 'feedback ' + (right?'correct':'wrong');
  fb.innerHTML = '<strong>' + (right?'✅ Correct.':'❌ Not quite.') + '</strong><br>' + escapeHtml(task.explanation);
  el.appendChild(fb);
  if (i === tasks.length-1) document.getElementById('doneBanner').style.display='block';
}
render();
</script>
</body>
</html>
