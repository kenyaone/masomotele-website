<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute vs Relative References | MTTI Computer Applications</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #eef1fb; border-color: #667eea; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #667eea; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
    
        /* How-To intro screen — shown before question 1, not scored */
        .howto-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .howto-card h3 { font-family: 'Fredoka', sans-serif; font-size: 1.3em; margin-bottom: 12px; color: #667eea; }
        .howto-card p { line-height: 1.6; margin-bottom: 16px; color: #444; }
        .howto-fields { display: flex; flex-direction: column; gap: 16px; margin-bottom: 18px; }
        .howto-field { background: #f5f7fb; border-radius: 12px; padding: 16px 18px; }
        .howto-field label { display: block; font-weight: 700; margin-bottom: 8px; color: #333; line-height: 1.4; }
        .howto-field select, .howto-field input[type="text"] { width: 100%; padding: 10px 12px; border-radius: 8px; border: 2px solid #ddd; font-family: 'Space Mono', monospace; font-size: 0.95em; background: #fff; color: #333; }
        .howto-field .hc-check-row { display: flex; align-items: center; gap: 10px; }
        .howto-field .hc-check-row input[type="checkbox"] { width: 20px; height: 20px; }
        .howto-field.hc-correct { outline: 3px solid #28a745; }
        .howto-field.hc-wrong { outline: 3px solid #dc3545; }
        .howto-banner { margin-top: 4px; margin-bottom: 18px; padding: 12px 16px; border-radius: 10px; font-size: 0.9em; font-weight: 700; display: none; }
        .howto-banner.show { display: block; }
        .howto-banner.ok { background: #d4edda; color: #155724; }
        .howto-banner.fail { background: #f8d7da; color: #721c24; }
        .start-quiz-btn { margin-top: 4px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 2 · Lesson 2.6 · Quiz</div>
            <h1>Absolute vs Relative References</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"Kevin copied a formula referencing B2 down several rows, and it correctly became B3, B4, B5...","question":"What type of reference is this?","options":["Absolute","Relative","Mixed","Broken"],"correct":1,"explanation":"A reference that shifts along with where the formula is copied is a relative reference \u2014 the default in Excel."},{"scenario":"Brenda's formula references a single tax-rate cell that must never change no matter where the formula is copied.","question":"How should that cell be referenced?","options":["As a relative reference, e.g. B2","As an absolute reference, e.g. $B$2","It cannot be referenced at all","As plain text"],"correct":1,"explanation":"Dollar signs on both the column and row ($B$2) lock the reference completely, so it never shifts when copied."},{"scenario":"Kevin wants to quickly change a reference's type while writing a formula, without manually typing dollar signs.","question":"Which key toggles through reference types?","options":["F4","F1","Ctrl+Z","Tab"],"correct":0,"explanation":"F4 cycles a selected reference through relative \u2192 absolute \u2192 the two mixed forms."},{"scenario":"Brenda's discount formula broke when copied down because the discount-rate reference shifted to a blank cell.","question":"What was most likely wrong with the original formula?","options":["It used an absolute reference for the discount rate","It used a relative reference for the discount rate, which should have been absolute","It used SUM instead of AVERAGE","Nothing was wrong, this is expected behaviour"],"correct":1,"explanation":"A relative reference to a single shared cell breaks when copied, since it shifts along with the formula \u2014 that cell needed to be absolute."},{"scenario":"Kevin needs a formula copied both across columns and down rows, where only the row number of one reference should stay fixed.","question":"What kind of reference does this describe?","options":["Fully relative","Fully absolute","A mixed reference locking only the row","This is not possible in Excel"],"correct":2,"explanation":"A mixed reference (e.g. B$2) locks just the row while the column still shifts, or vice versa \u2014 exactly this partial-locking case."},{"scenario":"Brenda asks why her formula \"broke\" only after she copied it to other rows, when it worked fine in the first row.","question":"What is the most likely general explanation?","options":["Excel formulas always break after one use","A reference that should have been absolute was left relative, so it shifted when copied","The file was saved in the wrong format","The formula used too many functions at once"],"correct":1,"explanation":"This is the classic absolute-vs-relative symptom: a formula that works once but breaks when copied usually has a reference that needed to be locked and was not."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }
        const HOWTO_TITLE = 'Quick How-To: Locking a Reference';
        const HOWTO_INTRO = 'Two of the scenarios coming up are about exactly this: Brenda has a single tax-rate cell (B2) that a formula must reference, and that reference must never shift no matter where the formula is copied. Pick the correct way to write that reference, then pick the key that helps type it quickly, and check your work.';
        const HOWTO_CHECK_LABEL = 'Check My Reference';
        const HOWTO_OK_MSG = 'Correct — dollar signs on both the column and the row lock a reference completely, and F4 is the shortcut that cycles through those forms while typing a formula.';
        const HOWTO_FAIL_MSG = 'Not yet — a reference that must never move needs dollar signs on both the column and the row, and there is a single function key that toggles reference types.';
        const HOWTO_FIELDS = [
            { id: 'howtoRefFormat', kind: 'select', label: 'The tax-rate cell is B2. A formula will be copied down many rows, and the tax-rate reference must never shift. How should B2 be written inside that formula?', options: [
                { value: '', label: 'Choose a reference format...' },
                { value: 'B2', label: 'B2' },
                { value: '$B$2', label: '$B$2' },
                { value: 'B$2', label: 'B$2' },
                { value: '$B2', label: '$B2' }
            ], rule: { op: 'eq', target: '$B$2' } },
            { id: 'howtoRefKey', kind: 'select', label: 'Kevin wants to add those dollar signs quickly while typing the formula, instead of typing each $ by hand. Which key cycles a selected reference through its relative, absolute, and mixed forms?', options: [
                { value: '', label: 'Choose a key...' },
                { value: 'F1', label: 'F1' },
                { value: 'F4', label: 'F4' },
                { value: 'CtrlZ', label: 'Ctrl+Z' },
                { value: 'Tab', label: 'Tab' }
            ], rule: { op: 'eq', target: 'F4' } }
        ];
        function escHtmlH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function applyOp(op, val, target) {
            if (op === 'eq') return val === target;
            if (op === 'checked') return val === true;
            return false;
        }
        function renderHowtoFields(marks) {
            document.getElementById('howtoFields').innerHTML = HOWTO_FIELDS.map((f, i) => {
                const cls = marks ? (marks[i] ? 'hc-correct' : 'hc-wrong') : '';
                let control = '';
                if (f.kind === 'select') {
                    control = `<select id="${f.id}">` + f.options.map(o => `<option value="${escHtmlH(o.value)}">${escHtmlH(o.label)}</option>`).join('') + `</select>`;
                } else if (f.kind === 'checkbox') {
                    control = `<div class="hc-check-row"><input type="checkbox" id="${f.id}"><span>${escHtmlH(f.checkboxLabel)}</span></div>`;
                }
                return `<div class="howto-field ${cls}"><label>${escHtmlH(f.label)}</label>${control}</div>`;
            }).join('');
        }
        function checkHowto() {
            const marks = HOWTO_FIELDS.map(f => {
                const el = document.getElementById(f.id);
                const val = f.kind === 'checkbox' ? el.checked : el.value;
                return applyOp(f.rule.op, val, f.rule.target);
            });
            renderHowtoFields(marks);
            const allOk = marks.every(m => m);
            const banner = document.getElementById('howtoBanner');
            banner.classList.add('show');
            banner.className = 'howto-banner show ' + (allOk ? 'ok' : 'fail');
            banner.textContent = allOk ? HOWTO_OK_MSG : HOWTO_FAIL_MSG;
        }
        function renderHowto() {
            document.getElementById('exerciseCard').innerHTML = `
                <div class="howto-card">
                    <h3>${HOWTO_TITLE}</h3>
                    <p>${HOWTO_INTRO}</p>
                    <div class="howto-fields" id="howtoFields"></div>
                    <div class="howto-banner" id="howtoBanner"></div>
                    <button class="start-quiz-btn" id="checkHowtoBtn">${HOWTO_CHECK_LABEL}</button>
                    <button class="start-quiz-btn" id="startQuizBtn" style="margin-left:10px;background:linear-gradient(135deg,#28a745,#1e7e34);">Start Quiz &rarr;</button>
                </div>`;
            renderHowtoFields();
            document.getElementById('checkHowtoBtn').addEventListener('click', checkHowto);
            document.getElementById('startQuizBtn').addEventListener('click', renderQuestion);
        }

        renderHowto();
    </script>
</body>
</html>
