<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COA-01 Final Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Final Assessment · Quiz</div>
            <h1>COA-01 Final Assessment</h1>
            <p></p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [{"id":"q1","text":"You need every heading in a 40-page Word document to look identical, and you want to be able to restyle every heading at once later. What's the best approach?","options":["Apply a built-in Heading style to each one, so they're all linked to one definition","Manually bold and resize each heading one by one","Copy-paste formatting from the first heading using the Format Painter every time","Convert every heading into an image"],"answer":0,"explanation":"Styles link every element using them to one shared definition — change the style once and every heading using it updates automatically, unlike manual formatting or copy-pasting which has to be redone everywhere."},{"id":"q2","text":"You want to send the same certificate letter to 50 students, each with their own name and course filled in automatically. Which Word feature is built for this?","options":["Track Changes","Mail Merge","Text Boxes","Page Break"],"answer":1,"explanation":"Mail Merge combines a template document with a data source (like an Excel list of names) to generate one personalised copy per row."},{"id":"q3","text":"What does Mail Merge require to actually run?","options":["Only the Word template — it invents names automatically","A PDF version of the document","A main document (template) plus a data source (e.g. an Excel list) with matching fields","An internet connection"],"answer":2,"explanation":"Mail Merge needs both a template with merge fields and a connected data source (commonly an Excel sheet or Outlook contacts) supplying the values for each field."},{"id":"q4","text":"You want a header that shows the chapter title on every page from page 2 onward, but NOT on the cover page. Which setting makes this possible?","options":["Page Numbers only","Watermark","Column Breaks","Different First Page (in Header & Footer options)"],"answer":3,"explanation":"The 'Different First Page' option lets the cover page have a blank/unique header while every following page uses the standard header."},{"id":"q5","text":"In Excel, cell C3 contains the formula =A3*B3. You copy C3 down to C4. What happens to the formula in C4?","options":["It automatically becomes =A4*B4 — the references shift relative to the new row","It stays exactly =A3*B3","Excel shows an error","It becomes a fixed value with no formula"],"answer":0,"explanation":"By default, Excel uses relative references — copying a formula down or across shifts the cell references to match the new position."},{"id":"q6","text":"You're copying a formula that must always multiply by the value in cell B1, no matter which row you paste it into. What do you do?","options":["Nothing — Excel figures it out automatically","Add dollar signs to lock it, e.g. $1, so the reference doesn't shift when copied","Retype the formula manually in every cell","Convert B1 into a chart"],"answer":1,"explanation":"Dollar signs create an absolute reference ($1) — unlike a relative reference, it stays fixed on B1 no matter where the formula is copied."},{"id":"q7","text":"What's the practical difference between Sorting and Filtering a table of student results in Excel?","options":["They are the same feature with two names","Filtering deletes rows permanently","Sorting reorders all the rows; filtering temporarily hides rows that don't match a condition, without reordering the rest","Sorting only works on numbers, filtering only works on text"],"answer":2,"explanation":"Sorting rearranges every row by a chosen order; filtering hides rows that don't meet a criterion while leaving the underlying data and order intact."},{"id":"q8","text":"You want to show what percentage of a training budget was spent on each course category. Which chart type communicates this best?","options":["A line chart","A scatter chart","No chart is needed","A pie chart, since it shows parts of a whole"],"answer":3,"explanation":"Pie charts are built specifically to show proportions of a whole; a line chart is better suited to showing change over time, and a scatter chart to relationships between two numeric variables."},{"id":"q9","text":"What is a PivotTable mainly used for?","options":["Summarising and cross-tabulating large amounts of data — e.g. total sales per region per month — without writing formulas","Formatting cell borders","Spell-checking a worksheet","Printing a worksheet"],"answer":0,"explanation":"PivotTables let you drag-and-drop fields to instantly summarise, group, and cross-tabulate large datasets — a core reporting tool in Excel."},{"id":"q10","text":"Why would you apply a Theme to a PowerPoint presentation instead of styling each slide individually?","options":["Themes only affect the title slide","A theme applies a consistent set of colours, fonts and layouts across every slide at once, and updates them all if changed","Themes disable animations","Themes make the file impossible to edit"],"answer":1,"explanation":"A theme centrally controls colours/fonts/layout for the whole deck — exactly like a Word style, but for the whole presentation, keeping every slide visually consistent."},{"id":"q11","text":"What are Speaker Notes in PowerPoint actually for?","options":["Text visible to the audience during the presentation","A required field before you can save the file","Private prompts/reminders visible only to the presenter (e.g. in Presenter View), not shown on the projected slide","Automatic subtitles"],"answer":2,"explanation":"Speaker Notes are attached to a slide but only shown to the presenter (typically via Presenter View), letting them cue themselves without cluttering the audience-facing slide."},{"id":"q12","text":"What's the difference between a Transition and an Animation in PowerPoint?","options":["They are identical features","Transitions only work with video, animations only work with text","Animations are permanent and cannot be removed","A transition is the effect between two whole slides; an animation applies to individual elements within one slide"],"answer":3,"explanation":"Transitions control how one slide changes into the next; animations control how individual objects (text, images, shapes) behave within a single slide."},{"id":"q13","text":"You need to email your finished presentation to someone who doesn't have PowerPoint and shouldn't be able to edit it. What's the best export choice?","options":["Export it to PDF","Save it as a .pptx and hope for the best","Print it on paper and scan it back in","Save it as a .txt file"],"answer":0,"explanation":"PDF preserves the visual layout exactly and can be opened by virtually anyone without PowerPoint installed, and isn't natively editable — a good fit for read-only sharing."},{"id":"q14","text":"In Microsoft Publisher, what is a text box or frame primarily used for?","options":["Only for adding borders to a page","Holding and precisely positioning a block of text or an image anywhere on a page layout, independent of the rest of the content","Automatically translating text","Compressing the file size"],"answer":1,"explanation":"Publisher is a desktop-publishing tool built around free-positioned text/picture frames, unlike Word's flowing document model — frames let you place content exactly where you want it on the page."},{"id":"q15","text":"Why start a new flyer from one of Publisher's built-in templates instead of a blank page?","options":["Templates cannot be changed once chosen","Blank pages are not supported in Publisher","A template gives you a professionally laid-out starting point (spacing, placeholder text/images) that you customise, saving design time","Templates are only for greeting cards"],"answer":2,"explanation":"Templates provide a tested layout and placeholder content you replace with your own — a major head start over designing every element from a blank page."},{"id":"q16","text":"Before sending a Publisher flyer to a commercial printer, what should you double-check?","options":["That the file has an internet connection","That every font is Comic Sans","That the file cannot be reopened","Print settings like bleed, margins and colour mode (CMYK vs RGB), since these affect how it will actually print"],"answer":3,"explanation":"Bleed, margins and colour mode are print-specific settings — getting them wrong can mean text is cut off or colours look different on the final printed piece, even if it looks fine on screen."},{"id":"q17","text":"Which is an appropriate way to use an AI assistant while drafting a report in Word?","options":["Use it to generate a first draft or restructure a paragraph, then review and edit the result yourself before it goes out","Let it write the entire report and submit it unread","Use it to permanently delete your original draft","Ignore it entirely, since AI cannot help with writing at all"],"answer":0,"explanation":"AI drafting tools are most useful as a starting point or editing aid — the output still needs your review for accuracy, tone and correctness before it's considered finished."},{"id":"q18","text":"An AI assistant suggests an Excel formula to calculate your monthly totals. What should you do before relying on it?","options":["Apply it immediately with no checks","Test it against a few rows where you already know the correct answer, to confirm it actually calculates what you expect","Delete the underlying data so the formula has nothing to get wrong","Assume it's correct because AI wrote it"],"answer":1,"explanation":"AI-generated formulas can look plausible while still being subtly wrong (e.g. wrong range, off-by-one row) — spot-checking against known-correct values catches mistakes before they affect real reporting."}];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.text)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.answer].classList.add('correct');
            const right = i === q.answer;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this course.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the units you missed and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the questions you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
