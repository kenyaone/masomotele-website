<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choosing and Pairing Fonts for Real Projects | MTTI Graphic Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #6A1B9A 0%, #D81B60 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #f3e5f5; border-color: #6A1B9A; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #6A1B9A 0%, #D81B60 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #6A1B9A; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }

        /* How-To intro screen — shown before question 1, not scored */
        .howto-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .howto-card h3 { font-family: 'Fredoka', sans-serif; font-size: 1.3em; margin-bottom: 12px; color: #6A1B9A; }
        .howto-card p { line-height: 1.6; margin-bottom: 16px; color: #444; }
        .howto-banner { margin-top: 4px; margin-bottom: 18px; padding: 12px 16px; border-radius: 10px; font-size: 0.9em; font-weight: 700; display: none; }
        .howto-banner.show { display: block; }
        .howto-banner.ok { background: #d4edda; color: #155724; }
        .howto-banner.fail { background: #f8d7da; color: #721c24; }
        .start-quiz-btn { margin-top: 4px; background: linear-gradient(135deg, #6A1B9A 0%, #D81B60 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .howto-field { margin-bottom: 14px; }
        .howto-field label { display: block; font-size: 0.88em; color: #4a4a68; margin-bottom: 6px; font-weight: 700; }
        .howto-field select, .howto-field input[type=number], .howto-field input[type=text] { width: 100%; max-width: 320px; background: #f5f7fb; border: 2px solid #e0e6f5; color: #333; padding: 10px 12px; border-radius: 8px; font-size: 0.95em; font-family: 'Space Mono', monospace; }
        .howto-field select:focus, .howto-field input:focus { outline: none; border-color: #6A1B9A; }
        .howto-result-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 8px; font-size: 0.85em; margin-bottom: 6px; background: #f5f7fb; }
        .howto-result-row.ok { border-left: 3px solid #28a745; }
        .howto-result-row.fail { border-left: 3px solid #dc3545; }    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 1 · Lesson 1.1 · Quiz</div>
            <h1>Choosing and Pairing Fonts for Real Projects</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"Ivy is sorting reference fonts into categories for a moodboard.","question":"Which of these is a defining feature of a serif font?","options":["Small decorative strokes at the ends of letters","No decorative strokes at all","Letters that look hand-written","Extremely bold letterforms only"],"correct":0,"explanation":"Serif fonts have small finishing strokes (\"serifs\") at the ends of letters; sans-serif fonts do not have these strokes."},{"scenario":"A client asks Ivy for a \"clean, modern, minimal\" look for a tech startup's logo.","question":"Which font category best matches that brief?","options":["Script","Sans-serif","Heavy display","Ornamental decorative"],"correct":1,"explanation":"Sans-serif fonts read as clean and modern, which matches a minimal, contemporary tech brief."},{"scenario":"Ivy is laying out a long product description for a brochure at Chapa Design Studio.","question":"Why would she avoid a script or display font for this body text?","options":["They cost more money to license","They are hard to read in long blocks at small sizes","They only come in one color","They cannot be printed at all"],"correct":1,"explanation":"Script and display fonts are built for short, decorative use \u2014 their flourishes make long paragraphs tiring to read."},{"scenario":"Ivy pairs a plain sans-serif heading with a plain sans-serif body font that look almost identical.","question":"What is the likely problem with this pairing?","options":["Nothing, it's a perfectly safe combination","The two fonts are too similar and can look like an accidental mismatch rather than a deliberate pair","It will not print correctly","It uses too many colors"],"correct":1,"explanation":"Fonts that are almost-but-not-quite the same tend to read as an accidental mismatch rather than an intentional pairing; aim for clear contrast instead."},{"scenario":"Before finalizing a flyer, Ivy only checks the body text by zooming in on her screen to 300%.","question":"What is the risk of only checking readability this way?","options":["None, zoomed in is identical to the printed size","A font can look readable zoomed in but become hard to read at its real, smaller printed size","Zooming in changes the actual font","Zooming in makes the print file bigger"],"correct":1,"explanation":"Always test a font at the size it will actually appear at \u2014 it can look fine zoomed in on-screen and still be unreadable at the small size it will be printed."},{"scenario":"The client for the graduation flyer approves the design but says the invite text and the price list \"feel like they're competing\".","question":"What is the most likely fix?","options":["Add a third font to balance them out","Choose fonts that contrast clearly instead of two similar attention-grabbing fonts","Make both fonts even bigger","Remove all text and use only images"],"correct":1,"explanation":"When two decorative or bold fonts are used together they compete for attention; pairing one strong font with one quiet, simple font fixes the clash."},{"scenario":"Ivy is designing a wedding invitation and a large \"SALE\" banner in the same week.","question":"Which approach makes sense for each project?","options":["Use script and display fonts for both projects","Elegant serif or script for the wedding invite, bold display for the SALE banner \u2014 each font suited to its own project's mood","The exact same font for both projects","Pick random fonts without considering the brief"],"correct":1,"explanation":"Font choice should match the mood and purpose of each project \u2014 elegant script suits a wedding, bold display suits an attention-grabbing sale banner."},{"scenario":"A junior designer at Chapa Design Studio wants a fast rule to avoid font chaos on a new flyer.","question":"What is a simple, safe rule of thumb?","options":["Use as many fonts as look interesting","Limit the project to about two font families \u2014 one for headings, one for body text","Only ever use a single font style with zero exceptions","Choose fonts alphabetically"],"correct":1,"explanation":"Capping a project at roughly two font families (one for headings, one for body) is a reliable way to keep a design looking intentional rather than chaotic."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }
        /* How-To intro — a small, ungraded font-pairing field check shown
           before the quiz starts, directly rehearsing the "choose fonts
           that contrast clearly instead of two similar attention-grabbing
           fonts" mechanic that one of the quiz scenarios asks about, so
           it's not being asked cold. Same eq rule-checking logic as this
           course's other How-To field checks. */
        const HOWTO_FIELDS = [
            { id: 'headline_style', label: "Font style for the graduation flyer's main headline (the event name)", type: 'select', options: ['Bold Display', 'Quiet Simple Sans-serif', 'Elegant Script', 'Heavy Condensed'] },
            { id: 'pricelist_style', label: 'Font style for the supporting price list text underneath it', type: 'select', options: ['Bold Display', 'Quiet Simple Sans-serif', 'Elegant Script', 'Heavy Condensed'] },
        ];
        const HOWTO_RULES = [
            { field: 'headline_style', operator: 'eq', value: 'Bold Display', label: 'Headline keeps a strong, attention-grabbing font' },
            { field: 'pricelist_style', operator: 'eq', value: 'Quiet Simple Sans-serif', label: "Price list uses a quiet, simple font so it supports rather than competes" },
        ];

        function escHtmlH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        function howtoFieldHtml(f) {
            if (f.type === 'select') {
                return `<div class="howto-field"><label>${escHtmlH(f.label)}</label><select id="hf_${f.id}">${f.options.map(o => `<option value="${escHtmlH(o)}">${escHtmlH(o)}</option>`).join('')}</select></div>`;
            }
            return `<div class="howto-field"><label>${escHtmlH(f.label)}</label><input type="${f.type === 'number' ? 'number' : 'text'}" id="hf_${f.id}"></div>`;
        }

        function collectHowtoValues() {
            const vals = {};
            HOWTO_FIELDS.forEach(f => {
                const el = document.getElementById('hf_' + f.id);
                if (!el) return;
                vals[f.id] = f.type === 'number' ? parseFloat(el.value) : el.value;
            });
            return vals;
        }

        function applyHowtoOp(val, op, target) {
            switch (op) {
                case 'eq': return val == target;
                case 'neq': return val != target;
                case 'gte': return parseFloat(val) >= target;
                case 'lte': return parseFloat(val) <= target;
                case 'gt': return parseFloat(val) > target;
                case 'lt': return parseFloat(val) < target;
                default: return false;
            }
        }
        function checkHowto() {
            const vals = collectHowtoValues();
            const banner = document.getElementById('howtoBanner');
            const allOk = HOWTO_RULES.every(r => applyHowtoOp(vals[r.field], r.operator, r.value));
            banner.classList.add('show');
            banner.className = 'howto-banner show ' + (allOk ? 'ok' : 'fail');
            banner.textContent = allOk
                ? "That's a pairing that reads as deliberate — one strong font, one quiet font, instead of two fonts fighting for attention."
                : '❌ Not quite yet — re-check each field so the two fonts contrast instead of matching in boldness.';
            document.getElementById('howtoResultRows').innerHTML = HOWTO_RULES.map(r => {
                const ok = applyHowtoOp(vals[r.field], r.operator, r.value);
                return `<div class="howto-result-row ${ok ? 'ok' : 'fail'}"><span>${escHtmlH(r.label)}</span><span>${ok ? '✅' : '❌'}</span></div>`;
            }).join('');
        }

        function renderHowto() {
            document.getElementById('exerciseCard').innerHTML = `
                <div class="howto-card">
                    <h3>🔍 Quick How-To: Pairing Fonts So They Don't Compete</h3>
                    <p>One of the scenarios coming up is exactly this: on a graduation flyer for Chapa Design Studio, the client says the invite text and the price list "feel like they're competing." The fix is pairing one strong, attention-grabbing font with one quiet, simple font — not two bold fonts fighting each other. Choose a style for each piece of text below, then check your pairing.</p>
                    <div id="howtoFields">${HOWTO_FIELDS.map(howtoFieldHtml).join('')}</div>
                    <div class="howto-banner" id="howtoBanner"></div>
                    <div id="howtoResultRows"></div>
                    <button class="start-quiz-btn" id="checkHowtoBtn">Check My Pairing</button>
                    <button class="start-quiz-btn" id="startQuizBtn" style="margin-left:10px;background:linear-gradient(135deg,#28a745,#1e7e34);">Start Quiz →</button>
                </div>`;
            document.getElementById('checkHowtoBtn').addEventListener('click', checkHowto);
            document.getElementById('startQuizBtn').addEventListener('click', renderQuestion);
        }

        renderHowto();
    </script>
</body>
</html>
