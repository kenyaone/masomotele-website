<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorelDraw Interface and Core Tools | MTTI Graphic Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #6A3093 0%, #A044FF 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #f1e6ff; border-color: #6A3093; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #6A3093 0%, #A044FF 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #6A3093; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }

        /* How-To intro screen — shown before question 1, not scored */
        .howto-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .howto-card h3 { font-family: 'Fredoka', sans-serif; font-size: 1.3em; margin-bottom: 12px; color: #6A3093; }
        .howto-card p { line-height: 1.6; margin-bottom: 16px; color: #444; }
        .howto-fields { display: flex; flex-wrap: wrap; gap: 16px; background: #f5f0fb; border-radius: 12px; padding: 18px; margin-bottom: 18px; }
        .howto-field { flex: 1; min-width: 200px; }
        .howto-field label { display: block; font-size: 0.85em; font-weight: 700; margin-bottom: 6px; color: #4a2372; }
        .howto-field select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 2px solid #ddd; font-family: 'Space Mono', monospace; font-size: 0.95em; background: #fff; }
        .howto-field select.hf-correct { border-color: #28a745; background: #eafaf0; }
        .howto-field select.hf-wrong { border-color: #dc3545; background: #fdeaea; }
        .howto-field .hf-result { margin-top: 6px; font-size: 0.85em; font-weight: 700; display: none; }
        .howto-field .hf-result.show { display: block; }
        .howto-field .hf-result.ok { color: #155724; }
        .howto-field .hf-result.no { color: #721c24; }
        .howto-banner { margin-top: 4px; margin-bottom: 18px; padding: 12px 16px; border-radius: 10px; font-size: 0.9em; font-weight: 700; display: none; }
        .howto-banner.show { display: block; }
        .howto-banner.ok { background: #d4edda; color: #155724; }
        .howto-banner.fail { background: #f8d7da; color: #721c24; }
        .start-quiz-btn { margin-top: 4px; background: linear-gradient(135deg, #6A3093 0%, #A044FF 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Digital Tools (CorelDraw) · Lesson 1.1 · Quiz</div>
            <h1>CorelDraw Interface and Core Tools</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"Ivy opens CorelDraw for the very first time and sees three main areas: one running down the left, one along the top, and collapsible panels on the right.","question":"Which of these correctly matches the three main workspace areas she is looking at?","options":["Toolbox (left), property bar (top), dockers (right)","Property bar (left), toolbox (top), color palette (right)","Dockers (left), Pick tool (top), toolbox (right)","Toolbox (left), dockers (top), property bar (right)"],"correct":0,"explanation":"The toolbox runs down the left edge with all the drawing/editing tools, the property bar sits under the top menu and changes with the active tool/object, and dockers are the collapsible detail panels on the right."},{"scenario":"Ivy selects an ellipse shape, and then selects a text box instead. She notices the row of options just under the top menu changes completely between the two.","question":"What is this changing row of options called?","options":["The docker","The property bar","The status bar","The color palette"],"correct":1,"explanation":"The property bar updates based on the currently selected tool or object — showing outline/corner options for a shape, and font options for text, for example."},{"scenario":"Ivy just finished drawing a shape with the Bezier tool and now wants to click it and drag it to a new spot on the canvas.","question":"Which tool does she need to switch to first?","options":["Stay on the Bezier tool","The Pick tool","The Zoom tool","The Eyedropper tool"],"correct":1,"explanation":"Selecting, moving, resizing and rotating objects is done with the Pick tool — after drawing with another tool, switching back to the Pick tool is the normal next step."},{"scenario":"Ivy wants a fast way to get back to the Pick tool without moving her mouse all the way to the toolbox.","question":"What is the quick shortcut for this in CorelDraw?","options":["Pressing Ctrl+Z","Pressing the spacebar","Pressing Enter","Pressing Tab"],"correct":1,"explanation":"The spacebar is a quick shortcut that switches back to the Pick tool from most other tools, saving Ivy a trip back to the toolbox."},{"scenario":"A client emails Chapa Design Studio a logo as a JPG screenshot, and separately as the original CorelDraw .cdr file. Ivy needs to enlarge the logo for a large banner.","question":"Which file should Ivy prefer to work from, and why?","options":["The JPG, because it's smaller in file size","The .cdr file, because vector artwork scales up without losing sharpness","Either one works exactly the same at any size","The JPG, because raster images always look sharper enlarged"],"correct":1,"explanation":"The .cdr file holds vector paths, which are math-based and scale to any size cleanly. The JPG is raster (pixel-based) and will blur or pixelate when enlarged significantly."},{"scenario":"Ivy is trying to explain to a new intern why CorelDraw is described as a 'vector-first' application.","question":"Which explanation is most accurate?","options":["Its core drawing tools (shapes, Bezier paths, text) produce vector paths built from points and math rather than a pixel grid","It can only open raster image files and cannot draw anything itself","It converts every file to a fixed-size pixel grid the moment it's opened","Vector and raster mean exactly the same thing in CorelDraw"],"correct":0,"explanation":"CorelDraw's native tools create vector artwork — math-based paths — which is exactly why it's the industry standard for logos and print work that needs to resize cleanly."},{"scenario":"Ivy zooms in very closely on a raster photo that was imported into her CorelDraw document.","question":"What is she likely to notice as she zooms in far enough?","options":["The photo stays perfectly sharp no matter how far she zooms","The photo starts to look blocky or blurry because it's made of a fixed grid of pixels","The photo automatically converts itself into vector paths","Nothing changes because raster and vector behave identically"],"correct":1,"explanation":"Raster images are a fixed grid of pixels — there's no more real detail once you zoom past 100%, so blockiness or blur appears. This is the opposite of vector artwork, which stays sharp at any scale."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }

        /* How-To intro — a small, ungraded field-check demo shown before the
           quiz starts, rehearsing the "switch to the Pick tool" mechanic one
           of the quiz scenarios asks about, so it's not asked cold. */
        const HOWTO_FIELDS = [
            { id: 'howtoTool', target: 'Pick tool' },
            { id: 'howtoShortcut', target: 'Spacebar' },
        ];

        function checkHowto() {
            let allOk = true;
            HOWTO_FIELDS.forEach(f => {
                const sel = document.getElementById(f.id);
                const resultEl = document.getElementById(f.id + 'Result');
                const ok = sel.value === f.target;
                if (!ok) allOk = false;
                sel.classList.remove('hf-correct', 'hf-wrong');
                sel.classList.add(ok ? 'hf-correct' : 'hf-wrong');
                resultEl.classList.add('show');
                resultEl.className = 'hf-result show ' + (ok ? 'ok' : 'no');
                resultEl.textContent = ok ? "✅ Correct." : "❌ Not yet — try again.";
            });
            const banner = document.getElementById('howtoBanner');
            banner.classList.add('show');
            banner.className = 'howto-banner show ' + (allOk ? 'ok' : 'fail');
            banner.textContent = allOk
                ? "✅ That's it — switch to the Pick tool (or just tap Spacebar) any time you need to click and drag a shape you just drew."
                : "❌ Not quite yet — check both dropdowns against what Ivy needs to do to move her shape.";
        }

        function renderHowto() {
            document.getElementById('exerciseCard').innerHTML = `
                <div class="howto-card">
                    <h3>🔍 Quick How-To: Switching to the Right Tool</h3>
                    <p>One of the scenarios coming up asks about this exact moment: Ivy just finished drawing a shape with the Bezier tool and now wants to click it and drag it to a new spot. Before she can do that, she needs to switch tools. Fill in what she should do, then check your answers.</p>
                    <div class="howto-fields">
                        <div class="howto-field">
                            <label for="howtoTool">Which tool should Ivy switch to?</label>
                            <select id="howtoTool">
                                <option value="">-- choose --</option>
                                <option value="Bezier tool">Bezier tool</option>
                                <option value="Pick tool">Pick tool</option>
                                <option value="Zoom tool">Zoom tool</option>
                                <option value="Eyedropper tool">Eyedropper tool</option>
                            </select>
                            <div class="hf-result" id="howtoToolResult"></div>
                        </div>
                        <div class="howto-field">
                            <label for="howtoShortcut">Fastest keyboard shortcut to get there?</label>
                            <select id="howtoShortcut">
                                <option value="">-- choose --</option>
                                <option value="Ctrl+Z">Ctrl+Z</option>
                                <option value="Spacebar">Spacebar</option>
                                <option value="Enter">Enter</option>
                                <option value="Tab">Tab</option>
                            </select>
                            <div class="hf-result" id="howtoShortcutResult"></div>
                        </div>
                    </div>
                    <div class="howto-banner" id="howtoBanner"></div>
                    <button class="start-quiz-btn" id="checkHowtoBtn">Check My Settings</button>
                    <button class="start-quiz-btn" id="startQuizBtn" style="margin-left:10px;background:linear-gradient(135deg,#28a745,#1e7e34);">Start Quiz →</button>
                </div>`;
            document.getElementById('checkHowtoBtn').addEventListener('click', checkHowto);
            document.getElementById('startQuizBtn').addEventListener('click', renderQuestion);
        }

        renderHowto();
    </script>
</body>
</html>
