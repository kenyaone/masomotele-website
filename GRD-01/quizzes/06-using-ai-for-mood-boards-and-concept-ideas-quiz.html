<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using AI for Mood Boards and Concept Ideas | MTTI Graphic Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #D35400 0%, #8E44AD 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #D35400 0%, #8E44AD 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #eef1fb; border-color: #D35400; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #D35400 0%, #8E44AD 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #D35400; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }

        /* How-To intro screen — shown before question 1, not scored */
        .howto-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .howto-card h3 { font-family: 'Fredoka', sans-serif; font-size: 1.3em; margin-bottom: 12px; color: #D35400; }
        .howto-card p { line-height: 1.6; margin-bottom: 16px; color: #444; }
        .howto-fields { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
        .howto-field { background: #f5f7fb; border: 2px solid transparent; border-radius: 10px; padding: 14px 16px; }
        .howto-field label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.9em; color: #333; }
        .howto-field input[type="text"] { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #ccc; font-family: 'Space Mono', monospace; font-size: 0.95em; }
        .howto-field .hc-result { margin-top: 6px; font-size: 0.85em; font-weight: 700; }
        .howto-field.hc-ok { border-color: #28a745; background: #eafaf0; }
        .howto-field.hc-bad { border-color: #dc3545; background: #fdeeee; }
        .howto-banner { margin-top: 4px; margin-bottom: 18px; padding: 12px 16px; border-radius: 10px; font-size: 0.9em; font-weight: 700; display: none; }
        .howto-banner.show { display: block; }
        .howto-banner.ok { background: #d4edda; color: #155724; }
        .howto-banner.fail { background: #f8d7da; color: #721c24; }
        .start-quiz-btn { margin-top: 4px; background: linear-gradient(135deg, #D35400 0%, #8E44AD 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">AI Tools for Graphic Designers · Topic 1 · Quiz</div>
            <h1>Using AI for Mood Boards and Concept Ideas</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"Ivy has just been briefed on a new client job and hasn't opened CorelDraw yet.","question":"What is the best use of an AI image tool at this stage?","options":["Quickly generate mood board / concept direction ideas","Build the entire final logo file","Skip planning entirely and start with plain colour swatches only","Ask the AI tool to write the client's business plan"],"correct":0,"explanation":"At the concept stage, an AI image tool is best used to quickly explore mood board directions before real artwork begins."},{"scenario":"Ivy types \"cafe logo\" into the AI tool and gets vague, generic results.","question":"What would most likely improve the results?","options":["Adding detail: subject, mood, colour palette, and style reference","Typing the exact same prompt again","Turning off her computer","Asking for a completely unrelated image"],"correct":0,"explanation":"Specific, detailed prompts consistently produce more useful, focused concept results than vague ones."},{"scenario":"Ivy generates a batch of AI mood board images with a warm green and cream palette and hand-drawn leaf shapes she really likes.","question":"What should she take forward into her CorelDraw file?","options":["The exact pixel image, unmodified","The colour palette and motif style as inspiration, redrawn as original vector shapes","Nothing — mood boards aren't useful once she's picked a direction","Only the file name of the AI tool"],"correct":1,"explanation":"The mood board's value is the direction it suggests — colours, motifs, and style — which Ivy then rebuilds as original artwork."},{"scenario":"A colleague suggests just exporting the best AI mood board image and sending it straight to the client as the finished logo, to save time.","question":"Is this good practice?","options":["Yes, it saves time and looks professional","No — AI concept images are a starting point, not finished, original client-ready vector artwork","Yes, but only for very small clients","It doesn't matter as long as the client doesn't ask questions"],"correct":1,"explanation":"AI mood board images are never a substitute for original, client-ready vector artwork built in CorelDraw."},{"scenario":"Ivy wants a mood board with a distinctly different aesthetic direction from her first attempt, to show the client two options.","question":"What is a reasonable way to get a second, distinct direction?","options":["Reuse the identical prompt and hope for a different result","Write a new prompt with different mood, style, and colour keywords","Give up on a second concept","Ask the AI tool to copy an existing competitor's logo exactly"],"correct":1,"explanation":"Changing the descriptive keywords in the prompt is what produces a genuinely different concept direction."},{"scenario":"Ivy notices the AI mood board images look good overall, but the fine linework is inconsistent and slightly blurry up close.","question":"Why does this matter for her CorelDraw workflow?","options":["It doesn't matter, blurriness is fine for a logo","It confirms she needs to rebuild the design as clean, scalable vector artwork rather than use the image directly","It means she should give up on AI mood boards entirely","It means the AI tool is broken"],"correct":1,"explanation":"Inconsistent, blurry pixel detail is normal for AI concept images and is exactly why the final logo must be redrawn as crisp vector artwork."},{"scenario":"A new junior joins Chapa Design Studio and asks Ivy why they bother with AI mood boards if they still have to redraw everything in CorelDraw.","question":"What is the best explanation?","options":["AI mood boards are a fast way to explore directions and get client buy-in early, before investing time in detailed vector artwork","There's no real reason, it's just for fun","It replaces the need for CorelDraw entirely","It's a legal requirement for all logo design"],"correct":0,"explanation":"Mood boards save time by narrowing down direction quickly, before the more time-consuming work of building final vector artwork begins."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '&#9989; Correct.' : '&#10060; Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }

        /* How-To intro — a small, ungraded prompt-detail demo shown before the
           quiz starts, directly rehearsing the "add subject, mood, and colour
           palette detail" mechanic that one of the quiz scenarios asks about,
           so it's not being asked cold. */
        const HOWTO_FIELDS = [
            { id: 'hfSubject', label: 'Subject — what is the mood board actually of?', placeholder: 'e.g. a rustic neighbourhood cafe' },
            { id: 'hfMood', label: 'Mood / style keyword', placeholder: 'e.g. warm, hand-drawn, earthy' },
            { id: 'hfColour', label: 'Colour palette', placeholder: 'e.g. terracotta and cream' },
        ];

        function renderHowtoFields() {
            document.getElementById('howtoFields').innerHTML = HOWTO_FIELDS.map(f => `
                <div class="howto-field" id="wrap_${f.id}">
                    <label for="${f.id}">${f.label}</label>
                    <input type="text" id="${f.id}" placeholder="${f.placeholder}">
                    <div class="hc-result" id="res_${f.id}"></div>
                </div>`).join('');
            HOWTO_FIELDS.forEach(f => {
                document.getElementById(f.id).addEventListener('input', () => {
                    document.getElementById('howtoBanner').classList.remove('show');
                });
            });
        }

        function checkHowto() {
            let allOk = true;
            HOWTO_FIELDS.forEach(f => {
                const val = document.getElementById(f.id).value.trim();
                const ok = val.length > 0;
                if (!ok) allOk = false;
                const wrap = document.getElementById('wrap_' + f.id);
                wrap.classList.remove('hc-ok', 'hc-bad');
                wrap.classList.add(ok ? 'hc-ok' : 'hc-bad');
                document.getElementById('res_' + f.id).textContent = ok
                    ? '✅ Added'
                    : '❌ Still blank — a gap like this is exactly what produces vague, generic results';
            });
            const banner = document.getElementById('howtoBanner');
            banner.classList.add('show');
            banner.className = 'howto-banner show ' + (allOk ? 'ok' : 'fail');
            banner.textContent = allOk
                ? '✅ Nice — a prompt with subject, mood, and colour detail like this is what turns a generic "cafe logo" request into a useful mood board.'
                : '❌ Fill in every field first — a prompt missing subject, mood, or colour detail is exactly what produces vague, generic results like the ones in the scenario.';
        }

        function renderHowto() {
            document.getElementById('exerciseCard').innerHTML = `
                <div class="howto-card">
                    <h3>🔍 Quick How-To: Writing a Detailed AI Prompt</h3>
                    <p>One of the scenarios coming up is about this exact moment: Ivy types a vague prompt like "cafe logo" into the AI tool and gets vague, generic results. The fix is adding real detail — <strong>subject, mood/style, and colour palette</strong>. Try filling in all three fields below for a new client concept, then check your prompt.</p>
                    <div class="howto-fields" id="howtoFields"></div>
                    <div class="howto-banner" id="howtoBanner"></div>
                    <button class="start-quiz-btn" id="checkHowtoBtn">Check My Prompt</button>
                    <button class="start-quiz-btn" id="startQuizBtn" style="margin-left:10px;background:linear-gradient(135deg,#28a745,#1e7e34);">Start Quiz →</button>
                </div>`;
            renderHowtoFields();
            document.getElementById('checkHowtoBtn').addEventListener('click', checkHowto);
            document.getElementById('startQuizBtn').addEventListener('click', renderQuestion);
        }

        renderHowto();
    </script>
</body>
</html>
