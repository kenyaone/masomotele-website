<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Parts-Lookup and Compatibility Checking | MTTI Mobile Repair</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #134E5E 0%, #71B280 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #71B280 0%, #134E5E 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #eef1fb; border-color: #134E5E; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #134E5E 0%, #71B280 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #134E5E; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">AI Tools for Mobile Repair Technicians · Topic 2 of 3 · Quiz</div>
            <h1>AI Parts-Lookup and Compatibility Checking</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">7</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"A customer at QuickFix Phone Repairs needs a replacement screen for a Samsung Galaxy A12.","question":"What should Purity give the AI assistant to check compatibility accurately?","options":["Just the phone brand name","The exact model number and the exact replacement part number","The customer's name and phone number","Nothing, she should just order any A12 screen"],"correct":1,"explanation":"Precise model and part numbers give the AI concrete details to check, producing a much more accurate compatibility answer."},{"scenario":"Purity asks the AI to check compatibility, and it responds confidently but does not mention which regional variant it is referring to.","question":"What should Purity do next?","options":["Trust the confident tone and order immediately","Cross-check the answer against a supplier spec sheet or compare connectors before ordering","Assume all variants are identical","Ask a different customer to confirm"],"correct":1,"explanation":"A confident tone does not guarantee accuracy for a specific variant — cross-checking against a trusted source avoids an expensive mistake."},{"scenario":"Two phones with the same model name can still have different internal hardware.","question":"Why does this matter when ordering a replacement part?","options":["It doesn't matter, all parts with the same model name are identical","Different variants can need different connectors or part shapes, so the wrong variant's part may not fit or could damage the board","Only the color changes between variants","Parts are universal across all phone brands"],"correct":1,"explanation":"Hardware differences between variants (connectors, board layout) mean the wrong part can fail to fit or even damage the device."},{"scenario":"Purity is deciding how much to trust an AI's compatibility answer without any further check.","question":"What is the sensible approach?","options":["Treat it as a fast first-pass check, then confirm with a supplier spec sheet or physical comparison before ordering","Treat it as guaranteed accurate every time","Never use AI for this purpose","Only use AI compatibility checks for expensive parts"],"correct":0,"explanation":"AI answers are a useful starting point, but confirming with a trusted source before spending the customer's money is the safe habit."},{"scenario":"A previous job at QuickFix Phone Repairs went wrong because Purity ordered a part based only on the AI's answer, skipping any further check.","question":"What lesson should she take from that mistake?","options":["Stop using AI tools entirely for parts lookup","Always verify AI's compatibility answer against a trusted source before committing money","Only ever trust the customer's own guess about parts","Order extra parts every time to be safe"],"correct":1,"explanation":"The mistake shows why a verification step against a trusted source is essential before acting on an AI's compatibility answer."},{"scenario":"Purity finds a very new screen part number that the AI assistant seems unfamiliar with.","question":"What does this suggest about the AI's answer?","options":["It is still fully reliable regardless of familiarity","The AI may not have accurate or up to date information on very new parts, so extra verification is needed","The part definitely does not exist","AI tools automatically update themselves instantly for new parts"],"correct":1,"explanation":"AI tools can lack information on very recent parts, making it especially important to verify with a current supplier listing."},{"scenario":"Purity wants to build a reliable habit for parts lookup at QuickFix Phone Repairs.","question":"Which habit best balances speed and accuracy?","options":["Use AI for a fast first-pass compatibility check, then confirm with a supplier spec sheet or physical comparison before ordering","Skip AI entirely and only use supplier catalogs","Only use AI and never check anything else","Ask the customer to confirm compatibility themselves"],"correct":0,"explanation":"Combining AI's speed with a final trusted-source check gives Purity both efficiency and accuracy."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? 'Correct.' : 'Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }
        renderQuestion();
    </script>
</body>
</html>
