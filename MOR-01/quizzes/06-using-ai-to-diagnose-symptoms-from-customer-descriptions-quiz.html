<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using AI to Diagnose Symptoms From Customer Descriptions | MTTI Mobile Repair</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #0F2027 0%, #2C5364 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #2C5364 0%, #0F2027 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #eef1fb; border-color: #2C5364; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #0F2027 0%, #2C5364 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #2C5364; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">AI Tools for Mobile Repair Technicians · Topic 1 of 3 · Quiz</div>
            <h1>Using AI to Diagnose Symptoms From Customer Descriptions</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">7</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"A customer at QuickFix Phone Repairs tells Purity: \\"my phone gets hot and the battery dies fast.\\"","question":"What is the best first step for Purity to take with an AI assistant?","options":["Feed the vague description to the AI to get a first-pass list of likely causes before opening the device","Skip the AI and open the phone immediately","Ask the AI to repair the phone remotely","Tell the customer the phone cannot be fixed"],"correct":0,"explanation":"Feeding the description into an AI assistant produces a useful first-pass list of causes to investigate before any disassembly."},{"scenario":"Purity types just \\"phone problem, please fix\\" into the AI assistant with no other detail.","question":"Why is this prompt unlikely to produce a useful list of causes?","options":["The AI never works for phone repair questions","It is too vague — the AI has no symptom details to reason from","AI assistants require a paid subscription for repair questions","The prompt is too long"],"correct":1,"explanation":"A vague prompt gives the AI nothing concrete to reason from; describing the actual symptoms produces a far more useful list."},{"scenario":"The AI gives Purity a list of possible causes: battery degradation, a stuck background app, a faulty charging IC, and malware.","question":"How should Purity treat this list?","options":["As a confirmed diagnosis she can act on immediately","As a checklist of things to test physically before concluding anything","As proof the phone is unrepairable","As something to read to the customer and stop there"],"correct":1,"explanation":"The AI's list narrows down where to look; Purity still needs to test each possibility at the bench before concluding what is actually wrong."},{"scenario":"A customer mentions the overheating started right after a software update, and gives the exact phone model.","question":"What should Purity do with these extra details?","options":["Leave them out, they are not relevant","Include them in her AI prompt to get a more specific, useful list of causes","Tell the AI to undo the update remotely","Ignore the customer and use a generic checklist instead"],"correct":1,"explanation":"Adding specific details like model and timing sharpens the AI's suggested list, making it more targeted and useful."},{"scenario":"Purity gets the AI's list of likely causes and immediately replaces the battery, charging port, and motherboard without testing anything first.","question":"What is wrong with this approach?","options":["Nothing, replacing everything the AI mentioned is the safest approach","She skipped physically testing each possibility before spending the customer's money on parts","The AI's list was too short","She should have asked the AI to place the parts order"],"correct":1,"explanation":"Acting on the AI's list without testing wastes money and time — the list is a starting checklist, not a confirmed fix."},{"scenario":"A different customer says their phone \\"just feels slow sometimes.\\"","question":"What is the most useful next step before typing this into an AI assistant?","options":["Ask the customer a few clarifying questions (when it happens, which apps, since when) to build a clearer prompt","Type exactly those four words and accept whatever comes back","Refuse the job since the description is too vague","Assume it is a battery problem without asking anything"],"correct":0,"explanation":"Gathering a few clarifying details from the customer first produces a clearer, more specific AI prompt and a more useful list of causes."},{"scenario":"Purity has now tested each cause on the AI's list at the bench and found the real fault: a swollen battery pressing against the charging flex.","question":"What was the AI assistant's actual role in this repair?","options":["It performed the repair automatically","It helped generate a first-pass list of likely causes for Purity to test herself","It replaced the need for any hands-on inspection","It confirmed the final diagnosis on its own"],"correct":1,"explanation":"The AI helped narrow down where to look; the actual diagnosis was confirmed by Purity's own hands-on testing at the bench."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? 'Correct.' : 'Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }
        renderQuestion();
    </script>
</body>
</html>
