<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Considerations | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 2 · Lesson 2.2</div>
            <h1>Website Considerations</h1>
            <p>10 Karibu Kitchen scenarios — apply the eight parts, six design terms, and content practices</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "Sarah is drawing her five WordPress pages for Karibu Kitchen on a piece of paper. She asks which pages a small restaurant website absolutely must have.",
    "question": "From the eight essential parts in Lesson 2.2, which five best fit Karibu Kitchen?",
    "options": [
      "Homepage, About, Contact, News/Blog, Services/Product descriptions.",
      "Homepage, checkout, sitemap, whitepaper, admin dashboard.",
      "Only a homepage — everything else is optional.",
      "Twelve landing pages, one per product, with no About or Contact."
    ],
    "correct": 0,
    "explanation": "Section 2.2 names eight parts and points out that Sarah, a restaurant, needs the first five: homepage, company info, contact, news/blog, services/products. She does not need e-commerce (WhatsApp handles orders) or a full sitemap page yet."
  },
  {
    "scenario": "Sarah's cousin says: \"Beautiful design is all that matters — pick the prettiest theme and you are done.\" You need to teach her the difference between UI and UX.",
    "question": "Which explanation matches Lesson 2.2?",
    "options": [
      "UI and UX are the same thing.",
      "UI (User Interface) is what the site looks like — buttons, menus, colours. UX (User Experience) is how it feels to use — the overall satisfaction. A beautiful UI with terrible UX is a site that looks great but frustrates the customer.",
      "UI is for mobile, UX is for desktop.",
      "UX means \"Ugly eXperience\" and should be avoided."
    ],
    "correct": 1,
    "explanation": "Section 2.2's definition is exact: UI is visual elements, UX is overall satisfaction. The lesson also warns that good UX often means LESS UI — fewer buttons, fewer choices, clearer language. Options 1, 3 and 4 are wrong."
  },
  {
    "scenario": "Sarah tested her new WordPress site on her laptop only. Three days after launch, a friend complains: \"I opened it on my phone and the menu button is off-screen, and the whole thing is squashed.\"",
    "question": "Which Lesson 2.2 design term addresses this problem?",
    "options": [
      "Accessibility.",
      "Performance.",
      "Responsive design — the site should rearrange itself to fit any screen size, which is critical in Kenya where over 80 per cent of internet traffic is mobile.",
      "Browser compatibility."
    ],
    "correct": 2,
    "explanation": "Section 2.2 defines responsive design as the site adapting to any screen. It is called out as non-negotiable in Kenya's mobile-first traffic reality. Accessibility, performance, and browser compatibility are separate (though also non-negotiable) design terms."
  },
  {
    "scenario": "Sarah's homepage loads in 8 seconds because of a huge unoptimised photo of ugali. Her bounce rate is 62 per cent.",
    "question": "Which Lesson 2.2 principle is failing, and what is the target?",
    "options": [
      "Accessibility — the target is under 30 seconds.",
      "Performance — the target is under 3 seconds, otherwise you lose half your visitors.",
      "Responsive design — the target is 10 seconds.",
      "Browser compatibility — the target is 5 seconds."
    ],
    "correct": 1,
    "explanation": "Section 2.2 puts the performance target at under 3 seconds and warns that half of visitors leave beyond that. Compress the image, and the bounce rate falls. Options 1, 3 and 4 attach wrong metrics to the wrong terms."
  },
  {
    "scenario": "A visually impaired customer using a screen reader visits Sarah's Karibu Kitchen site. Every food photo is announced as \"image image image\" and the menu button is only clickable with a mouse.",
    "question": "Which website consideration from Lesson 2.2 is failing?",
    "options": [
      "Accessibility — the site should be usable by people with disabilities, including screen-reader users and keyboard-only navigators. Every image needs alt text; every interactive element needs to be keyboard-reachable.",
      "SEO.",
      "Responsive design.",
      "E-commerce."
    ],
    "correct": 0,
    "explanation": "Section 2.2 defines accessibility as designing so that people with disabilities can use the site — screen readers, keyboard navigation. Options 2–4 name real considerations but not the one described in this scenario."
  },
  {
    "scenario": "Sarah's About page is 900 words of jargon: \"Karibu Kitchen leverages synergistic culinary paradigms to actualise gastronomic value propositions across the Eldoret ecosystem.\"",
    "question": "Which content practice from Lesson 2.2 is she breaking?",
    "options": [
      "High-quality images.",
      "Consistent branding.",
      "Audience-focused, clear and concise writing — no jargon, no long sentences, written for the customer, not for the business owner.",
      "Regularly updated content."
    ],
    "correct": 2,
    "explanation": "Section 2.2 lists six content practices; the two most relevant here are audience-focused and clear/concise. Kapsoya office workers do not care about \"gastronomic value propositions\". Rewrite in plain Kenyan English. The other options name real practices but not the ones being violated."
  },
  {
    "scenario": "Sarah is writing menu descriptions and wants to include the phrase \"lunch delivery Eldoret\" so Google can find her. Her cousin says she should paste \"lunch delivery Eldoret lunch delivery Eldoret lunch delivery Eldoret\" 30 times at the bottom of every page.",
    "question": "Which Lesson 2.2 content practice does this violate?",
    "options": [
      "Use relevant keywords NATURALLY — do not stuff them. Keyword stuffing looks spammy to customers and is penalised by search engines.",
      "Consistent branding.",
      "Audience-focused.",
      "Regularly updated content."
    ],
    "correct": 0,
    "explanation": "Section 2.2's content practice list explicitly says use keywords naturally, do not stuff. Keyword stuffing is the exact opposite. Sarah should weave the phrase into headlines, page titles, alt text and body copy in a way that reads normally."
  },
  {
    "scenario": "Sarah has built her five-page site but is nervous — she thinks the whole project is nearly done. Her cousin asks, \"So how do people find it?\" Sarah has no answer.",
    "question": "Which set of promotion tactics from Lesson 2.2 should she plan next?",
    "options": [
      "Wait patiently — Google will eventually notice.",
      "Buy a billboard on Uganda Road for KES 300,000.",
      "Share every new page on social media, run PPC or display ads, build inbound links, use email marketing, submit to search engines and directories, add the URL to her email signature, and print it on business cards and flyers with a QR code.",
      "Delete the site and start again on Wix."
    ],
    "correct": 2,
    "explanation": "Section 2.2 lists seven website promotion tactics — this is where most small businesses give up. Option 1 wastes months; option 2 is off-strategy and off-budget; option 4 throws away the work she has done."
  },
  {
    "scenario": "Sarah's About page still says \"Founded in 2020, delivering to Kapsoya since 2020.\" It is now late 2026. Nothing has been updated in the six years since.",
    "question": "Which Lesson 2.2 content practice is failing?",
    "options": [
      "Consistent branding.",
      "Regularly updated content — an About page frozen at launch is a red flag to customers and to search engines.",
      "High-quality images.",
      "Responsive design."
    ],
    "correct": 1,
    "explanation": "Section 2.2 calls out an \"About Us from 2020\" as a red flag example. Regular updates signal an active business. The other options name real practices but do not describe stale content."
  },
  {
    "scenario": "Sarah is browsing Nyakinyua Kitchen's competitor site on Firefox and notices the checkout looks broken — buttons are missing and the fonts are wrong. On Chrome the same site works perfectly.",
    "question": "Which design term from Lesson 2.2 has Nyakinyua Kitchen failed on?",
    "options": [
      "Performance.",
      "Accessibility.",
      "Responsive design.",
      "Browser compatibility — the site should work in Chrome, Safari, Edge and Firefox, not just the browser the developer tested in."
    ],
    "correct": 3,
    "explanation": "Section 2.2 defines browser compatibility as functioning across Chrome, Safari, Edge and Firefox. A site that only works in one browser silently loses a large share of Kenyan customers. The other options are real terms but do not fit this scenario."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
