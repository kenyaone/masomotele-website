<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Accounts | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 3 · Lesson 3.2</div>
            <h1>Social Media Accounts</h1>
            <p>10 Karibu Kitchen scenarios — set up business profiles, apply the six profile items, and master hashtag rules</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "Sarah has been running Karibu Kitchen from her PERSONAL Facebook profile — the one that shows her graduation photos and her cousin's wedding pictures. Her cousin says a \"real\" business page is unnecessary.",
    "question": "Why does Lesson 3.2 disagree — what are the reasons a personal profile is the wrong tool for a business?",
    "options": [
      "Personal profiles look more authentic — always use them.",
      "Personal profiles cannot run adverts, have no analytics, limit how many people can see posts, and look amateur — every serious business needs a Business Page.",
      "Personal profiles are illegal in Kenya.",
      "There is no difference between personal and business profiles."
    ],
    "correct": 1,
    "explanation": "Section 3.2 gives four specific reasons: no adverts, no analytics, throttled reach, amateur look. A Business Page costs zero shillings and takes ten minutes. This is the single most common mistake — and the easiest to fix."
  },
  {
    "scenario": "Sarah is choosing what type of account to open for Karibu Kitchen.",
    "question": "Which four types of profile does Lesson 3.2 name?",
    "options": [
      "Verified, unverified, gold, blue.",
      "Personal profile, Business Page/Profile, Group, Event.",
      "Free, paid, premium, enterprise.",
      "Admin, editor, moderator, viewer."
    ],
    "correct": 1,
    "explanation": "Section 3.2 names four account types: Personal (individual), Business Page/Profile (the business as an entity, with analytics and ad access), Group (community), Event (temporary page for a specific event). Sarah needs all four eventually — she starts with number two."
  },
  {
    "scenario": "You are auditing Karibu Kitchen's Facebook Business Page setup.",
    "question": "Which set matches the six items every business profile MUST include, per Lesson 3.2?",
    "options": [
      "Biography, profile picture, cover photo, website URL, contact details, category.",
      "Password, security question, PIN, recovery email, backup phone, secret answer.",
      "Logo, slogan, mission, vision, values, tagline.",
      "First post, second post, third post, fourth post, fifth post, sixth post."
    ],
    "correct": 0,
    "explanation": "Section 3.2 names these six exactly: bio (concise description with what/where/CTA), profile picture (logo, sharp and square), cover photo (landscape image showing what you do), website URL, contact details (phone, WhatsApp, email, address), and category (Restaurant, Delivery service, Local business). Missing any of them makes customers doubt you are real."
  },
  {
    "scenario": "Sarah writes her Facebook bio as: \"Karibu Kitchen. Food.\"",
    "question": "Which rewrite matches Lesson 3.2's guidance for a business bio?",
    "options": [
      "\"Karibu Kitchen.\"",
      "\"Karibu Kitchen — fresh Kenyan lunch, delivered daily to Eldoret CBD. Dinner delivered to Kapsoya, Elgon View, Racecourse. WhatsApp to order.\"",
      "\"Yummy food. Order today. Nice.\"",
      "A 500-word essay on the history of Kenyan cuisine."
    ],
    "correct": 1,
    "explanation": "Section 3.2 defines a bio as concise (one or two sentences) with three ingredients: WHAT you sell, WHERE, and a CALL TO ACTION. The lesson uses this exact example. Options 1 and 3 lack detail and CTA. Option 4 is too long for a bio."
  },
  {
    "scenario": "Sarah wants to include hashtags in her Karibu Kitchen Instagram post. Her cousin says: \"Put 30 hashtags on every post — that is what Instagram allows.\"",
    "question": "Which of Lesson 3.2's three hashtag rules applies?",
    "options": [
      "Use as many as the platform allows — 30 on Instagram.",
      "Use three to five hashtags per post, mix broad (#Eldoret) with specific (#KaribuKitchen), and research each tag before using it — some are banned or dead.",
      "Never use hashtags.",
      "Only use hashtags in ALL CAPS."
    ],
    "correct": 1,
    "explanation": "Section 3.2's three hashtag rules are: 3–5 per post (Instagram allows 30 but 3 works better), mix broad with specific, research each tag first. Option 1 makes her look like a spammer; option 3 wastes reach; option 4 is not a rule."
  },
  {
    "scenario": "Sarah writes six words on a caption — \"Nice food today, order now :)\" — and picks the hashtag #food.",
    "question": "What does the hashtag actually DO, per Lesson 3.2?",
    "options": [
      "Turns the word into a searchable tag so people who do not follow her yet can find her content by topic.",
      "Sends her post to Google as an SEO signal.",
      "Nothing — hashtags are decorative.",
      "Sends the post directly to influencers automatically."
    ],
    "correct": 0,
    "explanation": "Section 3.2 defines a hashtag as categorising content with the # symbol so it can be found by topic. Used well it reaches non-followers; used badly it looks spammy. Options 2, 3, and 4 misdescribe the mechanism."
  },
  {
    "scenario": "Sarah's Facebook Page uses her logo at 200 pixels, blurred. Her Instagram uses a photo of her plate of ugali. Her Google Business Profile uses a screenshot of her ID.",
    "question": "Which of the six profile items from Lesson 3.2 is she failing on across all three?",
    "options": [
      "Profile picture — should be her logo, sharp and square, consistent across all three platforms.",
      "Bio.",
      "Category.",
      "URL."
    ],
    "correct": 0,
    "explanation": "Section 3.2 defines the profile picture as the logo, sharp and square. Consistency across platforms is what makes customers recognise Karibu Kitchen (also a brand consistency point from Lesson 1.2). A blurred logo, a plate photo and an ID screenshot are three different profile pictures — and one is a security risk."
  },
  {
    "scenario": "Sarah is following the 60-minute setup checklist from Lesson 3.2 to fully set up her three business accounts.",
    "question": "Which sequence and timing matches the lesson?",
    "options": [
      "0–20 min Facebook Business Page (bio, images, URL, contact, category, first post); 20–40 min Instagram Business Account (convert personal, add same bio and images, connect to Facebook); 40–60 min Google Business Profile (claim, verify, add photos, opening hours, respond to reviews).",
      "0–5 hours Facebook only.",
      "Skip Facebook, skip Instagram, only do Google.",
      "Do all three simultaneously in ten minutes."
    ],
    "correct": 0,
    "explanation": "Section 3.2's 60-minute checklist is exactly this three-step sequence with these times. Option 2 wastes hours on one platform; option 3 abandons two-thirds of the plan; option 4 skips essential setup steps like verification."
  },
  {
    "scenario": "Sarah wants to reshare Nyakinyua Kitchen's Facebook post about a food festival because it is genuinely useful for her Eldoret followers.",
    "question": "Which social media vocabulary word from Lesson 3.2 describes this action?",
    "options": [
      "Post.",
      "Comment.",
      "Share — redistributing somebody else's content to your own audience.",
      "Like."
    ],
    "correct": 2,
    "explanation": "Section 3.2's vocabulary: Post = share on your own profile; Comment = reply to someone else's; Share = redistribute someone else's to your audience; Like = quick reaction; Tag = mention another user/page; Hashtag = categorising. Sarah's action is a share."
  },
  {
    "scenario": "Sarah mentions another local business \"@FreshMilkKapsoya\" in a Karibu Kitchen post about her supplier partnership.",
    "question": "Which vocabulary term from Lesson 3.2 describes what she just did?",
    "options": [
      "Hashtag.",
      "Tag — mentioning another user or page in a post or photo.",
      "Post.",
      "Like."
    ],
    "correct": 1,
    "explanation": "Section 3.2 defines a tag as mentioning another user or page in a post or a photo. A hashtag categorises content by topic; a tag calls out a specific account. Getting these terms right matters in interviews, in class, and with clients."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
