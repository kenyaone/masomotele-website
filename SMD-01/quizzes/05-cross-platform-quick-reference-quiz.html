<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Platform Quick Reference | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 5 · Lesson 5.7</div>
            <h1>Cross-Platform Quick Reference</h1>
            <p>10 mixed-character scenarios — pick the right platform, budget split, and diagnostic for Sarah, Wangari, and Brian</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "You are advising three Kenyan business owners on the same afternoon. Sarah wants dinner-delivery orders from Kapsoya. Wangari wants HR Directors at Kenyan banks to book workshops worth KES 350,000 each. Brian wants Gen-Z Shopify sales from his home-workout apparel line.",
    "question": "Which platform matches each character according to Lessons 5.4-5.6 and the §5.7 case studies?",
    "options": [
      "Sarah — LinkedIn. Wangari — TikTok. Brian — Meta.",
      "Sarah — Meta (plus some Google Search). Wangari — LinkedIn. Brian — TikTok.",
      "All three — LinkedIn only.",
      "All three — TikTok only."
    ],
    "correct": 1,
    "explanation": "§5.7 Slide 7 reapplies the four choice questions from §5.1 (who, where, what, urgency) and gets three different answers. Sarah — hungry office workers, Facebook, transactional, urgent = Meta plus Google. Wangari — HR Directors, LinkedIn, high-value B2B, slow = LinkedIn. Brian — Gen-Z, TikTok, product sales, discovery = TikTok. Same four questions, three different platform answers."
  },
  {
    "scenario": "A new B2C client — a Nairobi meal-kit startup — has KES 100,000/month in ad budget. He asks for the standard rule-of-thumb split before you tailor it later.",
    "question": "What is the §5.7 budget rule of thumb for a B2C business at this budget level?",
    "options": [
      "100% to LinkedIn — it is the safest platform.",
      "40% Meta (broad reach + social targeting), 30% Google Search (bottom-funnel intent), 15% TikTok (discovery among younger customers), 15% LinkedIn ONLY if B2B — otherwise reallocate that 15% to Meta or Google. Review Cost per Result every 30 days and adjust.",
      "50% TikTok, 50% LinkedIn.",
      "25% each to Meta, Google, LinkedIn, TikTok — always equal."
    ],
    "correct": 1,
    "explanation": "§5.7 Slide 3 states the rule of thumb for a B2C client at KES 100,000/month: 40% Meta, 30% Google Search, 15% TikTok, 15% LinkedIn only if B2B (otherwise reallocate to Meta or Google). Reviewed every 30 days. For a B2C meal-kit startup, LinkedIn is out and that 15% goes to the two top-of-list platforms."
  },
  {
    "scenario": "A trainee reads out the five-platform comparison table from §5.7 Slide 2 but scrambles the CPCs. She quotes: \"Google Search USD 5-15 per click, Meta USD 30-100 per click, LinkedIn USD 0.30-3, TikTok USD 100 per click.\"",
    "question": "What are the correct CPC benchmark ranges from Slide 2?",
    "options": [
      "Google Search USD 0.30-3, Meta USD 0.50-2, LinkedIn USD 5-15, TikTok USD 1-3, YouTube CPV USD 0.03-0.30.",
      "Everything costs USD 10-15.",
      "Every platform is free.",
      "Google USD 100, Meta USD 100, LinkedIn USD 100, TikTok USD 100."
    ],
    "correct": 0,
    "explanation": "§5.7 Slide 2 gives the exact benchmark table: Google Search CPC USD 0.30-3, Meta CPC USD 0.50-2, LinkedIn CPC USD 5-15, TikTok CPC USD 1-3, YouTube cost per view USD 0.03-0.30. Memorising these bands is what lets a trainee answer client budget questions on the spot."
  },
  {
    "scenario": "You are asked to write Sarah's Karibu Kitchen first-campaign brief on a single line: KES 15,000/month, dinner delivery, Kapsoya + Elgon View + Racecourse, women 25-50.",
    "question": "Which line matches §5.7 Slide 4 (Case A)?",
    "options": [
      "Objective Sales; single-image + carousel; Advantage Plus placements; KES 400/day for 14 days; Meta Pixel installed via WordPress plugin tracking WooCommerce Purchase events.",
      "Objective Awareness; landscape video; Facebook Feed only; KES 15,000 blast in one day.",
      "Objective Lead Generation; Document Ad; LinkedIn Feed; KES 400/day.",
      "Objective Product Sales; three Spark Ads on TikTok; KES 500/day."
    ],
    "correct": 0,
    "explanation": "§5.7 Slide 4 (Case A — Karibu Kitchen on Meta) gives this exact brief: Sales objective, single-image + carousel, Advantage Plus placements, KES 400/day for 14 days, Meta Pixel via WordPress + WooCommerce Purchase tracking. It ties §5.4 (Meta setup) and §5.3 (mobile-first ad design) together in one line."
  },
  {
    "scenario": "You are asked to write Wangari's Wellness first-campaign brief in one line: USD 800 (~KES 100,000), lead generation for KES 350,000 workshops, HR Directors at 200-plus insurance and banking firms in Kenya.",
    "question": "Which line matches §5.7 Slide 5 (Case B)?",
    "options": [
      "Objective Sales; carousel on Instagram Reels; Advantage Plus placements; KES 400/day.",
      "Objective Lead Generation via LinkedIn Lead Gen Forms; audience HR Director or Head of People at 200-plus staff in Financial Services in Kenya; Document Ad with case-study PDF; LinkedIn Feed. At ~KES 1,000/click the USD 800 delivers ~100 clicks; if 10% qualify and 1 closes at KES 350,000, that is 3.5x ad spend.",
      "Objective Awareness; TikTok Spark Ad; audience Gen-Z; KES 500/day.",
      "Objective Product Sales; Shopify Pixel; KES 7,000 total spend."
    ],
    "correct": 1,
    "explanation": "§5.7 Slide 5 (Case B — Wangari's Wellness on LinkedIn) gives this exact brief: Lead Generation via Lead Gen Forms, HR Director/Head of People at 200-plus staff in Financial Services in Kenya, Document Ad with case-study PDF, LinkedIn Feed. The maths — ~100 clicks, 10% qualify, 1 closes = 3.5x ad spend — is why LinkedIn works for her and not for Sarah."
  },
  {
    "scenario": "You are asked to write Brian's Chapa Fitness first-campaign brief in one line: KES 25,000/month, double weekly sales from 40 to 80 units, Gen-Z on TikTok.",
    "question": "Which line matches §5.7 Slide 6 (Case C)?",
    "options": [
      "Objective Product Sales; audience Kenya 16-28, interests fitness + streetwear; three Spark Ads boosting his best organic content; TikTok Pixel + Events API installed via Shopify; first campaign uses KES 7,000 of the KES 25,000, scale if it hits, test a fourth Spark Ad if it does not.",
      "Objective Sales on Meta; three static images; Advantage Plus placements; KES 400/day for 14 days.",
      "Objective Lead Generation on LinkedIn; Document Ad; KES 1,000/click.",
      "Objective Awareness on Google Display; banner ads on news sites; KES 25,000 blast in one day."
    ],
    "correct": 0,
    "explanation": "§5.7 Slide 6 (Case C — Chapa Fitness on TikTok) gives this exact brief: Product Sales objective, Kenya 16-28 fitness + streetwear, three Spark Ads on existing organic content, TikTok Pixel + Events API via Shopify, KES 7,000 of KES 25,000 for the first test with a scale-or-test-again rule. This ties §5.6 (TikTok Spark Ads + Pixel/Events API) directly to the budget discipline from §5.1."
  },
  {
    "scenario": "A new client — a small SaaS startup selling accounting software to Kenyan SMEs — comes to you. You need to apply the four choice questions before you recommend a platform split.",
    "question": "In what order do §5.1 and §5.7 tell you to answer the four questions?",
    "options": [
      "What am I selling? Who is my customer? Where do they spend time? How urgent is the decision?",
      "Who is my customer? Where do they spend time online? What am I selling? How urgent is the decision?",
      "How urgent? Who? What? Where? — always start with urgency.",
      "There are five questions, not four."
    ],
    "correct": 1,
    "explanation": "§5.7 Slide 7 reprints the four §5.1 questions in the exact order they must be answered: (1) WHO is my customer? (2) WHERE do they spend time online? (3) WHAT am I selling? (4) HOW URGENT is the decision? Answering in that order forces the customer decision before the platform decision — which is the whole point of the framework."
  },
  {
    "scenario": "A colleague brags: \"I put 100% of my new client's Month 1 budget on TikTok because TikTok is trending. Zero split.\"",
    "question": "Which of §5.7 Slide 8's five common mistakes has he committed?",
    "options": [
      "None — putting all budget on one platform is best practice.",
      "Two big ones: mistake 1 (all the budget on one platform in month one — you must test at least two) and mistake 5 (chasing the trending platform of the week instead of the platform that matches YOUR customer — match customer first, platform second, trends never).",
      "Only mistake 3 — matching creative to the wrong platform.",
      "Only mistake 4 — forgetting the tracking Pixel."
    ],
    "correct": 1,
    "explanation": "§5.7 Slide 8 lists five common mistakes. This colleague hits mistake 1 (all budget on one platform, no testing of at least two) and mistake 5 (chasing the trending platform — TikTok — instead of picking the platform that matches the customer). The rule is: match customer first, platform second, trends never."
  },
  {
    "scenario": "Sarah runs her first Meta campaign for two days and wants to pause it because cost-per-purchase is jumping around. Brian runs his first TikTok campaign for two days and wants to swap all three Spark Ads because engagement varies hour to hour. Wangari runs her first LinkedIn campaign for two days and wants to reallocate the whole USD 800 to Meta because she has only two leads.",
    "question": "Which common mistake — from §5.7 Slide 8 — are all three characters about to make?",
    "options": [
      "None — all three are making sensible calls.",
      "Judging a new campaign before it exits the Learning Phase. Learning is measured in ~50 conversion EVENTS, not calendar days. Below 50 events the numbers swing wildly. Wait until the ad set exits Learning before pausing, swapping, or reallocating.",
      "Forgetting the Pixel.",
      "Not enough platforms."
    ],
    "correct": 1,
    "explanation": "§5.7 Slide 8 mistake 2: judging a new campaign before it exits the Learning Phase — measured in 50 conversion EVENTS, not 50 days. This is the single most expensive beginner mistake because it kills campaigns before the algorithm has enough data to optimise. First taught in §5.4 Slide 7 (Meta), it applies to TikTok and LinkedIn too."
  },
  {
    "scenario": "You are asked to write the Module 5 one-line summary that a trainee should tape to her monitor.",
    "question": "Which summary matches §5.7 Slide 9?",
    "options": [
      "\"Two families of ad platforms, nine platforms, twenty-plus ad formats, three worked case studies (Sarah, Wangari, Brian), a budget rule of thumb (40/30/15/15 for B2C), and four choice questions that solve any client briefing.\"",
      "\"One platform (TikTok), one format (vertical video), one budget rule (100% to TikTok).\"",
      "\"Just copy what your cousin does.\"",
      "\"Digital marketing is only Facebook adverts.\""
    ],
    "correct": 0,
    "explanation": "§5.7 Slide 9 closes Module 5 with exactly this recap: two families, nine platforms, 20+ ad formats, three worked case studies across every major paid-ads platform (Sarah on Meta, Wangari on LinkedIn, Brian on TikTok), the 40/30/15/15 B2C budget rule of thumb, and the four choice questions from §5.1 that solve any client-briefing conversation. That single line is the whole module."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
