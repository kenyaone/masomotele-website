<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email & Advertising Analytics | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 6 · Lesson 6.4</div>
            <h1>Email & Advertising Analytics</h1>
            <p>10 Wangari Wellness scenarios — email metrics, CPM/CPC/CPA/ROAS, Quality Score, and the monthly report</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "Wangari sends a Mailchimp campaign to 400 HR managers on her list. Mailchimp reports 60 opens, 12 clicks, 3 bounces, and 1 unsubscribe.",
    "question": "Which set of email metrics matches Lesson 6.4?",
    "options": [
      "Open rate 60%, click rate 12%, bounce rate 3%, unsubscribe rate 1%.",
      "Open rate 15% (60/400), click rate 3% (12/400), bounce rate 0.75% (3/400), unsubscribe rate 0.25% (1/400).",
      "Open rate 6%, click rate 1.2%, bounce rate 0.3%, unsubscribe rate 0.1%.",
      "Open rate 400%, click rate 100%, bounce rate 0%, unsubscribe rate 0%."
    ],
    "correct": 1,
    "explanation": "Section 6.4 defines each rate as a percentage of the sent list. 60/400 = 15% open, 12/400 = 3% click, 3/400 = 0.75% bounce, 1/400 = 0.25% unsubscribe. Wangari is right at the healthy-range boundary on opens and comfortably inside on the rest."
  },
  {
    "scenario": "Wangari's next campaign to 500 subscribers gets an open rate of 11%.",
    "question": "According to Lesson 6.4, what does that number say and what should she change?",
    "options": [
      "Excellent — anything over 10% is elite.",
      "Below 15% signals a subject-line problem. Wangari should rewrite her subject line before rewriting the body.",
      "The list is the problem, not the subject line — buy more subscribers immediately.",
      "It is a bounce-rate problem — clean the list."
    ],
    "correct": 1,
    "explanation": "Section 6.4 gives the small-business healthy range as 20-40% opens, and calls anything below 15% a subject-line problem. The click rate, body copy and offer all only matter after the recipient opens."
  },
  {
    "scenario": "Wangari's campaign to 500 subscribers has a bounce rate of 4%.",
    "question": "What does Lesson 6.4 say she should do?",
    "options": [
      "Nothing — 4% is fine.",
      "Keep bounce rate under 2%. At 4% she has a list-hygiene problem; she should clean invalid addresses before her next send.",
      "Send more often to \"warm up\" the addresses.",
      "Switch to SMS instead of email."
    ],
    "correct": 1,
    "explanation": "Section 6.4's benchmark is bounce rate under 2%. At 4% deliverability is at risk and her sender reputation will drop; the fix is list hygiene, not more sending."
  },
  {
    "scenario": "Wangari runs a Meta lead-gen campaign for corporate wellness contracts. She spent KES 60,000 in one month and generated 12 qualified leads.",
    "question": "What is her CPA (cost per acquisition) and how does Lesson 6.4 read it?",
    "options": [
      "CPA = KES 60,000 x 12 = KES 720,000 — too high.",
      "CPA = KES 60,000 / 12 = KES 5,000 per lead. For lead generation, aim for CPA under 5% of expected deal value. On a KES 200,000-500,000 contract, KES 5,000 is well inside 5%.",
      "CPA = KES 12 per KES 1,000 spent — meaningless number.",
      "CPA cannot be calculated for lead-gen campaigns."
    ],
    "correct": 1,
    "explanation": "Section 6.4 defines CPA as ad spend divided by acquisitions: 60,000 / 12 = KES 5,000. The lead-gen benchmark is CPA < 5% of expected deal value. On a KES 200k contract, 5% is KES 10,000 — Wangari's CPA is half of that. Healthy."
  },
  {
    "scenario": "Wangari wants to understand CPM vs CPC. Her cousin uses them interchangeably.",
    "question": "Which pairing from Lesson 6.4 is correct?",
    "options": [
      "CPM = cost per click. CPC = cost per thousand impressions.",
      "CPM = cost per thousand impressions (used when the goal is awareness). CPC = the pay-per-click model (advertiser pays each time an ad is clicked).",
      "CPM and CPC are the same thing.",
      "CPM = cost per acquisition. CPC = cost per conversion."
    ],
    "correct": 1,
    "explanation": "Section 6.4 defines CPM (cost per mille — cost per 1,000 impressions, awareness objective) and PPC/CPC (pay-per-click model used by Google Ads and most Meta ads). CPA is a third concept entirely."
  },
  {
    "scenario": "Wangari's Google Search campaign spent KES 30,000 in a month and produced KES 120,000 in first-purchase revenue from HR wellness starter packages.",
    "question": "What is her ROAS, and does it clear the Lesson 6.4 benchmark?",
    "options": [
      "ROAS = 120,000 - 30,000 = 90,000. No benchmark applies.",
      "ROAS = 120,000 / 30,000 = 4x. On a small e-commerce/first-purchase basis, Lesson 6.4 says aim for 3x or higher — she is clear.",
      "ROAS = 30,000 / 120,000 = 0.25x — she is losing money.",
      "ROAS cannot be calculated on Google Search."
    ],
    "correct": 1,
    "explanation": "Section 6.4 defines ROAS as revenue divided by ad spend. Wangari's 4x ROAS is above the 3x first-purchase benchmark for small e-commerce Google Search work. And lifetime value (repeat contracts) usually pushes it even higher."
  },
  {
    "scenario": "Wangari runs Google Ads for the keyword \"corporate wellness Nairobi\". Google shows her Quality Score for that keyword is 4/10. Her cousin says \"Quality Score is a made-up number, ignore it.\"",
    "question": "How does Lesson 6.4 describe Quality Score, and why does it matter?",
    "options": [
      "It is decoration — has no effect on cost or position.",
      "Google rates every keyword 1-10 on expected CTR, ad relevance, and landing-page experience. High Quality Score = lower cost per click AND higher position; low Quality Score = higher cost AND lower position. Aim for 7+.",
      "It only affects Meta, not Google.",
      "It is measured in shillings per click."
    ],
    "correct": 1,
    "explanation": "Section 6.4 defines Quality Score as Google's 1-10 rating driven by expected CTR, ad relevance, and landing-page experience. It literally rewards good campaigns and punishes bad ones. Every important keyword should sit at 7 or higher."
  },
  {
    "scenario": "Wangari's Quality Score for \"corporate wellness Nairobi\" is 4/10. She asks how to raise it.",
    "question": "Which of the three specific actions from Lesson 6.4 would you recommend?",
    "options": [
      "Increase the daily budget until Google notices.",
      "Rewrite the ad copy to include the exact keyword (\"corporate wellness Nairobi\") in the headline, improve the landing page so it matches the keyword promise, and pause underperforming keywords with low expected CTR.",
      "Delete the whole account and start fresh.",
      "Add the keyword to every possible ad group."
    ],
    "correct": 1,
    "explanation": "Section 6.4 lists three exact actions: include the keyword in the ad copy, improve landing-page match, and pause low-CTR keywords that drag the ad group down. Throwing money at a low-QS keyword does not fix it."
  },
  {
    "scenario": "Wangari's monthly retainer client (a Nairobi bank) has asked for the month's report. Her cousin drafts one that says: \"Campaigns did great. Numbers look good. We spent the budget. See you next month.\"",
    "question": "Which structure from Lesson 6.4 does Wangari's report actually need?",
    "options": [
      "A single-line summary — clients do not read reports.",
      "Five sections: (1) goal for this month; (2) what was actually achieved with numbers, not adjectives; (3) what worked (winning ad, platform, content); (4) what did NOT work, and why; (5) planned changes for next month — including CPA, ROAS, Quality Score changes, and two-week trends.",
      "A 40-page PDF with every chart Meta produces.",
      "A spreadsheet with only follower counts."
    ],
    "correct": 1,
    "explanation": "Section 6.4 lays out the exact five-section professional monthly report. Miss any section and the client loses trust; include them all and the retainer keeps renewing. \"Numbers not adjectives\" is the professional standard."
  },
  {
    "scenario": "Wangari's team is arguing about whether email is even worth measuring for a B2B corporate wellness pipeline where deals are KES 200,000-500,000. Her cousin says \"skip email metrics — they don't matter at that deal size.\"",
    "question": "How should Wangari respond, per Lesson 6.4?",
    "options": [
      "Agree — for B2B deals over KES 100,000, email metrics are irrelevant.",
      "Push back: open rate, click rate, bounce rate, unsubscribe rate and list size all still apply. For B2B lead nurture, they are the leading indicators of whether HR contacts are engaging before the sales call — a call she may only get if the email lands, opens, and gets clicked.",
      "Only measure the number of emails sent.",
      "Delete the mailing list entirely."
    ],
    "correct": 1,
    "explanation": "Section 6.4's five email metrics are the leading indicators for whether any downstream conversion is possible. For a KES 200k-500k B2B pipeline, they matter MORE, not less — the email is often the first touch before the sales call."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
