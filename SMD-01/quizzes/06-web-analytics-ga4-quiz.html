<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Analytics (GA4) | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 6 · Lesson 6.2</div>
            <h1>Web Analytics (GA4)</h1>
            <p>10 Karibu Kitchen scenarios — GA4 essentials, quality vs quantity traffic, and Kenya DPA 2019</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "Sarah's cousin insists Karibu Kitchen needs \"proper enterprise analytics\" and quotes KES 80,000 a month for a paid tool. Sarah's WooCommerce site currently runs no analytics at all.",
    "question": "Which tool does Lesson 6.2 recommend Sarah install first, and at what cost?",
    "options": [
      "Adobe Analytics — enterprise-grade, paid, industry standard for Kenyan small business.",
      "Google Analytics 4 (GA4) — free at the standard tier and used by roughly 90% of Kenyan business websites.",
      "Matomo — an open-source, privacy-focused tool that Kenyan customers legally must use.",
      "Clicky — the default for Kenyan e-commerce sites."
    ],
    "correct": 1,
    "explanation": "Section 6.2 names four tools (GA4, Adobe Analytics, Matomo, Clicky) but is explicit: for the work a Kenyan trainee will realistically do, GA4 is the answer — free at the standard tier and dominant in Kenya. Sarah does not need KES 80,000 a month to start."
  },
  {
    "scenario": "Sarah is reading a GA4 report and confuses \"unique visitors\" with \"impressions\".",
    "question": "Which definition pair from Lesson 6.2 is correct?",
    "options": [
      "Unique visitors = number of times content was displayed. Impressions = number of individual people visiting.",
      "Unique visitors = number of individual people visiting (not counting repeat visits by the same person). Impressions = number of times content was displayed to somebody.",
      "Unique visitors = only mobile visitors. Impressions = only desktop visitors.",
      "Unique visitors and impressions mean the same thing in GA4."
    ],
    "correct": 1,
    "explanation": "The eight essential GA4 terms in §6.2 include unique visitors (individual people, deduplicated) and impressions (total displays). Confusing them is one of the most common trainee errors."
  },
  {
    "scenario": "Sarah looks at her GA4 dashboard. Bounce rate is 78% on her menu page. She does not know what that means.",
    "question": "Which definition of bounce rate matches Lesson 6.2?",
    "options": [
      "The percentage of visitors who bought something.",
      "The percentage of visitors who leave after viewing only one page.",
      "The percentage of visitors from other websites linking to her.",
      "The percentage of visitors from mobile devices."
    ],
    "correct": 1,
    "explanation": "Bounce rate in §6.2 is the percentage of visitors who leave after viewing only one page. Options 1 (conversion rate), 3 (referrals) and 4 (device split) are different metrics entirely."
  },
  {
    "scenario": "Sarah's cousin brags: \"Nyakinyua Kitchen gets 15,000 site visitors a month. Karibu Kitchen only got 2,300.\" Sarah looks closer: of her 2,300 visitors, 170 placed an order. Nyakinyua gets fewer than 150 orders from their 15,000.",
    "question": "Which lesson from Lesson 6.2 applies here?",
    "options": [
      "Quantity of traffic always wins — Nyakinyua is objectively doing better.",
      "Quality of traffic matters more than quantity. Sarah's 7.4% conversion rate crushes Nyakinyua's sub-1%, and she is outperforming a site with six times her traffic.",
      "Sarah must copy Nyakinyua's SEO strategy immediately.",
      "Both sites are performing the same because visitors are visitors."
    ],
    "correct": 1,
    "explanation": "Section 6.2's \"quality beats quantity\" example uses these exact numbers. Sarah's 170 out of 2,300 is a ~7% conversion rate; Nyakinyua's is well under 1%. Fewer, better-matched visitors beat a flood of the wrong visitors."
  },
  {
    "scenario": "Sarah's WooCommerce site runs on WordPress. She wants to install GA4 herself in one morning.",
    "question": "Which three steps from Lesson 6.2 does she follow?",
    "options": [
      "Hire an agency, wait three months, pay KES 60,000.",
      "Create a GA4 property at analytics.google.com and copy the Measurement ID (G-XXXXXXXX); install the MonsterInsights plug-in on WordPress and paste the ID; confirm the visit in the Real-Time report by refreshing her site in another tab.",
      "Buy a paid analytics tool, ignore GA4, and hope for the best.",
      "Copy someone else's GA4 property into her site."
    ],
    "correct": 1,
    "explanation": "Section 6.2 walks through exactly three steps: create the GA4 property and copy the Measurement ID; install MonsterInsights and paste the ID; verify via the Real-Time report. Total time roughly 10 minutes."
  },
  {
    "scenario": "Sarah's month-3 Meta Ads summary: KES 45,000 spend, 138,000 impressions, 42,000 reach, frequency 3.3, 2,760 link clicks, 2% CTR, 1,940 landing-page views, 58 purchases, KES 49,300 revenue. She says: \"That's a KES 4,300 profit — barely worth it.\" Her cousin says: \"Switch them off.\"",
    "question": "Which three numbers from Lesson 6.2 does Sarah's surface analysis miss?",
    "options": [
      "The impression count, the reach count, and the click-through rate.",
      "Profit per order (KES 350 per order, not KES 850 revenue), view-through purchases (12 extra attributed to view-only exposure), and repeat orders (19 of the 58 have re-ordered organically — lifetime value beats first-purchase value).",
      "The colour of the ad, the font of the ad, and the time of day the ad ran.",
      "The number of staff at Karibu Kitchen, the price of a chapati, and the rent for the kitchen."
    ],
    "correct": 1,
    "explanation": "Section 6.2 is explicit about the three missing numbers: contribution margin per order (KES 350 x 58 = KES 20,300 profit), view-through attributed purchases (12 more orders), and repeat customers driving lifetime value. Sarah's ads are profitable — she just did not see the full picture."
  },
  {
    "scenario": "Sarah's WooCommerce site collects customer names, phone numbers, delivery addresses, and (through GA4) IP-address-based location data. Her cousin says \"Kenya has no rules on this.\"",
    "question": "Under Kenya's Data Protection Act 2019, what must Sarah actually do?",
    "options": [
      "Nothing — the DPA does not apply to websites.",
      "Publish a clear privacy notice, obtain consent for cookies/tracking where required, restrict access to the raw data on a need-to-know basis, and be able to demonstrate lawful basis for holding it.",
      "Sell the data to a partner to help fund the business.",
      "Delete GA4 immediately — analytics is illegal in Kenya."
    ],
    "correct": 1,
    "explanation": "Sarah is a data controller under Kenya's DPA 2019. Her obligations include a privacy notice, consent for cookies/tracking, access controls, and demonstrable lawful basis. GA4 is not illegal — but it must be configured and disclosed within Kenya's DPA framework. Options 1, 3 and 4 are wrong on the law."
  },
  {
    "scenario": "Sarah's CTR from the month-3 report is 2%: 2,760 clicks divided by 138,000 impressions. Her cousin thinks CTR is the same thing as conversion rate.",
    "question": "Which definition from Lesson 6.2 is correct?",
    "options": [
      "CTR = revenue / ad spend. Conversion rate = clicks / impressions.",
      "CTR = clicks / impressions. Conversion rate = the percentage of visitors who completed the desired action.",
      "CTR = the percentage who bounced. Conversion rate = the percentage who clicked.",
      "CTR and conversion rate mean the same thing."
    ],
    "correct": 1,
    "explanation": "Section 6.2's eight essential terms define CTR as clicks divided by impressions, and conversion rate as the percentage who completed the desired action (bought, submitted a form, etc.). ROAS is revenue divided by ad spend — a different metric again."
  },
  {
    "scenario": "Sarah is trying to work out where her website visitors came from. She sees a line in GA4 for traffic that came from another website (a Kenyan food blog that mentioned her).",
    "question": "Which of the eight essential GA4 terms describes that traffic?",
    "options": [
      "Impressions",
      "Bounce rate",
      "Referrals — traffic that came from other websites linking to yours",
      "Conversion rate"
    ],
    "correct": 2,
    "explanation": "Section 6.2 lists referrals as one of the eight essential terms: traffic that arrived because another site linked to you. A food blog mentioning Karibu Kitchen is textbook referral traffic."
  },
  {
    "scenario": "Sarah asks: \"Given all this, what should I actually do with GA4 every week?\"",
    "question": "Which routine does Lesson 6.2 support?",
    "options": [
      "Log in once a year at tax time.",
      "Review GA4 alongside her Friday 30-minute cadence — check unique visitors, conversion rate on the menu page, bounce rate, and top referrals, and compare against the previous week.",
      "Delete GA4 and rely on her cousin's opinion.",
      "Check GA4 every 15 minutes on her phone."
    ],
    "correct": 1,
    "explanation": "Lesson 6.2 fits inside the Friday cadence established in 6.1. Sarah reviews unique visitors, conversions (menu page → order), bounce rate, and referrals against the prior week. Constant checking is drowning; annual checking is guessing."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
