<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform-Specific Design Sizes | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 7 · Lesson 7.4</div>
            <h1>Platform-Specific Design Sizes</h1>
            <p>10 scenarios — the exact pixel dimensions, ratios, and safe zones every marketer memorises</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "Sarah posts a landscape lunch photo (1200 x 630 px) as an Instagram Story. Instagram crops it to the vertical safe zone. The plate disappears. Only the tablecloth remains.",
    "question": "What should Sarah have designed the Story at?",
    "options": [
      "1080 x 1080 px (square).",
      "1080 x 1920 px (vertical, 9:16 aspect ratio) — the correct size for Instagram Stories and Reels.",
      "1200 x 627 px (landscape).",
      "1280 x 720 px (YouTube thumbnail)."
    ],
    "correct": 1,
    "explanation": "Section 7.4 gives the exact Instagram Story/Reel size: 1080 x 1920 px, 9:16 vertical. A landscape upload gets cropped by the platform. Right size, right ratio, no cropping accidents."
  },
  {
    "scenario": "Sarah is preparing an Instagram square feed post for Karibu Kitchen.",
    "question": "What are the correct dimensions per Lesson 7.4?",
    "options": [
      "1080 x 1080 px (1:1 square).",
      "1080 x 1350 px (portrait).",
      "1080 x 1920 px (Story/Reel).",
      "820 x 312 px (Facebook cover)."
    ],
    "correct": 0,
    "explanation": "Section 7.4's four Instagram sizes: square feed 1080 x 1080, portrait feed 1080 x 1350, Story/Reel 1080 x 1920, profile 170 px square. Sarah's square feed post is 1080 x 1080."
  },
  {
    "scenario": "Brian films a Chapa Fitness Reel on his phone and needs to export it at the correct size for both Instagram Reels and TikTok.",
    "question": "Which dimensions and ratio from Lesson 7.4 apply?",
    "options": [
      "1080 x 1920 px, 9:16 vertical — the same ratio for Instagram Reel, TikTok, and YouTube Shorts.",
      "1200 x 627 px, 1.91:1 landscape.",
      "1080 x 1080 px, 1:1 square.",
      "1280 x 720 px, 16:9 landscape."
    ],
    "correct": 0,
    "explanation": "Section 7.4 identifies 9:16 vertical (1080 x 1920) as the dominant mobile ratio — Instagram Reels, TikTok, YouTube Shorts, and every Story. The most important ratio for a Kenyan mobile-first audience."
  },
  {
    "scenario": "Sarah is designing a Facebook feed image post.",
    "question": "What size does Lesson 7.4 give for a Facebook feed post image?",
    "options": [
      "1080 x 1080 px.",
      "1200 x 630 px (landscape, roughly 1.91:1).",
      "1080 x 1920 px.",
      "820 x 312 px (that's the cover photo, not feed)."
    ],
    "correct": 1,
    "explanation": "Section 7.4 gives Facebook feed post image at 1200 x 630 px, landscape 1.91:1. Cover photo is 820 x 312, event cover is 1920 x 1080, profile is 170 px square."
  },
  {
    "scenario": "Wangari is preparing a LinkedIn feed post image for her Wangari Wellness B2B pitch.",
    "question": "What size does Lesson 7.4 give?",
    "options": [
      "1200 x 627 px — the standard LinkedIn feed post image.",
      "1080 x 1080 px — LinkedIn only accepts squares.",
      "1080 x 1920 px — vertical only.",
      "1500 x 500 px — that's the Twitter header size."
    ],
    "correct": 0,
    "explanation": "Section 7.4 gives LinkedIn feed post image as 1200 x 627 px (very close to Facebook's 1200 x 630). LinkedIn cover is 1584 x 396 — the wider, shorter format."
  },
  {
    "scenario": "Brian wants to make a YouTube thumbnail for a Chapa Fitness long-form review video.",
    "question": "What size does Lesson 7.4 give?",
    "options": [
      "1280 x 720 px, 16:9.",
      "1080 x 1920 px, 9:16.",
      "1080 x 1080 px, 1:1.",
      "1200 x 675 px."
    ],
    "correct": 0,
    "explanation": "Section 7.4 gives YouTube thumbnail at 1280 x 720 px, 16:9 landscape. That's the same ratio as the video player, so YouTube does not crop or letterbox."
  },
  {
    "scenario": "Sarah is placing her Karibu Kitchen logo on a Story right at the very top of the design, 10 px from the edge.",
    "question": "Which safe-zone rule from Lesson 7.4 is she breaking?",
    "options": [
      "None — Instagram displays everything perfectly.",
      "Keep about a 50 px safe zone from every edge — and on Stories/Reels keep the top and bottom 200 px each free of critical content because Instagram places its username and buttons there.",
      "Everything must be within 5 px of the edge.",
      "The centre 100 x 100 px is the only safe zone."
    ],
    "correct": 1,
    "explanation": "Section 7.4's safe-zone rule: ~50 px from every edge for general safety, and on vertical Stories/Reels the top and bottom 200 px each are especially unsafe (username, buttons). Sarah's logo will be covered by the Instagram header."
  },
  {
    "scenario": "Sarah keeps making one great design idea, then failing to adapt it to other platforms. Her cousin does a fresh design from scratch for every channel.",
    "question": "Which system from Lesson 7.4 solves this?",
    "options": [
      "Sarah's three-template system: (1) Instagram Feed Square 1080 x 1080; (2) Instagram Story Vertical 1080 x 1920; (3) Facebook Feed Landscape 1200 x 630. Every food photo gets adapted to all three via Magic Resize (Pro) or manual duplication (free).",
      "Design for one platform only.",
      "Hire an agency.",
      "Never design at all — just post text."
    ],
    "correct": 0,
    "explanation": "Section 7.4 lays out Sarah's exact three-template system. One idea, three formats, three platforms, correctly sized. No cropping accidents, no wasted photos, and no starting from scratch each time."
  },
  {
    "scenario": "Sarah asks: \"Instead of memorising ten pixel numbers, is there a shortcut?\"",
    "question": "Which three aspect ratios does Lesson 7.4 tell her to memorise instead?",
    "options": [
      "1:1 square (Instagram feed), 9:16 vertical (Stories, Reels, TikTok, Shorts — the most important for Kenyan mobile audiences), and 16:9 landscape (YouTube thumbnails, some Facebook, most horizontal video).",
      "4:3 print ratio, 3:2 print ratio, and 5:4.",
      "1:2, 2:1, and 3:3.",
      "Any random ratio — the platform fixes it."
    ],
    "correct": 0,
    "explanation": "Section 7.4 names three dominant ratios: 1:1, 9:16, 16:9. Everything else (4:3, 3:2) is print — nobody prints anymore. Sarah designs for these three and she covers every platform she will use."
  },
  {
    "scenario": "Sarah is picking a size for a Pinterest pin for a lunch-planning infographic (Wangari has told her Pinterest is worth testing).",
    "question": "What size does Lesson 7.4 give?",
    "options": [
      "1000 x 1500 px, 2:3 (taller than wide) — the standard Pinterest pin ratio.",
      "1080 x 1080 px, 1:1.",
      "1280 x 720 px, 16:9.",
      "820 x 312 px — the Facebook cover size."
    ],
    "correct": 0,
    "explanation": "Section 7.4 gives Pinterest pin at 1000 x 1500 px, 2:3 vertical (taller than wide). Pinterest's feed favours taller pins because they take more vertical real estate on scroll."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
