<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Planning | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 7 · Lesson 7.5</div>
            <h1>Content Planning</h1>
            <p>10 Karibu Kitchen scenarios — four-step planning, three-pillar system, monthly calendar, and batching</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "Sarah's post frequency dropped last week from 6 to 2. She tells you: \"I was waiting for inspiration.\"",
    "question": "How does Lesson 7.5 respond?",
    "options": [
      "Correct — always wait for inspiration.",
      "Plans beat inspiration every single time. When you plan the month in advance, creative anxiety becomes a checklist. Amateurs feel inspired. Professionals feel prepared.",
      "Post at random until inspiration returns.",
      "Delete the account and start again."
    ],
    "correct": 1,
    "explanation": "Section 7.5 opens with this exact framing: plans beat inspiration. Professionals prepare, then execute. Waiting for inspiration is the losing strategy that dropped Sarah from 6 posts to 2."
  },
  {
    "scenario": "Sarah asks you to walk her through the four-step planning process.",
    "question": "Which sequence matches Lesson 7.5?",
    "options": [
      "Purpose (awareness/engagement/conversion), Audience (age, platform habits, pain points), Content Series (consistent look, recurring themes), Content Calendar (batch, schedule around key dates, leave room for timely content).",
      "Photo, filter, hashtag, post.",
      "Colour, font, logo, tagline.",
      "Reach, engagement, mentions, trends."
    ],
    "correct": 0,
    "explanation": "Section 7.5's four planning steps: Purpose, Audience, Content Series, Content Calendar. Option 3 is Brand Kit (Lesson 7.2). Option 4 is social insights terms (Lesson 6.3)."
  },
  {
    "scenario": "Sarah says she \"has run out of ideas\" after four months of posting.",
    "question": "Which system from Lesson 7.5 solves this forever?",
    "options": [
      "Post whatever comes to mind on the day.",
      "The three-pillar system. For Karibu Kitchen: Pillar 1 Food (50% of posts) — dishes, ingredients, cooking. Pillar 2 Behind-the-Scenes (25%) — Sarah, team, kitchen, delivery driver. Pillar 3 Customers (25%) — reviews, testimonials, tagged photos, order stories. Every post fits into one pillar.",
      "The 12-pillar system — 12 themes to juggle.",
      "The zero-pillar system — no themes."
    ],
    "correct": 1,
    "explanation": "Section 7.5's three-pillar system is the solution to \"I've run out of ideas\". For Sarah: 50% Food, 25% Behind-the-Scenes, 25% Customers. Every post belongs somewhere. She never stares at a blank Canva template again."
  },
  {
    "scenario": "Sarah wants a repeatable monthly rhythm. Three posts a week, twelve posts a month across four weeks.",
    "question": "Which weekly pattern from Lesson 7.5 matches?",
    "options": [
      "Monday food, Wednesday behind-the-scenes, Friday customer.",
      "Random pillars each week.",
      "Only food posts every day.",
      "One post a month."
    ],
    "correct": 0,
    "explanation": "Section 7.5's example monthly calendar for Sarah: Monday food, Wednesday behind-the-scenes, Friday customer — three posts a week, repeated for four weeks. Twelve posts a month across three pillars."
  },
  {
    "scenario": "Sarah wants her weekends back. Currently she spends 30-45 minutes every day making the day's post.",
    "question": "Which productivity approach does Lesson 7.5 recommend?",
    "options": [
      "Content batching: on the first Sunday of the month, two hours of food photography for all 12 photos in one session; on the first Monday, two hours of Canva work creating all 12 posts; plus 30 minutes of scheduling. Total ~4.5 hours, once per month.",
      "Post every hour of every day.",
      "Hire someone to post for her at KES 40,000/month.",
      "Stop posting entirely."
    ],
    "correct": 0,
    "explanation": "Section 7.5's batching: two hours photo shoot + two hours Canva + 30 min scheduling = 4.5 hours a month for a full 12-post calendar. Sarah reclaims her weekends and never misses a Wednesday because she was tired."
  },
  {
    "scenario": "Sarah reviews last month's data. Three posts drove ~80% of engagement: her chapati-and-stew photo, her 30-second Sunday-cooking Reel, and a customer thank-you screenshot.",
    "question": "How does Lesson 7.5 apply the 80/20 rule (from 6.3) to next month's plan?",
    "options": [
      "Ignore the winners — try 12 new formats.",
      "Identify the top three, understand what made them work, and plan three more of each format next month. Do not invent new formats every month — double down on what already works.",
      "Retire the winners.",
      "Copy Nyakinyua Kitchen's plan instead."
    ],
    "correct": 1,
    "explanation": "Section 7.5 applies 6.3's 80/20 rule to planning: identify the winning formats, plan more of them. Sarah is not being creative in a vacuum — she is being deliberate about what her audience already loves."
  },
  {
    "scenario": "Sarah wants to know what to plan for her Kigali-style Reel — the 12-second vertical clip Wangari showed her.",
    "question": "Which plan from Lesson 7.5 matches Sarah's Reel?",
    "options": [
      "12 seconds, vertical, near the kitchen window in natural light. Four 3-second shots: plating; food close-up; Sarah taking a bite; Sarah smiling with an empty fork. Trending Kenyan Afrobeats snippet. Caption: \"Fresh Kenyan lunch. Delivered to your desk in thirty minutes.\" CTA: \"WhatsApp us to order.\"",
      "60 seconds, horizontal, filmed in a studio with three cameras.",
      "Text only, no visual — a caption without a video.",
      "10 minutes long, filmed at night under fluorescent lights."
    ],
    "correct": 0,
    "explanation": "Section 7.5 details Sarah's Kigali-style Reel plan exactly: 12 seconds, vertical, kitchen-window natural light, four 3-second shots (plate, close-up, bite, smile), trending Afrobeats, and the WhatsApp CTA. Lesson 7.7 will show her how to actually film it."
  },
  {
    "scenario": "Sarah wants to know the ratio for her pillars. She hears one Instagram influencer say \"50% product, 50% lifestyle\" and another say \"25% product, 75% memes\".",
    "question": "What does Lesson 7.5 recommend for a Kenyan lunch business like Karibu Kitchen?",
    "options": [
      "50% product, 50% memes.",
      "50% Food (product), 25% Behind-the-Scenes, 25% Customers — the mix that suits a physical Kenyan food business where the product itself is visually compelling and customer social proof is essential.",
      "0% Food, 100% memes.",
      "Any random ratio — pillars do not matter."
    ],
    "correct": 1,
    "explanation": "Section 7.5's Karibu Kitchen mix is 50/25/25. The 50% weighting on food is because the product itself is visually compelling for a lunch business. Different business types (Wangari's B2B, Brian's Gen-Z apparel) would tune the ratio."
  },
  {
    "scenario": "Sarah wants to know if planning removes all spontaneity — what if something newsworthy happens (a delivery driver rescues a lost dog on the round)?",
    "question": "How does Lesson 7.5 handle this?",
    "options": [
      "The calendar is unbreakable — never post anything unplanned.",
      "The calendar plans the majority in advance, but leaves room for timely content. Batching is not rigidity — it is the default the plan reverts to. Spontaneous posts still happen, just not because inspiration is missing.",
      "Never post anything spontaneous.",
      "Only post spontaneous content."
    ],
    "correct": 1,
    "explanation": "Section 7.5's step four says: plan in advance, batch similar content, schedule around key dates, but leave room for timely content. The plan is the floor, not the ceiling. Timely posts still fit because the calendar is already handled."
  },
  {
    "scenario": "Wangari's cousin argues that content planning is only for big brands: \"Sarah's KES 15,000 budget doesn't need a calendar.\"",
    "question": "How does Lesson 7.5 respond?",
    "options": [
      "Cousin is right — small budgets do not need calendars.",
      "Small businesses need planning MORE than large ones, because their scarce time and budget must be spent deliberately. Batching plus the three-pillar calendar is the specific system that turns Sarah's KES 15,000 into consistent, professional output with weekends free.",
      "Calendars are only for Safaricom-scale brands.",
      "Skip planning entirely."
    ],
    "correct": 1,
    "explanation": "Section 7.5's whole point is that the small-business marketer needs planning more, not less. The calendar is what makes the KES 15,000 budget produce consistent, high-signal content instead of scattered attempts."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
