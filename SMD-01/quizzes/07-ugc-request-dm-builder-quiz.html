<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User-Generated Content (UGC) | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 7 · Lesson 7.8</div>
            <h1>User-Generated Content (UGC)</h1>
            <p>10 Karibu Kitchen scenarios — what UGC is, why it converts, permission, credit, and Sarah's system</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "A regular Karibu Kitchen customer takes a photo of her ugali-and-stew lunch on her office desk in Eldoret CBD and shares it on her Instagram Story with the hashtag #KaribuKitchen. She was not paid.",
    "question": "How does Lesson 7.8 classify this?",
    "options": [
      "Influencer content — she was paid.",
      "User-Generated Content (UGC) — unpaid, organic content created by a customer about the brand. Completely free. More powerful than any paid advert Sarah could buy.",
      "Sponsored content.",
      "A paid partnership."
    ],
    "correct": 1,
    "explanation": "Section 7.8 defines UGC as unpaid, organic content created by customers. It is distinct from influencer content (paid). The Karibu Kitchen desk-lunch story is textbook UGC."
  },
  {
    "scenario": "Sarah asks why UGC is worth building a system around when she could just run a KES 10,000 boosted ad instead.",
    "question": "Which three reasons from Lesson 7.8 explain UGC's power?",
    "options": [
      "Trust (Kenyan customers trust other customers about 3x more than they trust brands), Reach (each sharing customer broadcasts to a similar-neighbourhood similar-income network — perfect targeting for free), and Social Proof (a customer photo overcomes a first-time buyer's hesitation).",
      "It is cheaper only.",
      "It is legally required.",
      "It goes viral automatically."
    ],
    "correct": 0,
    "explanation": "Section 7.8 lists three reasons UGC outperforms professional marketing: trust, reach, social proof. All three compound. Boosted ads still have their place, but UGC is a different mechanism — one Sarah's competitors are ignoring."
  },
  {
    "scenario": "Sarah wants to actively invite UGC from her customers.",
    "question": "Which five polite ways from Lesson 7.8 does she use?",
    "options": [
      "Beg on every post; demand photos; threaten fee refunds; ban customers who refuse; publish customer numbers.",
      "Small card in every delivery (\"Enjoyed your meal? Share and tag @KaribuKitchen. We might feature it.\"); end of WhatsApp order confirmation (\"Would you mind sharing a photo when it arrives?\"); monthly hashtag campaign with a prize; reply to positive Google reviews asking permission to share; a customer-of-the-month feature.",
      "Only in-person requests.",
      "Only paid influencer requests."
    ],
    "correct": 1,
    "explanation": "Section 7.8's five polite invitation channels: delivery card, WhatsApp confirmation, hashtag campaign, Google-review replies, customer-of-the-month. Ask, politely, every day. Most Kenyan customers will oblige if simply asked."
  },
  {
    "scenario": "Sarah sees a beautiful customer photo of her lunch on Instagram and considers reposting it to the Karibu Kitchen account without asking first.",
    "question": "What does Lesson 7.8 say?",
    "options": [
      "Repost freely — public means public.",
      "Get permission first. It is a legal requirement under Kenya's Data Protection Act 2019, and an ethical requirement always. Either DM the creator (\"May we share it on the Karibu Kitchen Instagram, with credit?\") and wait for a yes, or publish a written hashtag rule in the bio (\"By using #KaribuKitchen you agree to let us re-share your content with credit\") — an implied-permission structure. Even with the hashtag rule, still ask directly for anything important.",
      "Repost and remove the customer's face to protect them.",
      "Repost only if the customer objects."
    ],
    "correct": 1,
    "explanation": "Section 7.8's permission rule ties directly to Kenya's DPA 2019. Two acceptable routes: direct DM (safest), or a bio-published hashtag rule (implied permission). For anything important, always ask directly. Reposting without permission creates legal AND social risk."
  },
  {
    "scenario": "Sarah reposts a customer's UGC photo, crops out their face, removes their watermark, applies a heavy filter to make it \"match her feed\", and does not tag them.",
    "question": "Which mistakes from Lesson 7.8 has she committed?",
    "options": [
      "None.",
      "Removing the customer's face or watermark (manipulation Kenyan customers notice), over-editing (imperfection is what makes UGC feel real), and not crediting the creator (tag their handle, mention them in the visual, keep any watermark — credit is what keeps customers wanting to send more content).",
      "Only failing to tag.",
      "Only over-editing."
    ],
    "correct": 1,
    "explanation": "Section 7.8's mistakes: reposting without permission, removing face/watermark, over-editing, ignoring the response. Section 7.8's credit rule: tag the handle, mention them in the visual, keep the watermark. Sarah is compounding several mistakes at once."
  },
  {
    "scenario": "Sarah reposts a customer's UGC. The customer comments \"Thanks for sharing my photo!\" and asks if the Friday special is on. Sarah does not reply.",
    "question": "Which mistake from Lesson 7.8 is this?",
    "options": [
      "None.",
      "Ignoring the customer's response to the repost. When the creator engages, engage back — say thank you, answer the question, ask something else. This is a relationship, not a broadcast.",
      "Reposting without permission.",
      "Over-editing."
    ],
    "correct": 1,
    "explanation": "Section 7.8's mistake four: ignoring the creator's response. UGC is a relationship. Not replying kills the willingness to send more. Sarah should answer the Friday-special question and thank the customer."
  },
  {
    "scenario": "Sarah wants to build her actual UGC system for Karibu Kitchen and asks for the five-step version from Lesson 7.8.",
    "question": "Which steps match?",
    "options": [
      "1) Print 200 delivery cards with the invitation to share; 2) One Friday Instagram Story every week celebrating \"Customer of the Week\" — always crediting the creator; 3) Reply to every Google review, thank the customer, ask permission to share; 4) Create an Instagram Highlight called \"Customer Photos\" so future customers can browse; 5) One free lunch a week to a random customer who shared UGC the previous week. Cost: about KES 2,000/month in free lunches. Value: customer content flowing every day.",
      "1) Copy competitor photos; 2) Post without permission; 3) Never reply; 4) Delete the highlight; 5) Cancel free lunches.",
      "1) Buy stock photos; 2) Boost only paid content; 3) Ignore customers.",
      "1) Hire an agency for KES 200,000/month."
    ],
    "correct": 0,
    "explanation": "Section 7.8 lays out Sarah's exact five-step UGC system: cards, Friday celebration, review replies, Highlight, weekly free-lunch draw. Roughly KES 2,000/month in food cost buys a daily stream of content she would otherwise have to create herself."
  },
  {
    "scenario": "Sarah's cousin argues that a paid TikTok influencer for KES 30,000 will always outperform UGC.",
    "question": "How does Lesson 7.8 push back?",
    "options": [
      "Paid influencer beats UGC in every case.",
      "UGC beats professional marketing on three specific counts (trust ~3x higher than brand voice, perfect free targeting to similar-neighbourhood networks, social proof for first-time buyers). An influencer post is one broadcast at KES 30,000; UGC is a daily stream at roughly KES 2,000/month. UGC also builds relationships — the influencer moves on to the next brand.",
      "Influencers are illegal in Kenya.",
      "UGC and influencer content are the same thing."
    ],
    "correct": 1,
    "explanation": "Section 7.8's whole opening reason for teaching UGC: Kenyan small businesses ignore it while global brands rely on it. For Sarah's KES 15,000-a-month budget, UGC is a much better use of shillings than a single influencer post."
  },
  {
    "scenario": "Sarah writes on her Karibu Kitchen Instagram bio: \"By using #KaribuKitchen you agree to let us re-share your content with credit.\" She now shares any post using the hashtag automatically without a DM.",
    "question": "How does Lesson 7.8 view this?",
    "options": [
      "Illegal in Kenya.",
      "This is the \"implied permission\" structure — acceptable, and helpful for volume — but Lesson 7.8 still says: for anything important, ask directly by DM as well. The written rule reduces risk; a direct DM removes it.",
      "This replaces any need to credit.",
      "This means Sarah owns the customer's photo forever."
    ],
    "correct": 1,
    "explanation": "Section 7.8 explicitly names the bio-published hashtag rule as an implied-permission structure that is acceptable, but recommends a direct DM as well for anything important. Neither route removes the obligation to credit — that is a separate rule."
  },
  {
    "scenario": "Sarah reposts a customer's UGC and forgets to tag them at all.",
    "question": "What consequence does Lesson 7.8 warn about?",
    "options": [
      "The customer will be flattered anyway.",
      "If they see you use their photo without credit, they will never share again. Credit is what keeps customers WANTING to send more content — tag the handle in the caption, mention them in the visual, and preserve any watermark they added.",
      "There is no consequence.",
      "The algorithm will penalise the post automatically."
    ],
    "correct": 1,
    "explanation": "Section 7.8's credit rule: never optional. Uncredited UGC kills the trust that drives future UGC. The fix is cheap: a tag, a name mention, and the watermark preserved."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
