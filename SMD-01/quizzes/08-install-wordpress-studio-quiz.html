<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install WordPress Studio | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 8 · Lesson 8.3</div>
            <h1>Install WordPress Studio</h1>
            <p>10 Sarah scenarios — download, install, and first site creation</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "Sarah has a Windows 8 laptop with 2 GB of free disk space and wants to install WordPress Studio to build Karibu Kitchen.",
    "question": "Can she install Studio right now?",
    "options": [
      "Yes — Studio runs on any Windows version.",
      "No — the prerequisites are Windows 10 or later, at least 4 GB of free disk space, and an internet connection for the initial download. She needs to upgrade Windows and free disk space first.",
      "Yes — Studio has no prerequisites.",
      "No — Studio only runs on Mac."
    ],
    "correct": 1,
    "explanation": "Slide 2 lists the prerequisites — Windows 10 or later (or Mac OS 12+, or Ubuntu 22+), at least 4 GB of free disk space, and internet for the initial download. Sarah does not meet either the Windows version or disk-space requirement."
  },
  {
    "scenario": "Sarah searches Google for 'wordpress studio download' and the first result is a free-download site with a big Download Now button.",
    "question": "What should Sarah do?",
    "options": [
      "Click the first result — it is convenient.",
      "Ignore search results and go directly to developer.wordpress.com/studio — the official page. Never download WordPress Studio from any other site because some fake downloads carry malware.",
      "Download from a torrent site instead.",
      "Ask a friend to email her the installer."
    ],
    "correct": 1,
    "explanation": "Slide 3 warns explicitly — the only safe download source is developer.wordpress.com/studio. Fake downloads on other sites can carry malware."
  },
  {
    "scenario": "Studio finishes downloading on Sarah's Windows laptop. She double-clicks the .exe. The installer asks her to accept the licence and confirm the install location.",
    "question": "Which step follows in a normal install?",
    "options": [
      "Click Install, wait about 30 seconds, and Studio adds itself to the Start Menu.",
      "Reboot Windows three times before continuing.",
      "Manually configure Apache and MySQL.",
      "Buy a hosting plan first."
    ],
    "correct": 0,
    "explanation": "Slide 4 describes the install — accept licence, confirm location, click Install. It finishes in about 30 seconds and Studio adds itself to the Start Menu on Windows."
  },
  {
    "scenario": "Sarah opens Studio for the first time and sees an empty dashboard. She wants to create her Karibu Kitchen site.",
    "question": "Which element does she click first?",
    "options": [
      "The Settings menu.",
      "The Help menu.",
      "The single big card with a plus sign in the middle of the screen — the Add site button.",
      "The Import site button in the sidebar."
    ],
    "correct": 2,
    "explanation": "Slide 5 describes the first-launch dashboard — the big card with a plus sign in the middle is the Add site button. That is where new sites start."
  },
  {
    "scenario": "In the Create a New Site dialog, Sarah is asked to set the site name, PHP version, WordPress version, and read a note about admin credentials.",
    "question": "Which of these actions is critical and easily forgotten?",
    "options": [
      "Change PHP to version 5.6.",
      "Skip the WordPress version entirely.",
      "Write down the auto-generated admin username and password on paper before closing the dialog — losing them means starting the site over.",
      "Type the site name in ALL CAPS."
    ],
    "correct": 2,
    "explanation": "Slide 6 warns explicitly — Studio auto-generates admin username and password, and losing them means starting over. Write them down on paper before closing the dialog."
  },
  {
    "scenario": "Sarah's Create a New Site dialog offers PHP version options. She wonders whether to change from the recommended 8.3.",
    "question": "What is the correct choice?",
    "options": [
      "Downgrade to PHP 5.6 to save memory.",
      "Stay with the recommended PHP 8.3.",
      "Pick PHP 4.0 for compatibility.",
      "Skip PHP and use Python instead."
    ],
    "correct": 1,
    "explanation": "Slide 6 says to stay with the recommended PHP 8.3. It is the current supported version for WordPress in 2026."
  },
  {
    "scenario": "Studio finishes creating the Karibu Kitchen site in about 10 seconds. Sarah sees a green dot next to the site name and a URL bar showing http://karibu-kitchen.wpstudio.local.",
    "question": "What do the green dot and the .wpstudio.local URL tell her?",
    "options": [
      "The site is broken and needs debugging.",
      "The site is running right now on a local domain — visible only on her laptop, not the public internet.",
      "The site is live on Google.",
      "The site has been deleted."
    ],
    "correct": 1,
    "explanation": "Slide 7 explains — the green dot means the site is running right now, and .wpstudio.local is the local domain, viewable only on her laptop. Not public until she uses Share Demo Site."
  },
  {
    "scenario": "Sarah installs Studio successfully, but when she tries to start her Karibu Kitchen site, Studio complains that port 80 is already in use.",
    "question": "What is the fix given in Lesson 8.3?",
    "options": [
      "Reinstall Windows.",
      "Uninstall Studio permanently.",
      "Check that ports 80 and 443 are not in use by another program — on Windows, use Task Manager to end any Apache, MAMP, or XAMPP processes.",
      "Buy a new laptop."
    ],
    "correct": 2,
    "explanation": "Slide 8 lists this as problem two — Studio installs but refuses to start a site. The fix is to check ports 80 and 443, and end any Apache, MAMP, or XAMPP processes in Task Manager."
  },
  {
    "scenario": "Sarah's antivirus quarantines the Studio installer during setup, claiming it is unsafe.",
    "question": "What should she do?",
    "options": [
      "Cancel the install and use a different tool.",
      "Temporarily disable the antivirus during install, then turn it back on. Studio is genuinely safe — this is a false positive.",
      "Uninstall the antivirus permanently.",
      "Reformat the laptop."
    ],
    "correct": 1,
    "explanation": "Slide 8 says antivirus blocking the installer is problem one. The fix is to disable antivirus temporarily during install, then re-enable it. Studio is safe."
  },
  {
    "scenario": "Sarah's local URL http://karibu-kitchen.wpstudio.local refuses to open in her browser after the install.",
    "question": "Which sequence of fixes matches Lesson 8.3?",
    "options": [
      "Delete the site and give up.",
      "Restart the computer once, and if it still fails, run Studio as Administrator on Windows.",
      "Reinstall Windows.",
      "Uninstall the browser."
    ],
    "correct": 1,
    "explanation": "Slide 8 gives the sequence for problem three — restart the computer once, and if the local URL still will not open, run Studio as Administrator on Windows. Hosts file entries usually reset on reboot."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
