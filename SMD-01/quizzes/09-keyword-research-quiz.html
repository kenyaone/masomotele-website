<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyword Research | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 9 · Lesson 9.2</div>
            <h1>Keyword Research</h1>
            <p>10 Sarah scenarios — Google Keyword Planner, long-tail, and the 10-keyword shortlist</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "Sarah has finished building karibukitchen.co.ke and wants to write ten blog posts immediately about 'artisan lunch' — the word she personally uses for her food.",
    "question": "What is the correct sequence in Lesson 9.2?",
    "options": [
      "Write first, research later — inspiration matters more.",
      "Research keywords BEFORE writing. Keywords tell you what customers actually type, not what YOU think they type. Nobody in Eldoret searches 'artisan lunch'.",
      "Skip keywords entirely — Google guesses intent.",
      "Copy Nyakinyua Kitchen's blog verbatim."
    ],
    "correct": 1,
    "explanation": "Slide 2 is explicit — research before writing. Keywords reveal what customers actually type. Sarah's 'artisan lunch' is not what her Eldoret customers search for."
  },
  {
    "scenario": "Sarah asks which free professional tool she should use for keyword research.",
    "question": "What is the correct answer?",
    "options": [
      "SEMrush paid tier only.",
      "Google Keyword Planner — free, official, and available on any Google Ads account even without spending a shilling on ads.",
      "Facebook Audience Insights.",
      "Google Docs word count."
    ],
    "correct": 1,
    "explanation": "Slide 3 names Google Keyword Planner as the professional standard — free, official, and accessible via any Ads account. No active campaign needed."
  },
  {
    "scenario": "Sarah opens Keyword Planner and enters the seed keyword 'lunch delivery Eldoret'. Google returns a table with dozens of ideas.",
    "question": "Which two columns does Lesson 9.2 say Sarah uses to make decisions?",
    "options": [
      "Column 1 (keyword) and Column 5 (impression share).",
      "Column 2 (average monthly searches) and Column 3 (competition level: low/medium/high).",
      "Column 4 (top of page bid) only.",
      "Column 5 (impression share) only."
    ],
    "correct": 1,
    "explanation": "Slide 4 lists all five columns but Slide 5 confirms Sarah uses columns 2 and 3 — search volume and competition — for her decisions."
  },
  {
    "scenario": "Sarah sees 'food delivery Kenya' has 10,000+ monthly searches with high competition. She is tempted.",
    "question": "What is the professional interpretation?",
    "options": [
      "Chase it — high volume always wins.",
      "It is a trap. Sarah will never outrank established chains for that keyword and will spend a fortune losing. Rule one — high volume plus high competition is a trap for a small business.",
      "It is illegal to target it.",
      "It is only high volume in the USA."
    ],
    "correct": 1,
    "explanation": "Slide 5 rule one — high volume with high competition is a trap. Sarah, a new local business, cannot outrank Uber Eats or Jumia Food for that term."
  },
  {
    "scenario": "Sarah spots 'vegetarian lunch Elgon View' with 10-100 monthly searches and low competition.",
    "question": "How should she think about this keyword?",
    "options": [
      "Ignore — too small.",
      "This is Sarah's opportunity. Low volume plus low competition means she can rank number one in about three months. Fewer searches — but every searcher is closer to buying.",
      "Buy backlinks for it immediately.",
      "Ignore because Elgon View is not in Eldoret."
    ],
    "correct": 1,
    "explanation": "Slide 5 rule two — low volume with low competition is a small business's opportunity. Every searcher on a specific term like this is closer to actual conversion."
  },
  {
    "scenario": "Sarah asks what 'long-tail' means and why it matters for Karibu Kitchen.",
    "question": "Which explanation matches Lesson 9.2?",
    "options": [
      "Long-tail means keywords with over 20 words.",
      "Long-tail = specific, four-or-more-word, location-specific or question-format keywords. Small businesses go long-tail. One number-one ranking on a long-tail term is worth more than five short-tail terms ranked at position 40.",
      "Long-tail only works in America.",
      "Long-tail is a Google Ads feature."
    ],
    "correct": 1,
    "explanation": "Slide 6 defines long-tail — four or more words, location-specific, question-format. It is the strategy for any small Kenyan business."
  },
  {
    "scenario": "Sarah is picking between 'lunch delivery' and 'vegetarian lunch delivery Elgon View' as a keyword target.",
    "question": "Which is long-tail and rankable in weeks?",
    "options": [
      "'lunch delivery' — short-tail, impossible to rank on.",
      "'vegetarian lunch delivery Elgon View' — long-tail, rankable in weeks.",
      "Both are identical.",
      "Neither — she must pay Google for a spot."
    ],
    "correct": 1,
    "explanation": "Slide 6 uses these exact two examples — 'lunch delivery' is short-tail and impossible; 'vegetarian lunch delivery Elgon View' is long-tail and rankable in weeks."
  },
  {
    "scenario": "Sarah has narrowed her list to 10 target keywords for Karibu Kitchen.",
    "question": "Which set matches Slide 7's shortlist?",
    "options": [
      "'lunch delivery Eldoret CBD', 'cheap lunch delivery Kapsoya', 'office lunch delivery Eldoret', 'vegetarian lunch Elgon View', 'chapati delivery Racecourse', 'ugali delivery Eldoret', 'Karibu Kitchen menu', 'Eldoret food delivery near me', 'dinner delivery Kapsoya', 'same day lunch Eldoret CBD'.",
      "'food', 'lunch', 'dinner', 'breakfast', 'kitchen', 'menu', 'delivery', 'Kenya', 'restaurant', 'cheap'.",
      "'artisan lunch', 'artisan food', 'artisan chef', 'artisan menu', 'artisan Eldoret', 'artisan delivery', 'artisan lunchbox', 'artisan takeaway', 'artisan chapati', 'artisan ugali'.",
      "'Jumia Food', 'Uber Eats', 'Bolt Food', 'Glovo', 'Yum', 'MRM', 'Chandarana', 'Naivas', 'Carrefour', 'Quickmart'."
    ],
    "correct": 0,
    "explanation": "Slide 7 lists exactly these 10 keywords. Each is long-tail, low competition, matches a real customer need, with search volume between 10 and 1,000 per month."
  },
  {
    "scenario": "Sarah asks how she should assign these 10 keywords to her pages.",
    "question": "What is the rule from Slide 8?",
    "options": [
      "Target all 10 keywords on the Home page.",
      "One page, one keyword. Home targets 'lunch delivery Eldoret CBD'. Menu targets 'Karibu Kitchen menu'. Each blog post gets its own keyword. Never target multiple money keywords on the same page.",
      "Randomly sprinkle keywords everywhere.",
      "Delete keywords once assigned."
    ],
    "correct": 1,
    "explanation": "Slide 8 rule — one page, one keyword. Sarah's Home gets 'lunch delivery Eldoret CBD', Menu gets 'Karibu Kitchen menu', blog posts and sub-pages each own their own keyword."
  },
  {
    "scenario": "Sarah asks how Google Keyword Planner is free if it lives inside Google Ads.",
    "question": "What is the truthful answer from Lesson 9.2?",
    "options": [
      "It is not free — she must pay a KES 5,000 licence.",
      "Sign up at ads.google.com. The Keyword Planner is available on any Ads account, even without an active campaign or a single shilling of ad spend.",
      "It is free only in the USA.",
      "Only agencies can access it."
    ],
    "correct": 1,
    "explanation": "Slide 3 is explicit — Keyword Planner is free on any Google Ads account, no ad spend required. Sign up, log in, open Tools and Settings > Keyword Planner."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
