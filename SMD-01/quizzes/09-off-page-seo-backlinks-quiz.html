<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Off-Page SEO (Backlinks) | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 9 · Lesson 9.5</div>
            <h1>Off-Page SEO (Backlinks)</h1>
            <p>10 Sarah scenarios — backlinks, dofollow, ethical earning, Google Penguin</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "Sarah asks why Google treats backlinks as important at all.",
    "question": "What is the honest, PageRank-era answer from Lesson 9.5?",
    "options": [
      "Google prefers sites that pay for links.",
      "When site A links to site B, that is A voting for B. Backlinks are votes of confidence. The more high-quality sites that link to you, the more Google trusts you.",
      "Backlinks only affect Bing, not Google.",
      "Backlinks are irrelevant since 2020."
    ],
    "correct": 1,
    "explanation": "Slide 2 is explicit — Google's original algorithm treats backlinks as votes. One link from a high-authority Kenyan news site (Nation or Standard) is worth more than 100 unknown-blog links."
  },
  {
    "scenario": "Sarah discovers she can get her Karibu Kitchen URL posted in a Facebook comment or in the sidebar of a blog roll on Nation Media's food section.",
    "question": "Which link passes ranking value?",
    "options": [
      "Both pass equal value.",
      "The blog roll link on the Nation Media site is dofollow and passes ranking value. The Facebook comment link is nofollow and does NOT directly help SEO — although it still brings traffic and awareness.",
      "Facebook links are always dofollow.",
      "All Google links are nofollow."
    ],
    "correct": 1,
    "explanation": "Slide 3 splits dofollow from nofollow — dofollow passes ranking value; nofollow does not. Facebook, Instagram, and comment-section links are typically nofollow. Real editorial links from news sites and blogs are typically dofollow."
  },
  {
    "scenario": "Sarah asks for five ethical strategies to actually earn backlinks.",
    "question": "Which set matches Lesson 9.5?",
    "options": [
      "Buy links from Fiverr, use PBNs, exchange links, spam comments, join link farms.",
      "Create linkable assets (original research, guides, tools, infographics), guest posting, broken link building, resource pages, partnerships with related businesses.",
      "Only post on Facebook.",
      "Delete competitors' sites."
    ],
    "correct": 1,
    "explanation": "Slide 4 lists the five legitimate strategies — linkable assets, guest posting, broken-link building, resource pages, and partnerships. All ethical, all rewarded by Google."
  },
  {
    "scenario": "Sarah wants a realistic 90-day backlink plan for Karibu Kitchen.",
    "question": "Which plan matches Slide 5?",
    "options": [
      "Month 1: buy 500 links. Month 2: buy 500 links. Month 3: buy 500 links.",
      "Month 1: get listed on five Kenyan business directories — Google Business Profile, Yelp Kenya, Yellow Pages Kenya, TripAdvisor, and two local Eldoret listings. Month 2: write two guest posts, one on a Kenyan food blog and one on an Eldoret community news site. Month 3: reach out to five wellness/lifestyle bloggers about her healthy dinner options. Total: 12-20 natural backlinks in 90 days.",
      "Month 1-3: do nothing.",
      "Buy a KES 500,000 link package."
    ],
    "correct": 1,
    "explanation": "Slide 5 gives Sarah's exact plan — directories in month 1, guest posts in month 2, blogger outreach in month 3. 12-20 backlinks earned, all natural, all free."
  },
  {
    "scenario": "Sarah's cousin offers to sell her 100 backlinks for KES 5,000.",
    "question": "What does Slide 6 tell her?",
    "options": [
      "Buy them — cheap wins.",
      "Never. Buying backlinks in bulk is one of the five things Google Penguin catches. Penalties are severe — sites can be removed from search results entirely. Recovery takes months.",
      "Buy only 50 to be safe.",
      "Buying is only illegal outside Kenya."
    ],
    "correct": 1,
    "explanation": "Slide 6 lists the five never-do practices — bulk-buying links, PBNs, exact-match anchor stuffing, comment spam, link farms. Google Penguin catches every one. Penalties are severe."
  },
  {
    "scenario": "Sarah asks how to measure whether her backlink outreach is working, without paying for Ahrefs.",
    "question": "Which free tools does Lesson 9.5 recommend?",
    "options": [
      "Only paid Semrush.",
      "Google Search Console Links report (updated weekly, shows every external site linking to yours) and Ahrefs Free Backlink Checker (no account needed, snapshot of top backlinks).",
      "Bing Webmaster Tools only.",
      "There are no free tools."
    ],
    "correct": 1,
    "explanation": "Slide 7 names both — Search Console Links report (free, official, weekly) and Ahrefs Free Backlink Checker (no account, one snapshot). Sarah spends five minutes weekly."
  },
  {
    "scenario": "Sarah checks her Search Console Links report and sees 40 backlinks from casino sites and adult sites she never asked for.",
    "question": "What does Slide 8 tell her to do?",
    "options": [
      "Panic and delete her whole site.",
      "Use the Google Search Console Disavow tool sparingly to tell Google to ignore clearly toxic links. Do not disavow real backlinks that just look small — you might block a future ranking win.",
      "Disavow every backlink she has.",
      "Buy more links to dilute them."
    ],
    "correct": 1,
    "explanation": "Slide 8 says use Disavow sparingly for clearly toxic links only. Do not disavow real backlinks just because they look small — you may be blocking future wins."
  },
  {
    "scenario": "Sarah is offered a link exchange — 'You link to me, I link to you' — with three unrelated Kenyan blogs.",
    "question": "What is the risk?",
    "options": [
      "No risk — link exchanges are safe.",
      "Reciprocal link exchange schemes are one of the five practices Google Penguin catches. Do it at scale and you risk removal from search results.",
      "Link exchanges are legal and boost SEO.",
      "Google prefers link exchanges."
    ],
    "correct": 1,
    "explanation": "Slide 6 lists link-exchange schemes among the five never-do practices. Small partnerships and natural cross-references are fine — organised link swaps are not."
  },
  {
    "scenario": "Sarah is drafting anchor text for the sites that will link to her. Someone suggests every anchor say 'lunch delivery Eldoret'.",
    "question": "Why is this dangerous?",
    "options": [
      "It is optimal — repetition wins.",
      "Exact-match anchor text stuffing across every backlink is one of the five practices Google Penguin catches. Anchor text should vary naturally — brand names, URLs, generic 'click here', related phrases.",
      "Google requires it.",
      "Kenya law forbids other anchors."
    ],
    "correct": 1,
    "explanation": "Slide 6 lists exact-match anchor stuffing among the five never-do practices. Natural link profiles vary anchor text across brand, URL, generic, and topical phrases."
  },
  {
    "scenario": "Sarah wonders how often she should actually check her backlink data.",
    "question": "Which routine matches Lesson 9.5?",
    "options": [
      "Never.",
      "Every week, spend about five minutes in Search Console asking two questions — are backlinks growing? Are they high quality or spam?",
      "Every hour.",
      "Only once a year."
    ],
    "correct": 1,
    "explanation": "Slide 7 sets the cadence — five minutes weekly, checking growth and quality. Growth means outreach is working. Quality means real editorial sites vs random casino/adult sites."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
