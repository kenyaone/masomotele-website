<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On-Page SEO with Yoast | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 9 · Lesson 9.3</div>
            <h1>On-Page SEO with Yoast</h1>
            <p>10 Sarah scenarios — the seven on-page elements Yoast tracks</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "Sarah asks how many on-page SEO elements she needs to get right for Karibu Kitchen's Home page to rank.",
    "question": "Which set of seven does Lesson 9.3 list?",
    "options": [
      "SEO title, URL/slug, meta description, H1, H2/H3 sub-headings, image alt text, body content.",
      "Font size, background colour, favicon, footer, sidebar, header image, logo.",
      "Facebook share, Instagram share, Twitter share, WhatsApp share, email share, print, PDF export.",
      "Domain age, hosting country, SSL grade, page count, plugin count, theme age, comment count."
    ],
    "correct": 0,
    "explanation": "Slide 2 lists the seven on-page elements — SEO title, URL, meta description, H1, H2/H3, alt text, body content. Miss any and ranking suffers."
  },
  {
    "scenario": "Sarah writes an SEO title of 78 characters for her Home page.",
    "question": "Which rule is she breaking?",
    "options": [
      "SEO titles should be between 50 and 60 characters — Google cuts off after about 60. Sarah's title will be truncated in the search results.",
      "SEO titles must be exactly 200 characters.",
      "SEO titles cannot include the target keyword.",
      "SEO titles must be in ALL CAPS."
    ],
    "correct": 0,
    "explanation": "Slide 3 sets the rule — 50-60 characters. Google cuts off around 60. Sarah's 'Lunch Delivery Eldoret - Karibu Kitchen' at 52 characters is the target model."
  },
  {
    "scenario": "Sarah is composing the Home page SEO title.",
    "question": "Which structure matches Lesson 9.3?",
    "options": [
      "Random words with no keyword.",
      "Target keyword at the beginning, brand at the end, compelling in the middle. Example: 'Lunch Delivery Eldoret - Karibu Kitchen'.",
      "Brand only, no keyword.",
      "Brand at the start, no keyword."
    ],
    "correct": 1,
    "explanation": "Slide 3 rules — keyword first, brand last, compelling. Sarah's Home page title 'Lunch Delivery Eldoret - Karibu Kitchen' is exactly this structure."
  },
  {
    "scenario": "Sarah's Delivery page URL currently reads karibukitchen.co.ke/Page_ID=1425.",
    "question": "What is the correct URL to change it to?",
    "options": [
      "karibukitchen.co.ke/DELIVERY_PAGE",
      "karibukitchen.co.ke/delivery — lowercase, descriptive, human-readable, hyphens between words (none needed here), and includes the keyword.",
      "karibukitchen.co.ke/2026/01/12/delivery.html",
      "karibukitchen.co.ke/?p=1425"
    ],
    "correct": 1,
    "explanation": "Slide 4 URL rules — lowercase, hyphens between words (never underscores), descriptive, keyword-including, no dates, no category codes. /delivery is the model."
  },
  {
    "scenario": "Sarah writes a meta description of 210 characters.",
    "question": "What is the rule?",
    "options": [
      "Between 120 and 160 characters, include the target keyword naturally, end with a call to action. Sarah's 210-char description will be truncated.",
      "Exactly 500 characters.",
      "Under 40 characters.",
      "Length does not matter."
    ],
    "correct": 0,
    "explanation": "Slide 5 sets the 120-160 range. Sarah's model: 'Fresh lunch delivered to Eldoret CBD in thirty minutes. Order by twelve, eat by one. Menu changes daily. WhatsApp us on 0782.' — 148 characters."
  },
  {
    "scenario": "Sarah's Home page currently has three H1 headings, no H2s, and one H3.",
    "question": "What is wrong?",
    "options": [
      "H1 count is fine — the more the better.",
      "Every page must have exactly ONE H1 heading (the page title). Main sections use H2, sub-sections use H3. Sarah has an inverted, broken hierarchy that Google cannot parse.",
      "H1 headings are optional.",
      "H1 must only be used in blog posts."
    ],
    "correct": 1,
    "explanation": "Slide 6 rule — one H1 per page, then H2s under it, then H3s under those. Sarah's example: H1 'Fresh lunch, delivered to your desk', H2s 'Today's specials', 'Where we deliver', 'How to order'."
  },
  {
    "scenario": "Sarah uploaded her hero image with the filename IMG_2419.jpg and left alt text blank.",
    "question": "Why is this a problem and what is a good alt text?",
    "options": [
      "It is not a problem — Google reads images directly.",
      "Google cannot see images, only alt text — so a blank alt hurts SEO and accessibility. Good alt: 'Ugali and beef stew in a takeaway container from Karibu Kitchen Eldoret'. Descriptive, includes the location keyword, sounds natural.",
      "The image is corrupted.",
      "Alt text is only for print pages."
    ],
    "correct": 1,
    "explanation": "Slide 7 explains — Google cannot see images, only alt text. Alt has two purposes: accessibility (screen readers for blind users) and SEO. Bad alt: 'IMG.JPG'. Good alt: descriptive natural language."
  },
  {
    "scenario": "Sarah's Home page has 80 words of body content.",
    "question": "What is the rule?",
    "options": [
      "Word count is irrelevant.",
      "At least 300 words for a Home page, 1,000+ for a blog post. Include the target keyword 3-5 times naturally spread through the text, plus synonyms and related terms.",
      "Exactly 50 words is best.",
      "Body content should be in bold ALL CAPS."
    ],
    "correct": 1,
    "explanation": "Slide 8 rules — 300 words minimum on a Home page, 1,000+ on a blog post, target keyword 3-5 times naturally, plus synonyms, internal links, human-first writing."
  },
  {
    "scenario": "Sarah's Home page keyword is 'lunch delivery Eldoret'. She writes 300 words that repeat 'lunch delivery Eldoret' 45 times.",
    "question": "What is wrong with this?",
    "options": [
      "Nothing — repetition helps ranking.",
      "This is keyword stuffing. Slide 8 says target keyword 3-5 times naturally, plus synonyms like 'lunch', 'food', 'delivery', 'meals', 'office', 'Eldoret'. Write for humans first, Google second.",
      "The keyword is too long.",
      "Google prefers 100+ repetitions."
    ],
    "correct": 1,
    "explanation": "Slide 8 warns — 3-5 times naturally spread, plus synonyms and related terms. 45 repetitions is keyword stuffing, which Google penalises. Write for humans first."
  },
  {
    "scenario": "Sarah wants a single visual signal that all seven on-page elements are correct.",
    "question": "What does Yoast SEO give her?",
    "options": [
      "A yellow warning box that never goes away.",
      "A green light in Yoast's purple box means all seven on-page elements are correct — Sarah's page is ready to rank.",
      "An email confirmation.",
      "Nothing — SEO cannot be verified."
    ],
    "correct": 1,
    "explanation": "Slide 9 wrap-up — Yoast SEO gives a green light when all seven elements are correct. Green means the page is ready to rank."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
