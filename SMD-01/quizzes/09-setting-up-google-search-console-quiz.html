<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setting Up Google Search Console | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 9 · Lesson 9.6</div>
            <h1>Setting Up Google Search Console</h1>
            <p>10 Sarah scenarios — property, verification, sitemap, Performance report, Monday routine</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "Sarah asks what Google Search Console actually shows that no other tool shows.",
    "question": "Which set of five matches Lesson 9.6?",
    "options": [
      "Facebook likes, Instagram followers, YouTube subs, TikTok views, Twitter retweets.",
      "How many people saw your site in Google search results, how many clicked, which keywords brought them, which pages are indexed vs not, and technical problems Google detected while crawling.",
      "Server RAM, disk usage, database size, plugin count, theme count.",
      "Number of orders, total revenue, refund rate, delivery time, customer rating."
    ],
    "correct": 1,
    "explanation": "Slide 2 lists the five — impressions in Google, clicks, keyword queries, indexing status, and crawl problems. This is how Google sees your site, not how visitors experience it (GA4 covers that)."
  },
  {
    "scenario": "Sarah opens search.google.com/search-console and clicks Add Property. Google offers two choices — Domain property or URL prefix property.",
    "question": "Which is the beginner choice?",
    "options": [
      "Neither — skip verification.",
      "URL prefix property. Type Sarah's full site URL: https://karibukitchen.co.ke. Click Continue.",
      "Domain property, which requires DNS access.",
      "Both simultaneously."
    ],
    "correct": 1,
    "explanation": "Slide 3 says beginners pick URL prefix. Type the full URL with https://. Domain property requires DNS TXT records which is more advanced."
  },
  {
    "scenario": "Sarah is offered three ways to verify ownership of karibukitchen.co.ke.",
    "question": "Which trio matches Lesson 9.6?",
    "options": [
      "HTML file upload to the root folder, HTML tag pasted into the head section, or Google Analytics/Google Tag Manager if MonsterInsights is already installed.",
      "Send Google a bank statement, upload a passport photo, provide a fingerprint.",
      "Post on Facebook, tweet from Twitter, email Google support.",
      "Only DNS TXT record — no other method."
    ],
    "correct": 0,
    "explanation": "Slide 4 lists the three methods — HTML file upload, HTML tag in the head, or Google Analytics/Tag Manager. Note DNS TXT is also possible for Domain property. Method 3 (via MonsterInsights) is easiest."
  },
  {
    "scenario": "Sarah installed MonsterInsights in Lesson 8.7 and is now doing GSC verification.",
    "question": "Which verification method should she prefer, and why?",
    "options": [
      "HTML file upload — most complex.",
      "Google Analytics / Google Tag Manager — because MonsterInsights already connects GA4 to her WordPress site, Google verifies automatically. Method 3 is the easiest.",
      "DNS TXT — she has no DNS access yet.",
      "None — she must revalidate manually every day."
    ],
    "correct": 1,
    "explanation": "Slide 4 recommends method three (GA / Tag Manager) whenever possible because it is the easiest. Sarah's MonsterInsights install from 8.7 makes this automatic."
  },
  {
    "scenario": "Sarah has verified. First job. She wants Google to systematically crawl her site.",
    "question": "What does she do?",
    "options": [
      "Wait 6 months and hope.",
      "Click Sitemaps in the sidebar. Add a new sitemap. Type sitemap_index.xml (Yoast auto-generates it for WordPress). Click Submit. Within about 24 hours all pages appear in Google's index.",
      "Delete the sitemap.",
      "Email Google support."
    ],
    "correct": 1,
    "explanation": "Slide 5 describes sitemap submission — for WordPress with Yoast, the URL is sitemap_index.xml. Submit on day one. Without a sitemap Google may miss half the pages."
  },
  {
    "scenario": "Sarah opens the Performance report and sees four summary cards. She wants to know what each means.",
    "question": "Which quartet matches Lesson 9.6?",
    "options": [
      "Total clicks (clicks from Google), total impressions (times the site appeared), average CTR (clicks / impressions), average position (rank).",
      "Total downloads, total refunds, total subscribers, total unsubscribes.",
      "Total tweets, total shares, total likes, total pins.",
      "Total emails sent, delivered, opened, clicked."
    ],
    "correct": 0,
    "explanation": "Slide 6 names the four summary cards — Total clicks, Total impressions, Average CTR, Average position. Sarah's month-one snapshot: 128 clicks, 2,400 impressions, 5.3% CTR, avg position 18."
  },
  {
    "scenario": "Sarah's Top Queries table shows 'lunch delivery Eldoret' with 34 clicks, 210 impressions, 16.2% CTR, average position 8.2.",
    "question": "How should she interpret this?",
    "options": [
      "Ranking is disastrous — abandon the keyword.",
      "She is ranking on page one (position 8.2) with a healthy 16.2% CTR. The keyword is working. This is where the next optimisation push should focus to push into the top three.",
      "The keyword must be deleted.",
      "The keyword only works on Bing."
    ],
    "correct": 1,
    "explanation": "Slide 7 walks through Sarah's exact data. Position 8.2 is page-one bottom. 16.2% CTR is strong. Sarah reads this table every Monday to see what is working and what needs attention."
  },
  {
    "scenario": "Sarah asks how much time she should spend in Search Console each week.",
    "question": "Which routine matches Lesson 9.6?",
    "options": [
      "Never open Search Console.",
      "Every Monday for the rest of your career, 30 minutes. Ask four questions: are total clicks growing week over week, are we improving in average position, are there queries with impressions but no clicks (need better title/meta), and are there coverage or indexing errors to fix.",
      "One hour every day.",
      "Only when Google emails you."
    ],
    "correct": 1,
    "explanation": "Slide 8 sets the cadence — 30 minutes every Monday. Four questions. This is what professional SEO looks like."
  },
  {
    "scenario": "Sarah sees a keyword with 500 impressions but only 3 clicks (0.6% CTR) at position 6.",
    "question": "What is the diagnosis and fix?",
    "options": [
      "Nothing — impressions are enough.",
      "The page is ranking well (position 6) but the title and meta description are not compelling enough to earn clicks. Rewrite the SEO title and meta description for that page.",
      "Delete the page.",
      "Buy Google Ads for that keyword."
    ],
    "correct": 1,
    "explanation": "Slide 8 question three — queries with impressions but no clicks mean the page needs a better title and meta description. Position is fine, packaging is not."
  },
  {
    "scenario": "Sarah asks whether Google Analytics 4 replaces Google Search Console since both are Google tools.",
    "question": "What is the correct answer?",
    "options": [
      "Yes — GA4 replaces GSC.",
      "No — both matter. Search Console shows how Google SEES your site (impressions, queries, indexing, crawl errors). GA4 shows how visitors BEHAVE on your site once they arrive. Different data, different jobs.",
      "GSC replaces GA4.",
      "Neither is useful."
    ],
    "correct": 1,
    "explanation": "Slide 2 draws the distinction — GSC = Google's view, GA4 = visitor behaviour view. Both matter and they answer different questions."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
