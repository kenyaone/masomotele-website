<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Ads Simulator Lab — Mwema Coffee House | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 10 · Lesson 10.1</div>
            <h1>Google Ads Simulator Lab — Mwema Coffee House</h1>
            <p>10 Mwema Coffee House scenarios — CPA, ROAS, six sliders, the winning recipe</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "You are a junior Google Ads specialist at a Nairobi digital agency. Your new client is Mwema Coffee House. The brief: daily budget KES 1,000, seven-day total KES 7,000, average order value KES 1,500, gross margin 40 per cent, conversion goal an actual online purchase (not a click).",
    "question": "What is Mwema's maximum profitable CPA?",
    "options": [
      "KES 1,500 — the full AOV.",
      "KES 600 — because 40 per cent of KES 1,500 gross profit is what each sale generates. Above KES 600 CPA and Mwema loses money.",
      "KES 100 — arbitrarily low.",
      "KES 7,000 — the total campaign budget."
    ],
    "correct": 1,
    "explanation": "Slide 3 does the maths — KES 1,500 AOV x 40% margin = KES 600 gross profit per sale. That is the maximum profitable CPA. Above it, every sale loses money."
  },
  {
    "scenario": "Your classmate is celebrating a 2 per cent CTR and low average CPC on Mwema's campaign but has zero conversions after three days.",
    "question": "What is the single most important mental shift Lesson 10.1 demands?",
    "options": [
      "CTR is the goal — celebrate the 2 per cent.",
      "Clicks are an intermediate metric. Conversions are the outcome metric. Every trainee walks into this lab focused on CPC. Every trainee who passes walks out focused on CPA and ROAS. Zero conversions after KES 3,000 spend is a losing campaign regardless of CTR.",
      "Reduce budget to save money.",
      "Buy more clicks."
    ],
    "correct": 1,
    "explanation": "Slide 4 is the core lesson — clicks are intermediate, conversions are the outcome. Cheap clicks with no sales still lose money. This is the whole point of Module 10."
  },
  {
    "scenario": "Your classmate spends KES 5,000 to earn one KES 1,500 sale and shrugs — 'at least we got a sale'.",
    "question": "What is the ROAS and why is this failing?",
    "options": [
      "ROAS 0.3x. The campaign spent KES 5,000 for KES 1,500 revenue. Mwema is losing money on every sale. Target ROAS is 3x or higher.",
      "ROAS 10x — the sale is pure profit.",
      "ROAS is irrelevant.",
      "ROAS 100x — the click was cheap."
    ],
    "correct": 0,
    "explanation": "Slide 4 gives this exact worked example — KES 5,000 spent, KES 1,500 revenue, ROAS 0.3x. The campaign is losing money. Target ROAS is 3x."
  },
  {
    "scenario": "You want to structure Mwema's campaign correctly before turning any sliders.",
    "question": "Which structure matches Lesson 10.1?",
    "options": [
      "Ten campaigns, no ad groups, one keyword.",
      "One campaign (sets goal and budget cap), one ad group (holds keywords and ads), 3-5 keywords, 2-3 ad variations. Simple. Enough to compete.",
      "One campaign, one ad group, 500 keywords, one ad.",
      "No structure — just spend."
    ],
    "correct": 1,
    "explanation": "Slide 5 recaps campaign structure — one campaign, one ad group, 3-5 keywords, 2-3 ad variations. This is the minimum viable structure for the lab."
  },
  {
    "scenario": "The simulator gives you six sliders to move.",
    "question": "Which set matches Lesson 10.1?",
    "options": [
      "Font size, background colour, image count, page speed, plugin count, theme age.",
      "Daily budget, max CPC bid, keyword match type tightness (Broad/Phrase/Exact), number of negative keywords, ad copy quality (0-10), landing page quality (0-10).",
      "Twitter budget, Facebook budget, Instagram budget, LinkedIn budget, TikTok budget, YouTube budget.",
      "Wi-Fi speed, laptop RAM, browser version, plugin count, theme count, cache size."
    ],
    "correct": 1,
    "explanation": "Slide 6 lists the six sliders — budget, max CPC, match type, negatives, ad quality, landing quality. Each has a specific effect on impressions, clicks, conversion rate, and CPA."
  },
  {
    "scenario": "You are watching the simulator's status pill in the bottom right. It says Red.",
    "question": "What two conditions must BOTH be met to turn it Green?",
    "options": [
      "10 clicks and 10 impressions.",
      "ROAS 3x or higher AND 30 or more conversions across the 7 days. Both conditions must hit. Only then does Mwema pay your agency.",
      "One conversion.",
      "Just a low CPC."
    ],
    "correct": 1,
    "explanation": "Slide 7 states the two conditions — ROAS >= 3x AND >= 30 conversions in 7 days. Both required. That is when Mwema is profitable and pays the agency."
  },
  {
    "scenario": "You are turning Slider 3 — keyword match type. The tightness options are Broad, Phrase, Exact.",
    "question": "Which setting is on the winning recipe from Slide 8?",
    "options": [
      "Broad — cast the widest net.",
      "Phrase or Exact — tighter match cuts impressions but raises CTR and conversion rate.",
      "Broad, then broader.",
      "Off — no match type."
    ],
    "correct": 1,
    "explanation": "Slide 6 explains match type — tighter = fewer impressions, higher CTR and conversion rate. Slide 8's winning recipe uses Phrase or Exact, never Broad."
  },
  {
    "scenario": "You are choosing how many negative keywords to add for Mwema.",
    "question": "What is on the winning recipe?",
    "options": [
      "Zero negatives.",
      "8 to 15 negative keywords. Each negative removes a slice of wasted clicks (searches for jobs, free samples, competitors, unrelated locations).",
      "Over 500 negatives.",
      "One negative."
    ],
    "correct": 1,
    "explanation": "Slide 8 winning recipe — 8 to 15 negatives. Enough to strip out obvious waste without over-restricting reach."
  },
  {
    "scenario": "You are setting Slider 2 — max CPC bid.",
    "question": "What sweet spot does the winning recipe indicate?",
    "options": [
      "KES 200 per click.",
      "KES 20 to 30 per click — do not over-bid. Higher wins more impressions but crushes margin.",
      "KES 1 per click.",
      "KES 500 per click."
    ],
    "correct": 1,
    "explanation": "Slide 6 says the CPC sweet spot is around KES 20-30. Slide 8 confirms — do not over-bid. Above this, margin collapses even if conversions climb."
  },
  {
    "scenario": "You have set match type Phrase, 12 negatives, ad copy quality 9, landing quality 9, CPC bid KES 25, and daily budget KES 1,000. ROAS is 2.6x with 24 conversions. Status pill is still Red.",
    "question": "What single lever does the winning recipe say to nudge?",
    "options": [
      "Lower ad quality to 3.",
      "Nudge the daily budget up to somewhere between KES 1,200 and KES 1,800, slightly above baseline, to reach 30+ conversions. Do not over-bid CPC. Keep the quality scores at 9-10.",
      "Change match type back to Broad.",
      "Remove all negatives."
    ],
    "correct": 1,
    "explanation": "Slide 8 winning recipe — daily budget KES 1,200-1,800 to hit 30+ conversions. The recipe is otherwise correct. Push budget, not CPC. ROAS holds because match type, quality, and negatives are all optimal."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
