<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Pixel + Events API | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 12 · Lesson 12.2</div>
            <h1>TikTok Pixel + Events API</h1>
            <p>10 Brian Otieno scenarios — Pixel, Events API, standard events, AAM, dedup, Kenya DPA 2019</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "Brian's first Chapa Fitness TikTok campaign ran for two weeks with no Pixel installed. TikTok Ads Manager reports 420 clicks and USD 68 spent, but Brian has no idea how many of those clicks turned into Shopify orders.",
    "question": "What does the TikTok Pixel do that would have fixed this?",
    "options": [
      "The Pixel is a TikTok badge for websites — it does not affect ads.",
      "The Pixel is a JavaScript on every page that fires events to TikTok — ViewContent, AddToCart, Purchase with value + currency — so TikTok can attribute conversions back to the ad the visitor clicked.",
      "The Pixel is an autoplay video widget.",
      "The Pixel is a plugin that automatically raises ad spend."
    ],
    "correct": 1,
    "explanation": "Slide 2 of §12.2 explains the Pixel: a JavaScript on every page that fires standard events (ViewContent, AddToCart, Purchase, etc.) to TikTok. Events Manager attributes them back to the ad, and Brian learns not just clicks but purchases at value X."
  },
  {
    "scenario": "Brian installed the Pixel three months ago. Since then, his reported iPhone conversions have collapsed by roughly 40% even though Chapa Fitness Shopify orders in his admin dashboard have stayed the same.",
    "question": "What is the most likely cause and the fix?",
    "options": [
      "The Pixel is broken and must be reinstalled from scratch.",
      "iOS 14.5+ App Tracking Transparency lets iPhone users block the client-side Pixel with one tap — around 80% opt out. The fix is the TikTok Events API — server-side event sending that cannot be blocked by ATT or ad blockers.",
      "TikTok has stopped tracking Kenya.",
      "He has too many customers."
    ],
    "correct": 1,
    "explanation": "Slide 4 of §12.2 covers the iOS 14.5 ATT change. Pixel-only setups lose ~30-40% of iPhone conversion signal. Events API runs server-side, cannot be blocked, and — combined with the Pixel — restores near-complete coverage."
  },
  {
    "scenario": "Brian's Shopify store fires events named ViewContent, AddToCart, InitiateCheckout, Purchase, and CompleteRegistration.",
    "question": "What are these called in TikTok's tracking vocabulary?",
    "options": [
      "Custom events.",
      "Standard events — TikTok recognises around 15 of them by exact name, which unlocks its built-in optimisation (Product Sales, Conversions).",
      "Boost events.",
      "Legacy events."
    ],
    "correct": 1,
    "explanation": "Slide 3 of §12.2 lists the five standard events every store needs. Standard-event naming unlocks TikTok's built-in optimisation and lets ad groups optimise for Purchase, InitiateCheckout, and so on."
  },
  {
    "scenario": "Brian installed both the TikTok Pixel and the Events API. Events Manager now shows every Purchase event TWICE — once from the browser, once from the server — and his ROAS looks impossibly high.",
    "question": "What is the fix?",
    "options": [
      "Uninstall the Events API and go back to Pixel only.",
      "Attach a shared event ID to both copies of every event. TikTok's deduplication logic then counts each shared-ID pair as one event. Shopify's official app handles this automatically; custom stacks must set the event ID on both sides manually.",
      "Multiply the ad account balance by two.",
      "Ignore it — TikTok cleans it up after 30 days."
    ],
    "correct": 1,
    "explanation": "Slide 6 of §12.2 covers deduplication. Without a shared event ID, Pixel + Events API double-count. With it, TikTok sees the same ID from two sources and credits one event only."
  },
  {
    "scenario": "Brian is offered two ways to install the TikTok Pixel on his Shopify store: paste code snippets directly into every theme template, or install TikTok's official Shopify app.",
    "question": "What is the correct fast path for chapafitness.co.ke?",
    "options": [
      "Hire a developer to write custom code from scratch, one snippet per template file.",
      "Install TikTok's official Shopify app. One click gives Pixel + Events API + Automatic Advanced Matching + event ID deduplication — the entire stack — in around ten minutes.",
      "Copy the Pixel into every theme file manually and skip the Events API.",
      "Move the whole store off Shopify first."
    ],
    "correct": 1,
    "explanation": "Slide 5 of §12.2 covers install paths. TikTok's official Shopify app installs Pixel + Events API in one click and handles Automatic Advanced Matching and event ID deduplication automatically. Direct code and GTM are alternatives — Shopify's app is the fastest and cleanest."
  },
  {
    "scenario": "Brian sees an Events Manager toggle called \"Automatic Advanced Matching\" and is unsure whether to switch it on.",
    "question": "What does it do, and what should he pick?",
    "options": [
      "It automatically raises his bid — leave it off to save money.",
      "It automatically hashes email addresses and phone numbers found in the page (e.g. in the Shopify checkout form) and attaches them to every event. Hashed PII raises TikTok's match rate significantly. Turn it ON — this is standard practice.",
      "It uploads raw customer emails to TikTok — never turn it on.",
      "It changes the ad account currency to KES."
    ],
    "correct": 1,
    "explanation": "Slide 6 of §12.2 covers Automatic Advanced Matching. The Pixel hashes PII on the browser side using SHA-256 and sends it with every event, raising match rate. It is safe, DPA 2019-compatible when combined with consent, and materially improves optimisation."
  },
  {
    "scenario": "Brian launched the Pixel and moved straight into a new campaign without ever opening the TikTok Pixel Helper. A week later he realises the Purchase event has never fired — he has no purchase attribution at all.",
    "question": "What should he have done between install and campaign launch?",
    "options": [
      "Nothing extra — TikTok verifies installs automatically.",
      "Install TikTok Pixel Helper (Chrome), walk the full purchase flow (homepage → product page → cart → checkout → thank-you page), confirm all five standard events fire with correct parameters in Pixel Helper, and cross-check the server-side copies in Events Manager BEFORE trusting attribution.",
      "Send TikTok an email asking them to verify.",
      "Reinstall the Pixel every Monday."
    ],
    "correct": 1,
    "explanation": "Slide 7 of §12.2 covers Pixel Helper verification. Every install must be walked end-to-end. Pixel Helper shows the browser copies; Events Manager confirms the server copies. Skipping this step is one of the most common mistakes."
  },
  {
    "scenario": "Brian's cookie banner on chapafitness.co.ke has an \"Accept all\" button but no \"Reject\" option, and there is no way for a visitor to withdraw consent after clicking Accept.",
    "question": "Does this comply with the Kenya Data Protection Act 2019?",
    "options": [
      "Yes — accept-only banners are fine under Kenyan law.",
      "No. DPA 2019 requires informed consent (a genuine Reject option), a privacy policy naming TikTok as a data processor, and an ongoing right to withdraw consent. Brian must add a Reject button, a settings-based withdrawal mechanism, and a privacy policy that names TikTok. Fines can reach KES 5,000,000.",
      "Yes — TikTok is exempt from Kenyan law.",
      "Only if the site is in Kiswahili."
    ],
    "correct": 1,
    "explanation": "Slide 8 of §12.2 covers the three DPA 2019 obligations: (1) informed consent banner with accept/reject, (2) a privacy policy naming processors like TikTok, (3) an ongoing right to withdraw. Accept-only is non-compliant. The Office of the Data Protection Commissioner enforces this."
  },
  {
    "scenario": "Brian wants to track a custom feature: a WhatsApp button on every product page that lets shoppers ask him about size in one tap. TikTok has no standard event named for this.",
    "question": "What should he use?",
    "options": [
      "Use ViewContent — it is close enough.",
      "Use TikTok's Contact standard event (fires on messaging button taps) OR a Custom Event with a descriptive name (e.g. \"whatsapp_size_question\"). Custom events cover anything TikTok has no standard template for and can still be used as conversion events in campaigns.",
      "Skip tracking that button entirely.",
      "Use Purchase — every tap counts as a sale."
    ],
    "correct": 1,
    "explanation": "Slide 3 of §12.2 covers standard vs custom events. Contact is a standard event that fits messaging-button taps; anything more specific becomes a Custom Event. Both can be optimisation targets and used in Custom audiences."
  },
  {
    "scenario": "A trainee summarises Lesson 12.2 in one line: \"The Pixel is server-side, the Events API is client-side, event ID deduplication is optional, and Kenya DPA 2019 does not apply to trackers.\"",
    "question": "How many of those four claims are correct?",
    "options": [
      "All four.",
      "Two — the deduplication and DPA parts.",
      "Zero — every claim is wrong.",
      "One — only the Pixel part."
    ],
    "correct": 2,
    "explanation": "Every claim is wrong. The PIXEL is client-side (browser); the EVENTS API is server-side (Slide 4). Event ID deduplication is MANDATORY when running both — otherwise events double-count (Slide 6). And Kenya DPA 2019 explicitly covers IP + browser fingerprint + hashed PII as personal data — trackers absolutely fall under it (Slide 8)."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
