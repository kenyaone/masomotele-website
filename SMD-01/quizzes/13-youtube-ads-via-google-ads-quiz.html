<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Ads via Google Ads | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 13 · Lesson 13.5</div>
            <h1>YouTube Ads via Google Ads</h1>
            <p>10 Sarah Chebet scenarios — 8 formats, objective mapping, KES 15,000 setup</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "Sarah spends 45 minutes hunting through YouTube Studio for a \"Create Ad\" button. She cannot find one.",
    "question": "What is she doing wrong?",
    "options": [
      "YouTube ads have been discontinued.",
      "YouTube Ads do not run from inside YouTube. They run through Google Ads at ads.google.com — the same platform Sarah's Module 9 Search ads use. She creates a Video campaign inside Google Ads and picks one of the 8 YouTube formats. Same login, same billing.",
      "Only Google employees can create YouTube ads.",
      "She needs to install a special YouTube Studio plugin."
    ],
    "correct": 1,
    "explanation": "Slide 2 of §13.5: the single most common beginner mistake. YouTube Ads are a Google Ads campaign type, not a YouTube Studio feature. ads.google.com is the correct entry point."
  },
  {
    "scenario": "Sarah is choosing a first ad format. She wants a format where bad creative costs almost nothing, so she can test before committing more budget.",
    "question": "Which format matches this brief?",
    "options": [
      "Non-skippable 15-second ads.",
      "Skippable in-stream. Viewers see a \"Skip Ad\" button after 5 seconds. Sarah is only charged if the viewer watches 30 seconds, watches the full ad (if shorter), or clicks a CTA. Bad ads get skipped and cost nothing — near risk-free testing.",
      "6-second Bumper ads.",
      "YouTube Masthead."
    ],
    "correct": 1,
    "explanation": "Slide 3 of §13.5: Skippable in-stream charges only after 30-sec watch, full watch, or engagement. Bad ads get skipped for free. Ideal first-format for testing."
  },
  {
    "scenario": "Sarah wants a 6-second brand mnemonic she can run against 100,000 Kenyans as pure brand-recall reinforcement.",
    "question": "Which format is she looking for?",
    "options": [
      "Skippable in-stream at 6 seconds.",
      "Bumper ads. 6 seconds, no skip, CPM-based. Perfect for one message or a mnemonic — Sarah's \"Karibu Kitchen · Eldoret · 30 minutes\". Pure awareness format; no expectation of clicks.",
      "In-feed video ads.",
      "Shorts ads."
    ],
    "correct": 1,
    "explanation": "Slide 4 of §13.5: Bumper ads = 6 sec, no skip, CPM. Designed for a single brand message or mnemonic. Not for clicks."
  },
  {
    "scenario": "Sarah wants her ad to appear as a thumbnail alongside YouTube Search results when someone types \"lunch delivery Eldoret\".",
    "question": "Which format achieves this?",
    "options": [
      "Skippable in-stream.",
      "In-feed video ads (formerly Discovery ads). These are thumbnails in YouTube Search results, Home feed, and the Watch Next column. They look like organic thumbnails with a small \"Ad\" tag. Sarah pays per click — ideal for aligning with search intent.",
      "Bumper ads.",
      "Masthead."
    ],
    "correct": 1,
    "explanation": "Slide 5 of §13.5: in-feed video ads are the search-intent format. Thumbnails in Search + Home + Watch Next, per-click billing, and they surface against typed queries."
  },
  {
    "scenario": "Brian's Chapa Fitness wants to reach Gen-Z Kenyans on the Shorts feed WITHOUT producing three organic Shorts a week to feed the algorithm.",
    "question": "Which format solves this?",
    "options": [
      "In-feed video ads.",
      "Shorts ads. Vertical 9:16 ads that appear between organic Shorts in the Shorts feed. Same look as an organic Short. Great for reaching the Shorts audience without producing a constant organic Shorts cadence.",
      "Non-skippable 15-second ads.",
      "Masthead."
    ],
    "correct": 1,
    "explanation": "Slide 5 of §13.5: Shorts ads let advertisers reach the Shorts audience without having to produce daily organic Shorts. Vertical 9:16, native placement."
  },
  {
    "scenario": "A vendor pitches Sarah a YouTube Masthead ad for KES 900,000 for one day.",
    "question": "Should she buy?",
    "options": [
      "Yes — Masthead is the most cost-effective YouTube ad type.",
      "No. Masthead is the reserved-buy banner at the top of YouTube Home for 24 hours. It is a national-scale FMCG and telco format — Safaricom, Coca-Cola territory. KES 900,000 for one day is 60× Sarah's entire monthly YouTube budget of KES 15,000. Wrong format for her tier.",
      "Yes — one Masthead ad will earn her KES 5 million in orders.",
      "Yes — YouTube caps Masthead price at KES 100/day."
    ],
    "correct": 1,
    "explanation": "Slide 6 of §13.5: Masthead is a reserved buy for national FMCG and telcos. Not for Sarah's KES 15,000/month budget tier."
  },
  {
    "scenario": "Sarah's objective is WhatsApp orders. She wants Google to optimise the campaign toward the action itself.",
    "question": "Which campaign type does this?",
    "options": [
      "Video reach campaign.",
      "Video action campaign. Combines Skippable in-stream + In-feed video ads and lets Google's algorithm optimise for a specific action — click, lead form submission, or purchase. It is the modern default for direct-response advertisers.",
      "Masthead.",
      "Bumper ads."
    ],
    "correct": 1,
    "explanation": "Slide 6 of §13.5: Video action campaigns are the modern direct-response campaign type. Mixes Skippable + In-feed and optimises for the target action."
  },
  {
    "scenario": "A trainee wants to run Bumper ads for a Sales objective, arguing \"they're cheaper per impression\".",
    "question": "What is the professional correction?",
    "options": [
      "The trainee is right — Bumpers are best for Sales.",
      "Objective mapping is the key skill. Bumper ads are 6-second pure awareness with no expectation of clicks. For a Sales objective Sarah needs Skippable in-stream inside a Video action campaign, which optimises for the actual conversion. Never Bumper for conversions. Never Video action for pure reach.",
      "Only Google employees can pick campaign types.",
      "The format does not affect the objective."
    ],
    "correct": 1,
    "explanation": "Slide 7 of §13.5: objective mapping. Bumpers = awareness only. Video action campaigns with Skippable in-stream = the correct sales format. Mismatching format and objective wastes budget."
  },
  {
    "scenario": "For her KES 15,000/month campaign Sarah wants to target only people who have shown recent commercial interest in food delivery services and people typing queries like \"lunch delivery Eldoret\" into Google.",
    "question": "What is the correct targeting stack?",
    "options": [
      "Broad targeting — 18-55, worldwide.",
      "In-market audience for \"food delivery services\" (people currently researching a purchase) PLUS a custom intent audience built from her exact target keywords (\"lunch delivery Eldoret\", \"food delivery Kenya\", \"Karibu Kitchen\"). Location Kenya with an Eldoret bid boost. Age 18-55.",
      "Only lookalike audiences from her Facebook Page.",
      "One single interest: \"cooking\"."
    ],
    "correct": 1,
    "explanation": "Slide 8 of §13.5: Sarah's exact targeting stack — in-market audience + custom intent keywords + Kenya location + Eldoret boost + 18-55 age. In-market signals purchase intent; custom intent captures typed queries."
  },
  {
    "scenario": "A trainee summarises Lesson 13.5 in one line: \"YouTube Ads are created inside YouTube Studio, Bumper ads are 30 seconds long, and Masthead is the cheapest format.\"",
    "question": "How many of those three claims are correct?",
    "options": [
      "All three.",
      "Two — the Bumper and Masthead parts.",
      "Zero — every claim is wrong.",
      "One — only the YouTube Studio part."
    ],
    "correct": 2,
    "explanation": "Every claim is wrong. YouTube Ads are created inside Google Ads at ads.google.com, not YouTube Studio (Slide 2). Bumper ads are 6 seconds, not 30 (Slide 4). Masthead is a reserved-buy top-of-Home banner — one of the most expensive YouTube formats, not the cheapest (Slide 6)."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
