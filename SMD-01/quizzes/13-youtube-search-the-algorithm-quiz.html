<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube as the World's #2 Search Engine | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 13 · Lesson 13.1</div>
            <h1>YouTube as the World's #2 Search Engine</h1>
            <p>10 scenarios — surfaces, algorithm signals, long-tail intent, Sarah + Brian</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "Sarah tells a trainee: \"YouTube is basically a social network like Facebook. People just scroll.\" The trainee is confused because Google keeps recommending YouTube videos when he types how-to questions.",
    "question": "What is the correct professional description of YouTube's role?",
    "options": [
      "YouTube is only a social network — the trainee is imagining the Google results.",
      "YouTube is the world's #2 search engine, behind only Google itself. Over 2.7 billion monthly users, more than 1 billion hours watched per day, and roughly 40% of \"how to\" Google queries surface a YouTube video carousel above written results.",
      "YouTube is a paid-only platform for large brands.",
      "YouTube is a TV network, not a search engine."
    ],
    "correct": 1,
    "explanation": "Slide 2 of §13.1: YouTube is the #2 search engine on Earth, behind only Google. It is a search + discovery + entertainment platform simultaneously — and for how-to queries it also powers Google's own results page."
  },
  {
    "scenario": "Sarah has been posting her 3-minute ugali tutorial to the Karibu Kitchen Facebook Page. Views peak at ~800 in the first 48 hours, then collapse to near zero. She asks why the same video does not \"stay alive\" the way YouTube tutorials seem to.",
    "question": "What is the structural reason?",
    "options": [
      "Facebook secretly deletes old videos.",
      "Facebook is a social feed — discovery is tied to fresh posts inside a friend graph, so decay is fast. YouTube is a search + suggestion platform — discovery is tied to typed queries and Suggested Videos, so an evergreen tutorial keeps collecting views for years.",
      "Sarah's tutorial has a bad title.",
      "Facebook only shows videos to people in Nairobi."
    ],
    "correct": 1,
    "explanation": "Slide 7 of §13.1: Sarah's realisation. Facebook is friend-graph + freshness. YouTube is search + Suggested + Home. A how-to tutorial belongs on YouTube first — it earns discovery for years, not 48 hours."
  },
  {
    "scenario": "Sarah types \"how to make ugali\" into Google from her phone and the first three results are all YouTube videos, sitting above every written recipe blog.",
    "question": "What is the significance for a Kenyan food business?",
    "options": [
      "It is a bug in Google Kenya.",
      "For roughly 40% of \"how to\" queries, Google surfaces a YouTube video carousel above written results. Sarah's YouTube tutorial can therefore rank on Google page one WITHOUT her ranking a single blog page. One upload, two search engines, free traffic from both.",
      "It only happens for logged-out searches.",
      "It only happens on desktop, not mobile."
    ],
    "correct": 1,
    "explanation": "Slide 6 of §13.1: YouTube outranks blog posts for many how-to queries because viewers want to watch, not read. Google knows this and surfaces the video carousel. Sarah gets Google traffic AND YouTube traffic from one upload."
  },
  {
    "scenario": "Sarah keeps hearing \"YouTube is about views\". She uploads a tutorial that gets 10,000 impressions but only 300 clicks and an average watch time of 20 seconds out of 3 minutes.",
    "question": "What is the algorithm's real read on this video?",
    "options": [
      "Success — 10,000 impressions is a huge number.",
      "Poor. Watch time is YouTube's #1 signal, and 20/180 = ~11% average view. Click-through rate is ~3% (300/10,000). Both are weak. YouTube will show it to fewer people, not more. Views alone are not on the ranking signal list.",
      "The 300 clicks alone guarantee promotion.",
      "The algorithm only cares about subscribers."
    ],
    "correct": 1,
    "explanation": "Slide 4 of §13.1 lists the five signals in weight order: watch time (biggest), click-through rate on thumbnail, session watch time, engagement, freshness. Views alone are not a ranking signal. Sarah's video is failing the two biggest levers."
  },
  {
    "scenario": "Sarah is choosing between titling her video \"Ugali recipe\" and \"How to make ugali without lumps step by step\". The second title is much longer.",
    "question": "Which title is stronger and why?",
    "options": [
      "\"Ugali recipe\" — shorter is always better.",
      "\"How to make ugali without lumps step by step\" is a long-tail keyword. Lower search volume, MUCH lower competition, and the viewer has a specific problem. Long-tail is where small Kenyan brands win on YouTube because big global cooking channels ignore niche queries.",
      "Titles do not matter at all on YouTube.",
      "The second title is too long — YouTube will reject it."
    ],
    "correct": 1,
    "explanation": "Slide 5 of §13.1: long-tail intent is the small-brand edge. Short-tail like \"ugali recipe\" is brutal competition. Long-tail like \"how to make ugali without lumps\" is specific, low-competition, and high-intent."
  },
  {
    "scenario": "Brian of Chapa Fitness has been posting 15-second workout clips only to Instagram Reels. A friend tells him \"YouTube is for old people, don't bother\".",
    "question": "What is the correct professional response?",
    "options": [
      "The friend is right — skip YouTube for Gen-Z.",
      "The friend is wrong. YouTube Shorts hit roughly 70 billion daily views globally in 2026 and lives inside every YouTube session — no separate app to grow. Cross-posting Reels to Shorts is a free second Gen-Z audience for zero extra editing. Brian should push every Reel to both.",
      "Instagram is the only place Gen-Z watches vertical video.",
      "Brian should delete his Instagram account."
    ],
    "correct": 1,
    "explanation": "Slide 8 of §13.1: Brian's realisation. Shorts has enormous Gen-Z reach in Kenya as of 2026. Same asset, same 9:16 crop, free second audience. Cross-posting is discipline, not cheating."
  },
  {
    "scenario": "A trainee argues: \"YouTube Home, YouTube Search, Suggested Videos, and the Shorts feed all use the same algorithm.\"",
    "question": "Is this true?",
    "options": [
      "Yes — one YouTube algorithm.",
      "No. They are four distinct discovery surfaces, each with its own algorithm and its own viewer intent. Search rewards long-tail keywords + direct intent. Home rewards personalisation + browse. Suggested rewards session watch time. Shorts rewards entertainment + swipe engagement. Confusing them wastes uploads.",
      "Only Search has an algorithm — the others are random.",
      "Only Shorts has an algorithm."
    ],
    "correct": 1,
    "explanation": "Slide 3 of §13.1: four discovery surfaces, four algorithms, four intents. Sarah's how-to belongs on Search + Suggested. Brian's 15-second clips belong on Shorts. Same platform, different games."
  },
  {
    "scenario": "Sarah is deciding whether to post her \"How to order lunch delivery in Eldoret\" tutorial as long-form (4 minutes) or as a 45-second Short.",
    "question": "For direct-search intent — someone typing that exact query — what is the professional recommendation?",
    "options": [
      "Always post as a Short.",
      "Long-form (4 minutes) for the primary upload — direct-search intent rewards depth, and the video needs to answer the question fully. A 45-second Short can be a secondary teaser that links viewers back to the long-form. Wrong format for direct intent = wasted upload.",
      "Post it as a 2-hour livestream.",
      "Post it as a photo, not a video."
    ],
    "correct": 1,
    "explanation": "Slide 3 + Slide 5 of §13.1: direct-search intent lives on YouTube Search, which rewards depth and watch-time. Shorts serves entertainment discovery, not typed how-to queries. Sarah's 4-minute explainer is the right primary."
  },
  {
    "scenario": "Sarah's cousin says: \"Just chase views. If a video hits 10,000 views, YouTube will push it to a million.\"",
    "question": "What is the correct algorithmic principle?",
    "options": [
      "The cousin is right — views cause more views.",
      "Views alone are not a YouTube ranking signal. Watch time and click-through rate are. A video with 10,000 views but 15% average viewed will die. A video with 2,000 views but 75% average viewed will keep growing. Chase watch time. Views follow.",
      "Views only matter on Shorts.",
      "The algorithm caps every video at 10,000 views."
    ],
    "correct": 1,
    "explanation": "Slide 4 of §13.1: the five signals in weight order — watch time, CTR, session time, engagement, freshness. Views is not on the list. This is the single biggest beginner mistake on YouTube."
  },
  {
    "scenario": "A trainee summarises Lesson 13.1 in one line: \"YouTube has two surfaces, the algorithm's biggest signal is total views, and Kenya has under one million monthly viewers.\"",
    "question": "How many of those three claims are correct?",
    "options": [
      "All three.",
      "Two — the surface count and Kenya audience parts.",
      "Zero — every claim is wrong.",
      "One — only the algorithm part."
    ],
    "correct": 2,
    "explanation": "Every claim is wrong. YouTube has FOUR discovery surfaces — Search, Home, Suggested, Shorts (Slide 3). The biggest algorithm signal is watch time, not total views (Slide 4). Kenya has over 15 million monthly active viewers as of 2026, not under one million (Slide 2)."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
