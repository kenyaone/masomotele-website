<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup + Verification | MTTI Digital Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 14 · Lesson 14.2</div>
            <h1>Setup + Verification</h1>
            <p>10 Sarah Chebet scenarios — signup, categories, address, verification</p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "scenario": "Sarah is about to sign in at business.google.com and asks which Gmail she should use — her personal Gmail or a business one.",
    "question": "What is the right choice, and why?",
    "options": [
      "Her personal Gmail is fine — Google does not care which account owns the profile.",
      "A dedicated business Gmail (e.g. sarah@karibukitchen.co.ke or karibukitchen.eldoret@gmail.com). The signing account owns the profile forever; using a business account survives staff changes, keeps personal life separate, and lets ownership be transferred cleanly later.",
      "Any random Gmail, it does not matter.",
      "Her cousin's Gmail — for redundancy."
    ],
    "correct": 1,
    "explanation": "Slide 2 of §14.2: use the Gmail that will manage the profile forever. A business Gmail (not personal) is the durable choice — it survives staff changes and separates personal life from business ownership."
  },
  {
    "scenario": "Sarah types \"Karibu Kitchen — Best Lunch Delivery Eldoret Cheap Fast Reliable\" into the business name field.",
    "question": "What is wrong with this, and what should she type instead?",
    "options": [
      "Nothing — keyword stuffing helps ranking.",
      "Keyword stuffing in the name field is a GBP policy violation and can lead to suspension. She must type only \"Karibu Kitchen\" — the exact trading name on the signboard, invoices and the Kapsoya kitchen door.",
      "She should also add her home village.",
      "The name must be in Swahili only."
    ],
    "correct": 1,
    "explanation": "Slide 2 is explicit: no keyword stuffing. Business name = exact trading name. Keyword stuffing violates GBP policy."
  },
  {
    "scenario": "Sarah's business is 90% lunch delivery and 10% collection at the Kapsoya kitchen. She must pick a primary category and up to 9 additional categories.",
    "question": "What is the correct configuration?",
    "options": [
      "Primary: Restaurant. Additional: Meal delivery service, Caterer, African restaurant.",
      "Primary: Meal delivery service. Additional: Restaurant, Caterer, African restaurant, Delivery service — only categories she truly serves.",
      "Primary: Wedding venue. Additional: Nightclub, Bar, Casino.",
      "Only one category — leave the other slots empty."
    ],
    "correct": 1,
    "explanation": "Slide 3: primary category is the strongest Relevance signal, so it must match the searcher's intent — \"Meal delivery service\". Additional categories add reach, but only ones the business truly offers. False categories = policy violation."
  },
  {
    "scenario": "Google asks: \"Do customers visit your business at your address?\" Sarah's kitchen accepts a small number of walk-in pickups, but 90% of orders are delivered.",
    "question": "What is the best address setup for Karibu Kitchen?",
    "options": [
      "Service-area only (address hidden) — because delivery is the majority.",
      "Physical address only — because a kitchen exists.",
      "Hybrid: list the physical Kapsoya kitchen address AND set a delivery service area covering Eldoret CBD, Kapsoya, Elgon View, Racecourse and Pioneer.",
      "Leave the address blank."
    ],
    "correct": 2,
    "explanation": "Slide 4: hybrid best fits Sarah's situation. The kitchen address (walk-ins possible) plus a service area for delivery estates. Extends Distance reach without hiding the physical kitchen."
  },
  {
    "scenario": "Sarah enters her personal Safaricom SIM as the business phone because \"it is easier than issuing a new one\".",
    "question": "Why is this a mistake for a professional GBP setup?",
    "options": [
      "It is not a mistake — one number is enough.",
      "NAP consistency (Name, Address, Phone) is a direct Google trust signal. The phone must be a dedicated business number that matches the number on the website, Facebook Page and WhatsApp Business profile. A personal SIM breaks NAP consistency and mixes personal calls with business calls.",
      "Safaricom is not supported by Google.",
      "Sarah should use a Kenyan landline only."
    ],
    "correct": 1,
    "explanation": "Slide 5: NAP consistency is a trust signal. Dedicated business number, matching everywhere — GBP, website, Facebook, WhatsApp Business. Personal SIM breaks that signal."
  },
  {
    "scenario": "Sarah is offered five ways to verify Karibu Kitchen.",
    "question": "Which set of five matches Lesson 14.2?",
    "options": [
      "Postcard, phone, email, video, Search Console.",
      "Facebook login, Twitter DM, Instagram tag, TikTok comment, LinkedIn message.",
      "Bank statement, passport, fingerprint, DNA test, iris scan.",
      "Only postcard — no other method exists."
    ],
    "correct": 0,
    "explanation": "Slide 6 lists the five methods: postcard (~2 weeks), phone (instant, some categories), email (instant, when domain matches), video (5-min recording, common in Kenya), Search Console (instant, if domain already verified)."
  },
  {
    "scenario": "Sarah's options are: postcard (available, slow), phone (not offered for her category), email (not offered because her Gmail domain does not match karibukitchen.co.ke), video (available), Search Console (available — Lesson 9.6 already verified the domain).",
    "question": "Which method should she pick?",
    "options": [
      "Postcard — because it is the most common globally.",
      "Search Console — instant, and Lesson 9.6 already earned her the shortcut. Take the fastest method available.",
      "Wait until phone verification becomes available.",
      "Do not verify — it is optional."
    ],
    "correct": 1,
    "explanation": "Slide 7: Sarah has two open options — video and Search Console. Search Console is instant and she already owns the domain proof, so it wins. Rule: take the fastest available method."
  },
  {
    "scenario": "A trainee asks: \"What does 'video verification' actually mean?\"",
    "question": "Which description matches Lesson 14.2?",
    "options": [
      "Sarah appears on Google's live TV channel.",
      "A five-minute recording of the physical location plus signage — increasingly common in Kenya. The video proves the business exists at the claimed address.",
      "A short YouTube ad.",
      "A phone call with a Google agent."
    ],
    "correct": 1,
    "explanation": "Slide 6 defines video verification: 5-minute recording of location + signage, increasingly common in Kenya. It is one of the five methods, alongside postcard, phone, email and Search Console."
  },
  {
    "scenario": "Verification completes. Sarah asks what changes at that exact moment.",
    "question": "Which trio matches Lesson 14.2?",
    "options": [
      "Nothing changes for two weeks.",
      "The listing goes live on Search, Maps and the knowledge panel simultaneously; the Business Profile Manager dashboard unlocks (Insights, Reviews, Posts, Q&A, Photos, Products, Services); ranking begins — Relevance, Distance and Prominence are measured in real time from that moment.",
      "Sarah receives a KES 5,000 Google Ads credit.",
      "Her personal Facebook is disabled."
    ],
    "correct": 1,
    "explanation": "Slide 8 lists exactly this trio. Verification is the switch that turns a draft profile into a live, ranking listing across all three GBP surfaces, unlocks the full dashboard, and starts ranking measurement."
  },
  {
    "scenario": "A trainee summarises §14.2 as: \"You must use postcard verification, you can pick unlimited categories, and business name should include your top keywords.\"",
    "question": "How many of the three claims are correct?",
    "options": [
      "All three.",
      "Two.",
      "Zero — every claim is wrong.",
      "One — only the categories part."
    ],
    "correct": 2,
    "explanation": "Every claim is wrong. Postcard is one of FIVE methods, not required (Slide 6). Categories are capped at ONE primary + up to 9 additional (Slide 3). Business name = exact trading name — keyword stuffing is a policy violation (Slide 2)."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
