<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching Shots for a Consistent Look | MTTI Video Editing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg,#6A11CB 0%,#2575FC 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f7971e 0%, #ffd200 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #eef2ff; border-color: #2575FC; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg,#6A11CB 0%,#2575FC 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #2575FC; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        /* How-To intro screen — shown before question 1, not scored */
        .howto-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .howto-card h3 { font-family: 'Fredoka', sans-serif; font-size: 1.3em; margin-bottom: 12px; color: #2575FC; }
        .howto-card p { line-height: 1.6; margin-bottom: 16px; color: #444; }
        .howto-fields { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
        .howto-field { background: #f5f7fb; border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; }
        .howto-field label { font-weight: 700; font-size: 0.95em; flex: 1; }
        .howto-field input { width: 90px; padding: 8px 10px; border-radius: 8px; border: 2px solid #ccd6f0; font-family: 'Space Mono', monospace; font-size: 1em; text-align: center; }
        .howto-field input.hf-correct { border-color: #28a745; background: #d4edda; }
        .howto-field input.hf-wrong { border-color: #dc3545; background: #f8d7da; }
        .howto-field .hf-status { font-size: 0.85em; font-weight: 700; min-width: 60px; text-align: right; }
        .howto-banner { margin-top: 4px; margin-bottom: 18px; padding: 12px 16px; border-radius: 10px; font-size: 0.9em; font-weight: 700; display: none; }
        .howto-banner.show { display: block; }
        .howto-banner.ok { background: #d4edda; color: #155724; }
        .howto-banner.fail { background: #f8d7da; color: #721c24; }
        .start-quiz-btn { margin-top: 4px; background: linear-gradient(135deg,#6A11CB 0%,#2575FC 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 4 · Lesson 4.3 · Quiz</div>
            <h1>Matching Shots for a Consistent Look</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"Otieno cuts between two individually well-corrected clips in the same scene, and the client says the cut 'feels off' even though neither clip looks wrong on its own.","question":"What is the most likely explanation?","options":["One of the clips must be corrupted","The two shots are mismatched relative to each other, even though each looks fine individually","The client is simply mistaken and nothing is wrong","Audio levels are the only thing that can cause a cut to feel off"],"correct":1,"explanation":"A viewer often perceives a mismatch between two shots even when each is individually fine, because the eye compares adjacent shots in a sequence."},{"scenario":"Otieno picks one shot to serve as the reference for a promo mixing two cameras.","question":"What should he do with that reference shot's Exposure and Temp values?","options":["Ignore them; every shot should be corrected independently with no shared target","Note them, and adjust the other shots toward matching those same values","Reference values only matter for audio syncing","Delete the reference shot's values after selecting it"],"correct":1,"explanation":"The reference shot's values become the shared target that every other shot in the same sequence is adjusted toward."},{"scenario":"Camera B's footage, after correction, reads Exposure +2 and Temp +7, while the reference (Camera A) reads Exposure 0 and Temp +5.","question":"Is this considered an acceptable match within a roughly \u00b15 tolerance?","options":["No, any difference at all is unacceptable","Yes, both values are within about \u00b15 of the reference, which is close enough for the shots to read as matching","It cannot be judged without knowing the file size","Only Exposure matters; Temp differences are never acceptable"],"correct":1,"explanation":"A difference of 2 on Exposure and 2 on Temp both fall comfortably within a \u00b15 tolerance, which is the accepted standard for a perceived match."},{"scenario":"Otieno tries to get Camera B's values to match Camera A's reference exactly, down to the last unit, spending a long time chasing a perfect number.","question":"Is this the recommended approach?","options":["Yes, an exact match is always required and achievable","No, working within a small tolerance is standard, since different cameras render color differently and an exact match is rarely realistic or necessary","No, matching should never be attempted between different cameras","Yes, but only for Temp, never for Exposure"],"correct":1,"explanation":"Because different cameras and lenses render slightly differently, chasing an exact match is usually unrealistic; working within a small tolerance achieves a perceived match efficiently."},{"scenario":"Otieno corrects Camera B's raw exposure and white balance problems, then separately adjusts it further to match Camera A's reference values.","question":"What does this show about the relationship between correction and matching?","options":["Matching replaces the need for individual correction entirely","Matching is a separate step that happens on top of individual correction, not instead of it","Correction and matching are the same single step with no distinction","Matching should always happen before correction"],"correct":1,"explanation":"Individual correction fixes each clip's own problems first; matching is an additional step layered on top so multiple corrected clips also align with each other."},{"scenario":"A new clip, Camera C, reads Exposure +12 and Temp -8, while the reference (Camera A) reads Exposure 0 and Temp +5.","question":"What correction direction does Camera C need to move toward the reference?","options":["Exposure should be raised further, and Temp should be cooled further","Exposure should be lowered (it reads too bright), and Temp should be warmed up (it reads too cool)","No correction is needed since Camera C looks fine on its own","Only Exposure needs adjusting; Temp differences don't matter for matching"],"correct":1,"explanation":"Camera C is brighter and cooler than the reference, so matching means lowering its Exposure and warming its Temp back toward the reference values."},{"scenario":"Otieno finishes matching Camera B to Camera A and wants to confirm the match actually works before finalising the edit.","question":"What is a sound way to confirm the match?","options":["Trust the numbers alone and never actually watch the clips together","Preview the two shots side by side or back to back to visually confirm they read as consistent","Export the whole video immediately without previewing","Ask the client to guess which camera shot which clip"],"correct":1,"explanation":"A side-by-side or back-to-back preview is the practical way to confirm that numeric matching actually translates into a visually consistent cut."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '&#9989; Correct.' : '&#10060; Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '\u{1F31F}', msg = 'Excellent work. Otieno-level color grading know-how.';
            if (pct < 50) { badge = '\u{1F331}'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '\u{1F4DA}'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> &middot; Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again &#128257;</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }
        /* How-To intro — a small, ungraded field-check demo shown before the
           quiz starts, directly rehearsing the "adjust a clip's Exposure and
           Temp toward the reference camera, within tolerance" mechanic that
           one of the quiz scenarios asks about, so it's not being asked cold. */
        const HOWTO_FIELDS = [
            { id: 'howtoExposure', label: 'Exposure', placeholder: 'target 0', target: 0, tolerance: 5 },
            { id: 'howtoTemp', label: 'Temp', placeholder: 'target +5', target: 5, tolerance: 5 },
        ];

        function checkHowtoField(rule) {
            const el = document.getElementById(rule.id);
            const raw = el.value.trim();
            if (raw === '' || isNaN(Number(raw))) return null;
            const v = Number(raw);
            return Math.abs(v - rule.target) <= rule.tolerance;
        }

        function checkHowto() {
            let allOk = true, allAnswered = true;
            HOWTO_FIELDS.forEach(rule => {
                const ok = checkHowtoField(rule);
                const el = document.getElementById(rule.id);
                const status = document.getElementById(rule.id + '_status');
                el.classList.remove('hf-correct', 'hf-wrong');
                if (ok === null) { allAnswered = false; status.textContent = ''; return; }
                el.classList.add(ok ? 'hf-correct' : 'hf-wrong');
                status.textContent = ok ? '✅ matched' : '❌ off';
                if (!ok) allOk = false;
            });
            const banner = document.getElementById('howtoBanner');
            banner.classList.add('show');
            if (!allAnswered) {
                banner.className = 'howto-banner show fail';
                banner.textContent = '❌ Enter a number in both fields first.';
                return;
            }
            banner.className = 'howto-banner show ' + (allOk ? 'ok' : 'fail');
            banner.textContent = allOk
                ? '✅ Within ±5 of the reference on both — that reads as a match.'
                : '❌ Not yet — get both values within ±5 of Camera A\'s Exposure 0 and Temp +5.';
        }

        function renderHowto() {
            document.getElementById('exerciseCard').innerHTML = `
                <div class="howto-card">
                    <h3>🔍 Quick How-To: Matching a Clip to the Reference</h3>
                    <p>One of the scenarios coming up asks how far off a clip can be from the reference camera and still count as a match. Camera A (the reference) reads Exposure 0 and Temp +5. A new clip, Camera D, comes in reading Exposure +9 and Temp -6 &mdash; too bright and too cool. Enter corrected Exposure and Temp values for Camera D that land within the accepted &plusmn;5 tolerance of the reference, then check your match.</p>
                    <div class="howto-fields" id="howtoFields"></div>
                    <div class="howto-banner" id="howtoBanner"></div>
                    <button class="start-quiz-btn" id="checkHowtoBtn">Check My Settings</button>
                    <button class="start-quiz-btn" id="startQuizBtn" style="margin-left:10px;background:linear-gradient(135deg,#28a745,#1e7e34);">Start Quiz →</button>
                </div>`;
            document.getElementById('howtoFields').innerHTML = HOWTO_FIELDS.map(f => `
                <div class="howto-field">
                    <label for="${f.id}">${f.label}</label>
                    <input type="number" id="${f.id}" placeholder="${f.placeholder}">
                    <span class="hf-status" id="${f.id}_status"></span>
                </div>`).join('');
            document.getElementById('checkHowtoBtn').addEventListener('click', checkHowto);
            document.getElementById('startQuizBtn').addEventListener('click', renderQuestion);
        }

        renderHowto();
    </script>
</body>
</html>
