<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adding and Trimming Background Music | MTTI Video Editing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #2b0b5e 0%, #1a1a4b 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f7971e 0%, #ffd200 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #eef1fb; border-color: #2b0b5e; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #2b0b5e 0%, #1a1a4b 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #2b0b5e; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
    
        /* How-To intro screen — shown before question 1, not scored */
        .howto-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .howto-card h3 { font-family: 'Fredoka', sans-serif; font-size: 1.3em; margin-bottom: 12px; color: #2b0b5e; }
        .howto-card p { line-height: 1.6; margin-bottom: 16px; color: #444; }
        .howto-fields { display: flex; flex-direction: column; gap: 16px; margin-bottom: 18px; }
        .howto-field { background: #f5f7fb; border-radius: 12px; padding: 16px 18px; }
        .howto-field label { display: block; font-weight: 700; margin-bottom: 8px; color: #333; font-family: 'Fredoka', sans-serif; }
        .howto-field .hf-hint { font-size: 0.82em; color: #777; margin-bottom: 8px; }
        .howto-field input { width: 100%; max-width: 220px; padding: 10px 14px; border-radius: 8px; border: 2px solid #ccc; font-family: 'Space Mono', monospace; font-size: 1em; }
        .howto-field input.hf-correct { border-color: #28a745; background: #d4edda; }
        .howto-field input.hf-wrong { border-color: #dc3545; background: #f8d7da; }
        .howto-field .hf-result { margin-top: 8px; font-size: 0.85em; font-weight: 700; min-height: 1.1em; }
        .howto-field .hf-result.ok { color: #155724; }
        .howto-field .hf-result.fail { color: #721c24; }
        .howto-banner { margin-top: 4px; margin-bottom: 18px; padding: 12px 16px; border-radius: 10px; font-size: 0.9em; font-weight: 700; display: none; }
        .howto-banner.show { display: block; }
        .howto-banner.ok { background: #d4edda; color: #155724; }
        .howto-banner.fail { background: #f8d7da; color: #721c24; }
        .start-quiz-btn { margin-top: 4px; background: linear-gradient(135deg, #2b0b5e 0%, #1a1a4b 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Audio Editing · Topic 1 · Quiz</div>
            <h1>Adding and Trimming Background Music</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"Otieno wants to add music to a client's Reel without risking a copyright strike or a muted post on Instagram.","question":"Where should he pull the track from?","options":["Extract audio from a downloaded music video he found online","CapCut's built-in Sounds library, which offers commercially-cleared tracks","Record the song playing from a speaker using his phone's microphone","It doesn't matter \u2014 any audio source works fine for social platforms"],"correct":1,"explanation":"CapCut's built-in sound library is cleared for use on platforms like Instagram and TikTok, unlike audio pulled from someone else's copyrighted video."},{"scenario":"Otieno has a 25-second track for an 8-second WhatsApp Status clip, and the song's best drop happens 10 seconds into the track.","question":"Where should he set the trim-in point so the drop lines up with the start of the clip?","options":["0 seconds","5 seconds","10 seconds","15 seconds"],"correct":2,"explanation":"Setting the trim-in point at the 10-second mark, where the drop occurs, means the clip opens right on the track's most energetic moment."},{"scenario":"After trimming a track to exactly match his video's length, Otieno notices the music just stops abruptly at the very last frame, with an audible hard cut.","question":"What is missing from his edit?","options":["A fade-out at the end of the trimmed clip","A second overlapping music track","A louder volume setting","A Zoom transition on the video"],"correct":0,"explanation":"A hard stop with no fade-out is exactly what a missing fade-out sounds like \u2014 adding a short fade before the trim-out point fixes it."},{"scenario":"A stray honking-car sound sits in the middle of an otherwise good 30-second track, not at either end.","question":"What is the correct way for Otieno to remove just that middle section without leaving a silent gap?","options":["Trim the start and end handles of the whole clip","Use the Split tool to cut on both sides of the honk, delete that piece, then ripple delete to close the gap","Lower the volume of the entire track to hide the honk","Re-record the whole track from scratch"],"correct":1,"explanation":"Splitting on either side of the unwanted section, deleting it, and then ripple deleting closes the gap so the remaining audio plays continuously with no silent hole."},{"scenario":"Otieno sets a fade-out of 9 seconds on a music clip that is only 12 seconds long after trimming.","question":"What is the likely effect of this fade-out setting?","options":["No effect \u2014 fade-out duration never impacts how a clip sounds","The music will sound like it's dying out for most of the clip, since the fade eats into 9 of its 12 seconds","The video will automatically get longer to fit the fade","CapCut will reject any fade-out longer than 2 seconds"],"correct":1,"explanation":"A fade-out that long relative to the clip means the volume is dropping for most of the track's run time, rather than ending crisply in just the last second or two."},{"scenario":"Otieno is finishing a promo clip in Canva's Video editor instead of CapCut, and wants the music to fade out cleanly before the trim-out point.","question":"Where does he set that in Canva's Video editor?","options":["There is no fade control in Canva's Video editor","The audio settings panel's Fade in \/ Fade out duration fields, same idea as CapCut's fade handles","Only in the export settings after the video is finished","By manually drawing a fade curve with the pen tool"],"correct":1,"explanation":"Canva's Video editor offers Fade in \/ Fade out duration fields in its audio settings panel, giving the same control CapCut offers through its fade handles or Volume settings."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '&#9989; Correct.' : '&#10060; Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. Otieno-level audio-editing know-how.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> &middot; Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again &#128257;</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }
        
        /* How-To intro — a small, ungraded field-check demo shown before the
           quiz starts, directly rehearsing the mechanic one of the quiz
           scenarios asks about, so it's not being asked cold. */
        const HOWTO_FIELDS = [
            { id: 'trimIn', label: 'Trim-in point (seconds)', hint: 'Where the riff starts in the 18-second jingle.', placeholder: 'e.g. 5', okText: 'Trim-in lines up with the riff — the Reel opens right on the hook.', failText: 'Not lined up yet — the riff starts at 13 seconds into the track.' },
        ];
        const HOWTO_RULES = {
            trimIn: {op:'eq',value:13},
        };

        function howtoApplyOp(op, actual, rule) {
            if (op === 'eq') return Math.abs(actual - rule.value) < 0.001;
            if (op === 'gte') return actual >= rule.value;
            if (op === 'lte') return actual <= rule.value;
            if (op === 'range') return actual >= rule.min && actual <= rule.max;
            return false;
        }

        function checkHowto() {
            let allOk = true;
            HOWTO_FIELDS.forEach(f => {
                const input = document.getElementById('howto_' + f.id);
                const raw = input.value.trim();
                const val = parseFloat(raw);
                const rule = HOWTO_RULES[f.id];
                const ok = raw !== '' && !isNaN(val) && howtoApplyOp(rule.op, val, rule);
                input.classList.remove('hf-correct', 'hf-wrong');
                input.classList.add(ok ? 'hf-correct' : 'hf-wrong');
                const resultEl = document.getElementById('howto_result_' + f.id);
                resultEl.className = 'hf-result ' + (ok ? 'ok' : 'fail');
                resultEl.textContent = (ok ? '✅ ' : '❌ ') + (ok ? f.okText : f.failText);
                if (!ok) allOk = false;
            });
            const banner = document.getElementById('howtoBanner');
            banner.classList.add('show');
            banner.className = 'howto-banner show ' + (allOk ? 'ok' : 'fail');
            banner.textContent = allOk ? '✅ Nailed it — that\'s exactly how it works on the real timeline: drag the trim-in handle to 13s and the riff plays from frame one.' : '❌ Not quite yet — adjust the trim-in point to match the 13-second mark, then check again.';
        }

        function renderHowto() {
            const fieldsHtml = HOWTO_FIELDS.map(f => `
                <div class="howto-field">
                    <label for="howto_${f.id}">${f.label}</label>
                    <div class="hf-hint">${f.hint}</div>
                    <input type="number" step="any" id="howto_${f.id}" placeholder="${f.placeholder}">
                    <div class="hf-result" id="howto_result_${f.id}"></div>
                </div>`).join('');
            document.getElementById('exerciseCard').innerHTML = `
                <div class="howto-card">
                    <h3>🔍 Quick How-To: Setting a Trim-In Point</h3>
                    <p>One of the scenarios coming up asks you to line up a track's best moment with the start of a clip. Here's the mechanic: press and hold the music clip's left edge, then drag the trim-in handle to the exact second you want playback to start (below, just type the second value instead of dragging). Otieno has an 18-second jingle for a 6-second product Reel — the catchiest riff kicks in at the <strong>13-second</strong> mark. Set the trim-in point so the Reel opens right on that riff, then check your setting.</p>
                    <div class="howto-fields">${fieldsHtml}</div>
                    <div class="howto-banner" id="howtoBanner"></div>
                    <button class="start-quiz-btn" id="checkHowtoBtn">Check My Settings</button>
                    <button class="start-quiz-btn" id="startQuizBtn" style="margin-left:10px;background:linear-gradient(135deg,#28a745,#1e7e34);">Start Quiz →</button>
                </div>`;
            document.getElementById('checkHowtoBtn').addEventListener('click', checkHowto);
            document.getElementById('startQuizBtn').addEventListener('click', renderQuestion);
        }

        renderHowto();
    </script>
</body>
</html>
