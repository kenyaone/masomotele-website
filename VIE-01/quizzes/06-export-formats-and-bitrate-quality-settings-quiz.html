<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Formats and Bitrate/Quality Settings | MTTI Video Editing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #2b0a4a 0%, #1b3a8c 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f7971e 0%, #ffd200 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #eef1fb; border-color: #2b0a4a; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #2b0a4a 0%, #1b3a8c 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #2b0a4a; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }

        /* How-To intro screen — shown before question 1, not scored */
        .howto-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .howto-card h3 { font-family: 'Fredoka', sans-serif; font-size: 1.3em; margin-bottom: 12px; color: #2b0a4a; }
        .howto-card p { line-height: 1.6; margin-bottom: 16px; color: #444; }
        .howto-fields { display: flex; flex-direction: column; gap: 14px; background: #f5f7fb; border-radius: 12px; padding: 18px; margin-bottom: 18px; }
        .howto-field-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .howto-field-label { flex: 0 0 210px; font-weight: 700; font-size: 0.92em; }
        .howto-field-input { flex: 1; min-width: 140px; padding: 9px 12px; border-radius: 8px; border: 2px solid #ccc; font-family: 'Space Mono', monospace; font-size: 0.95em; background: #fff; color: #333; }
        .howto-field-input:focus { outline: none; border-color: #2b0a4a; }
        .howto-field-result { width: 26px; text-align: center; font-size: 1.15em; }
        .howto-banner { margin-top: 4px; margin-bottom: 18px; padding: 12px 16px; border-radius: 10px; font-size: 0.9em; font-weight: 700; display: none; }
        .howto-banner.show { display: block; }
        .howto-banner.ok { background: #d4edda; color: #155724; }
        .howto-banner.fail { background: #f8d7da; color: #721c24; }
        .start-quiz-btn { margin-top: 4px; background: linear-gradient(135deg, #2b0a4a 0%, #1b3a8c 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Exporting & Rendering · Lesson 2 · Quiz</div>
            <h1>Export Formats and Bitrate/Quality Settings</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"Otieno is choosing an export format for a clip he needs to send to a client's phone over WhatsApp.","question":"Which format is the safest, most compatible default?","options":["MOV (ProRes), since it's always the highest quality option","MP4 (H.264), since it plays back reliably almost everywhere including WhatsApp","A RAW, uncompressed file","Format doesn't matter as long as the resolution is high"],"correct":1,"explanation":"MP4 using H.264 encoding is the standard, most widely compatible format for delivery to a client's phone or messaging app."},{"scenario":"A client asks Otieno what bitrate actually controls in his exported video.","question":"What is the best explanation?","options":["Bitrate only affects audio, never video","Bitrate is how much data is used to encode each second of video \u2014 higher bitrate preserves more detail but produces a larger file","Bitrate determines the video's frame rate","Bitrate has no effect on file size or quality"],"correct":1,"explanation":"Bitrate directly trades off visual detail against file size: more data per second (higher bitrate) means better preserved detail but a bigger file."},{"scenario":"Otieno needs to send a promo video to a client fast over WhatsApp on a limited data bundle.","question":"What export choice best fits that need?","options":["Highest possible bitrate and 4K resolution, regardless of file size","A lower bitrate and a moderate resolution like 720p, to keep the file small and quick to send","MOV format at maximum quality","Exporting is unnecessary \u2014 send the raw project file instead"],"correct":1,"explanation":"A smaller, lower-bitrate export at a moderate resolution loads and sends faster over mobile data, which is exactly what a WhatsApp delivery under a data budget needs."},{"scenario":"Otieno is preparing the same finished edit for a YouTube upload instead of a WhatsApp send.","question":"How should his approach to bitrate and resolution change for YouTube?","options":["Use the same low-bitrate settings as WhatsApp, since smaller is always better","Increase resolution and bitrate, since YouTube re-encodes the upload anyway and rewards more source detail with a sharper result","Bitrate and resolution are irrelevant to YouTube uploads","Export at 240p to save upload time"],"correct":1,"explanation":"Since YouTube isn't limited by a strict file-size cap and re-encodes uploads on its own servers, giving it a higher-bitrate, higher-resolution source file produces a sharper final result."},{"scenario":"A client asks why their exported video looks blocky and blurry in fast-motion scenes, after Otieno set a very low bitrate to keep the file tiny.","question":"What is the most likely cause?","options":["The camera used to film it was faulty","A bitrate that's too low for the amount of motion in the scene, causing visible compression artifacts","The video format (MP4 vs MOV) is always the cause of blockiness","Frame rate mismatch is the only possible explanation"],"correct":1,"explanation":"Fast-motion and busy scenes need more data per second to encode cleanly \u2014 too low a bitrate for that content shows up as blocky or blurry compression artifacts."},{"scenario":"Otieno is deciding between MP4 (H.264) and MP4 (H.265\/HEVC) for a client delivery.","question":"What is a fair trade-off to consider about H.265\/HEVC?","options":["H.265 can produce a similar-quality file at a smaller size, but isn't as universally supported on older devices and apps as H.264","H.265 is never usable for any delivery","H.265 always looks worse than H.264 at the same file size","There is no practical difference between the two formats"],"correct":0,"explanation":"H.265\/HEVC's efficiency advantage (smaller files at similar quality) comes with a compatibility trade-off, since not every device or platform supports it as reliably as the near-universal H.264."},{"scenario":"Otieno wants a simple rule of thumb for choosing format and bitrate\/quality across all his client deliveries.","question":"Which statement best summarises a sound approach?","options":["Always use the maximum bitrate and resolution regardless of destination","Pick format and bitrate\/quality around where the video is going: smaller and more compressed for a fast WhatsApp send, higher quality and bitrate for a YouTube upload where size isn't the limiting factor","Bitrate and format choices don't matter as long as the edit itself is good","Always use the smallest possible file for every destination"],"correct":1,"explanation":"The core lesson is matching export settings to the destination's real constraints \u2014 file-size sensitive for WhatsApp, quality-first for YouTube \u2014 rather than using one setting everywhere."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '&#9989; Correct.' : '&#10060; Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. Otieno-level export know-how.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> &middot; Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again &#128257;</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }

        /* How-To intro — a small, ungraded field-check demo shown before
           the quiz starts, directly rehearsing the export-setting mechanic
           that one of the quiz scenarios asks about, so it's not being
           asked cold. */
        const HOWTO_FIELDS = [
            { id: 'howtoBitrate', label: 'Bitrate (Mbps)', type: 'number', start: 20 },
            { id: 'howtoRes', label: 'Export Resolution', type: 'select', options: ['480p', '720p', '1080p', '4K'], start: '4K' }
        ];
        const HOWTO_RULES = [
            { id: 'howtoBitrate', op: 'lte', target: 8 },
            { id: 'howtoRes', op: 'eq', target: '720p' }
        ];

        function renderHowtoFields() {
            document.getElementById('howtoFields').innerHTML = HOWTO_FIELDS.map(f => {
                if (f.type === 'select') {
                    const opts = f.options.map(o => `<option value="${o}" ${o === f.start ? 'selected' : ''}>${o}</option>`).join('');
                    return `<div class="howto-field-row"><label class="howto-field-label" for="${f.id}">${f.label}</label><select class="howto-field-input" id="${f.id}">${opts}</select><span class="howto-field-result" id="${f.id}_result"></span></div>`;
                }
                return `<div class="howto-field-row"><label class="howto-field-label" for="${f.id}">${f.label}</label><input class="howto-field-input" type="number" id="${f.id}" value="${f.start}"><span class="howto-field-result" id="${f.id}_result"></span></div>`;
            }).join('');
        }

        function applyHowtoOp(op, val, target) {
            if (op === 'eq') return String(val) === String(target);
            if (op === 'lte') return parseFloat(val) <= parseFloat(target);
            if (op === 'gte') return parseFloat(val) >= parseFloat(target);
            return false;
        }

        function checkHowto() {
            let allOk = true;
            HOWTO_RULES.forEach(r => {
                const el = document.getElementById(r.id);
                const ok = applyHowtoOp(r.op, el.value, r.target);
                if (!ok) allOk = false;
                const resultEl = document.getElementById(r.id + '_result');
                resultEl.textContent = ok ? '✅' : '❌';
            });
            const banner = document.getElementById('howtoBanner');
            banner.classList.add('show');
            banner.className = 'howto-banner show ' + (allOk ? 'ok' : 'fail');
            banner.textContent = allOk
                ? '✅ Nailed it — that\'s exactly the setting to use here.'
                : '❌ Not quite yet — adjust the highlighted field(s) and check again.';
        }

        function renderHowto() {
            document.getElementById('exerciseCard').innerHTML = `
                <div class="howto-card">
                    <h3>🔍 Quick How-To: Picking Export Settings for the Destination</h3>
                    <p>One of the scenarios coming up asks about exactly this. Otieno needs to send a shop promo to a client fast over <strong>WhatsApp, on a limited data bundle</strong>. A big, high-bitrate file just wastes everyone's time and data. Dial in a bitrate and resolution that actually fit a fast WhatsApp send below, then check your work.</p>
                    <div class="howto-fields" id="howtoFields"></div>
                    <div class="howto-banner" id="howtoBanner"></div>
                    <button class="start-quiz-btn" id="checkHowtoBtn">Check My Settings</button>
                    <button class="start-quiz-btn" id="startQuizBtn" style="margin-left:10px;background:linear-gradient(135deg,#28a745,#1e7e34);">Start Quiz →</button>
                </div>`;
            renderHowtoFields();
            document.getElementById('checkHowtoBtn').addEventListener('click', checkHowto);
            document.getElementById('startQuizBtn').addEventListener('click', renderQuestion);
        }

        renderHowto();
    </script>
</body>
</html>
