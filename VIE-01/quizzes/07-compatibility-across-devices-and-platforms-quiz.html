<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compatibility Across Devices and Platforms | MTTI Video Editing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #6A11CB 0%, #2575FC 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f7971e 0%, #ffd200 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #eef6fb; border-color: #2575FC; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #6A11CB 0%, #2575FC 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #2575FC; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }

        /* How-To intro screen — shown before question 1, not scored */
        .howto-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .howto-card h3 { font-family: 'Fredoka', sans-serif; font-size: 1.3em; margin-bottom: 12px; color: #2575FC; }
        .howto-card p { line-height: 1.6; margin-bottom: 16px; color: #444; }
        .howto-banner { margin-top: 4px; margin-bottom: 18px; padding: 12px 16px; border-radius: 10px; font-size: 0.9em; font-weight: 700; display: none; }
        .howto-banner.show { display: block; }
        .howto-banner.ok { background: #d4edda; color: #155724; }
        .howto-banner.fail { background: #f8d7da; color: #721c24; }
        .start-quiz-btn { margin-top: 4px; background: linear-gradient(135deg, #6A11CB 0%, #2575FC 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .howto-timeline { display: flex; gap: 6px; background: #0f0f18; border-radius: 12px; padding: 12px; margin-bottom: 18px; overflow-x: auto; }
        .howto-clip { flex-shrink: 0; min-width: 78px; border-radius: 8px; padding: 10px 10px 8px; display: flex; flex-direction: column; justify-content: space-between; font-size: 0.78em; color: #fff; }
        .howto-clip .hc-label { font-weight: 700; }
        .howto-clip .hc-move { display: flex; gap: 4px; margin-top: 6px; }
        .howto-clip .hc-move button { flex: 1; background: rgba(0,0,0,0.25); border: none; color: #fff; border-radius: 5px; padding: 3px 0; cursor: pointer; font-size: 0.95em; }
        .howto-clip .hc-move button:disabled { opacity: 0.3; cursor: not-allowed; }
        .howto-clip.hc-correct { outline: 3px solid #28a745; }
        .howto-clip.hc-wrong { outline: 3px solid #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 4 · Lesson 4.3 · Quiz</div>
            <h1>Compatibility Across Devices and Platforms</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"A client's older Android phone fails to open a wedding highlight video Otieno exported.","question":"What is the most likely cause, and what should Otieno check first?","options":["The video is cursed and cannot be fixed","The export codec \u2014 H.265 often lacks hardware decoding support on older\/budget Android phones, unlike H.264","The video's title text, which has no effect on playback","The client's phone storage is full"],"correct":1,"explanation":"Codec support is the classic cause of \"won't play on this specific old phone\" complaints \u2014 H.264 is far more universally supported than H.265."},{"scenario":"A shop's Reels upload gets rejected\/badly cropped by Instagram after Otieno exported it in 16:9 landscape.","question":"What is the direct fix?","options":["Re-export in vertical 9:16, since Reels expects vertical video, not landscape","Switch the codec from H.264 to H.265","Rename the file extension from .mp4 to .mov","Nothing \u2014 Instagram never accepts any video format"],"correct":0,"explanation":"Reels\/TikTok expect vertical 9:16 video; a landscape 16:9 export is a mismatched aspect ratio, not a codec or container problem."},{"scenario":"Otieno wants the single safest, most broadly compatible codec + container combination for a client he knows nothing about (unknown device, unknown platform).","question":"Which combination should he default to?","options":["H.265 in a MOV container","H.264 in an MP4 container","ProRes in an AVI container","Any combination works identically everywhere"],"correct":1,"explanation":"H.264 inside MP4 is the industry-standard safe default \u2014 supported by the widest range of devices, browsers, and platforms."},{"scenario":"A client sends a high quality, carefully compressed video to WhatsApp Status and is annoyed the quality looks worse afterward.","question":"What's the most likely explanation?","options":["WhatsApp does not support video at all","WhatsApp Status re-compresses uploaded video itself, so an already highly-optimized file can be compressed again, reducing quality further","The client's phone screen resolution changed","This means Otieno's original export was corrupted"],"correct":1,"explanation":"Platforms like WhatsApp Status apply their own compression on upload, which can visibly degrade a file Otieno already carefully compressed."},{"scenario":"Otieno is deciding whether to manually configure every export setting or use CapCut\/Canva Video's named \"Reels\/TikTok\" preset for a shop promo.","question":"What's the advantage of using the named preset?","options":["It automatically adds background music","It pre-sets the resolution, aspect ratio, and codec\/container combination known to be safe for that specific platform, reducing the risk of a rejected or wrongly-cropped upload","It removes the need for a scenario or client at all","Presets always produce the smallest possible file size regardless of platform"],"correct":1,"explanation":"Named platform presets exist specifically to bundle the safe resolution\/aspect-ratio\/codec settings for that destination, cutting down compatibility mistakes."},{"scenario":"A client reports two separate issues: their grandmother's old Android can't play a wedding video, and a different shop client's Reels upload was rejected for orientation.","question":"What is the correct diagnostic order Otieno should follow for problems like these?","options":["Guess randomly and re-export with different settings each time until something works","Check codec first (H.264 vs H.265 for older-device playback), then container, then resolution\/aspect ratio \u2014 matching the fix to what the specific complaint actually describes","Assume both issues have the same single cause and apply one identical fix to both","Ignore both complaints since compatibility issues cannot be diagnosed"],"correct":1,"explanation":"The two complaints have different root causes (codec support vs aspect ratio) \u2014 working through codec, container, then resolution\/aspect ratio in order lets Otieno match each fix to its actual reported symptom."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '&#9989; Correct.' : '&#10060; Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. Otieno-level format know-how.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> &middot; Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again &#128257;</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }

        /* How-To intro — a small, ungraded reorder demo directly
           rehearsing the "check codec, then container, then resolution/
           aspect ratio, in that order" diagnostic mechanic that one of
           the quiz scenarios asks about, so it's not being asked cold. */
        const HOWTO_CLIPS = [
            { id: 'h1', label: 'Check Codec', color: '#6A11CB' },
            { id: 'h2', label: 'Check Container', color: '#2575FC' },
            { id: 'h3', label: 'Check Resolution / Aspect Ratio', color: '#E65100' },
        ];
        const HOWTO_CORRECT = ['h1', 'h2', 'h3'];
        let howtoOrder = ['h2', 'h1', 'h3']; // first two steps start swapped, same as the quiz scenario describes

        function escHtmlH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function howtoClipById(id) { return HOWTO_CLIPS.find(c => c.id === id); }

        function renderHowtoTimeline(marks) {
            document.getElementById('howtoTimeline').innerHTML = howtoOrder.map((id, i) => {
                const c = howtoClipById(id);
                const cls = marks ? (marks[i] ? 'hc-correct' : 'hc-wrong') : '';
                return `<div class="howto-clip ${cls}" style="background:${c.color};">
                    <div class="hc-label">${escHtmlH(c.label)}</div>
                    <div class="hc-move">
                        <button data-dir="left" data-id="${id}" ${i===0?'disabled':''}>◀</button>
                        <button data-dir="right" data-id="${id}" ${i===howtoOrder.length-1?'disabled':''}>▶</button>
                    </div>
                </div>`;
            }).join('');
            document.querySelectorAll('.hc-move button').forEach(btn => {
                btn.addEventListener('click', () => moveHowtoClip(btn.dataset.id, btn.dataset.dir));
            });
        }

        function moveHowtoClip(id, dir) {
            const i = howtoOrder.indexOf(id);
            const j = dir === 'left' ? i - 1 : i + 1;
            if (j < 0 || j >= howtoOrder.length) return;
            [howtoOrder[i], howtoOrder[j]] = [howtoOrder[j], howtoOrder[i]];
            renderHowtoTimeline();
            document.getElementById('howtoBanner').classList.remove('show');
        }

        function checkHowto() {
            const marks = howtoOrder.map((id, i) => id === HOWTO_CORRECT[i]);
            renderHowtoTimeline(marks);
            const allOk = marks.every(m => m);
            const banner = document.getElementById('howtoBanner');
            banner.classList.add('show');
            banner.className = 'howto-banner show ' + (allOk ? 'ok' : 'fail');
            banner.textContent = allOk
                ? '✅ That\'s the right diagnostic order — codec, then container, then resolution/aspect ratio.'
                : '❌ Not quite yet — keep using ◀▶ until the steps run in the right order.';
        }

        function renderHowto() {
            document.getElementById('exerciseCard').innerHTML = `
                <div class="howto-card">
                    <h3>🔍 Quick How-To: Diagnosing a Compatibility Complaint</h3>
                    <p>One of the scenarios coming up asks about this exact situation: a grandmother's old Android can't play a wedding video, and a different client's Reels upload was rejected for orientation. Before reaching for random fixes, Otieno works through checks in order: <strong>codec first, then container, then resolution/aspect ratio</strong> — matching the fix to what the complaint actually describes. Try reordering these three checks into the right sequence, then check your work.</p>
                    <div class="howto-timeline" id="howtoTimeline"></div>
                    <div class="howto-banner" id="howtoBanner"></div>
                    <button class="start-quiz-btn" id="checkHowtoBtn">Check My Order</button>
                    <button class="start-quiz-btn" id="startQuizBtn" style="margin-left:10px;background:linear-gradient(135deg,#28a745,#1e7e34);">Start Quiz →</button>
                </div>`;
            renderHowtoTimeline();
            document.getElementById('checkHowtoBtn').addEventListener('click', checkHowto);
            document.getElementById('startQuizBtn').addEventListener('click', renderQuestion);
        }

        renderHowto();
        renderHowto();
    </script>
</body>
</html>
