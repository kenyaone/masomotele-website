<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Containers vs Codecs — MP4/MOV vs H.264/H.265 | MTTI Video Editing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #6A11CB 0%, #2575FC 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f7971e 0%, #ffd200 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #eef6fb; border-color: #2575FC; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #6A11CB 0%, #2575FC 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #2575FC; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }

        /* How-To intro screen — shown before question 1, not scored */
        .howto-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .howto-card h3 { font-family: 'Fredoka', sans-serif; font-size: 1.3em; margin-bottom: 12px; color: #2575FC; }
        .howto-card p { line-height: 1.6; margin-bottom: 16px; color: #444; }
        .howto-banner { margin-top: 4px; margin-bottom: 18px; padding: 12px 16px; border-radius: 10px; font-size: 0.9em; font-weight: 700; display: none; }
        .howto-banner.show { display: block; }
        .howto-banner.ok { background: #d4edda; color: #155724; }
        .howto-banner.fail { background: #f8d7da; color: #721c24; }
        .start-quiz-btn { margin-top: 4px; background: linear-gradient(135deg, #6A11CB 0%, #2575FC 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .howto-field { margin-bottom: 14px; }
        .howto-field label { display: block; font-size: 0.88em; color: #4a4a68; margin-bottom: 6px; font-weight: 700; }
        .howto-field select, .howto-field input[type=number], .howto-field input[type=text] { width: 100%; max-width: 320px; background: #f5f7fb; border: 2px solid #e0e6f5; color: #333; padding: 10px 12px; border-radius: 8px; font-size: 0.95em; font-family: 'Space Mono', monospace; }
        .howto-field select:focus, .howto-field input:focus { outline: none; border-color: #2575FC; }
        .howto-result-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 8px; font-size: 0.85em; margin-bottom: 6px; background: #f5f7fb; }
        .howto-result-row.ok { border-left: 3px solid #28a745; }
        .howto-result-row.fail { border-left: 3px solid #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 4 · Lesson 4.1 · Quiz</div>
            <h1>Containers vs Codecs — MP4/MOV vs H.264/H.265</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"A client tells Otieno, \"I sent you an MP4, so it must be H.264, right?\"","question":"How should Otieno correct this?","options":["He agrees \u2014 MP4 always means H.264","MP4 is a container, not a codec \u2014 the file could hold H.264, H.265, or another codec inside it, so he needs to check","MP4 files never contain video, only audio","MP4 and H.264 are two names for the exact same container"],"correct":1,"explanation":"MP4 is a container format; the actual compression (codec) inside it can vary, so the extension alone doesn't confirm the codec."},{"scenario":"Otieno receives a professionally shot intro clip described as \"ProRes\" for a wedding highlight reel.","question":"Which container is this ProRes footage most likely wrapped in?","options":[".mp4",".mov",".avi","ProRes has no container, it plays raw"],"correct":1,"explanation":"ProRes is almost always delivered inside a MOV container \u2014 MP4 does not commonly carry ProRes-encoded video."},{"scenario":"A church asks Otieno why their event footage, all saved as .mov files from an iPhone, edits smoothly in CapCut just like their old .mp4 clips.","question":"What's the most accurate explanation?","options":[".mov files are secretly renamed .mp4 files","Both containers can hold the same H.264\/H.265 codec inside, so playback and editing behaviour ends up the same even though the wrapper differs","CapCut converts all files to the same format before opening them, erasing any difference","iPhones cannot actually produce .mov files"],"correct":1,"explanation":"Since MOV and MP4 can both carry H.264 or H.265 internally, footage with either extension can behave identically once it's the same codec inside."},{"scenario":"Otieno wants to quickly check what codec is really inside a client's oddly-named video file before importing it to CapCut.","question":"What is he actually trying to find out?","options":["The file's container extension, which he already knows from the filename","The compression method (codec) used inside the file, since the extension\/container alone doesn't tell him that","The exact camera model used to shoot it","Whether the file has a password"],"correct":1,"explanation":"The filename\/extension reveals the container. To know how the video was actually compressed, Otieno needs to check the codec separately, e.g. via a media-info tool."},{"scenario":"A shop owner insists his phone's .avi export and his videographer's .mov ProRes export are \"basically the same file type since both are just video\".","question":"What should Otieno clarify?","options":["He should agree, since all video files are interchangeable","They are different containers, and in this case very likely carry very different codecs too (compressed H.264-family footage vs lightly-compressed ProRes), so they behave very differently in size and editing performance","AVI files cannot be opened on a phone under any circumstances","MOV files never contain video, only metadata"],"correct":1,"explanation":"Different containers commonly pair with different typical codecs \u2014 here a heavily compressed phone codec versus a much larger, lightly-compressed ProRes file \u2014 so treating them as \"basically the same\" ignores a real, practical difference."},{"scenario":"Otieno is training a new assistant editor and wants a one-line rule to avoid confusing containers and codecs.","question":"Which statement is the best rule of thumb?","options":["The file extension always tells you the codec used inside","Container is the wrapper you see in the filename (MP4\/MOV\/AVI); codec is the compression method inside it (H.264\/H.265\/ProRes) \u2014 check them separately, never assume one from the other","Codecs and containers are the same concept with different names","Only .mov files can contain compressed video"],"correct":1,"explanation":"The core distinction is wrapper vs compression method \u2014 conflating the two leads to wrong assumptions about a file's actual quality, size, or compatibility."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '&#9989; Correct.' : '&#10060; Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. Otieno-level format know-how.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> &middot; Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again &#128257;</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }

        /* How-To intro — a small, ungraded field-check demo directly
           rehearsing the "identify the container vs the codec actually
           inside a file" mechanic that one of the quiz scenarios asks
           about, so it's not being asked cold. Same eq/gte/lte rule-
           checking logic as this course's Practical Inspector fields,
           kept lightweight inside a howto-card shell. */
        const HOWTO_FIELDS = [
            { id: 'container_ext', label: 'Container shown by the filename "praise_night.mov"', type: 'select', options: ['.mp4', '.mov', '.avi'] },
            { id: 'codec_inside', label: 'Codec the videographer claims is inside, before Otieno checks a media-info tool', type: 'select', options: ['H.264', 'H.265', 'ProRes', 'Uncompressed'] },
        ];
        const HOWTO_RULES = [
            { field: 'container_ext', operator: 'eq', value: '.mov', label: 'Correctly read the container from the filename' },
            { field: 'codec_inside', operator: 'eq', value: 'ProRes', label: 'Correctly kept the codec claim separate from the container — they aren\'t the same thing' },
        ];

        function escHtmlH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        function howtoFieldHtml(f) {
            if (f.type === 'select') {
                return `<div class="howto-field"><label>${escHtmlH(f.label)}</label><select id="hf_${f.id}">${f.options.map(o => `<option value="${escHtmlH(o)}">${escHtmlH(o)}</option>`).join('')}</select></div>`;
            }
            return `<div class="howto-field"><label>${escHtmlH(f.label)}</label><input type="${f.type === 'number' ? 'number' : 'text'}" id="hf_${f.id}"></div>`;
        }

        function collectHowtoValues() {
            const vals = {};
            HOWTO_FIELDS.forEach(f => {
                const el = document.getElementById('hf_' + f.id);
                if (!el) return;
                vals[f.id] = f.type === 'number' ? parseFloat(el.value) : el.value;
            });
            return vals;
        }

        function applyHowtoOp(val, op, target) {
            switch (op) {
                case 'eq': return val == target;
                case 'neq': return val != target;
                case 'gte': return parseFloat(val) >= target;
                case 'lte': return parseFloat(val) <= target;
                case 'gt': return parseFloat(val) > target;
                case 'lt': return parseFloat(val) < target;
                default: return false;
            }
        }
        function checkHowto() {
            const vals = collectHowtoValues();
            const banner = document.getElementById('howtoBanner');
            const allOk = HOWTO_RULES.every(r => applyHowtoOp(vals[r.field], r.operator, r.value));
            banner.classList.add('show');
            banner.className = 'howto-banner show ' + (allOk ? 'ok' : 'fail');
            banner.textContent = allOk
                ? '✅ Right on both counts — container and codec really are two separate things to check.'
                : '❌ Not quite yet — re-check each field above against the filename and the claim.';
            document.getElementById('howtoResultRows').innerHTML = HOWTO_RULES.map(r => {
                const ok = applyHowtoOp(vals[r.field], r.operator, r.value);
                return `<div class="howto-result-row ${ok ? 'ok' : 'fail'}"><span>${escHtmlH(r.label)}</span><span>${ok ? '✅' : '❌'}</span></div>`;
            }).join('');
        }

        function renderHowto() {
            document.getElementById('exerciseCard').innerHTML = `
                <div class="howto-card">
                    <h3>🔍 Quick How-To: Container vs Codec, Check Separately</h3>
                    <p>One of the scenarios coming up is exactly this: a client sends Otieno a file named <strong>"praise_night.mov"</strong> and says the videographer described it as "ProRes footage" — before importing it into CapCut, Otieno checks the container and the codec separately, since the filename alone only tells him one of them. Fill in what Otieno should determine about this file, then check your answer.</p>
                    <div id="howtoFields">${HOWTO_FIELDS.map(howtoFieldHtml).join('')}</div>
                    <div class="howto-banner" id="howtoBanner"></div>
                    <div id="howtoResultRows"></div>
                    <button class="start-quiz-btn" id="checkHowtoBtn">Check My Settings</button>
                    <button class="start-quiz-btn" id="startQuizBtn" style="margin-left:10px;background:linear-gradient(135deg,#28a745,#1e7e34);">Start Quiz →</button>
                </div>`;
            document.getElementById('checkHowtoBtn').addEventListener('click', checkHowto);
            document.getElementById('startQuizBtn').addEventListener('click', renderQuestion);
        }

        renderHowto();
        renderHowto();
    </script>
</body>
</html>
