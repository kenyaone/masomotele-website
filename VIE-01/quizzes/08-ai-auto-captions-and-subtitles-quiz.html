<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Auto-Captions and Subtitles | MTTI Video Editing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #4527a0 0%, #1a237e 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header .lesson-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 999px; font-size: 0.85em; margin-bottom: 12px; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.2em; margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
        .score-board { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value { font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f7971e 0%, #ffd200 100%); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
        .exercise-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .scenario { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); border-left: 5px solid #ffc107; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; font-size: 0.98em; line-height: 1.55; }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question { font-size: 1.15em; margin-bottom: 20px; font-weight: 700; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: #f5f7fb; border: 2px solid transparent; padding: 16px 20px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left; }
        .option:hover:not(.disabled) { background: #ede7f6; border-color: #4527a0; transform: translateX(4px); }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback { margin-top: 22px; padding: 18px 22px; border-radius: 12px; font-size: 0.98em; line-height: 1.5; }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .next-btn, .restart-btn { margin-top: 20px; background: linear-gradient(135deg, #4527a0 0%, #1a237e 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .results { text-align: center; padding: 25px 15px; }
        .results h2 { font-family: 'Fredoka', sans-serif; font-size: 2em; margin-bottom: 12px; color: #333; }
        .results .final-score { font-size: 3em; font-family: 'Fredoka', sans-serif; color: #4527a0; margin: 20px 0; }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        /* How-To intro screen — shown before question 1, not scored */
        .howto-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .howto-card h3 { font-family: 'Fredoka', sans-serif; font-size: 1.3em; margin-bottom: 12px; color: #4527a0; }
        .howto-card p { line-height: 1.6; margin-bottom: 16px; color: #444; }
        .howto-field { margin-bottom: 16px; }
        .howto-field label { display: block; font-size: 0.92em; margin-bottom: 6px; font-weight: 700; color: #333; line-height: 1.4; }
        .howto-field select, .howto-field input[type="number"], .howto-field input[type="text"] { width: 100%; background: #f5f7fb; border: 2px solid #e0e4ef; padding: 10px 12px; border-radius: 8px; font-size: 0.95em; font-family: 'Space Mono', monospace; color: #333; }
        .howto-field select:focus, .howto-field input:focus { outline: none; border-color: #4527a0; }
        .howto-results { margin-top: 4px; }
        .howto-result-row { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px; border-radius: 8px; font-size: 0.88em; margin-bottom: 6px; background: #f5f7fb; }
        .howto-result-row.ok { border-left: 3px solid #28a745; }
        .howto-result-row.fail { border-left: 3px solid #dc3545; }
        .howto-banner { margin-top: 4px; margin-bottom: 18px; padding: 12px 16px; border-radius: 10px; font-size: 0.9em; font-weight: 700; display: none; }
        .howto-banner.show { display: block; }
        .howto-banner.ok { background: #d4edda; color: #155724; }
        .howto-banner.fail { background: #f8d7da; color: #721c24; }
        .start-quiz-btn { margin-top: 4px; background: linear-gradient(135deg, #4527a0 0%, #1a237e 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Unit 194 · Lesson 1 · Quiz</div>
            <h1>AI Auto-Captions and Subtitles</h1>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="exercise-card" id="exerciseCard"></div>
    </div>
    <script>
        const exercises = [{"scenario":"Otieno runs CapCut's Auto Captions on a wedding highlight reel and the AI produces a full caption track in under a minute.","question":"What is the most accurate way to think about that generated caption track?","options":["A guaranteed-correct final transcript, ready to export","A fast first draft that must be checked against the audio before export","Something that never needs review since CapCut's AI is always accurate","Text that only needs checking if the client complains afterward"],"correct":1,"explanation":"Auto Captions is a speech-recognition guess, not a guaranteed transcript \u2014 it saves time on a first draft but still needs a human review pass before it is trusted."},{"scenario":"On a testimonial video for Rift Valley Fashions, Auto Captions displayed the shop's name as \"Rift Valley Passions.\"","question":"Why did this specific kind of error happen?","options":["CapCut deliberately changes brand names to protect client privacy","Speech-recognition AI struggles most with proper nouns and brand words it has never encountered before, so it substitutes the closest-sounding word it knows","The client mispronounced their own shop's name","Auto Captions only works correctly for English words with no proper nouns at all"],"correct":1,"explanation":"Names, brand words, and unfamiliar terms are the weakest spot for speech-recognition AI, since it has no way to know the correct spelling in advance \u2014 it substitutes the closest sound-alike word instead."},{"scenario":"Otieno is deciding whether to export a captioned church-event video the moment Auto Captions finishes generating.","question":"What should happen between generation and export?","options":["Nothing \u2014 export immediately to save time","Otieno should play back the full clip, reading every caption line against the actual audio, and correct anything the AI got wrong","Only the first ten seconds need to be checked","Review is only needed if the video is longer than five minutes"],"correct":1,"explanation":"The professional habit is a full playback review of every caption line against the audio \u2014 errors can appear anywhere in the clip, not just at the start."},{"scenario":"A caption line disappears from the screen before a viewer has time to finish reading it, especially during a fast-cut sequence in a Reels-style edit.","question":"What kind of problem is this, and should it be fixed before export?","options":["It is a timing\/readability problem, and yes \u2014 captions cut off before they can be read should be adjusted before export","It is not a real problem since most viewers watch with sound on anyway","Only spelling errors need to be fixed; timing never matters","This can only be fixed by re-shooting the original footage"],"correct":0,"explanation":"Caption timing that outruns a viewer's reading speed is just as much a quality problem as a misheard word, and it is fixable in the caption editor without reshooting anything."},{"scenario":"Otieno is training a newer editor at Eldoret Reels Studio on how to use Auto Captions responsibly.","question":"Which rule of thumb should he teach?","options":["Trust the AI completely \u2014 reviewing captions wastes billable time","Always read and correct every auto-generated caption line before export, since the AI is a fast starting point, not a final answer","Only check captions on videos longer than two minutes","Auto Captions never needs review if the audio was recorded in a quiet room"],"correct":1,"explanation":"The core habit to teach is universal: no auto-captioned video leaves Eldoret Reels Studio without every line being checked against the audio first, regardless of video length or recording conditions."},{"scenario":"A client later points out that a testimonial video Otieno delivered has their shop's name spelled wrong in the captions.","question":"What is the underlying lesson from this situation?","options":["CapCut's Auto Captions feature should never be used again for any project","Skipping the caption review step let an AI transcription error reach the client uncorrected \u2014 the fix is to always review before export, not to abandon the tool","The client should have proofread the video themselves before it was sent","This kind of error is unavoidable and cannot be prevented"],"correct":1,"explanation":"The tool itself is still valuable for speed \u2014 the failure was skipping the human review step that catches exactly this kind of error before it reaches the client."}];
        let currentQuestion = 0, score = 0, streak = 0, answered = false;
        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }
        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            html += `<div class="question">${escapeHtml(q.question)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => { html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`; });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }
        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.correct].classList.add('correct');
            const right = i === q.correct;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '&#9989; Correct.' : '&#10060; Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= exercises.length) return showResults(); renderQuestion(); }
        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. Otieno-level AI-editing judgement.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Review the lesson and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> &middot; Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again &#128257;</button>
                </div>`;
        }
        function restart() { currentQuestion = 0; score = 0; streak = 0; renderQuestion(); }
        /* How-To intro — a small, ungraded field-check demo shown before the
           quiz starts, directly rehearsing this quiz's most procedural
           mechanic so it isn't asked cold in question form. */
        function escHtmlH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        const HOWTO_FIELDS = [
            { id: 'caption_name_fix', type: 'select', label: 'Caption line 1 was auto-generated as: "Thanks so much from Kerio Dairy Co-Up!" Which version should replace it before export?', options: [
                'Leave it as "Thanks so much from Kerio Dairy Co-Up!"',
                'Thanks so much from Kerio Dairy Co-op!',
                'Thanks so much from Kerio Valley Co-op!'
            ] },
            { id: 'caption_timing_fix', type: 'select', label: 'Caption line 2 has 16 words but only stays onscreen for 1.1 seconds — too fast for most viewers to read. What should Otieno do before export?', options: [
                'Leave it at 1.1 seconds since most viewers watch with sound on anyway',
                "Extend the caption's on-screen time to roughly 3-5 seconds so it can actually be read",
                'Delete the caption line entirely'
            ] },
        ];
        const HOWTO_RULES = [
            { field: 'caption_name_fix', operator: 'eq', value: 'Thanks so much from Kerio Dairy Co-op!', label: "Shop name corrected in caption line 1" },
            { field: 'caption_timing_fix', operator: 'eq', value: "Extend the caption's on-screen time to roughly 3-5 seconds so it can actually be read", label: 'Caption line 2 given enough on-screen time to read' },
        ];

        function howtoFieldHtml(f) {
            return `<div class="howto-field"><label>${escHtmlH(f.label)}</label><select id="hf_${f.id}"><option value="">— choose —</option>${(f.options||[]).map(o=>`<option value="${escHtmlH(o)}">${escHtmlH(o)}</option>`).join('')}</select></div>`;
        }

        function howtoCollectValues() {
            const vals = {};
            HOWTO_FIELDS.forEach(f => {
                const el = document.getElementById('hf_' + f.id);
                if (!el) return;
                vals[f.id] = el.value;
            });
            return vals;
        }

        function applyHowtoOp(val, op, target) {
            switch (op) {
                case 'eq': return val == target;
                case 'gte': return parseFloat(val) >= target;
                case 'lte': return parseFloat(val) <= target;
                default: return false;
            }
        }

        function checkHowto() {
            const vals = howtoCollectValues();
            const rows = HOWTO_RULES.map(r => {
                const ok = applyHowtoOp(vals[r.field], r.operator, r.value);
                return `<div class="howto-result-row ${ok?'ok':'fail'}"><span>${escHtmlH(r.label)}</span><span>${ok?'✅':'❌'}</span></div>`;
            }).join('');
            const allOk = HOWTO_RULES.every(r => applyHowtoOp(vals[r.field], r.operator, r.value));
            document.getElementById('howtoResults').innerHTML = rows;
            const banner = document.getElementById('howtoBanner');
            banner.classList.add('show');
            banner.className = 'howto-banner show ' + (allOk ? 'ok' : 'fail');
            banner.textContent = allOk
                ? "✅ Both caught — that's exactly the review pass every auto-captioned clip needs before export."
                : '❌ Not quite yet — re-check each line against the audio and pick the corrected version.';
        }

        function renderHowto() {
            document.getElementById('exerciseCard').innerHTML = `
                <div class="howto-card">
                    <h3>🔍 Quick How-To: Reviewing Auto-Captions Before Export</h3>
                    <p>One of the scenarios coming up is about what should happen between Auto Captions generating a track and Otieno exporting the video: <strong>play it back and check every line against the audio before export.</strong> Here's a fresh caption pass for a testimonial at "Kerio Dairy Co-op" — pick the right fix for each line below.</p>
                    <div id="howtoFieldsWrap">${HOWTO_FIELDS.map(howtoFieldHtml).join('')}</div>
                    <div class="howto-results" id="howtoResults"></div>
                    <div class="howto-banner" id="howtoBanner"></div>
                    <button class="start-quiz-btn" id="checkHowtoBtn">Check My Fixes</button>
                    <button class="start-quiz-btn" id="startQuizBtn" style="margin-left:10px;background:linear-gradient(135deg,#28a745,#1e7e34);">Start Quiz →</button>
                </div>`;
            document.getElementById('checkHowtoBtn').addEventListener('click', checkHowto);
            document.getElementById('startQuizBtn').addEventListener('click', renderQuestion);
        }

        renderHowto();
    </script>
</body>
</html>
