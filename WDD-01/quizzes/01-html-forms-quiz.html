<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms | MTTI Web Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }

        /* How-To intro screen — shown before question 1, not scored */
        .howto-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .howto-card h3 { font-family: 'Fredoka', sans-serif; font-size: 1.3em; margin-bottom: 12px; color: #667eea; }
        .howto-card p { line-height: 1.6; margin-bottom: 16px; color: #444; }
        .howto-fields { display: flex; flex-direction: column; gap: 16px; margin-bottom: 18px; }
        .howto-field { display: flex; flex-direction: column; gap: 6px; background: #f5f7fb; border-radius: 10px; padding: 14px 16px; }
        .howto-field label { font-weight: 700; font-family: 'Fredoka', sans-serif; font-size: 0.9em; color: #444; }
        .howto-field input, .howto-field select { padding: 10px 12px; border-radius: 8px; border: 2px solid #ccd3e0; font-family: 'Space Mono', monospace; font-size: 0.95em; background: #fff; }
        .howto-field input.hc-correct, .howto-field select.hc-correct { border-color: #28a745; background: #eafaf0; }
        .howto-field input.hc-wrong, .howto-field select.hc-wrong { border-color: #dc3545; background: #fdecea; }
        .howto-banner { margin-top: 4px; margin-bottom: 18px; padding: 12px 16px; border-radius: 10px; font-size: 0.9em; font-weight: 700; display: none; }
        .howto-banner.show { display: block; }
        .howto-banner.ok { background: #d4edda; color: #155724; }
        .howto-banner.fail { background: #f8d7da; color: #721c24; }
        .start-quiz-btn { margin-top: 4px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 1 · Lesson 1.6 · Quiz</div>
            <h1>Forms</h1>
            <p></p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "id": "q1",
    "text": "James adds a contact form. Which attribute on <form> specifies the server-side URL that will process the submission?",
    "options": [
      "src",
      "href",
      "action",
      "method"
    ],
    "answer": 2,
    "explanation": "The action attribute specifies the URL that receives the form data when submitted. method specifies how the data is sent (GET or POST). Without action, the form submits to the current page URL."
  },
  {
    "id": "q2",
    "text": "When should James use method=\"POST\" instead of method=\"GET\" on his contact form?",
    "options": [
      "POST is faster than GET for large forms",
      "POST sends data in the request body (not the URL) — required for sensitive data and file uploads",
      "GET cannot be used with text inputs",
      "POST is only for forms that upload files"
    ],
    "answer": 1,
    "explanation": "GET appends form data to the URL (?name=James&phone=07...) — visible, bookmarkable, and limited in size. POST sends data in the request body — appropriate for contact forms, login, and anything that modifies server state."
  },
  {
    "id": "q3",
    "text": "James writes: <input type=\"text\" placeholder=\"Your name\"> without a label. What is wrong?",
    "options": [
      "Placeholder text is not displayed by all browsers",
      "Without a <label>, screen reader users and users with cognitive disabilities cannot identify the purpose of the field",
      "The input needs a name attribute to work",
      "Placeholder is only valid for type=\"email\""
    ],
    "answer": 1,
    "explanation": "Placeholder text disappears when the user starts typing — it cannot replace a <label>. Screen readers read the label to announce what the field is for. Always pair every input with a visible <label> linked via for/id attributes."
  },
  {
    "id": "q4",
    "text": "Which input type should James use for a phone number field to trigger the numeric keyboard on mobile?",
    "options": [
      "type=\"number\"",
      "type=\"text\"",
      "type=\"tel\"",
      "type=\"phone\""
    ],
    "answer": 2,
    "explanation": "type=\"tel\" is designed for telephone numbers — it shows a phone dial pad on mobile keyboards and accepts the + prefix for international numbers. type=\"number\" shows a spinner and rejects the + sign used in +254 format."
  },
  {
    "id": "q5",
    "text": "How do you correctly link a <label> to its <input>?",
    "options": [
      "<label><input></label> OR <label for=\"name\">Name</label><input id=\"name\">",
      "<label name=\"name\">Name</label><input id=\"name\">",
      "<label href=\"#name\">Name</label><input name=\"name\">",
      "Labels are automatically linked to the next input"
    ],
    "answer": 0,
    "explanation": "Two valid patterns: wrap the input inside the label (implicit association), OR use for=\"id\" and id=\"name\" (explicit association). The for attribute must match the input's id exactly. name alone does not create an association."
  },
  {
    "id": "q6",
    "text": "James wants customers to select their delivery zone from a list of 5 options. Which form element is best?",
    "options": [
      "Five separate <input type=\"text\"> fields",
      "<select> with five <option> elements",
      "<input type=\"checkbox\"> for each zone",
      "<textarea> where the customer types the zone name"
    ],
    "answer": 1,
    "explanation": "<select> presents a dropdown list of predefined options — it prevents typos, works well on mobile, and ensures valid input. Checkboxes allow multiple selections (not appropriate for a single zone choice); textarea allows freeform text."
  },
  {
    "id": "q7",
    "text": "What does the required attribute do on a form input?",
    "options": [
      "Marks the field with a red asterisk automatically",
      "Prevents the form from submitting if the field is empty — browser-level HTML validation",
      "Makes the field read-only so users cannot change the value",
      "Sends an error email to the site owner"
    ],
    "answer": 1,
    "explanation": "required is a boolean attribute that triggers browser-built-in validation on submit — if the field is empty, the browser shows an error and blocks submission. It is not a substitute for server-side validation or JavaScript validation."
  },
  {
    "id": "q8",
    "text": "What is the purpose of <fieldset> and <legend> in a form?",
    "options": [
      "They add styling borders around groups of inputs",
      "<fieldset> groups related inputs semantically and <legend> labels the group — critical for radio button groups and complex forms",
      "They replace <form> for inline forms",
      "They are only needed for file upload inputs"
    ],
    "answer": 1,
    "explanation": "<fieldset> groups related fields and <legend> names the group. Screen readers announce the legend before each field in the group — 'Delivery options, Standard delivery' — giving context that individual labels alone cannot provide."
  },
  {
    "id": "q9",
    "text": "James wants a multi-line text box for customers to describe their order. Which element should he use?",
    "options": [
      "<input type=\"multiline\">",
      "<input type=\"paragraph\">",
      "<textarea>",
      "<p contenteditable>"
    ],
    "answer": 2,
    "explanation": "<textarea> creates a resizable multi-line text input. It has opening and closing tags (unlike self-closing <input>) and can have default content between them. Never use a contenteditable <p> as a form input — it isn't submitted with the form."
  },
  {
    "id": "q10",
    "text": "What type of <input> creates the submit button that sends the form?",
    "options": [
      "type=\"form\"",
      "type=\"send\"",
      "type=\"button\"",
      "type=\"submit\""
    ],
    "answer": 3,
    "explanation": "type=\"submit\" creates a button that, when clicked, triggers form validation and sends the form data to the action URL. type=\"button\" creates a generic button with no default behaviour — it requires JavaScript to do anything."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.text)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.answer].classList.add('correct');
            const right = i === q.answer;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        /* How-To intro — a small, ungraded field-check demo shown before the
           quiz starts, directly rehearsing the "for must exactly match id"
           label-linking mechanic one of the quiz questions asks about, so
           it's not being asked cold. */
        const HOWTO_RULES = [
            { id: 'howtoForInput', op: 'eq', value: 'phone-number' },
            { id: 'howtoIdInput', op: 'eq', value: 'phone-number' }
        ];

        function applyHowtoOp(op, actual, target) {
            if (op === 'eq') return String(actual).trim() === String(target).trim();
            return false;
        }

        function checkHowto() {
            let allOk = true;
            HOWTO_RULES.forEach(r => {
                const el = document.getElementById(r.id);
                const ok = applyHowtoOp(r.op, el.value, r.value);
                el.classList.remove('hc-correct', 'hc-wrong');
                el.classList.add(ok ? 'hc-correct' : 'hc-wrong');
                if (!ok) allOk = false;
            });
            const banner = document.getElementById('howtoBanner');
            banner.classList.add('show');
            banner.className = 'howto-banner show ' + (allOk ? 'ok' : 'fail');
            banner.textContent = allOk
                ? "✅ Linked — the for and id now match exactly, so the label and input are programmatically connected."
                : "❌ Not linked yet — the label's for value must exactly match the input's id value, character for character.";
        }

        function renderHowto() {
            document.getElementById('exerciseCard').innerHTML = `
                <div class="howto-card">
                    <h3>🔍 Quick How-To: Linking a Label to Its Input</h3>
                    <p>One of the questions coming up asks how a <code>&lt;label&gt;</code> gets linked to its <code>&lt;input&gt;</code>. James is adding a phone number field to his contact form, but the <code>for</code> value on the label no longer matches the <code>id</code> on the input. Fix the field below so they match exactly, then check your work.</p>
                    <div class="howto-fields">
                        <div class="howto-field">
                            <label for="howtoForInput">Label's for value — &lt;label for="___"&gt;Phone Number&lt;/label&gt;</label>
                            <input type="text" id="howtoForInput" value="telephone">
                        </div>
                        <div class="howto-field">
                            <label for="howtoIdInput">Input's id value — &lt;input id="___"&gt;</label>
                            <input type="text" id="howtoIdInput" value="phone-number">
                        </div>
                    </div>
                    <div class="howto-banner" id="howtoBanner"></div>
                    <button class="start-quiz-btn" id="checkHowtoBtn">Check My Fields</button>
                    <button class="start-quiz-btn" id="startQuizBtn" style="margin-left:10px;background:linear-gradient(135deg,#28a745,#1e7e34);">Start Quiz →</button>
                </div>`;
            document.getElementById('checkHowtoBtn').addEventListener('click', checkHowto);
            document.getElementById('startQuizBtn').addEventListener('click', renderQuestion);
        }

        renderHowto();
    </script>
</body>
</html>
