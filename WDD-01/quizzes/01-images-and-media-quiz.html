<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images and Media | MTTI Web Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }

        /* How-To intro screen — shown before question 1, not scored */
        .howto-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .howto-card h3 { font-family: 'Fredoka', sans-serif; font-size: 1.3em; margin-bottom: 12px; color: #667eea; }
        .howto-card p { line-height: 1.6; margin-bottom: 16px; color: #444; }
        .howto-field-row { margin-bottom: 18px; }
        .howto-field-row label { display: block; font-weight: 700; margin-bottom: 8px; color: #333; }
        .howto-field-row input[type="text"] { width: 100%; max-width: 460px; padding: 12px 14px; border-radius: 10px; border: 2px solid #ccc; font-family: 'Space Mono', monospace; font-size: 0.95em; }
        .howto-field-row input.hc-ok { border-color: #28a745; background: #eafaf0; }
        .howto-field-row input.hc-fail { border-color: #dc3545; background: #fdeeee; }
        .howto-banner { margin-top: 4px; margin-bottom: 18px; padding: 12px 16px; border-radius: 10px; font-size: 0.9em; font-weight: 700; display: none; }
        .howto-banner.show { display: block; }
        .howto-banner.ok { background: #d4edda; color: #155724; }
        .howto-banner.fail { background: #f8d7da; color: #721c24; }
        .start-quiz-btn { margin-top: 4px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 1 · Lesson 1.4 · Quiz</div>
            <h1>Images and Media</h1>
            <p></p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "id": "q1",
    "text": "James adds a product photo: <img src=\"cement-bag.jpg\">. What is MISSING from this tag?",
    "options": [
      "A width attribute",
      "An alt attribute describing the image",
      "A class attribute for styling",
      "A title attribute for tooltips"
    ],
    "answer": 1,
    "explanation": "The alt attribute is required for accessibility and SEO. It describes the image for screen reader users and is displayed if the image fails to load. Missing alt is both an accessibility violation and bad practice."
  },
  {
    "id": "q2",
    "text": "James's product image is purely decorative (a background texture with no information). What should the alt attribute value be?",
    "options": [
      "alt=\"decorative image\"",
      "alt=\"background texture for hardware shop\"",
      "alt=\"\" (empty string)",
      "The alt attribute should be removed entirely"
    ],
    "answer": 2,
    "explanation": "An empty alt=\"\" tells screen readers to skip the image completely — correct for purely decorative images that add no information. Removing alt entirely is invalid HTML; alt must always be present."
  },
  {
    "id": "q3",
    "text": "Which image format is best for product photographs on James's site because it offers high quality at small file sizes?",
    "options": [
      "BMP — uncompressed for maximum quality",
      "GIF — supports animation",
      "WebP — modern format with superior compression for photos",
      "SVG — scalable vector format"
    ],
    "answer": 2,
    "explanation": "WebP provides ~30% smaller files than JPEG at equivalent quality, making it ideal for product photos on a site targeting Kenyan mobile users on limited data. SVG is for icons/logos, GIF for animation, BMP is too large."
  },
  {
    "id": "q4",
    "text": "What is the purpose of the <figure> and <figcaption> elements around an image?",
    "options": [
      "They make images responsive automatically",
      "They group an image with its caption semantically, so screen readers and search engines understand the relationship",
      "They are required for images to display in all browsers",
      "They add a border and shadow around the image"
    ],
    "answer": 1,
    "explanation": "<figure> wraps self-contained media (image, chart, code block) and <figcaption> labels it. Screen readers announce the caption as belonging to the image. It's semantic HTML — presentation is still handled by CSS."
  },
  {
    "id": "q5",
    "text": "James uploads a 4.5MB photo of his cement stock. What should he do before adding it to his HTML?",
    "options": [
      "Add loading=\"lazy\" to skip compression",
      "Compress and resize the image (e.g. to WebP, under 150KB) to reduce page load time",
      "Store it in a CDN instead of the same server",
      "Convert it to a base64-encoded data URL in the src attribute"
    ],
    "answer": 1,
    "explanation": "A 4.5MB image will take many seconds on mobile data. Images should be resized to their display dimensions and compressed. WebP at under 150KB is a good target for product thumbnails on Kenyan mobile connections."
  },
  {
    "id": "q6",
    "text": "Which attribute makes an image load only when it scrolls into the viewport, saving data for customers who don't scroll?",
    "options": [
      "defer=\"true\"",
      "async=\"lazy\"",
      "loading=\"lazy\"",
      "src=\"lazy\""
    ],
    "answer": 2,
    "explanation": "loading=\"lazy\" is a native browser attribute that defers loading an image until it is near the viewport. It requires no JavaScript and significantly reduces initial page load time and data usage."
  },
  {
    "id": "q7",
    "text": "James's supplier sends him a logo as an SVG file. What is the main advantage of SVG over PNG for a logo?",
    "options": [
      "SVG files support more colours than PNG",
      "SVG is a vector format — it scales to any size without becoming blurry or pixelated",
      "SVG loads faster than PNG on all connections",
      "PNG doesn't support transparency; SVG does"
    ],
    "answer": 1,
    "explanation": "SVG is vector-based — it uses mathematical paths rather than pixels, so it scales perfectly to any size (16px favicon or 1600px banner) without quality loss. PNG is pixel-based and becomes blurry when enlarged."
  },
  {
    "id": "q8",
    "text": "What does the srcset attribute on an <img> tag allow you to do?",
    "options": [
      "Provide multiple image sources at different resolutions so the browser picks the best one for the device",
      "List fallback images if the primary src fails to load",
      "Set the image source differently for dark mode",
      "Load images from multiple CDN servers simultaneously"
    ],
    "answer": 0,
    "explanation": "srcset lets you specify different image files for different screen resolutions (1x, 2x) or viewport widths. The browser automatically picks the most appropriate version — sharp images on Retina screens, smaller on low-DPI displays."
  },
  {
    "id": "q9",
    "text": "James wants to embed a YouTube product demonstration video. Which HTML element should he use?",
    "options": [
      "<video src=\"youtube.com/...\">",
      "<img type=\"video\">",
      "<iframe> with the YouTube embed URL",
      "<embed src=\"...\">"
    ],
    "answer": 2,
    "explanation": "<iframe> is used to embed external content from another origin, including YouTube videos. YouTube's 'Share → Embed' gives you an <iframe> code. The <video> tag is for self-hosted video files."
  },
  {
    "id": "q10",
    "text": "Which attribute should be added to a <video> tag to make the video player controls (play, pause, volume) visible?",
    "options": [
      "autoplay",
      "controls",
      "muted",
      "loop"
    ],
    "answer": 1,
    "explanation": "The controls attribute (boolean — no value needed) shows the browser's native video player controls. Without it, the video plays silently with no visible way to control it — inaccessible to users who can't use keyboard shortcuts."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.text)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.answer].classList.add('correct');
            const right = i === q.answer;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        /* How-To intro — a small, ungraded field-check demo shown before
           the quiz starts, directly rehearsing writing an alt attribute,
           which one of the quiz scenarios asks about, so it is not being
           asked cold. */
        const HOWTO_ALT_BAD = ['image', 'photo', 'img', 'picture', 'pic', ''];

        function checkHowto() {
            const input = document.getElementById('howtoAltInput');
            const val = input.value.trim();
            const lower = val.toLowerCase();
            const ok = val.length >= 8 && !HOWTO_ALT_BAD.includes(lower);
            input.classList.remove('hc-ok', 'hc-fail');
            input.classList.add(ok ? 'hc-ok' : 'hc-fail');
            const banner = document.getElementById('howtoBanner');
            banner.classList.add('show');
            banner.className = 'howto-banner show ' + (ok ? 'ok' : 'fail');
            banner.textContent = ok
                ? 'Fixed — a screen reader can now describe this photo, and the text will show if it ever fails to load.'
                : 'Not quite yet — avoid generic text like "image" or "photo"; describe what is actually shown, for example "50kg bag of Portland cement".';
        }

        function renderHowto() {
            document.getElementById('exerciseCard').innerHTML = `
                <div class="howto-card">
                    <h3>🔍 Quick How-To: Writing an Alt Attribute</h3>
                    <p>One of the scenarios coming up points out that James's product photo tag, &lt;img src="cement-bag.jpg"&gt;, is missing something important. Every &lt;img&gt; needs an alt attribute describing the picture for screen readers and search engines. Try writing alt text for this cement bag photo below, then check it.</p>
                    <div class="howto-field-row">
                        <label for="howtoAltInput">Alt text for the cement bag photo</label>
                        <input type="text" id="howtoAltInput" placeholder="describe what is in the photo">
                    </div>
                    <div class="howto-banner" id="howtoBanner"></div>
                    <button class="start-quiz-btn" id="checkHowtoBtn">Check My Alt Text</button>
                    <button class="start-quiz-btn" id="startQuizBtn" style="margin-left:10px;background:linear-gradient(135deg,#28a745,#1e7e34);">Start Quiz →</button>
                </div>`;
            document.getElementById('checkHowtoBtn').addEventListener('click', checkHowto);
            document.getElementById('startQuizBtn').addEventListener('click', renderQuestion);
        }

        renderHowto();
    </script>
</body>
</html>
