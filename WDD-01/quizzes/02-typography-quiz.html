<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography | MTTI Web Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 2 · Lesson 2.2 · Quiz</div>
            <h1>Typography</h1>
            <p></p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "id": "q1",
    "text": "James sets font-size: 18px on the body. What is the em equivalent for a heading that should be 1.5 times the base size?",
    "options": [
      "1.5em",
      "1.8em",
      "18em",
      "0.5em"
    ],
    "answer": 0,
    "explanation": "1em equals the current font size of the element. If the body is 18px, 1.5em on a child element = 18 × 1.5 = 27px. em is relative to the parent element's font size, which makes it flexible for responsive design."
  },
  {
    "id": "q2",
    "text": "What is the main advantage of using rem over em for font sizes?",
    "options": [
      "rem loads faster than em",
      "rem is relative to the root element (html) font size — it doesn't compound through nested elements like em does",
      "rem is supported in more browsers than em",
      "rem values are automatically converted to pixels by the browser"
    ],
    "answer": 1,
    "explanation": "em compounds: if a parent is 1.2em and a child is 1.2em, the child is actually 1.44× the root size. rem always refers to the html element's font size regardless of nesting depth, making it predictable and easy to reason about."
  },
  {
    "id": "q3",
    "text": "James uses Google Fonts for his headings. What must he add to the <head> of every page?",
    "options": [
      "A JavaScript file from Google",
      "A <link> tag to the Google Fonts stylesheet URL (or @import in CSS)",
      "A <script> tag with the font name as a parameter",
      "Nothing — Google Fonts loads automatically when named in CSS"
    ],
    "answer": 1,
    "explanation": "Google Fonts are loaded via a <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/...\"> tag in <head>. This downloads the font CSS, which then tells the browser where to fetch the actual font files when needed."
  },
  {
    "id": "q4",
    "text": "James writes: font-family: 'Open Sans', sans-serif. What is 'sans-serif' doing here?",
    "options": [
      "Applying italic style to the font",
      "Acting as a fallback generic font family if Open Sans fails to load",
      "Setting the font weight to normal",
      "Specifying the font format (woff2, ttf)"
    ],
    "answer": 1,
    "explanation": "The last value in a font stack is the generic fallback family (serif, sans-serif, monospace, cursive, fantasy). If all named fonts fail to load, the browser uses the user's default sans-serif font. Always include a generic fallback."
  },
  {
    "id": "q5",
    "text": "What is the recommended line-height range for body text to maximise readability?",
    "options": [
      "0.8 – 1.0 (tighter than the default)",
      "1.4 – 1.7 (a unitless multiplier)",
      "2.0 – 2.5 (double-spaced for clarity)",
      "10px – 14px (fixed pixel values)"
    ],
    "answer": 1,
    "explanation": "A unitless line-height of 1.4–1.7 is recommended for body text — it multiplies the element's font size to set the line box height. 1.0 makes text cramped; 2.0+ creates too much space. Unitless is preferred so it scales with font size."
  },
  {
    "id": "q6",
    "text": "James wants his product name headings to appear in uppercase regardless of how they were typed in HTML. Which CSS property achieves this without changing the HTML?",
    "options": [
      "font-variant: uppercase",
      "text-transform: uppercase",
      "font-style: uppercase",
      "letter-case: upper"
    ],
    "answer": 1,
    "explanation": "text-transform: uppercase renders text in uppercase visually without changing the underlying HTML. This is correct because the HTML source stays clean and accessible (screen readers may read the original casing), while the visual style is CSS's responsibility."
  },
  {
    "id": "q7",
    "text": "James sets font-weight: 700 on his price text. What is the equivalent font-weight keyword?",
    "options": [
      "light",
      "medium",
      "bold",
      "black"
    ],
    "answer": 2,
    "explanation": "Font weight 700 = bold. The scale: 100 (thin), 200 (extra-light), 300 (light), 400 (normal/regular), 500 (medium), 600 (semi-bold), 700 (bold), 800 (extra-bold), 900 (black/heavy). Not all fonts include every weight."
  },
  {
    "id": "q8",
    "text": "Why should James avoid setting body font-size in pixels (e.g. 16px) in favour of a percentage like 100%?",
    "options": [
      "Pixels are not supported in mobile browsers",
      "Setting pixel font sizes overrides the user's browser font-size preference — percentage or no override respects the user's accessibility settings",
      "100% is always 16px, so there's no difference",
      "Percentages load faster than pixel values"
    ],
    "answer": 1,
    "explanation": "Browsers default to 16px but users can change this (e.g. visually impaired users may set 20px). Setting body font-size: 16px overrides their preference. font-size: 100% or omitting it entirely respects their default, then rem values scale from it."
  },
  {
    "id": "q9",
    "text": "James wants to limit his product description text to a maximum of 65 characters per line for readability. Which CSS property controls line length?",
    "options": [
      "font-size",
      "text-wrap",
      "max-width: 65ch",
      "columns: 65"
    ],
    "answer": 2,
    "explanation": "The ch unit equals the width of the '0' character in the current font — setting max-width: 65ch limits the text container to approximately 65 characters per line. This is the most typographically accurate way to control line length."
  },
  {
    "id": "q10",
    "text": "Which CSS property adds spacing between individual letters in a heading for a premium feel?",
    "options": [
      "word-spacing",
      "text-indent",
      "letter-spacing",
      "font-kerning"
    ],
    "answer": 2,
    "explanation": "letter-spacing adds or reduces space between every character. Positive values add space (used for uppercase headings and logos); negative values tighten text. word-spacing affects space between words only."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.text)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.answer].classList.add('correct');
            const right = i === q.answer;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
