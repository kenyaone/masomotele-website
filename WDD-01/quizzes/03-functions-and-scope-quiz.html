<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions | MTTI Web Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }

        /* How-To intro screen — shown before question 1, not scored */
        .howto-card { background: white; color: #333; border-radius: 25px; padding: 35px; margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .howto-card h3 { font-family: 'Fredoka', sans-serif; font-size: 1.3em; margin-bottom: 12px; color: #667eea; }
        .howto-card p { line-height: 1.6; margin-bottom: 16px; color: #444; }
        .howto-banner { margin-top: 4px; margin-bottom: 18px; padding: 12px 16px; border-radius: 10px; font-size: 0.9em; font-weight: 700; display: none; }
        .howto-banner.show { display: block; }
        .howto-banner.ok { background: #d4edda; color: #155724; }
        .howto-banner.fail { background: #f8d7da; color: #721c24; }
        .start-quiz-btn { margin-top: 4px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 1em; cursor: pointer; font-family: 'Fredoka', sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .howto-fields { display: flex; flex-direction: column; gap: 14px; background: #f5f7fb; border-radius: 12px; padding: 18px; margin-bottom: 18px; }
        .howto-field { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-radius: 8px; padding: 8px 10px; }
        .howto-field .hf-label { font-size: 0.92em; flex: 1; min-width: 220px; }
        .howto-field .hf-label code { background: #e8ebf7; padding: 2px 6px; border-radius: 4px; }
        .howto-field select { padding: 8px 10px; border-radius: 8px; border: 2px solid #ccd3ea; font-family: 'Space Mono', monospace; font-size: 0.92em; }
        .howto-field.hf-correct { background: #d4edda; }
        .howto-field.hf-wrong { background: #f8d7da; }
        .howto-field.hf-correct select { border-color: #28a745; }
        .howto-field.hf-wrong select { border-color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 3 · Lesson 3.2 · Quiz</div>
            <h1>Functions</h1>
            <p></p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "id": "q1",
    "text": "James writes a function that calculates the total with VAT. Which syntax is a function DECLARATION?",
    "options": [
      "const total = function(price) { return price * 1.16; };",
      "function calculateTotal(price) { return price * 1.16; }",
      "const calculateTotal = (price) => price * 1.16;",
      "let total = new Function('price', 'return price * 1.16')"
    ],
    "answer": 1,
    "explanation": "A function declaration uses the function keyword before the name. It is hoisted — you can call calculateTotal() before it is declared in the code. Options A and C are function expressions (assigned to variables); they are not hoisted the same way."
  },
  {
    "id": "q2",
    "text": "James writes: const formatKES = (amount) => `KES ${amount.toLocaleString()}`. What type of function is this?",
    "options": [
      "Function declaration",
      "Arrow function expression",
      "Immediately Invoked Function Expression (IIFE)",
      "Generator function"
    ],
    "answer": 1,
    "explanation": "Arrow functions use the => syntax. They are always expressions (assigned to variables). They have shorter syntax than function expressions and do not have their own this binding — important for event handlers and methods."
  },
  {
    "id": "q3",
    "text": "James defines: function greet(name = 'Customer') { return `Hello, ${name}!`; }. What does greet() return with no argument?",
    "options": [
      "'Hello, undefined!'",
      "'Hello, !'",
      "'Hello, Customer!'",
      "An error — name is required"
    ],
    "answer": 2,
    "explanation": "Default parameters (name = 'Customer') are used when the argument is undefined or not passed. greet() → name is undefined → default 'Customer' is used → 'Hello, Customer!'. Default parameters were introduced in ES6."
  },
  {
    "id": "q4",
    "text": "What is the difference between a parameter and an argument?",
    "options": [
      "They are identical terms",
      "Parameters are the named variables in the function definition; arguments are the actual values passed when calling the function",
      "Parameters are for arrow functions; arguments are for declarations",
      "Arguments come before parameters in a function call"
    ],
    "answer": 1,
    "explanation": "In function calculateTotal(price, tax), price and tax are PARAMETERS — placeholders in the definition. When called as calculateTotal(850, 0.16), 850 and 0.16 are ARGUMENTS — the actual values passed. This distinction matters for documentation and error messages."
  },
  {
    "id": "q5",
    "text": "James declares a variable inside a function: function showPrice() { let discount = 100; }. Can he access discount outside the function?",
    "options": [
      "Yes — let declarations are always globally accessible",
      "No — let inside a function is function-scoped; it does not exist outside the function",
      "Yes — but only from other functions in the same file",
      "No — but only if the function has been called first"
    ],
    "answer": 1,
    "explanation": "Variables declared with let or const inside a function are function-scoped (or more precisely, block-scoped to the {} of the function body). They do not exist outside that scope. Accessing discount outside would throw ReferenceError."
  },
  {
    "id": "q6",
    "text": "What does a function return if it has no return statement?",
    "options": [
      "0",
      "null",
      "undefined",
      "An empty string ''"
    ],
    "answer": 2,
    "explanation": "Functions without a return statement (or with a bare return;) return undefined. This is often the source of bugs when developers forget to return a value and then try to use the result. Always return explicitly when a value is expected."
  },
  {
    "id": "q7",
    "text": "James wants to calculate total only when a button is clicked. He writes: btn.addEventListener('click', calculateTotal). Why are there NO parentheses after calculateTotal?",
    "options": [
      "addEventListener does not accept parentheses",
      "Without parentheses, he passes the function REFERENCE — addEventListener calls it later. With () it would call it immediately during setup",
      "This is a syntax error — parentheses are always required",
      "Parentheses would pass the return value, not the function itself — and the return value could be undefined"
    ],
    "answer": 1,
    "explanation": "calculateTotal (no parentheses) is a reference to the function — you're telling addEventListener 'call this function when the event fires'. calculateTotal() (with parentheses) calls it immediately and passes the return value. You want the reference, not the result."
  },
  {
    "id": "q8",
    "text": "What is a pure function?",
    "options": [
      "A function that only returns strings",
      "A function that returns the same output for the same input and has no side effects",
      "A function declared with the 'pure' keyword",
      "A function that does not call any other functions"
    ],
    "answer": 1,
    "explanation": "A pure function: (1) always returns the same output for the same input, and (2) causes no side effects (no DOM manipulation, no global variable changes, no console.log). Pure functions are easy to test, debug, and reason about."
  },
  {
    "id": "q9",
    "text": "James writes: const double = n => n * 2. How does he call this function with the value 5?",
    "options": [
      "double => 5",
      "double(5)",
      "call double(5)",
      "n = 5; double()"
    ],
    "answer": 1,
    "explanation": "Functions (including arrow functions assigned to const) are called with the variable name followed by parentheses containing the arguments: double(5) returns 10. Arrow functions stored in const are called identically to regular function declarations."
  },
  {
    "id": "q10",
    "text": "James creates a function that multiplies any two numbers. What are the TWO parts every function needs?",
    "options": [
      "A name and a return statement",
      "Parameters and a function body (the {} block)",
      "An arrow and a default value",
      "A name and a call to itself"
    ],
    "answer": 1,
    "explanation": "Every function needs parameters (to receive input) and a function body (the code block {} that runs when called). A name and return statement are optional — anonymous functions (arrow functions, callbacks) have no name, and some functions return undefined intentionally."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.text)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.answer].classList.add('correct');
            const right = i === q.answer;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }


        /* How-To intro — a small, ungraded "predict the return value" demo
           shown before the quiz starts, directly rehearsing the "what does
           a default parameter return?" mechanic that one of the quiz
           questions asks about, so it's not being asked cold. */
        const HOWTO_FIELDS = [
            { id: 'hf1', label: 'greet()', target: 'Hello, Customer!', options: ['Hello, undefined!', 'Hello, !', 'Hello, Customer!', 'An error is thrown'] },
            { id: 'hf2', label: "greet('Amina')", target: 'Hello, Amina!', options: ['Hello, Amina!', 'Hello, Customer!', 'Hello, undefined!', 'An error is thrown'] },
        ];

        function escHtmlH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        function renderHowtoFields() {
            document.getElementById('howtoFields').innerHTML = HOWTO_FIELDS.map(f => `
                <div class="howto-field" id="row-${f.id}">
                    <div class="hf-label">James calls: <code>${escHtmlH(f.label)}</code> What does it return?</div>
                    <select id="${f.id}">
                        <option value="">-- choose --</option>
                        ${f.options.map(o => `<option value="${escHtmlH(o)}">${escHtmlH(o)}</option>`).join('')}
                    </select>
                </div>`).join('');
        }

        function checkHowto() {
            let allOk = true;
            HOWTO_FIELDS.forEach(f => {
                const sel = document.getElementById(f.id);
                const row = document.getElementById('row-' + f.id);
                const ok = sel.value === f.target;
                row.classList.remove('hf-correct', 'hf-wrong');
                row.classList.add(ok ? 'hf-correct' : 'hf-wrong');
                if (!ok) allOk = false;
            });
            const banner = document.getElementById('howtoBanner');
            banner.classList.add('show');
            banner.className = 'howto-banner show ' + (allOk ? 'ok' : 'fail');
            banner.textContent = allOk
                ? 'Correct — a default parameter only kicks in when the argument is left out entirely.'
                : 'Not quite yet — check each field above and try again.';
        }

        function renderHowto() {
            document.getElementById('exerciseCard').innerHTML = `
                <div class="howto-card">
                    <h3>Quick How-To: Predicting Function Returns</h3>
                    <p>One of the questions coming up defines a function with a default parameter: <code>function greet(name = 'Customer') { ... }</code>. When an argument is passed, it is used instead of the default; when it is left out, the default steps in. Predict what each call below returns, then check your answers.</p>
                    <div class="howto-fields" id="howtoFields"></div>
                    <div class="howto-banner" id="howtoBanner"></div>
                    <button class="start-quiz-btn" id="checkHowtoBtn">Check My Returns</button>
                    <button class="start-quiz-btn" id="startQuizBtn" style="margin-left:10px;background:linear-gradient(135deg,#28a745,#1e7e34);">Start Quiz →</button>
                </div>`;
            renderHowtoFields();
            document.getElementById('checkHowtoBtn').addEventListener('click', checkHowto);
            document.getElementById('startQuizBtn').addEventListener('click', renderQuestion);
        }

        renderHowto();
    </script>
</body>
</html>
