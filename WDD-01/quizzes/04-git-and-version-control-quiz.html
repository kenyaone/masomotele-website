<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version Control with Git | MTTI Web Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 4 · Lesson 4.1 · Quiz</div>
            <h1>Version Control with Git</h1>
            <p></p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "id": "q1",
    "text": "James runs git init in his project folder. What does this create?",
    "options": [
      "A new GitHub repository online",
      "A hidden .git directory that starts tracking the project's history locally",
      "A blank index.html file",
      "A connection to the remote server"
    ],
    "answer": 1,
    "explanation": "git init creates a hidden .git directory containing all the metadata for the local repository — the object database, refs, config, and hooks. Nothing is connected to the internet yet; the repo is entirely local."
  },
  {
    "id": "q2",
    "text": "James edits style.css and runs git status. The file shows as 'modified'. What must James do next to include it in a commit?",
    "options": [
      "git commit style.css",
      "git add style.css (stage it) before committing",
      "git push style.css",
      "git track style.css"
    ],
    "answer": 1,
    "explanation": "The Git workflow is: modify → stage (git add) → commit. Staging is the step where you select which changes to include in the next commit. Running git commit without staging first does nothing for modified files."
  },
  {
    "id": "q3",
    "text": "James runs git commit -m \"Add product grid layout\". What does this create?",
    "options": [
      "A temporary save that can be easily undone",
      "A permanent, immutable snapshot of all staged changes with the message as a label",
      "A branch named 'Add product grid layout'",
      "An automatic push to the remote repository"
    ],
    "answer": 1,
    "explanation": "A Git commit is a permanent, content-addressed snapshot stored in the repository. The SHA hash is derived from the content — the commit is immutable. It is local only until pushed. The message is a human-readable label for the snapshot."
  },
  {
    "id": "q4",
    "text": "James wants to see all changes since the last commit before staging them. Which command shows this?",
    "options": [
      "git log",
      "git diff",
      "git status",
      "git show HEAD"
    ],
    "answer": 1,
    "explanation": "git diff shows the line-by-line differences between the working directory and the last commit (unstaged changes). git diff --staged shows staged-but-uncommitted changes. git status shows which files changed; git log shows commit history."
  },
  {
    "id": "q5",
    "text": "James accidentally committed a file containing his database password. What should he do?",
    "options": [
      "Delete the file and run git commit —-amend",
      "Immediately revoke/rotate the password, remove the file from history using git filter-repo or BFG, and force-push. Treat the secret as compromised",
      "Run git reset HEAD and the file disappears from history",
      "Add the file to .gitignore — this removes it from the repository"
    ],
    "answer": 1,
    "explanation": "git commits are part of the permanent history — delete and amend only helps if it hasn't been pushed. The password must be rotated immediately as it may already be scraped. Use git filter-repo or BFG Repo Cleaner to rewrite history. .gitignore does not remove already-committed files."
  },
  {
    "id": "q6",
    "text": "James creates a new branch: git branch feature/product-filter. What is a Git branch?",
    "options": [
      "A copy of the entire repository",
      "A lightweight movable pointer to a commit — allows parallel lines of work without affecting main",
      "A remote backup of the repository",
      "A named folder inside the project"
    ],
    "answer": 1,
    "explanation": "A branch is simply a pointer to a commit. Creating a branch is nearly instant and costs almost no storage. Both main and feature/product-filter start pointing to the same commit; as you commit on the feature branch, the pointer moves forward independently."
  },
  {
    "id": "q7",
    "text": "James runs git log --oneline. What does he see?",
    "options": [
      "All changed files in the working directory",
      "A compact list of commits with short SHA hashes and messages",
      "The contents of the current branch's latest commit",
      "A visual graph of all branches"
    ],
    "answer": 1,
    "explanation": "--oneline formats each commit as a 7-character short hash and the first line of the commit message. It shows the project timeline compactly. git log --oneline --graph also adds an ASCII branch graph."
  },
  {
    "id": "q8",
    "text": "James wants to undo changes to index.html that haven't been staged yet. Which command restores the file?",
    "options": [
      "git reset index.html",
      "git checkout -- index.html (or git restore index.html in newer Git)",
      "git revert index.html",
      "git stash index.html"
    ],
    "answer": 1,
    "explanation": "git checkout -- index.html (pre-2.23) or git restore index.html (Git 2.23+) discards working-directory changes and restores the file to its state at the last commit. This is DESTRUCTIVE for that file's local changes — they cannot be recovered."
  },
  {
    "id": "q9",
    "text": "James adds .DS_Store and node_modules/ to his .gitignore file. What does this accomplish?",
    "options": [
      "Permanently removes these from the repository history",
      "Prevents Git from tracking or staging these files and directories in future commits",
      "Deletes these files from the filesystem",
      "Hides these files from other collaborators"
    ],
    "answer": 1,
    "explanation": ".gitignore lists patterns for files Git should not track. It affects FUTURE tracking — it won't remove files already committed. node_modules should never be committed (reinstall from package.json). .DS_Store is a Mac metadata file irrelevant to other collaborators."
  },
  {
    "id": "q10",
    "text": "James merges his feature branch into main: git merge feature/product-filter. A merge conflict occurs on style.css. What does this mean?",
    "options": [
      "style.css is corrupted and must be deleted",
      "Both branches modified the same lines of style.css and Git cannot determine which version to keep — James must manually resolve the conflict",
      "The file is too large to merge automatically",
      "The feature branch and main branch are on different versions of Git"
    ],
    "answer": 1,
    "explanation": "A merge conflict occurs when two branches change the same lines of the same file. Git marks the conflict in the file with <<<<<<, =======, >>>>>>> markers. James must open the file, choose the correct version (or combine both), remove the markers, then git add and commit the resolution."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.text)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.answer].classList.add('correct');
            const right = i === q.answer;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
