<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub | MTTI Web Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 4 · Lesson 4.2 · Quiz</div>
            <h1>GitHub</h1>
            <p></p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "id": "q1",
    "text": "James runs git remote add origin https://github.com/jkariuki/hardware-hub.git. What does this command do?",
    "options": [
      "Clones the repository from GitHub to his local machine",
      "Creates a named connection ('origin') from his local repo to the GitHub URL",
      "Pushes all commits to GitHub immediately",
      "Downloads the latest changes from GitHub"
    ],
    "answer": 1,
    "explanation": "git remote add creates a named reference (alias) to a remote URL. 'origin' is the conventional name for the primary remote. After this, he can push with git push origin main instead of typing the full URL every time."
  },
  {
    "id": "q2",
    "text": "James runs git push -u origin main. What does the -u flag do?",
    "options": [
      "Forces the push even if it would overwrite remote commits",
      "Sets 'origin/main' as the upstream tracking branch — future git push and git pull work without specifying the remote and branch",
      "Pushes only untracked files",
      "Creates a pull request automatically"
    ],
    "answer": 1,
    "explanation": "-u (--set-upstream) links the local branch to the remote branch. After setting it once, git push alone knows to push to origin/main and git pull knows to pull from origin/main. Without -u, you must specify the remote and branch every time."
  },
  {
    "id": "q3",
    "text": "James wants to download all commits his collaborator pushed to GitHub since yesterday. Which command fetches AND merges them into his current branch?",
    "options": [
      "git fetch",
      "git pull",
      "git clone",
      "git sync"
    ],
    "answer": 1,
    "explanation": "git pull = git fetch (download commits) + git merge (merge into current branch). git fetch downloads but does not merge — the remote changes are available locally but not yet applied. For careful review before merging, fetch then merge manually."
  },
  {
    "id": "q4",
    "text": "James forks another developer's CSS library on GitHub. What does forking create?",
    "options": [
      "A local copy on his machine",
      "A personal copy of the repository in his GitHub account — he can modify it without affecting the original",
      "A branch in the original repository",
      "A permission request to edit the original repository"
    ],
    "answer": 1,
    "explanation": "Forking creates a copy of the repository under your GitHub account. You have full write access to your fork. It's the standard way to contribute to open-source projects: fork → clone → modify → pull request to the original."
  },
  {
    "id": "q5",
    "text": "James creates a Pull Request on GitHub from his feature branch. What happens next in a typical team workflow?",
    "options": [
      "GitHub automatically merges the branch to main",
      "A reviewer sees the changes, comments, requests revisions, and approves before merging",
      "The feature branch is deleted automatically",
      "GitHub deploys the feature branch to production"
    ],
    "answer": 1,
    "explanation": "Pull Requests are code review checkpoints. A collaborator reviews the diff, adds comments, may request changes, and approves when satisfied. Only then is the PR merged into main. This prevents unreviewed code from reaching the main branch."
  },
  {
    "id": "q6",
    "text": "James's GitHub repository is public. He committed .env containing API keys. What should he do immediately?",
    "options": [
      "Delete the .env file and push — GitHub removes the history",
      "Revoke all compromised keys immediately, use git filter-repo to remove the file from history, force-push, and add .env to .gitignore",
      "Make the repository private — this hides the keys from public view",
      "The keys are safe because they're buried in the commit history"
    ],
    "answer": 1,
    "explanation": "GitHub bots and malicious actors scrape new public commits within seconds. Even if you delete the file in a new commit, the original commit with the keys remains in history and is still publicly accessible. Revoke keys immediately — assume they are compromised."
  },
  {
    "id": "q7",
    "text": "What is the purpose of a README.md file in a GitHub repository?",
    "options": [
      "It is required for GitHub Pages to work",
      "It is displayed on the repository's homepage and describes the project, setup instructions, and usage",
      "It replaces the .gitignore file",
      "It lists all contributors automatically"
    ],
    "answer": 1,
    "explanation": "README.md is rendered as formatted text on the repository's GitHub homepage. It's the first thing visitors see — a good README explains what the project does, how to install it, how to use it, and how to contribute. Markdown (.md) enables formatting."
  },
  {
    "id": "q8",
    "text": "James runs git clone https://github.com/jkariuki/hardware-hub.git. What does this do?",
    "options": [
      "Creates an empty local repo and connects it to GitHub",
      "Downloads the full repository (all commits, branches, history) to his local machine and sets origin",
      "Downloads only the latest commit",
      "Creates a fork of the repository on GitHub"
    ],
    "answer": 1,
    "explanation": "git clone downloads the entire repository — all commits, branches, and history — and creates a local directory with it. It automatically sets origin to the cloned URL. It's the starting point when joining an existing project."
  },
  {
    "id": "q9",
    "text": "James's collaborator pushed changes to main while James was also working on main locally. git push fails. What should James do?",
    "options": [
      "Force push to override the collaborator's changes",
      "git pull (to merge remote changes locally), resolve any conflicts, then git push",
      "git reset --hard origin/main to discard his local changes",
      "Create a new repository and start over"
    ],
    "answer": 1,
    "explanation": "When the remote is ahead, git push is rejected. The correct flow: git pull to fetch and merge the remote commits into your local branch, resolve any merge conflicts, then git push. Force pushing would destroy your collaborator's work."
  },
  {
    "id": "q10",
    "text": "James enables branch protection on main — requiring at least one review before merging. Why is this good practice?",
    "options": [
      "It prevents the main branch from being deleted accidentally",
      "It ensures all code changes to main are reviewed — reducing bugs reaching production and encouraging knowledge sharing",
      "It speeds up the merge process",
      "It is required for GitHub Pages to work"
    ],
    "answer": 1,
    "explanation": "Branch protection rules enforce the PR review workflow — direct pushes to main are blocked. This catches bugs, enforces standards, and ensures no single person can unilaterally deploy untested code. Critical for any production repository."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.text)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.answer].classList.add('correct');
            const right = i === q.answer;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
