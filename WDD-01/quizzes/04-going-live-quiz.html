<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Going Live Checklist | MTTI Web Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; animation: slideDown 0.6s ease-out; }
        .header .lesson-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 6px 16px; border-radius: 999px;
            font-size: 0.85em; margin-bottom: 12px;
        }
        .header h1 {
            font-family: 'Fredoka', sans-serif; font-size: 2.2em;
            margin-bottom: 8px; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .header p { opacity: 0.95; font-size: 0.95em; }
        .score-board {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-around;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .score-item .value {
            font-size: 1.8em; font-weight: bold; font-family: 'Fredoka', sans-serif;
        }
        .progress-bar {
            width: 100%; height: 8px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 10px; transition: width 0.5s ease; width: 0%;
        }
        .exercise-card {
            background: white; color: #333; border-radius: 25px;
            padding: 35px; margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out both;
        }
        .scenario {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-left: 5px solid #ffc107;
            padding: 20px 24px; border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.98em; line-height: 1.55;
        }
        .scenario strong { color: #7a5a00; font-family: 'Fredoka', sans-serif; }
        .question {
            font-size: 1.15em; margin-bottom: 20px;
            font-weight: 700; line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: #f5f7fb; border: 2px solid transparent;
            padding: 16px 20px; border-radius: 12px;
            cursor: pointer; transition: all 0.2s ease;
            font-family: 'Space Mono', monospace; font-size: 0.98em; text-align: left;
        }
        .option:hover:not(.disabled) {
            background: #eef1fb; border-color: #667eea; transform: translateX(4px);
        }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }
        .option.disabled { cursor: not-allowed; opacity: 0.85; }
        .feedback {
            margin-top: 22px; padding: 18px 22px; border-radius: 12px;
            animation: slideUp 0.4s ease-out;
            font-size: 0.98em; line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .feedback.wrong { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .feedback strong { font-family: 'Fredoka', sans-serif; }
        .next-btn, .restart-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none;
            padding: 14px 32px; border-radius: 12px;
            font-size: 1em; cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .next-btn:hover, .restart-btn:hover { transform: scale(1.04); }
        .results {
            text-align: center; padding: 25px 15px;
            animation: bounceIn 0.6s ease-out;
        }
        .results h2 {
            font-family: 'Fredoka', sans-serif; font-size: 2em;
            margin-bottom: 12px; color: #333;
        }
        .results .final-score {
            font-size: 3em; font-family: 'Fredoka', sans-serif;
            color: #667eea; margin: 20px 0;
        }
        .results p { color: #555; margin-bottom: 12px; }
        .badge { display: inline-block; font-size: 3.5em; margin: 8px 0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lesson-tag">Module 4 · Lesson 4.6 · Quiz</div>
            <h1>Going Live Checklist</h1>
            <p></p>
        </div>

        <div class="score-board">
            <div class="score-item"><div class="label">Score</div><div class="value" id="score">0</div></div>
            <div class="score-item"><div class="label">Question</div><div class="value"><span id="current">1</span>/<span id="total">10</span></div></div>
            <div class="score-item"><div class="label">Streak</div><div class="value" id="streak">0</div></div>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div class="exercise-card" id="exerciseCard"></div>
    </div>

    <script>
        const exercises = [
  {
    "id": "q1",
    "text": "James's contact form sends a success message in JavaScript but he hasn't tested it on a real server. What is the risk?",
    "options": [
      "JavaScript success messages don't work on servers",
      "Client-side 'success' may not mean the server actually received or processed the data — James must test the full server round-trip",
      "The form works differently on Chrome vs Firefox",
      "Email confirmation messages are blocked by most hosting providers"
    ],
    "answer": 1,
    "explanation": "A JavaScript success message fires when fetch() resolves without checking if the server action (saving to DB, sending email) actually succeeded. Test the full flow: submit → verify email received → verify data saved. Never trust client-side feedback alone."
  },
  {
    "id": "q2",
    "text": "James submits his sitemap to Google Search Console. What is the benefit?",
    "options": [
      "Google immediately ranks his site on page 1",
      "Google discovers all pages on the site faster and can report indexing errors",
      "The sitemap replaces the need for meta descriptions",
      "It submits the site to all search engines simultaneously"
    ],
    "answer": 1,
    "explanation": "A sitemap.xml lists all pages you want indexed. Submitting it to Google Search Console ensures Googlebot discovers them promptly rather than relying solely on link discovery. Search Console also reports crawl errors, indexing issues, and mobile usability problems."
  },
  {
    "id": "q3",
    "text": "James tests his site on Chrome (desktop). A customer tests it on their Tecno Android phone and reports broken layout. What should James have done?",
    "options": [
      "Tested on a real Android device or used Chrome DevTools device toolbar",
      "Used a different CSS framework",
      "Checked the W3C HTML validator before launch",
      "Enabled JavaScript on the server"
    ],
    "answer": 0,
    "explanation": "Chrome on desktop doesn't replicate all Android rendering quirks — viewport differences, touch behaviour, system font sizes, and performance all differ. Real device testing (or BrowserStack) on the most common devices (Tecno, Samsung, Infinix) is essential for Kenyan market sites."
  },
  {
    "id": "q4",
    "text": "James's site uses HTTP after launch. A visitor submits the contact form. What is the risk?",
    "options": [
      "The form data is stored unencrypted on the server",
      "The form data travels as plaintext — a network observer or man-in-the-middle can read the customer's name and phone number",
      "HTTP forms require JavaScript to submit",
      "HTTP sites cannot use AJAX"
    ],
    "answer": 1,
    "explanation": "HTTP transmits data in plaintext. On a shared network (café WiFi, Safaricom router), anyone with network access can read submitted form data. HTTPS encrypts the transmission end-to-end. Modern browsers flag HTTP sites as 'Not Secure' — destroying customer trust."
  },
  {
    "id": "q5",
    "text": "James's page title is 'Document' and has no meta description. What is the SEO and UX impact?",
    "options": [
      "Search engines ignore missing titles and use the h1 instead",
      "Google shows 'Document' in search results — meaningless to potential customers, reducing click-through rate significantly",
      "Missing meta descriptions prevent indexing",
      "This only affects Safari, not Google Chrome"
    ],
    "answer": 1,
    "explanation": "The <title> is the primary headline in Google search results and browser tabs. 'Document' tells no one what the page is about. Meta descriptions appear as the preview text below the title. Both directly affect click-through rate from search results."
  },
  {
    "id": "q6",
    "text": "James clicks every link on his site before launch and finds a broken link to /about-us.html (404). What should he do?",
    "options": [
      "Add a redirect from /about-us.html to the homepage",
      "Fix the link in the HTML to point to the correct URL, or create the missing page",
      "Leave it — 404 pages are normal",
      "Add a noindex meta tag to the linked page"
    ],
    "answer": 1,
    "explanation": "The correct fix is to fix the broken link or create the missing page. A 404 frustrates users (dead end) and wastes Google's crawl budget. If the page has moved permanently, a 301 redirect is appropriate. But fixing the link directly is preferable to adding redirects."
  },
  {
    "id": "q7",
    "text": "James's site has been live for two weeks but doesn't appear in Google search results for 'hardware shop Nakuru'. What should he check first?",
    "options": [
      "His hosting plan doesn't include Google indexing",
      "Whether robots.txt is blocking Googlebot or the sitemap was submitted correctly in Search Console",
      "Whether he needs to pay Google for search ranking",
      "Whether his CSS is blocking the crawl"
    ],
    "answer": 1,
    "explanation": "New sites take 2–4 weeks to index. If they don't appear, check: (1) robots.txt isn't blocking Googlebot (Disallow: /), (2) sitemap submitted in Search Console, (3) pages are not marked noindex, (4) no crawl errors in Search Console coverage report."
  },
  {
    "id": "q8",
    "text": "James's domain and SSL certificate expire next month. What should he do?",
    "options": [
      "Wait — the registrar and hosting provider will notify him automatically",
      "Enable auto-renew on both the domain and SSL certificate, and set a personal calendar reminder as a backup",
      "SSL certificates renew automatically with Let's Encrypt — only the domain needs manual renewal",
      "Cancel and re-register when expired — it's cheaper"
    ],
    "answer": 1,
    "explanation": "Both domain and SSL expiry take the site offline or mark it 'Not Secure'. Let's Encrypt auto-renews SSL if the cron job is running (cPanel does this). Domains require payment — enable auto-renew and keep payment details current. A calendar reminder is a safety net."
  },
  {
    "id": "q9",
    "text": "James wants to know how many people visit his site and which products they view most. Which free tool should he add?",
    "options": [
      "cPanel's error log viewer",
      "Google Search Console",
      "Google Analytics (or a privacy-friendly alternative like Plausible)",
      "The browser's Network panel"
    ],
    "answer": 2,
    "explanation": "Google Analytics tracks page views, user geography, device types, traffic sources, and on-site behaviour (bounce rate, session duration). It's free and requires adding a small JavaScript snippet. Plausible.io is a privacy-friendly alternative that doesn't require cookie consent under GDPR/Kenya DPA."
  },
  {
    "id": "q10",
    "text": "James launches the site and shares it on WhatsApp. A customer opens the link and the browser shows a security warning. What is the most likely cause?",
    "options": [
      "The site has too many images",
      "The SSL certificate is self-signed, expired, or not yet provisioned — the domain doesn't have a valid HTTPS certificate",
      "WhatsApp blocks external links by default",
      "The page has too many HTTP requests"
    ],
    "answer": 1,
    "explanation": "Browser security warnings ('Your connection is not private') are triggered by: expired SSL certificate, self-signed cert, cert for a different domain, or Let's Encrypt not yet provisioned. Check Settings → Pages (GitHub) or cPanel → SSL/TLS to confirm the certificate status."
  }
];

        let currentQuestion = 0, score = 0, streak = 0, answered = false;

        function updateScoreboard() {
            document.getElementById('score').textContent = score;
            document.getElementById('current').textContent = Math.min(currentQuestion + 1, exercises.length);
            document.getElementById('total').textContent = exercises.length;
            document.getElementById('streak').textContent = streak;
            document.getElementById('progress').style.width = ((currentQuestion) / exercises.length) * 100 + '%';
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderQuestion() {
            answered = false;
            const q = exercises[currentQuestion];
            let html = '';
            if (q.scenario) {
                html += `<div class="scenario"><strong>Scenario.</strong> ${escapeHtml(q.scenario)}</div>`;
            }
            html += `<div class="question">${escapeHtml(q.text)}</div>`;
            html += '<div class="options">';
            q.options.forEach((o, i) => {
                html += `<button class="option" onclick="selectAnswer(${i})">${escapeHtml(o)}</button>`;
            });
            html += '</div>';
            document.getElementById('exerciseCard').innerHTML = html;
            updateScoreboard();
        }

        function selectAnswer(i) {
            if (answered) return;
            answered = true;
            const q = exercises[currentQuestion];
            const btns = document.querySelectorAll('.option');
            btns.forEach(b => b.classList.add('disabled'));
            btns[q.answer].classList.add('correct');
            const right = i === q.answer;
            if (!right) btns[i].classList.add('wrong');
            if (right) { score += 10; streak += 1; } else { streak = 0; }
            const fb = document.createElement('div');
            fb.className = 'feedback ' + (right ? 'correct' : 'wrong');
            fb.innerHTML = `<strong>${right ? '✅ Correct.' : '❌ Not quite.'}</strong><br>${escapeHtml(q.explanation)}`;
            document.getElementById('exerciseCard').appendChild(fb);
            const nb = document.createElement('button');
            nb.className = 'next-btn';
            nb.textContent = currentQuestion === exercises.length - 1 ? 'See results →' : 'Next scenario →';
            nb.onclick = nextQuestion;
            document.getElementById('exerciseCard').appendChild(nb);
            updateScoreboard();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= exercises.length) return showResults();
            renderQuestion();
        }

        function showResults() {
            document.getElementById('progress').style.width = '100%';
            const total = exercises.length * 10;
            const pct = Math.round(score / total * 100);
            if (window.parent) { window.parent.postMessage({type:"mtti_quiz_score", score: score, total: total, percent: pct}, "*"); }
            let badge = '🌟', msg = 'Excellent work. You have a professional grasp of this lesson.';
            if (pct < 50) { badge = '🌱'; msg = 'Good first attempt. Re-watch the lesson video and try again.'; }
            else if (pct < 80) { badge = '📚'; msg = 'Solid progress. Review the scenarios you missed and retry.'; }
            document.getElementById('exerciseCard').innerHTML = `
                <div class="results">
                    <span class="badge">${badge}</span>
                    <h2>Quiz Complete</h2>
                    <div class="final-score">${score} / ${total}</div>
                    <p><strong>${pct}%</strong> · Longest streak: ${streak}</p>
                    <p>${msg}</p>
                    <button class="restart-btn" onclick="restart()">Try again 🔁</button>
                </div>`;
        }

        function restart() {
            currentQuestion = 0; score = 0; streak = 0;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
