    <style>

        .feedback-header { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; margin-bottom: 0.5rem; }
        .feedback-header.correct { color: var(--success); }
        .feedback-header.incorrect { color: var(--error); }

        .btn-primary { background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%); color: white; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); }

        .btn-secondary { background: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: var(--error); color: var(--error); }
        .results-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; margin-top: 2rem; text-align: center; display: none; }
        .results-panel.show { display: block; }
        .results-score { font-size: 4.5rem; font-weight: 700; font-family: 'IBM Plex Mono', monospace; background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .results-label { color: var(--text-secondary); margin-bottom: 1rem; }
        .results-grade { display: inline-block; padding: 0.6rem 2rem; border-radius: 25px; font-weight: 600; margin-bottom: 1.5rem; }
        .results-grade.excellent { background: rgba(0, 184, 148, 0.2); color: var(--success); }
        .results-grade.good { background: rgba(108, 92, 231, 0.2); color: var(--accent); }
        .results-grade.average { background: rgba(253, 203, 110, 0.2); color: var(--warning); }
        .results-grade.poor { background: rgba(214, 48, 49, 0.2); color: var(--error); }
        .results-stats { display: flex; justify-content: center; gap: 4rem; }
        .stat-box-value { font-size: 2rem; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
        .stat-box-value.correct { color: var(--success); }
        .stat-box-value.incorrect { color: var(--error); }

        @media (max-width: 600px) { .main-container { padding: 1rem; } .component-grid { grid-template-columns: repeat(2, 1fr); } .calc-label { min-width: 100%; } }
    </style>

<body>
    <header class="header"><div class="header-content"><div class="logo"><div class="logo-icon">📐</div><div><h1>M.T.T.I</h1><span>CCTV Installation</span></div></div><div class="score-display"><div class="score-value" id="currentScore">0%</div><div class="score-label">Score</div></div></div></header>
    <main class="main-container">
        <div class="exam-header"><div class="unit-badge">Unit 2</div><h2 class="exam-title">System Design and Site Survey</h2><p class="exam-desc">Plan camera placement, conduct professional site surveys, calculate storage requirements, and design effective surveillance systems.</p><div class="exam-stats"><div class="stat-item"><span>📋</span> 8 Scenarios</div><div class="stat-item"><span>⏱️</span> ~25 minutes</div><div class="stat-item"><span>🎯</span> 70% to pass</div></div></div>
        <div class="scenarios" id="scenarios"></div>
        <div class="actions"><button class="btn btn-secondary" onclick="resetExam()">Reset Exam</button><button class="btn btn-primary" id="submitBtn" onclick="submitExam()">Submit Answers</button></div>
        <div class="results-panel" id="results"><div class="results-score" id="finalScore">0%</div><div class="results-label">Your Final Score</div><div class="results-grade" id="grade"></div><div class="results-stats"><div class="stat-box"><div class="stat-box-value correct" id="correctCount">0</div><div class="stat-box-label">Correct</div></div><div class="stat-box"><div class="stat-box-value incorrect" id="incorrectCount">0</div><div class="stat-box-label">Incorrect</div></div></div></div>
    </main>
    <script>
        const examData = [
            { type: "diagnosis", client: "We've had multiple break-ins through our back door. We need cameras but have a limited budget for only 2-3 cameras.", site: "Small retail shop - 50sqm, front and back entrances", requirements: ["Entry/exit monitoring", "Budget: 2-3 cameras max", "Theft deterrence"], question: "As a PRIORITY, where should cameras be installed first?", options: [{ title: "All entry/exit points (front door, back door)", desc: "Capture every person entering and leaving" },{ title: "Only the cash register area", desc: "Focus on transactions and cash handling" },{ title: "Random corners of the shop floor", desc: "General merchandise coverage" },{ title: "Only outside the building perimeter", desc: "External monitoring before entry" }], correct: 0, explanation: "Entry/exit points are ALWAYS the #1 priority. Every person entering or leaving is recorded, providing crucial evidence. The back door (where break-ins occurred) is especially critical. Cash register and shop floor are secondary." },
            { type: "procedure", client: "This is my first professional site survey. What's the correct process to follow?", site: "New commercial client premises", requirements: ["Professional assessment", "Accurate quotation needed"], question: "Arrange the site survey steps in CORRECT order:", steps: ["Create camera placement diagram with coverage angles", "Meet client and understand their security concerns", "Walk premises and identify vulnerable/high-risk areas", "Document existing infrastructure (power, network)", "Note environmental factors (lighting, obstructions)", "Prepare detailed quotation with equipment list"], correctOrder: [1, 2, 3, 4, 0, 5], explanation: "Professional survey order: Client meeting (understand needs) → Walkthrough (identify risks) → Document infrastructure → Note environment → Design camera placement → Prepare quotation. Never quote before thorough survey!" },
            { type: "calculation", client: "How much storage do we need for our 16-camera system with 30 days retention?", site: "16-camera retail installation", requirements: ["30 days retention", "1080p cameras", "H.265 compression", "24/7 recording"], question: "Calculate the storage requirements:", calculations: [{ label: "GB per camera per day (H.265)", value: "8", unit: "GB", readonly: true },{ label: "Number of cameras", value: "16", unit: "cameras", readonly: true },{ label: "Retention period", value: "30", unit: "days", readonly: true },{ label: "Total storage needed", value: "", unit: "GB", answer: ["3840", "3840gb"] },{ label: "Recommended with 20% buffer", value: "", unit: "TB", answer: ["4", "5", "4.6"] }], explanation: "Storage: 1080p H.265 ≈ 7-10GB per camera per day. 16 × 30 × 8GB = 3,840GB (3.84TB). Add 20% buffer = ~4.6TB. Use 2×3TB or 2×4TB drives in RAID. H.264 uses approximately 2× more storage." },
            { type: "component-select", client: "What should I document during my site survey visit?", site: "Commercial premises assessment", requirements: ["Professional documentation", "Accurate system design"], question: "Select ALL items to document during a professional site survey:", options: [{ icon: "📸", name: "Photos of locations", correct: true },{ icon: "📏", name: "Measurements", correct: true },{ icon: "💡", name: "Lighting conditions", correct: true },{ icon: "🔌", name: "Power outlets", correct: true },{ icon: "🎂", name: "Employee birthdays", correct: false },{ icon: "🌐", name: "Network location", correct: true },{ icon: "🚪", name: "Entry/exit points", correct: true },{ icon: "☀️", name: "Sun position/glare", correct: true }], explanation: "Document: Camera locations (photos), distances (lens selection), lighting (day AND night), power availability, network infrastructure, entry/exit points, and sun position (causes glare). Prevents costly surprises!" },
            { type: "troubleshoot-tree", client: "The client insists that 2 cameras can cover their entire 50×30m car park AND capture license plates.", site: "Car park - 50m × 30m, 40 parking spaces", requirements: ["License plate capture required", "Client budget: 2 cameras only"], question: "Handle this unrealistic expectation professionally:", steps: [{ question: "Client believes 2 cameras can cover everything with plate capture. Response?", options: ["Agree and install 2 wide-angle cameras", "Explain limitation with coverage diagram", "Refuse the job entirely"], correct: 1, followup: "You draw a diagram showing actual coverage vs. the car park area, explaining pixel density for LPR." },{ question: "Client understands but insists on their budget. What do you propose?", options: ["Prioritize entry/exit for plates + wide-angle for overview", "Install nothing until budget increases", "Use cheapest cameras for more coverage"], correct: 0, followup: "You recommend: 1 LPR camera at vehicle entrance + 1 wide-angle for general overview." },{ question: "What documentation protects both parties?", options: ["Verbal agreement is sufficient", "Written scope showing coverage limitations, signed by client", "No documentation for small jobs"], correct: 1, followup: "You provide a site diagram marking monitored vs. unmonitored zones, with client signature." }], explanation: "Educate clients with visual aids. Prioritize critical areas when budget is limited. ALWAYS document coverage limitations in writing to protect yourself from complaints about unmonitored areas." },
            { type: "diagnosis", client: "Should our CCTV be on the same network as office computers?", site: "Office building with existing IT network", requirements: ["16 IP cameras", "Existing corporate network", "Security considerations"], question: "What is the BEST network design approach?", options: [{ title: "Separate dedicated VLAN or physical network for CCTV", desc: "Isolate surveillance traffic from business network" },{ title: "Connect everything to the same switch", desc: "Simpler installation, shared infrastructure" },{ title: "Use WiFi for all cameras", desc: "No additional cabling required" },{ title: "Connect cameras directly to internet router", desc: "Direct internet access for remote viewing" }], correct: 0, explanation: "CCTV should ALWAYS be on a separate network segment (VLAN or physical). Reasons: 1) Security - isolates cameras from corporate data, 2) Bandwidth - video won't affect business operations, 3) Management - easier troubleshooting. WiFi is unreliable; direct internet is insecure." },
            { type: "fill-blank", client: "Explain the DORI standard for camera planning so I understand resolution needs.", site: "System design consultation", requirements: ["Understanding image quality requirements"], question: "Complete the DORI standard pixels-per-meter requirements:", blanks: [{ text: "D - Detection (person present): ", answer: ["25", "25ppm"], hint: "PPM minimum" },{ text: "O - Observation (some characteristics): ", answer: ["62", "60", "62ppm"], hint: "PPM minimum" },{ text: "R - Recognition (identify known person): ", answer: ["125", "125ppm"], hint: "PPM minimum" },{ text: "I - Identification (identify unknown): ", answer: ["250", "250ppm"], hint: "PPM minimum" }], explanation: "DORI standard: Detection (25 PPM) - see something is there; Observation (62 PPM) - see clothing/characteristics; Recognition (125 PPM) - confirm someone you know; Identification (250 PPM) - identify a stranger for evidence. Use DORI to calculate resolution and lens for each position." },
            { type: "diagnosis", client: "We need to monitor our 200-meter warehouse perimeter fence at night for intrusion.", site: "Industrial warehouse - 200m perimeter", requirements: ["Perimeter intrusion detection", "Night operation", "200m coverage"], question: "What camera configuration is MOST appropriate?", options: [{ title: "Multiple fixed IR cameras every 30-40m along fence", desc: "Overlapping coverage with night vision at regular intervals" },{ title: "Single PTZ camera in the center", desc: "One camera that can pan to cover all areas" },{ title: "Two wide-angle cameras at opposite corners", desc: "Corner-to-corner diagonal coverage" },{ title: "Thermal cameras with analytics only", desc: "Heat-detection for human detection" }], correct: 0, explanation: "Long perimeter needs multiple fixed cameras at regular intervals (30-50m) for continuous monitoring. PTZ can only look at one area at a time - intruders could enter undetected. Fixed IR cameras provide 24/7 coverage without gaps." }
        ];
        let answers = new Array(examData.length).fill(null);
        function init() { renderScenarios(); initDragDrop(); }
        function renderScenarios() { document.getElementById('scenarios').innerHTML = examData.map((s, i) => renderScenario(s, i)).join(''); }
        function renderScenario(s, idx) {
            let html = '';
            if (s.type === 'diagnosis') html = `<div class="diagnostic-options">${s.options.map((o, i) => `<div class="diagnostic-option" data-idx="${idx}" data-opt="${i}" onclick="selectOption(${idx},${i})"><div class="option-marker"></div><div class="option-content"><div class="option-title">${o.title}</div><div class="option-desc">${o.desc}</div></div></div>`).join('')}</div>`;
            else if (s.type === 'fill-blank') html = `<div class="fill-blanks">${s.blanks.map((b, i) => `<div class="blank-row"><span class="fill-text">${b.text}</span><input type="text" class="blank-input" data-idx="${idx}" data-b="${i}" placeholder="${b.hint}" onchange="updateBlank(${idx})"></div>`).join('')}</div>`;
            else if (s.type === 'component-select') html = `<div class="component-grid">${s.options.map((o, i) => `<div class="component-card" data-idx="${idx}" data-opt="${i}" onclick="toggleComp(${idx},${i})"><div class="component-icon">${o.icon}</div><div class="component-name">${o.name}</div></div>`).join('')}</div>`;
            else if (s.type === 'calculation') html = `<div class="calc-group">${s.calculations.map((c, i) => `<div class="calc-row"><span class="calc-label">${c.label}:</span>${c.readonly ? `<span class="calc-readonly">${c.value}</span>` : `<input type="text" class="calc-input" data-idx="${idx}" data-c="${i}" placeholder="?" onchange="updateCalc(${idx})">`}<span class="calc-unit">${c.unit}</span></div>`).join('')}</div>`;
            else if (s.type === 'troubleshoot-tree') html = `<div class="troubleshoot-tree">${s.steps.map((st, i) => `<div class="tree-step" id="ts${idx}_${i}" ${i > 0 ? 'style="display:none"' : ''}><div class="tree-question">${st.question}</div><div class="tree-options">${st.options.map((o, oi) => `<button class="tree-btn" data-idx="${idx}" data-s="${i}" data-o="${oi}" onclick="selectTree(${idx},${i},${oi})">${o}</button>`).join('')}</div><div class="tree-followup" id="tf${idx}_${i}" style="display:none"></div></div>`).join('')}</div>`;
            else if (s.type === 'procedure') { const sh = s.steps.map((t, i) => ({text: t, orig: i})).sort(() => Math.random() - 0.5); html = `<div class="procedure-list" id="proc${idx}">${sh.map((t, i) => `<div class="procedure-item" draggable="true" data-idx="${idx}" data-orig="${t.orig}"><span class="drag-handle">⋮⋮</span><div class="procedure-num">${i + 1}</div><div class="procedure-text">${t.text}</div></div>`).join('')}</div>`; }
            return `<div class="scenario-card" id="card${idx}"><div class="scenario-header"><div class="scenario-num"><strong>${idx + 1}</strong> of ${examData.length}</div><div class="scenario-type">${{'diagnosis':'🔍 Diagnosis','fill-blank':'✏️ Fill Blanks','component-select':'🎯 Select All','calculation':'🧮 Calculation','troubleshoot-tree':'🌳 Decision Tree','procedure':'📋 Ordering'}[s.type]}</div></div><div class="scenario-body">${s.client ? `<div class="job-brief"><div class="brief-label">📋 Client Request</div><div class="brief-text">"${s.client}"</div>${s.site ? `<div class="site-info">📍 ${s.site}</div>` : ''}</div>` : ''}${s.requirements?.length ? `<div class="requirements-box"><div class="requirements-label">Requirements</div><div class="requirements-list">${s.requirements.map(r => `<span class="req-tag">• ${r}</span>`).join('')}</div></div>` : ''}<div class="question-section"><div class="question-text">${s.question}</div>${html}</div><div class="feedback-box" id="fb${idx}"><div class="feedback-header"><span class="feedback-icon"></span><span class="feedback-title"></span></div><div class="feedback-text">${s.explanation}</div><div class="correct-answer" id="ca${idx}"></div></div></div></div>`;
        }
        function selectOption(idx, opt) { if (document.querySelector(`.diagnostic-option[data-idx="${idx}"]`)?.classList.contains('disabled')) return; document.querySelectorAll(`.diagnostic-option[data-idx="${idx}"]`).forEach(e => e.classList.remove('selected')); document.querySelector(`.diagnostic-option[data-idx="${idx}"][data-opt="${opt}"]`).classList.add('selected'); answers[idx] = opt; }
        function updateBlank(idx) { answers[idx] = Array.from(document.querySelectorAll(`.blank-input[data-idx="${idx}"]`)).map(e => e.value.trim().toLowerCase()); }
        function toggleComp(idx, opt) { const c = document.querySelector(`.component-card[data-idx="${idx}"][data-opt="${opt}"]`); if (c.classList.contains('disabled')) return; c.classList.toggle('selected'); answers[idx] = Array.from(document.querySelectorAll(`.component-card[data-idx="${idx}"].selected`)).map(e => parseInt(e.dataset.opt)); }
        function updateCalc(idx) { answers[idx] = Array.from(document.querySelectorAll(`.calc-input[data-idx="${idx}"]`)).map(e => e.value.trim().toLowerCase()); }
        function selectTree(idx, step, opt) { const s = examData[idx]; const btns = document.querySelectorAll(`.tree-btn[data-idx="${idx}"][data-s="${step}"]`); if (btns[0].classList.contains('disabled')) return; btns.forEach(b => b.classList.remove('selected')); btns[opt].classList.add('selected'); if (!answers[idx]) answers[idx] = []; answers[idx][step] = opt; document.getElementById(`tf${idx}_${step}`).textContent = s.steps[step].followup; document.getElementById(`tf${idx}_${step}`).style.display = 'block'; if (step < s.steps.length - 1) setTimeout(() => document.getElementById(`ts${idx}_${step + 1}`).style.display = 'block', 400); }
        let draggedItem = null;
        function initDragDrop() { document.querySelectorAll('.procedure-item').forEach(item => { item.addEventListener('dragstart', () => { draggedItem = item; item.classList.add('dragging'); }); item.addEventListener('dragend', () => { item.classList.remove('dragging'); document.querySelectorAll('.procedure-item').forEach(i => i.classList.remove('drag-over')); }); item.addEventListener('dragover', e => { e.preventDefault(); if (item !== draggedItem && !item.classList.contains('disabled')) item.classList.add('drag-over'); }); item.addEventListener('dragleave', () => item.classList.remove('drag-over')); item.addEventListener('drop', e => { e.preventDefault(); if (item !== draggedItem && !item.classList.contains('disabled')) { const container = item.parentNode, all = [...container.querySelectorAll('.procedure-item')]; if (all.indexOf(draggedItem) < all.indexOf(item)) item.after(draggedItem); else item.before(draggedItem); container.querySelectorAll('.procedure-item').forEach((el, i) => el.querySelector('.procedure-num').textContent = i + 1); answers[item.dataset.idx] = [...container.querySelectorAll('.procedure-item')].map(el => parseInt(el.dataset.orig)); } item.classList.remove('drag-over'); }); }); }
        function submitExam() {
            let correct = 0;
            examData.forEach((s, idx) => {
                const ans = answers[idx], card = document.getElementById(`card${idx}`), fb = document.getElementById(`fb${idx}`), ca = document.getElementById(`ca${idx}`);
                let ok = false;
                if (s.type === 'diagnosis') { ok = ans === s.correct; document.querySelectorAll(`.diagnostic-option[data-idx="${idx}"]`).forEach((e, i) => { e.classList.add('disabled'); if (i === s.correct) e.classList.add('correct'); else if (i === ans && !ok) e.classList.add('incorrect'); }); ca.textContent = `✓ ${s.options[s.correct].title}`; }
                else if (s.type === 'fill-blank') { let all = true; document.querySelectorAll(`.blank-input[data-idx="${idx}"]`).forEach((e, i) => { e.disabled = true; const acc = s.blanks[i].answer.map(a => a.toLowerCase()); if (ans && acc.some(a => ans[i]?.includes(a) || a.includes(ans[i] || ''))) e.classList.add('correct'); else { e.classList.add('incorrect'); all = false; } }); ok = all; ca.textContent = `Answers: ${s.blanks.map(b => b.answer[0]).join(', ')}`; }
                else if (s.type === 'component-select') { const corr = s.options.map((o, i) => o.correct ? i : -1).filter(i => i !== -1), sel = ans || []; ok = corr.length === sel.length && corr.every(i => sel.includes(i)); document.querySelectorAll(`.component-card[data-idx="${idx}"]`).forEach((e, i) => { e.classList.add('disabled'); if (s.options[i].correct) e.classList.add('correct'); else if (sel.includes(i)) e.classList.add('incorrect'); }); ca.textContent = `Correct: ${s.options.filter(o => o.correct).map(o => o.name).join(', ')}`; }
                else if (s.type === 'calculation') { let cok = true, ci = 0; document.querySelectorAll(`.calc-input[data-idx="${idx}"]`).forEach(e => { e.disabled = true; const ed = s.calculations.filter(c => !c.readonly); if (ci < ed.length) { const acc = ed[ci].answer.map(a => a.toString().toLowerCase()); const ua = (ans && ans[ci]) ? ans[ci] : ''; if (acc.some(a => a === ua || a.includes(ua) || ua.includes(a))) e.classList.add('correct'); else { e.classList.add('incorrect'); cok = false; } ci++; } }); ok = cok; ca.textContent = `Answers: ${s.calculations.filter(c => !c.readonly).map(c => c.answer[0] + ' ' + c.unit).join(', ')}`; }
                else if (s.type === 'troubleshoot-tree') { ok = ans && ans.length === s.steps.length && s.steps.every((st, i) => ans[i] === st.correct); document.querySelectorAll(`.tree-btn[data-idx="${idx}"]`).forEach(b => { b.classList.add('disabled'); if (parseInt(b.dataset.o) === s.steps[parseInt(b.dataset.s)].correct) b.classList.add('correct'); else if (b.classList.contains('selected')) b.classList.add('incorrect'); }); s.steps.forEach((_, i) => { document.getElementById(`ts${idx}_${i}`).style.display = 'block'; document.getElementById(`tf${idx}_${i}`).style.display = 'block'; }); }
                else if (s.type === 'procedure') { ok = JSON.stringify(ans || []) === JSON.stringify(s.correctOrder); document.querySelectorAll(`#proc${idx} .procedure-item`).forEach((el, i) => { el.classList.add('disabled'); el.draggable = false; if ((ans || [])[i] === s.correctOrder[i]) el.classList.add('correct'); else el.classList.add('incorrect'); }); ca.textContent = `Correct order: ${s.correctOrder.map(i => i + 1).join(' → ')}`; }
                if (ok) { correct++; card.classList.add('correct'); fb.classList.add('correct', 'show'); fb.querySelector('.feedback-header').classList.add('correct'); fb.querySelector('.feedback-icon').textContent = '✓'; fb.querySelector('.feedback-title').textContent = 'Correct!'; }
                else { card.classList.add('incorrect'); fb.classList.add('incorrect', 'show'); fb.querySelector('.feedback-header').classList.add('incorrect'); fb.querySelector('.feedback-icon').textContent = '✗'; fb.querySelector('.feedback-title').textContent = 'Incorrect'; }
            });
            const pct = Math.round((correct / examData.length) * 100);
            document.getElementById('currentScore').textContent = `${pct}%`; document.getElementById('finalScore').textContent = `${pct}%`; document.getElementById('correctCount').textContent = correct; document.getElementById('incorrectCount').textContent = examData.length - correct;
            const g = document.getElementById('grade'); if (pct >= 90) { g.textContent = 'Excellent!'; g.className = 'results-grade excellent'; } else if (pct >= 70) { g.textContent = 'Good Job!'; g.className = 'results-grade good'; } else if (pct >= 50) { g.textContent = 'Average'; g.className = 'results-grade average'; } else { g.textContent = 'Needs Practice'; g.className = 'results-grade poor'; }
            document.getElementById('results').classList.add('show'); document.getElementById('submitBtn').disabled = true;
            
            // Save results to MTTI system
            if (typeof submitExamToMTTI === 'function') {
                const questionResults = examData.map((s, idx) => ({
                    question: s.question,
                    type: s.type,
                    correct: document.getElementById(`card${idx}`).classList.contains('correct')
                }));
                
                submitExamToMTTI(
                    'CCTV Unit 2: System Design & Site Survey',
                    correct,
                    examData.length,
                    questionResults,
                    0
                ).then(result => {
                    if (result.success) {
                        console.log('✅ Results saved to MTTI:', result.data);
                    } else {
                        console.error('❌ Failed to save results:', result.message);
                    }
                });
            }
        }
        function resetExam() { answers = new Array(examData.length).fill(null); document.getElementById('currentScore').textContent = '0%'; document.getElementById('results').classList.remove('show'); document.getElementById('submitBtn').disabled = false; renderScenarios(); initDragDrop(); }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
