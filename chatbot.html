<!-- MTTI Chatbot Widget -->
<!-- Add this code just before </body> tag in your WordPress theme -->

<style>
/* MTTI Chatbot Styles */
#mtti-chat-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

#mtti-chat-button {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s, box-shadow 0.3s;
}

#mtti-chat-button:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 25px rgba(0,0,0,0.4);
}

#mtti-chat-button svg {
    width: 30px;
    height: 30px;
    fill: #00d4ff;
}

#mtti-chat-button.has-notification::after {
    content: '1';
    position: absolute;
    top: -5px;
    right: -5px;
    background: #ff4757;
    color: white;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

#mtti-chat-box {
    display: none;
    position: absolute;
    bottom: 70px;
    right: 0;
    width: 350px;
    height: 500px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    overflow: hidden;
    flex-direction: column;
}

#mtti-chat-box.open {
    display: flex;
}

#mtti-chat-header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: white;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
}

#mtti-chat-header img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #00d4ff;
}

#mtti-chat-header-info h4 {
    margin: 0;
    font-size: 14px;
}

#mtti-chat-header-info p {
    margin: 0;
    font-size: 11px;
    color: #8892b0;
}

#mtti-chat-close {
    margin-left: auto;
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    padding: 0;
    line-height: 1;
}

#mtti-chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: #f8f9fa;
}

.mtti-message {
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
}

.mtti-message.bot {
    align-items: flex-start;
}

.mtti-message.user {
    align-items: flex-end;
}

.mtti-message-bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.4;
}

.mtti-message.bot .mtti-message-bubble {
    background: white;
    color: #333;
    border: 1px solid #e0e0e0;
    border-bottom-left-radius: 4px;
}

.mtti-message.user .mtti-message-bubble {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: white;
    border-bottom-right-radius: 4px;
}

#mtti-chat-options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 15px;
    background: #f8f9fa;
    border-top: 1px solid #e0e0e0;
}

.mtti-option-btn {
    background: white;
    border: 2px solid #00d4ff;
    color: #1a1a2e;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.3s;
}

.mtti-option-btn:hover {
    background: #00d4ff;
    color: white;
}

#mtti-chat-input-area {
    display: flex;
    padding: 10px;
    background: white;
    border-top: 1px solid #e0e0e0;
}

#mtti-chat-input {
    flex: 1;
    border: 1px solid #e0e0e0;
    border-radius: 20px;
    padding: 10px 15px;
    font-size: 14px;
    outline: none;
}

#mtti-chat-input:focus {
    border-color: #00d4ff;
}

#mtti-chat-send {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border: none;
    color: #00d4ff;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-left: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

#mtti-chat-send:hover {
    opacity: 0.9;
}

.mtti-typing {
    display: flex;
    gap: 4px;
    padding: 10px 14px;
}

.mtti-typing span {
    width: 8px;
    height: 8px;
    background: #8892b0;
    border-radius: 50%;
    animation: typing 1s infinite;
}

.mtti-typing span:nth-child(2) { animation-delay: 0.2s; }
.mtti-typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1); }
}

/* Mobile responsive */
@media (max-width: 480px) {
    #mtti-chat-box {
        width: 100%;
        height: 100%;
        bottom: 0;
        right: 0;
        border-radius: 0;
    }
    
    #mtti-chat-widget {
        bottom: 10px;
        right: 10px;
    }
}
</style>

<div id="mtti-chat-widget">
    <!-- Chat Button -->
    <button id="mtti-chat-button" class="has-notification" onclick="toggleMTTIChat()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
        </svg>
    </button>
    
    <!-- Chat Box -->
    <div id="mtti-chat-box">
        <div id="mtti-chat-header">
            <div style="width:40px;height:40px;border-radius:50%;background:#00d4ff;display:flex;align-items:center;justify-content:center;font-size:20px;">🎓</div>
            <div id="mtti-chat-header-info">
                <h4>MTTI Admissions</h4>
                <p>🟢 Online | Typically replies instantly</p>
            </div>
            <button id="mtti-chat-close" onclick="toggleMTTIChat()">×</button>
        </div>
        
        <div id="mtti-chat-messages"></div>
        
        <div id="mtti-chat-options"></div>
        
        <div id="mtti-chat-input-area">
            <input type="text" id="mtti-chat-input" placeholder="Type your message..." onkeypress="handleMTTIKeyPress(event)">
            <button id="mtti-chat-send" onclick="sendMTTIMessage()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
// MTTI Chatbot Configuration
const MTTI_CONFIG = {
    courses: [
        { name: 'Computer Applications', duration: '1 month', fee: 'KES 4,500' },
        { name: 'Web Development', duration: '2 months', fee: 'KES 12,000' },
        { name: 'Graphic Design', duration: '2 months', fee: 'KES 15,000' },
        { name: 'Digital Marketing', duration: '2 months', fee: 'KES 10,000' },
        { name: 'Cybersecurity', duration: '2 months', fee: 'KES 15,000' },
        { name: 'Computer  Repair', duration: '2 month', fee: 'KES 8,000' },
        { name: 'CCTV Installation', duration: '2 month', fee: 'KES 18,000' }
		{ name: 'CCTV Video Editing', duration: '2 month', fee: 'KES 15,000' }
		{ name: 'Graphic Design', duration: '2 month', fee: 'KES 12,000' }
		{ name: 'Computer Essentails', duration: '2 weeks', fee: 'KES 1,500' }
		{ name: 'German langauage', duration: '2 month Per Module', fee: 'KES 24,000' }
		{ name: 'Nursing Assistant', duration: '6 month', fee: 'KES 60,000' }
		{ name: 'Care Giver', duration: '3 month', fee: 'KES 30,000' }
    ],
    contact: {
        phone: '0712464936',
        email: 'info@masomoteletraining.co.ke',
        location: 'Sagaas Center, 4th Floor, Eldoret',
        website: 'masomoteletraining.co.ke'
    },
    whatsapp: 'https://wa.me/254712464936'
};

let chatState = 'welcome';
let userData = { name: '', phone: '', email: '', course: '' };

// Initialize chat
function initMTTIChat() {
    setTimeout(() => {
        addBotMessage("👋 Hello! Welcome to Masomotele Technical Training Institute!");
        setTimeout(() => {
            addBotMessage("I'm here to help you find the perfect course and get you enrolled. What would you like to know?");
            showOptions([
                { text: '📚 View Courses', action: 'courses' },
                { text: '💰 Fees & Duration', action: 'fees' },
                { text: '📍 Location', action: 'location' },
                { text: '✍️ Apply Now', action: 'apply' }
            ]);
        }, 1000);
    }, 500);
}

// Toggle chat open/close
function toggleMTTIChat() {
    const chatBox = document.getElementById('mtti-chat-box');
    const chatButton = document.getElementById('mtti-chat-button');
    
    if (chatBox.classList.contains('open')) {
        chatBox.classList.remove('open');
    } else {
        chatBox.classList.add('open');
        chatButton.classList.remove('has-notification');
        
        // Initialize chat if first time
        if (document.getElementById('mtti-chat-messages').children.length === 0) {
            initMTTIChat();
        }
    }
}

// Add bot message
function addBotMessage(text) {
    const messagesDiv = document.getElementById('mtti-chat-messages');
    const messageDiv = document.createElement('div');
    messageDiv.className = 'mtti-message bot';
    messageDiv.innerHTML = `<div class="mtti-message-bubble">${text}</div>`;
    messagesDiv.appendChild(messageDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// Add user message
function addUserMessage(text) {
    const messagesDiv = document.getElementById('mtti-chat-messages');
    const messageDiv = document.createElement('div');
    messageDiv.className = 'mtti-message user';
    messageDiv.innerHTML = `<div class="mtti-message-bubble">${text}</div>`;
    messagesDiv.appendChild(messageDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// Show typing indicator
function showTyping() {
    const messagesDiv = document.getElementById('mtti-chat-messages');
    const typingDiv = document.createElement('div');
    typingDiv.className = 'mtti-message bot';
    typingDiv.id = 'mtti-typing';
    typingDiv.innerHTML = `<div class="mtti-message-bubble mtti-typing"><span></span><span></span><span></span></div>`;
    messagesDiv.appendChild(typingDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// Hide typing indicator
function hideTyping() {
    const typing = document.getElementById('mtti-typing');
    if (typing) typing.remove();
}

// Show option buttons
function showOptions(options) {
    const optionsDiv = document.getElementById('mtti-chat-options');
    optionsDiv.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'mtti-option-btn';
        btn.textContent = opt.text;
        btn.onclick = () => handleOption(opt.action, opt.text);
        optionsDiv.appendChild(btn);
    });
}

// Clear options
function clearOptions() {
    document.getElementById('mtti-chat-options').innerHTML = '';
}

// Handle option click
function handleOption(action, text) {
    addUserMessage(text);
    clearOptions();
    showTyping();
    
    setTimeout(() => {
        hideTyping();
        
        switch(action) {
            case 'courses':
                showCourses();
                break;
            case 'fees':
                showFees();
                break;
            case 'location':
                showLocation();
                break;
            case 'apply':
                startApplication();
                break;
            case 'course_select':
                userData.course = text;
                askName();
                break;
            case 'confirm_yes':
                submitApplication();
                break;
            case 'confirm_no':
                startApplication();
                break;
            case 'more_info':
                showMoreOptions();
                break;
            default:
                handleCourseSelect(action);
        }
    }, 800);
}

// Show courses
function showCourses() {
    let courseList = "📚 <strong>Our Courses:</strong><br><br>";
    MTTI_CONFIG.courses.forEach((c, i) => {
        courseList += `${i+1}. <strong>${c.name}</strong><br>   ⏱️ ${c.duration} | 💰 ${c.fee}<br><br>`;
    });
    addBotMessage(courseList);
    
    setTimeout(() => {
        addBotMessage("Which course interests you? 👇");
        showOptions([
            ...MTTI_CONFIG.courses.slice(0, 4).map(c => ({ text: c.name, action: 'course_select' })),
            { text: '📋 More Courses', action: 'more_courses' }
        ]);
    }, 500);
}

// Show fees
function showFees() {
    let feeList = "💰 <strong>Course Fees & Duration:</strong><br><br>";
    MTTI_CONFIG.courses.forEach(c => {
        feeList += `• <strong>${c.name}</strong>: ${c.fee} (${c.duration})<br>`;
    });
    feeList += "<br>✅ Flexible payment plans available!";
    addBotMessage(feeList);
    showOptions([
        { text: '✍️ Apply Now', action: 'apply' },
        { text: '📍 Location', action: 'location' },
        { text: '💬 Talk to Admissions', action: 'contact' }
    ]);
}

// Show location
function showLocation() {
    addBotMessage(`📍 <strong>Our Location:</strong><br><br>
        🏢 ${MTTI_CONFIG.contact.location}<br><br>
        📞 Phone: <a href="tel:${MTTI_CONFIG.contact.phone}">${MTTI_CONFIG.contact.phone}</a><br>
        ✉️ Email: ${MTTI_CONFIG.contact.email}<br>
        🌐 Website: ${MTTI_CONFIG.contact.website}<br><br>
        <a href="${MTTI_CONFIG.whatsapp}" target="_blank" style="color:#25d366;font-weight:bold;">💬 WhatsApp Us Now!</a>`);
    showOptions([
        { text: '✍️ Apply Now', action: 'apply' },
        { text: '📚 View Courses', action: 'courses' }
    ]);
}

// Start application process
function startApplication() {
    chatState = 'select_course';
    addBotMessage("Great! Let's get you enrolled! 🎉<br><br>First, which course would you like to apply for?");
    showOptions(MTTI_CONFIG.courses.map(c => ({ text: c.name, action: 'course_select' })));
}

// Ask for name
function askName() {
    chatState = 'ask_name';
    addBotMessage(`Excellent choice! <strong>${userData.course}</strong> is very popular! 👍<br><br>What's your full name?`);
    clearOptions();
}

// Ask for phone
function askPhone() {
    chatState = 'ask_phone';
    addBotMessage(`Nice to meet you, <strong>${userData.name}</strong>! 😊<br><br>What's your phone number? (We'll WhatsApp you the enrollment details)`);
}

// Ask for email
function askEmail() {
    chatState = 'ask_email';
    addBotMessage("Almost done! What's your email address? (Optional - type 'skip' to skip)");
}

// Confirm application
function confirmApplication() {
    chatState = 'confirm';
    addBotMessage(`📋 <strong>Please confirm your details:</strong><br><br>
        👤 Name: ${userData.name}<br>
        📞 Phone: ${userData.phone}<br>
        ✉️ Email: ${userData.email || 'Not provided'}<br>
        📚 Course: ${userData.course}<br><br>
        Is this correct?`);
    showOptions([
        { text: '✅ Yes, Submit', action: 'confirm_yes' },
        { text: '❌ No, Start Over', action: 'confirm_no' }
    ]);
}

// Submit application
function submitApplication() {
    addBotMessage("🎉 <strong>Application Submitted Successfully!</strong><br><br>Thank you for choosing MTTI!<br><br>Our admissions team will contact you within 24 hours via WhatsApp or phone call.<br><br>📞 Or call us now: <a href='tel:0712464936'>0712 464 936</a>");
    
    // Send to Google Sheets via webhook (you'll need to set this up)
    sendToWebhook(userData);
    
    setTimeout(() => {
        addBotMessage(`💬 Want faster response? <a href="${MTTI_CONFIG.whatsapp}?text=Hi! I just applied for ${userData.course}. My name is ${userData.name}." target="_blank" style="color:#25d366;font-weight:bold;">WhatsApp us now!</a>`);
        showOptions([
            { text: '📚 View More Courses', action: 'courses' },
            { text: '📍 Get Directions', action: 'location' }
        ]);
    }, 1000);
    
    chatState = 'complete';
}

// Send to webhook (Google Sheets/Make.com)
function sendToWebhook(data) {
    // Replace with your Make.com webhook URL
    const webhookURL = 'YOUR_MAKE_WEBHOOK_URL_HERE';
    
    if (webhookURL !== 'YOUR_MAKE_WEBHOOK_URL_HERE') {
        fetch(webhookURL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: data.name,
                phone: data.phone,
                email: data.email,
                course: data.course,
                source: 'Website Chatbot',
                timestamp: new Date().toISOString()
            })
        }).catch(err => console.log('Webhook error:', err));
    }
    
    // Also log to console for testing
    console.log('MTTI Lead:', data);
}

// Handle text input
function sendMTTIMessage() {
    const input = document.getElementById('mtti-chat-input');
    const message = input.value.trim();
    
    if (!message) return;
    
    addUserMessage(message);
    input.value = '';
    showTyping();
    
    setTimeout(() => {
        hideTyping();
        processMessage(message);
    }, 800);
}

// Process user message based on state
function processMessage(message) {
    switch(chatState) {
        case 'ask_name':
            userData.name = message;
            askPhone();
            break;
        case 'ask_phone':
            if (validatePhone(message)) {
                userData.phone = message;
                askEmail();
            } else {
                addBotMessage("Please enter a valid Kenyan phone number (e.g., 0712345678)");
            }
            break;
        case 'ask_email':
            if (message.toLowerCase() === 'skip') {
                userData.email = '';
            } else {
                userData.email = message;
            }
            confirmApplication();
            break;
        default:
            handleGeneralMessage(message);
    }
}

// Handle general messages
function handleGeneralMessage(message) {
    const lowerMsg = message.toLowerCase();
    
    if (lowerMsg.includes('course') || lowerMsg.includes('learn') || lowerMsg.includes('study')) {
        showCourses();
    } else if (lowerMsg.includes('fee') || lowerMsg.includes('cost') || lowerMsg.includes('price') || lowerMsg.includes('pay')) {
        showFees();
    } else if (lowerMsg.includes('where') || lowerMsg.includes('location') || lowerMsg.includes('address') || lowerMsg.includes('direction')) {
        showLocation();
    } else if (lowerMsg.includes('apply') || lowerMsg.includes('enroll') || lowerMsg.includes('register') || lowerMsg.includes('join')) {
        startApplication();
    } else if (lowerMsg.includes('hello') || lowerMsg.includes('hi') || lowerMsg.includes('hey')) {
        addBotMessage("Hello! 👋 How can I help you today?");
        showOptions([
            { text: '📚 View Courses', action: 'courses' },
            { text: '💰 Fees & Duration', action: 'fees' },
            { text: '✍️ Apply Now', action: 'apply' }
        ]);
    } else if (lowerMsg.includes('web')) {
        showCourseDetail('Web Development');
    } else if (lowerMsg.includes('graphic') || lowerMsg.includes('design')) {
        showCourseDetail('Graphic Design');
    } else if (lowerMsg.includes('computer')) {
        showCourseDetail('Computer Applications');
    } else if (lowerMsg.includes('cyber') || lowerMsg.includes('security')) {
        showCourseDetail('Cybersecurity');
    } else if (lowerMsg.includes('cctv')) {
        showCourseDetail('CCTV Installation');
    } else if (lowerMsg.includes('phone') || lowerMsg.includes('mobile') || lowerMsg.includes('repair')) {
        showCourseDetail('Mobile Phone Repair');
    } else if (lowerMsg.includes('marketing') || lowerMsg.includes('digital')) {
        showCourseDetail('Digital Marketing');
    } else {
        addBotMessage("I'd be happy to help! Here are some things I can assist with:");
        showOptions([
            { text: '📚 View Courses', action: 'courses' },
            { text: '💰 Fees & Duration', action: 'fees' },
            { text: '📍 Location', action: 'location' },
            { text: '✍️ Apply Now', action: 'apply' }
        ]);
    }
}

// Show specific course detail
function showCourseDetail(courseName) {
    const course = MTTI_CONFIG.courses.find(c => c.name === courseName);
    if (course) {
        addBotMessage(`📚 <strong>${course.name}</strong><br><br>
            ⏱️ Duration: ${course.duration}<br>
            💰 Fee: ${course.fee}<br><br>
            ✅ Practical hands-on training<br>
            ✅ Industry-ready skills<br>
            ✅ Job placement assistance<br><br>
            Would you like to apply?`);
        userData.course = courseName;
        showOptions([
            { text: '✍️ Apply Now', action: 'apply' },
            { text: '📚 Other Courses', action: 'courses' },
            { text: '💬 Talk to Admissions', action: 'contact' }
        ]);
    }
}

// Validate phone number
function validatePhone(phone) {
    const cleaned = phone.replace(/\D/g, '');
    return cleaned.length >= 9 && cleaned.length <= 12;
}

// Handle enter key
function handleMTTIKeyPress(event) {
    if (event.key === 'Enter') {
        sendMTTIMessage();
    }
}

// Show more options
function showMoreOptions() {
    showOptions([
        { text: '📚 View Courses', action: 'courses' },
        { text: '💰 Fees & Duration', action: 'fees' },
        { text: '📍 Location', action: 'location' },
        { text: '✍️ Apply Now', action: 'apply' }
    ]);
}

// Auto-open chat after 5 seconds (optional)
setTimeout(() => {
    const chatBox = document.getElementById('mtti-chat-box');
    if (!chatBox.classList.contains('open')) {
        // Uncomment below to auto-open
        // toggleMTTIChat();
    }
}, 5000);
</script>
