<!DOCTYPE html>
<html lang="en">
<head>

    <style>

        .tree-btn:hover:not(.disabled) { border-color: var(--accent); }

        .tree-btn.correct { border-color: var(--success); background: rgba(0, 184, 148, 0.15); }

        .component-card.correct { border-color: var(--success); background: rgba(0, 184, 148, 0.1); }
        .component-card.incorrect { border-color: var(--error); background: rgba(214, 48, 49, 0.1); }
        .component-card.disabled { cursor: not-allowed; opacity: 0.7; }
        .component-icon { font-size: 2rem; margin-bottom: 0.5rem; }
        .component-name { font-size: 0.8rem; font-weight: 500; }
        .calc-group { background: var(--bg-input); border-radius: 10px; padding: 1.25rem; }
        .calc-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
        .calc-label { min-width: 240px; font-size: 0.85rem; color: var(--text-secondary); }
        .calc-input { width: 100px; padding: 0.6rem 0.75rem; background: var(--bg-dark); border: 2px solid var(--border); border-radius: 6px; color: var(--text-primary); font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; text-align: center; }
        .calc-input:focus { outline: none; border-color: var(--accent); }
        .calc-input.correct { border-color: var(--success); background: rgba(0, 184, 148, 0.1); }
        .calc-input.incorrect { border-color: var(--error); background: rgba(214, 48, 49, 0.1); }
        .calc-unit { font-size: 0.85rem; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }
        .calc-readonly { font-weight: 600; color: var(--text-primary); }
        .feedback-box { margin-top: 1.25rem; padding: 1.25rem; border-radius: 10px; display: none; }
        .feedback-box.show { display: block; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .feedback-box.correct { background: rgba(0, 184, 148, 0.1); border: 1px solid var(--success); }
        .feedback-box.incorrect { background: rgba(214, 48, 49, 0.1); border: 1px solid var(--error); }
        .feedback-header { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; margin-bottom: 0.5rem; }
        .feedback-header.correct { color: var(--success); }
        .feedback-header.incorrect { color: var(--error); }
        .feedback-text { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.7; }
        .correct-answer { margin-top: 0.75rem; padding: 0.625rem 0.875rem; background: var(--bg-dark); border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; }
        .actions { margin-top: 2rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .btn { padding: 1rem 2.5rem; border: none; border-radius: 10px; font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%); color: white; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(9, 132, 227, 0.3); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: var(--error); color: var(--error); }
        .results-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; margin-top: 2rem; text-align: center; display: none; }
        .results-panel.show { display: block; }
        .results-score { font-size: 4.5rem; font-weight: 700; font-family: 'IBM Plex Mono', monospace; background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .results-label { color: var(--text-secondary); margin-bottom: 1rem; font-size: 1.1rem; }
        .results-grade { display: inline-block; padding: 0.6rem 2rem; border-radius: 25px; font-weight: 600; font-size: 1.1rem; margin-bottom: 1.5rem; }
        .results-grade.excellent { background: rgba(0, 184, 148, 0.2); color: var(--success); }
        .results-grade.good { background: rgba(9, 132, 227, 0.2); color: var(--accent); }
        .results-grade.average { background: rgba(253, 203, 110, 0.2); color: var(--warning); }
        .results-grade.poor { background: rgba(214, 48, 49, 0.2); color: var(--error); }
        .results-stats { display: flex; justify-content: center; gap: 4rem; }

        .stat-box-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        @media (max-width: 600px) { .main-container { padding: 1rem; } .exam-title { font-size: 1.4rem; } .component-grid { grid-template-columns: repeat(2, 1fr); } .calc-label { min-width: 100%; } }

<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">💾</div>
                <div><h1>M.T.T.I</h1><span>CCTV Installation</span></div>
            </div>
            <div class="score-display">
                <div class="score-value" id="currentScore">0%</div>
                <div class="score-label">Score</div>
            </div>
        </div>
    </header>
    <main class="main-container">
        <div class="exam-header">
            <div class="unit-badge">Unit 4</div>
            <h2 class="exam-title">Video Transmission and Storage</h2>
            <p class="exam-desc">Configure recording settings, compression codecs, remote access, storage systems, and bandwidth management.</p>
            <div class="exam-stats">
                <div class="stat-item"><span>📋</span> 8 Scenarios</div>
                <div class="stat-item"><span>⏱️</span> ~25 minutes</div>
                <div class="stat-item"><span>🎯</span> 70% to pass</div>
            </div>
        </div>
        <div class="scenarios" id="scenarios"></div>
        <div class="actions">
            <button class="btn btn-secondary" onclick="resetExam()">Reset Exam</button>
            <button class="btn btn-primary" id="submitBtn" onclick="submitExam()">Submit Answers</button>
        </div>
        <div class="results-panel" id="results">
            <div class="results-score" id="finalScore">0%</div>
            <div class="results-label">Your Final Score</div>
            <div class="results-grade" id="grade"></div>
            <div class="results-stats">
                <div class="stat-box"><div class="stat-box-value correct" id="correctCount">0</div><div class="stat-box-label">Correct</div></div>
                <div class="stat-box"><div class="stat-box-value incorrect" id="incorrectCount">0</div><div class="stat-box-label">Incorrect</div></div>
            </div>
        </div>
    </main>
    <script>
        const examData = [
            {
                type: "fill-blank",
                client: "I need to understand video compression to optimize our storage capacity and network bandwidth.",
                site: "System optimization consultation",
                requirements: ["Storage efficiency", "Bandwidth management", "Quality retention"],
                question: "Complete the video compression knowledge:",
                blanks: [
                    { text: "Current most efficient codec is H.", answer: ["265", "265+", "hevc"], hint: "latest standard" },
                    { text: "H.265 saves approximately ", answer: ["50", "50%", "half"], hint: "percent vs H.264" },
                    { text: "Higher compression requires more ", answer: ["cpu", "processing", "cpu power"], hint: "computing resource" },
                    { text: "Live streaming protocol: ", answer: ["rtsp", "rtsp://"], hint: "Real Time Streaming" }
                ],
                explanation: "H.265 (HEVC) is approximately 50% more efficient than H.264, meaning same quality at half the bitrate/storage. However, it requires more CPU for encoding/decoding. Some cameras offer H.265+ or Smart Codec with even better efficiency. RTSP (Real Time Streaming Protocol) is standard for live video streaming from IP cameras."
            },
            {
                type: "calculation",
                client: "I need to determine the internet upload speed required for remote viewing of all 4 cameras.",
                site: "Small business - 4 camera system with remote access",
                requirements: ["4 cameras at 1080p", "Remote viewing capability", "Smooth playback needed"],
                question: "Calculate the bandwidth requirements:",
                calculations: [
                    { label: "Main stream bitrate per 1080p H.264 camera", value: "4", unit: "Mbps", readonly: true },
                    { label: "Number of cameras", value: "4", unit: "cameras", readonly: true },
                    { label: "Total bandwidth for all main streams", value: "", unit: "Mbps", answer: ["16", "16mbps"] },
                    { label: "Sub-stream bitrate per camera (typically)", value: "0.5", unit: "Mbps", readonly: true },
                    { label: "Total using sub-streams for remote", value: "", unit: "Mbps", answer: ["2", "2mbps"] }
                ],
                explanation: "Main stream (1080p H.264): ~4Mbps per camera. 4 cameras = 16Mbps upload needed - often unrealistic for typical internet. SOLUTION: Use sub-stream for remote viewing. Sub-stream (typically 640×480 @ 0.5Mbps) = only 2Mbps for all 4 cameras. Main stream records locally at full quality, sub-stream enables smooth remote access. This is why dual-stream capability is essential!"
            },
            {
                type: "troubleshoot-tree",
                client: "Remote viewing works perfectly on WiFi inside the building, but doesn't work at all when I'm away using mobile data.",
                site: "Small business - remote access not working externally",
                requirements: ["Local access works fine", "External access fails completely", "Using manufacturer's mobile app"],
                question: "Troubleshoot the remote access issue:",
                steps: [
                    {
                        question: "App works on local WiFi but fails on mobile data outside. What does this indicate?",
                        options: ["The camera hardware is faulty", "Port forwarding or P2P cloud service not configured", "Mobile phone needs replacement"],
                        correct: 1,
                        followup: "Local access uses direct connection on same network. External access requires either port forwarding through the router or P2P cloud service."
                    },
                    {
                        question: "Which remote access method is EASIEST for non-technical clients?",
                        options: ["Manual port forwarding with static IP", "P2P Cloud service (Hik-Connect, DMSS, etc.)", "Setting up a VPN server"],
                        correct: 1,
                        followup: "You check the NVR settings and find the P2P/Cloud service is disabled."
                    },
                    {
                        question: "After enabling P2P, what security step is CRITICAL?",
                        options: ["Leave default passwords for convenience", "Change all default passwords to strong unique ones", "Disable all encryption for faster streaming"],
                        correct: 1,
                        followup: "You enable P2P cloud service, change the default admin password to a strong one, and scan the QR code in the app. Remote access now works."
                    }
                ],
                explanation: "Remote access options: 1) P2P Cloud (easiest - camera connects outbound to manufacturer's servers, app connects to same servers), 2) Port forwarding (forward NVR ports through router - more technical), 3) VPN (most secure but complex). P2P is convenient but goes through third-party servers. ALWAYS change default passwords - default credentials are the #1 cause of CCTV hacking!"
            },
            {
                type: "diagnosis",
                client: "Our NVR displays 'HDD Error' and recording has stopped. The hard drive is only 6 months old.",
                site: "Retail store - recording failure",
                requirements: ["Recording stopped unexpectedly", "HDD error message displayed", "Drive is relatively new (6 months)"],
                question: "What is the MOST LIKELY cause of this premature hard drive failure?",
                options: [
                    { title: "Using desktop-grade HDD instead of surveillance-rated drive", desc: "Wrong drive type for continuous 24/7 recording workload" },
                    { title: "NVR firmware is outdated", desc: "Software compatibility causing drive errors" },
                    { title: "Camera resolution is too high", desc: "Data rate exceeding drive capabilities" },
                    { title: "Room temperature is too cold", desc: "Environmental conditions affecting drive" }
                ],
                correct: 0,
                explanation: "Desktop HDDs (WD Blue, Seagate Barracuda) are NOT designed for 24/7 continuous write operations. They overheat and fail quickly in CCTV applications. ALWAYS use SURVEILLANCE-RATED drives: WD Purple or Seagate SkyHawk. These drives are engineered for: constant writing, multiple video streams, vibration resistance, and 24/7 operation. They're warrantied for surveillance use. The extra cost prevents exactly this situation."
            },
            {
                type: "component-select",
                client: "What recording modes should I configure to balance storage usage with complete coverage?",
                site: "System configuration consultation",
                requirements: ["Optimize storage usage", "Maintain security coverage", "30-day retention goal"],
                question: "Select ALL appropriate recording strategies that can be combined:",
                options: [
                    { icon: "⏰", name: "24/7 Continuous", correct: true },
                    { icon: "🚶", name: "Motion Detection", correct: true },
                    { icon: "📅", name: "Scheduled Recording", correct: true },
                    { icon: "❌", name: "No Recording", correct: false },
                    { icon: "🚨", name: "Alarm/Sensor Triggered", correct: true },
                    { icon: "🔀", name: "Continuous + Motion Boost", correct: true }
                ],
                explanation: "Recording strategies: CONTINUOUS (24/7) - highest storage use but never misses anything. MOTION - saves storage but may miss slow movements. SCHEDULED - record only during business hours. ALARM - triggered by external sensors (door contacts, PIR). BEST PRACTICE: Continuous at lower quality + motion-triggered quality boost, OR continuous during business hours + motion-only overnight. Combine strategies based on client needs and storage budget."
            },
            {
                type: "procedure",
                client: "How do I properly configure RAID on our enterprise NVR with 8 hard drive bays?",
                site: "Enterprise installation - 8-bay NVR",
                requirements: ["8 × 4TB surveillance drives", "Data redundancy required", "Maximum usable storage needed"],
                question: "Arrange the RAID configuration steps in CORRECT order:",
                steps: [
                    "Select RAID level (RAID 5 recommended for balance)",
                    "Back up any existing recordings to external storage",
                    "Verify all drives are detected in NVR storage menu",
                    "Initialize drives and create the RAID array",
                    "Format the array and allocate for recording",
                    "Test recording and verify write performance"
                ],
                correctOrder: [1, 2, 0, 3, 4, 5],
                explanation: "RAID setup sequence: BACKUP FIRST (initialization destroys all data!) → Verify all drives detected → Choose RAID level → Initialize and create array → Format → Test. RAID levels: RAID 5 = good capacity + survives 1 drive failure (recommended for CCTV). RAID 6 = survives 2 failures but less capacity. RAID 10 = best performance but only 50% capacity. For 8×4TB in RAID 5: ~28TB usable storage."
            },
            {
                type: "diagnosis",
                client: "Video playback is smooth locally but very choppy and keeps buffering when viewing remotely on my phone.",
                site: "Remote viewing performance issues",
                requirements: ["Local playback is perfect", "Remote playback buffers constantly", "Using 4G mobile connection"],
                question: "What is the MOST LIKELY cause and best solution?",
                options: [
                    { title: "App is streaming main stream - switch to sub-stream", desc: "Reduce bandwidth by using lower resolution secondary stream" },
                    { title: "Phone is too old and needs replacement", desc: "Hardware limitations on mobile device" },
                    { title: "NVR hard drive is failing", desc: "Storage read performance issue" },
                    { title: "Cameras need firmware update", desc: "Software bug in camera encoding" }
                ],
                correct: 0,
                explanation: "Remote buffering with smooth local playback = bandwidth bottleneck. Main stream (1080p/4MP) requires 4-8 Mbps per camera - mobile data often can't sustain this. SOLUTION: Configure app to use sub-stream for remote viewing. Sub-stream (D1/VGA resolution) uses only 0.3-0.5 Mbps, smooth even on slow connections. Most apps have 'Fluent/Smooth' vs 'Clear/HD' mode - Fluent uses sub-stream."
            },
            {
                type: "fill-blank",
                client: "Explain the different video streaming protocols used in CCTV systems.",
                site: "Technical consultation",
                requirements: ["Understanding streaming technology"],
                question: "Complete the streaming protocol information:",
                blanks: [
                    { text: "Live view streaming protocol: ", answer: ["rtsp", "rtsp://"], hint: "real-time streaming" },
                    { text: "Default RTSP port number: ", answer: ["554"], hint: "standard port" },
                    { text: "Web browser streaming often uses: ", answer: ["http", "https", "hls"], hint: "web protocol" },
                    { text: "ONVIF discovery uses port: ", answer: ["80", "8080", "3702"], hint: "HTTP or discovery" }
                ],
                explanation: "RTSP (Real Time Streaming Protocol) on port 554 is the standard for live video streaming - used by VLC, NVRs, and professional software. HTTP/HTTPS streaming (often HLS - HTTP Live Streaming) works in web browsers without plugins. ONVIF uses HTTP port 80/8080 for camera configuration and port 3702 for device discovery (WS-Discovery). Understanding these helps with firewall configuration and troubleshooting."
            }
        ];

        let answers = new Array(examData.length).fill(null);
        function init() { renderScenarios(); initDragDrop(); }
        function renderScenarios() { document.getElementById('scenarios').innerHTML = examData.map((s, i) => renderScenario(s, i)).join(''); }
        function renderScenario(scenario, idx) {
            let answerHTML = '';
            switch(scenario.type) {
                case 'diagnosis': answerHTML = `<div class="diagnostic-options">${scenario.options.map((opt, i) => `<div class="diagnostic-option" data-idx="${idx}" data-opt="${i}" onclick="selectOption(${idx}, ${i})"><div class="option-marker"></div><div class="option-content"><div class="option-title">${opt.title}</div><div class="option-desc">${opt.desc}</div></div></div>`).join('')}</div>`; break;
                case 'fill-blank': answerHTML = `<div class="fill-blanks">${scenario.blanks.map((b, i) => `<div class="blank-row"><span class="fill-text">${b.text}</span><input type="text" class="blank-input" data-idx="${idx}" data-blank="${i}" placeholder="${b.hint || '...'}" onchange="updateFillBlank(${idx})"></div>`).join('')}</div>`; break;
                case 'component-select': answerHTML = `<div class="component-grid">${scenario.options.map((opt, i) => `<div class="component-card" data-idx="${idx}" data-opt="${i}" onclick="toggleComponent(${idx}, ${i})"><div class="component-icon">${opt.icon}</div><div class="component-name">${opt.name}</div></div>`).join('')}</div>`; break;
                case 'troubleshoot-tree': answerHTML = `<div class="troubleshoot-tree">${scenario.steps.map((step, i) => `<div class="tree-step" id="step${idx}_${i}" ${i > 0 ? 'style="display:none;"' : ''}><div class="tree-question">${step.question}</div><div class="tree-options">${step.options.map((opt, oi) => `<button class="tree-btn" data-idx="${idx}" data-step="${i}" data-opt="${oi}" onclick="selectTreeOption(${idx}, ${i}, ${oi})">${opt}</button>`).join('')}</div><div class="tree-followup" id="followup${idx}_${i}" style="display:none;"></div></div>`).join('')}</div>`; break;
                case 'procedure': const shuffled = scenario.steps.map((s, i) => ({text: s, orig: i})).sort(() => Math.random() - 0.5); answerHTML = `<div class="procedure-list" id="proc${idx}">${shuffled.map((s, i) => `<div class="procedure-item" draggable="true" data-idx="${idx}" data-orig="${s.orig}"><span class="drag-handle">⋮⋮</span><div class="procedure-num">${i + 1}</div><div class="procedure-text">${s.text}</div></div>`).join('')}</div>`; break;
                case 'calculation': answerHTML = `<div class="calc-group">${scenario.calculations.map((c, i) => `<div class="calc-row"><span class="calc-label">${c.label}:</span>${c.readonly ? `<span class="calc-readonly">${c.value}</span>` : `<input type="text" class="calc-input" data-idx="${idx}" data-calc="${i}" placeholder="?" onchange="updateCalc(${idx})">`}<span class="calc-unit">${c.unit}</span></div>`).join('')}</div>`; break;
            }
            return `<div class="scenario-card" id="card${idx}"><div class="scenario-header"><div class="scenario-num"><strong>${idx + 1}</strong> of ${examData.length}</div><div class="scenario-type">${{'diagnosis':'🔍 Diagnosis','fill-blank':'✏️ Fill Blanks','procedure':'📋 Ordering','troubleshoot-tree':'🌳 Decision Tree','component-select':'🎯 Select All','calculation':'🧮 Calculation'}[scenario.type]}</div></div><div class="scenario-body">${scenario.client ? `<div class="job-brief"><div class="brief-label">📋 Client Request</div><div class="brief-text">"${scenario.client}"</div>${scenario.site ? `<div class="site-info">📍 ${scenario.site}</div>` : ''}</div>` : ''}${scenario.requirements?.length ? `<div class="requirements-box"><div class="requirements-label">Requirements</div><div class="requirements-list">${scenario.requirements.map(r => `<span class="req-tag">• ${r}</span>`).join('')}</div></div>` : ''}<div class="question-section"><div class="question-text">${scenario.question}</div>${answerHTML}</div><div class="feedback-box" id="feedback${idx}"><div class="feedback-header"><span class="feedback-icon"></span><span class="feedback-title"></span></div><div class="feedback-text">${scenario.explanation}</div><div class="correct-answer" id="correct${idx}"></div></div></div></div>`;
        }
        function selectOption(idx, opt) { if (document.querySelector(`.diagnostic-option[data-idx="${idx}"]`)?.classList.contains('disabled')) return; document.querySelectorAll(`.diagnostic-option[data-idx="${idx}"]`).forEach(el => el.classList.remove('selected')); document.querySelector(`.diagnostic-option[data-idx="${idx}"][data-opt="${opt}"]`).classList.add('selected'); answers[idx] = opt; }
        function updateFillBlank(idx) { answers[idx] = Array.from(document.querySelectorAll(`.blank-input[data-idx="${idx}"]`)).map(inp => inp.value.trim().toLowerCase()); }
        function toggleComponent(idx, opt) { const card = document.querySelector(`.component-card[data-idx="${idx}"][data-opt="${opt}"]`); if (card.classList.contains('disabled')) return; card.classList.toggle('selected'); answers[idx] = Array.from(document.querySelectorAll(`.component-card[data-idx="${idx}"].selected`)).map(c => parseInt(c.dataset.opt)); }
        function updateCalc(idx) { answers[idx] = Array.from(document.querySelectorAll(`.calc-input[data-idx="${idx}"]`)).map(inp => inp.value.trim().toLowerCase()); }
        function selectTreeOption(idx, step, opt) { const scenario = examData[idx]; const btns = document.querySelectorAll(`.tree-btn[data-idx="${idx}"][data-step="${step}"]`); if (btns[0].classList.contains('disabled')) return; btns.forEach(b => b.classList.remove('selected')); btns[opt].classList.add('selected'); if (!answers[idx]) answers[idx] = []; answers[idx][step] = opt; document.getElementById(`followup${idx}_${step}`).textContent = scenario.steps[step].followup; document.getElementById(`followup${idx}_${step}`).style.display = 'block'; if (step < scenario.steps.length - 1) setTimeout(() => document.getElementById(`step${idx}_${step + 1}`).style.display = 'block', 400); }
        let draggedItem = null;
        function initDragDrop() { document.querySelectorAll('.procedure-item').forEach(item => { item.addEventListener('dragstart', () => { draggedItem = item; item.classList.add('dragging'); }); item.addEventListener('dragend', () => { item.classList.remove('dragging'); document.querySelectorAll('.procedure-item').forEach(i => i.classList.remove('drag-over')); }); item.addEventListener('dragover', e => { e.preventDefault(); if (item !== draggedItem && !item.classList.contains('disabled')) item.classList.add('drag-over'); }); item.addEventListener('dragleave', () => item.classList.remove('drag-over')); item.addEventListener('drop', e => { e.preventDefault(); if (item !== draggedItem && !item.classList.contains('disabled')) { const container = item.parentNode, all = [...container.querySelectorAll('.procedure-item')]; if (all.indexOf(draggedItem) < all.indexOf(item)) item.after(draggedItem); else item.before(draggedItem); container.querySelectorAll('.procedure-item').forEach((el, i) => el.querySelector('.procedure-num').textContent = i + 1); answers[item.dataset.idx] = [...container.querySelectorAll('.procedure-item')].map(el => parseInt(el.dataset.orig)); } item.classList.remove('drag-over'); }); }); }
        function submitExam() {
            let correct = 0;
            examData.forEach((scenario, idx) => {
                const answer = answers[idx], card = document.getElementById(`card${idx}`), feedback = document.getElementById(`feedback${idx}`), correctDiv = document.getElementById(`correct${idx}`);
                let isCorrect = false;
                switch(scenario.type) {
                    case 'diagnosis': isCorrect = answer === scenario.correct; document.querySelectorAll(`.diagnostic-option[data-idx="${idx}"]`).forEach((el, i) => { el.classList.add('disabled'); if (i === scenario.correct) el.classList.add('correct'); else if (i === answer && !isCorrect) el.classList.add('incorrect'); }); correctDiv.textContent = `✓ ${scenario.options[scenario.correct].title}`; break;
                    case 'fill-blank': let allCorrect = true; document.querySelectorAll(`.blank-input[data-idx="${idx}"]`).forEach((inp, i) => { inp.disabled = true; const acceptable = scenario.blanks[i].answer.map(a => a.toLowerCase()); if (answer && acceptable.some(a => answer[i]?.includes(a) || a.includes(answer[i] || ''))) inp.classList.add('correct'); else { inp.classList.add('incorrect'); allCorrect = false; } }); isCorrect = allCorrect; correctDiv.textContent = `Answers: ${scenario.blanks.map(b => b.answer[0]).join(', ')}`; break;
                    case 'component-select': const correctSet = scenario.options.map((o, i) => o.correct ? i : -1).filter(i => i !== -1), selectedSet = answer || []; isCorrect = correctSet.length === selectedSet.length && correctSet.every(i => selectedSet.includes(i)); document.querySelectorAll(`.component-card[data-idx="${idx}"]`).forEach((el, i) => { el.classList.add('disabled'); if (scenario.options[i].correct) el.classList.add('correct'); else if (selectedSet.includes(i)) el.classList.add('incorrect'); }); correctDiv.textContent = `Correct: ${scenario.options.filter(o => o.correct).map(o => o.name).join(', ')}`; break;
                    case 'troubleshoot-tree': isCorrect = answer && answer.length === scenario.steps.length && scenario.steps.every((s, i) => answer[i] === s.correct); document.querySelectorAll(`.tree-btn[data-idx="${idx}"]`).forEach(btn => { btn.classList.add('disabled'); if (parseInt(btn.dataset.opt) === scenario.steps[parseInt(btn.dataset.step)].correct) btn.classList.add('correct'); else if (btn.classList.contains('selected')) btn.classList.add('incorrect'); }); scenario.steps.forEach((_, i) => { document.getElementById(`step${idx}_${i}`).style.display = 'block'; document.getElementById(`followup${idx}_${i}`).style.display = 'block'; }); break;
                    case 'procedure': isCorrect = JSON.stringify(answer || []) === JSON.stringify(scenario.correctOrder); document.querySelectorAll(`#proc${idx} .procedure-item`).forEach((el, i) => { el.classList.add('disabled'); el.draggable = false; if ((answer || [])[i] === scenario.correctOrder[i]) el.classList.add('correct'); else el.classList.add('incorrect'); }); correctDiv.textContent = `Correct order: ${scenario.correctOrder.map(i => i + 1).join(' → ')}`; break;
                    case 'calculation': let calcCorrect = true, calcIdx = 0; document.querySelectorAll(`.calc-input[data-idx="${idx}"]`).forEach(inp => { inp.disabled = true; const editableCalcs = scenario.calculations.filter(c => !c.readonly); if (calcIdx < editableCalcs.length) { const calcData = editableCalcs[calcIdx]; const acceptable = calcData.answer.map(a => a.toString().toLowerCase().replace(/[^0-9a-z.-]/g, '')); const userAns = (answer && answer[calcIdx]) ? answer[calcIdx].replace(/[^0-9a-z.-]/g, '') : ''; if (acceptable.some(a => a === userAns || a.includes(userAns) || userAns.includes(a))) inp.classList.add('correct'); else { inp.classList.add('incorrect'); calcCorrect = false; } calcIdx++; } }); isCorrect = calcCorrect; correctDiv.textContent = `Answers: ${scenario.calculations.filter(c => !c.readonly).map(c => c.answer[0] + ' ' + c.unit).join(', ')}`; break;
                }
                if (isCorrect) { correct++; card.classList.add('correct'); feedback.classList.add('correct', 'show'); feedback.querySelector('.feedback-header').classList.add('correct'); feedback.querySelector('.feedback-icon').textContent = '✓'; feedback.querySelector('.feedback-title').textContent = 'Correct!'; }
                else { card.classList.add('incorrect'); feedback.classList.add('incorrect', 'show'); feedback.querySelector('.feedback-header').classList.add('incorrect'); feedback.querySelector('.feedback-icon').textContent = '✗'; feedback.querySelector('.feedback-title').textContent = 'Incorrect'; }
            });
            const pct = Math.round((correct / examData.length) * 100);
            document.getElementById('currentScore').textContent = `${pct}%`; document.getElementById('finalScore').textContent = `${pct}%`; document.getElementById('correctCount').textContent = correct; document.getElementById('incorrectCount').textContent = examData.length - correct;
            const grade = document.getElementById('grade'); if (pct >= 90) { grade.textContent = 'Excellent!'; grade.className = 'results-grade excellent'; } else if (pct >= 70) { grade.textContent = 'Good Job!'; grade.className = 'results-grade good'; } else if (pct >= 50) { grade.textContent = 'Average'; grade.className = 'results-grade average'; } else { grade.textContent = 'Needs Practice'; grade.className = 'results-grade poor'; }
            document.getElementById('results').classList.add('show'); document.getElementById('submitBtn').disabled = true;
        }
        function resetExam() { answers = new Array(examData.length).fill(null); document.getElementById('currentScore').textContent = '0%'; document.getElementById('results').classList.remove('show'); document.getElementById('submitBtn').disabled = false; renderScenarios(); initDragDrop(); }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
