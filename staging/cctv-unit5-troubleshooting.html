<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 5: Troubleshooting & Maintenance | M.T.T.I</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #d63031; --secondary: #00b894; --success: #00b894; --error: #d63031; --warning: #fdcb6e; --bg-dark: #0a0a0f; --bg-card: #12121a; --bg-input: #1a1a24; --bg-hover: #22222e; --text-primary: #f5f5f7; --text-secondary: #a0a0b0; --text-muted: #6a6a7a; --border: #2a2a3a; --accent: #d63031; --accent-glow: rgba(214, 48, 49, 0.15); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.7; }
        .header { background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-dark) 100%); border-bottom: 1px solid var(--border); padding: 1.5rem 2rem; position: sticky; top: 0; z-index: 100; }
        .header-content { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo { display: flex; align-items: center; gap: 0.75rem; }
        .logo-icon { width: 48px; height: 48px; background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .logo h1 { font-size: 1.1rem; font-weight: 700; background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo span { font-size: 0.65rem; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; display: block; }
        .score-display { background: var(--bg-card); border: 1px solid var(--border); padding: 0.75rem 1.5rem; border-radius: 10px; text-align: center; }
        .score-value { font-family: 'IBM Plex Mono', monospace; font-size: 1.5rem; font-weight: 700; color: var(--accent); }
        .score-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .main-container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        .exam-header { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; margin-bottom: 2rem; position: relative; overflow: hidden; }
        .exam-header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--accent) 0%, var(--secondary) 100%); }
        .unit-badge { display: inline-block; background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%); color: white; padding: 0.35rem 1rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1rem; }
        .exam-title { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; }
        .exam-desc { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1.5rem; }
        .exam-stats { display: flex; gap: 2rem; flex-wrap: wrap; }
        .stat-item { display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.9rem; }
        .scenarios { display: flex; flex-direction: column; gap: 1.5rem; }
        .scenario-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: all 0.3s; }
        .scenario-card.correct { border-color: var(--success); box-shadow: 0 0 30px rgba(0, 184, 148, 0.1); }
        .scenario-card.incorrect { border-color: var(--error); box-shadow: 0 0 30px rgba(214, 48, 49, 0.1); }
        .scenario-header { background: var(--bg-input); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .scenario-num { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-secondary); }
        .scenario-num strong { background: var(--accent); color: white; padding: 0.25rem 0.65rem; border-radius: 5px; font-family: 'IBM Plex Mono', monospace; }
        .scenario-type { font-size: 0.7rem; padding: 0.3rem 0.75rem; background: var(--bg-hover); border-radius: 5px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .scenario-body { padding: 1.5rem; }
        .job-brief { background: linear-gradient(135deg, rgba(214, 48, 49, 0.1) 0%, rgba(0, 184, 148, 0.1) 100%); border: 1px solid rgba(214, 48, 49, 0.3); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; }
        .brief-label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.7rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.75rem; font-weight: 600; }
        .brief-text { font-size: 0.95rem; line-height: 1.7; }
        .site-info { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--bg-dark); padding: 0.5rem 0.85rem; border-radius: 6px; font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.75rem; font-family: 'IBM Plex Mono', monospace; }
        .requirements-box { background: var(--bg-input); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
        .requirements-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.75rem; }
        .requirements-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .req-tag { background: var(--bg-hover); border: 1px solid var(--border); padding: 0.4rem 0.75rem; border-radius: 6px; font-size: 0.8rem; }
        .question-section { margin-top: 1.25rem; }
        .question-text { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-primary); }
        .diagnostic-options { display: flex; flex-direction: column; gap: 0.6rem; }
        .diagnostic-option { display: flex; align-items: flex-start; gap: 0.75rem; padding: 1rem 1.25rem; background: var(--bg-input); border: 2px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .diagnostic-option:hover:not(.disabled) { border-color: var(--accent); background: var(--accent-glow); }
        .diagnostic-option.selected { border-color: var(--accent); background: var(--accent-glow); }
        .diagnostic-option.correct { border-color: var(--success); background: rgba(0, 184, 148, 0.15); }
        .diagnostic-option.incorrect { border-color: var(--error); background: rgba(214, 48, 49, 0.15); }
        .diagnostic-option.disabled { cursor: not-allowed; opacity: 0.7; }
        .option-marker { width: 24px; height: 24px; border: 2px solid var(--border); border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 2px; transition: all 0.2s; }
        .diagnostic-option.selected .option-marker { border-color: var(--accent); background: var(--accent); color: white; }
        .diagnostic-option.correct .option-marker { border-color: var(--success); background: var(--success); color: white; }
        .diagnostic-option.incorrect .option-marker { border-color: var(--error); background: var(--error); color: white; }
        .option-content { flex: 1; }
        .option-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.25rem; }
        .option-desc { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5; }
        .fill-blanks { background: var(--bg-input); border-radius: 10px; padding: 1.25rem; }
        .blank-row { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; line-height: 2.2; }
        .fill-text { font-size: 0.9rem; }
        .blank-input { display: inline-block; width: 140px; padding: 0.5rem 0.75rem; background: var(--bg-dark); border: 2px solid var(--border); border-radius: 6px; color: var(--text-primary); font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; text-align: center; }
        .blank-input:focus { outline: none; border-color: var(--accent); }
        .blank-input.correct { border-color: var(--success); background: rgba(0, 184, 148, 0.1); }
        .blank-input.incorrect { border-color: var(--error); background: rgba(214, 48, 49, 0.1); }
        .procedure-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .procedure-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.875rem 1rem; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; cursor: grab; transition: all 0.2s; user-select: none; }
        .procedure-item:hover:not(.disabled) { border-color: var(--accent); }
        .procedure-item.dragging { opacity: 0.5; }
        .procedure-item.drag-over { border-color: var(--accent); background: var(--accent-glow); }
        .procedure-item.correct { border-color: var(--success); background: rgba(0, 184, 148, 0.1); }
        .procedure-item.incorrect { border-color: var(--error); background: rgba(214, 48, 49, 0.1); }
        .procedure-item.disabled { cursor: not-allowed; }
        .procedure-num { width: 28px; height: 28px; background: var(--bg-hover); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
        .procedure-item.correct .procedure-num { background: var(--success); color: white; }
        .procedure-item.incorrect .procedure-num { background: var(--error); color: white; }
        .drag-handle { color: var(--text-muted); }
        .procedure-text { flex: 1; font-size: 0.85rem; }
        .troubleshoot-tree { display: flex; flex-direction: column; gap: 1rem; }
        .tree-step { background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; }
        .tree-question { font-size: 0.9rem; margin-bottom: 0.875rem; font-weight: 500; }
        .tree-options { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .tree-btn { padding: 0.6rem 1rem; background: var(--bg-hover); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-family: inherit; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
        .tree-btn:hover:not(.disabled) { border-color: var(--accent); }
        .tree-btn.selected { border-color: var(--accent); background: var(--accent-glow); }
        .tree-btn.correct { border-color: var(--success); background: rgba(0, 184, 148, 0.15); }
        .tree-btn.incorrect { border-color: var(--error); background: rgba(214, 48, 49, 0.15); }
        .tree-btn.disabled { cursor: not-allowed; opacity: 0.6; }
        .tree-followup { margin-top: 0.875rem; padding: 0.875rem; background: var(--bg-dark); border-radius: 8px; font-size: 0.85rem; color: var(--text-secondary); border-left: 3px solid var(--accent); }
        .component-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.75rem; }
        .component-card { background: var(--bg-input); border: 2px solid var(--border); border-radius: 10px; padding: 1rem; text-align: center; cursor: pointer; transition: all 0.2s; }
        .component-card:hover:not(.disabled) { border-color: var(--accent); transform: translateY(-2px); }
        .component-card.selected { border-color: var(--accent); background: var(--accent-glow); }
        .component-card.correct { border-color: var(--success); background: rgba(0, 184, 148, 0.1); }
        .component-card.incorrect { border-color: var(--error); background: rgba(214, 48, 49, 0.1); }
        .component-card.disabled { cursor: not-allowed; opacity: 0.7; }
        .component-icon { font-size: 2rem; margin-bottom: 0.5rem; }
        .component-name { font-size: 0.8rem; font-weight: 500; }
        .feedback-box { margin-top: 1.25rem; padding: 1.25rem; border-radius: 10px; display: none; }
        .feedback-box.show { display: block; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .feedback-box.correct { background: rgba(0, 184, 148, 0.1); border: 1px solid var(--success); }
        .feedback-box.incorrect { background: rgba(214, 48, 49, 0.1); border: 1px solid var(--error); }
        .feedback-header { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; margin-bottom: 0.5rem; }
        .feedback-header.correct { color: var(--success); }
        .feedback-header.incorrect { color: var(--error); }
        .feedback-text { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.7; }
        .correct-answer { margin-top: 0.75rem; padding: 0.625rem 0.875rem; background: var(--bg-dark); border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; }
        .actions { margin-top: 2rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .btn { padding: 1rem 2.5rem; border: none; border-radius: 10px; font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%); color: white; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(214, 48, 49, 0.3); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: var(--error); color: var(--error); }
        .results-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; margin-top: 2rem; text-align: center; display: none; }
        .results-panel.show { display: block; }
        .results-score { font-size: 4.5rem; font-weight: 700; font-family: 'IBM Plex Mono', monospace; background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .results-label { color: var(--text-secondary); margin-bottom: 1rem; font-size: 1.1rem; }
        .results-grade { display: inline-block; padding: 0.6rem 2rem; border-radius: 25px; font-weight: 600; font-size: 1.1rem; margin-bottom: 1.5rem; }
        .results-grade.excellent { background: rgba(0, 184, 148, 0.2); color: var(--success); }
        .results-grade.good { background: rgba(214, 48, 49, 0.2); color: var(--accent); }
        .results-grade.average { background: rgba(253, 203, 110, 0.2); color: var(--warning); }
        .results-grade.poor { background: rgba(214, 48, 49, 0.2); color: var(--error); }
        .results-stats { display: flex; justify-content: center; gap: 4rem; }
        .stat-box { text-align: center; }
        .stat-box-value { font-size: 2rem; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
        .stat-box-value.correct { color: var(--success); }
        .stat-box-value.incorrect { color: var(--error); }
        .stat-box-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        @media (max-width: 600px) { .main-container { padding: 1rem; } .exam-title { font-size: 1.4rem; } .component-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🔧</div>
                <div><h1>M.T.T.I</h1><span>CCTV Installation</span></div>
            </div>
            <div class="score-display">
                <div class="score-value" id="currentScore">0%</div>
                <div class="score-label">Score</div>
            </div>
        </div>
    </header>
    <main class="main-container">
        <div class="exam-header">
            <div class="unit-badge">Unit 5</div>
            <h2 class="exam-title">Troubleshooting and Maintenance</h2>
            <p class="exam-desc">Diagnose common CCTV problems, perform systematic troubleshooting, and implement preventive maintenance procedures.</p>
            <div class="exam-stats">
                <div class="stat-item"><span>📋</span> 8 Scenarios</div>
                <div class="stat-item"><span>⏱️</span> ~25 minutes</div>
                <div class="stat-item"><span>🎯</span> 70% to pass</div>
            </div>
        </div>
        <div class="scenarios" id="scenarios"></div>
        <div class="actions">
            <button class="btn btn-secondary" onclick="resetExam()">Reset Exam</button>
            <button class="btn btn-primary" id="submitBtn" onclick="submitExam()">Submit Answers</button>
        </div>
        <div class="results-panel" id="results">
            <div class="results-score" id="finalScore">0%</div>
            <div class="results-label">Your Final Score</div>
            <div class="results-grade" id="grade"></div>
            <div class="results-stats">
                <div class="stat-box"><div class="stat-box-value correct" id="correctCount">0</div><div class="stat-box-label">Correct</div></div>
                <div class="stat-box"><div class="stat-box-value incorrect" id="incorrectCount">0</div><div class="stat-box-label">Incorrect</div></div>
            </div>
        </div>
    </main>
    <script>
        const examData = [
            {
                type: "troubleshoot-tree",
                client: "URGENT: All 12 of our cameras went offline at exactly the same time this morning. Nothing is recording!",
                site: "Office building - 12 camera system completely down",
                requirements: ["All cameras offline simultaneously", "Was working yesterday", "Urgent restoration needed"],
                question: "Diagnose the complete system failure:",
                steps: [
                    {
                        question: "All 12 cameras went offline at the exact same time. What does this pattern indicate?",
                        options: ["All 12 cameras failed simultaneously (very unlikely)", "Common point of failure (switch, NVR, or power)", "Internet hackers attacked each camera"],
                        correct: 1,
                        followup: "You go to the network rack and notice the PoE switch LED lights are completely off - no power."
                    },
                    {
                        question: "PoE switch appears to have no power. What's your first action?",
                        options: ["Order a replacement switch immediately", "Check power source: outlet, power adapter, connections", "Reboot all cameras individually"],
                        correct: 1,
                        followup: "You trace the power and find the switch's power adapter was accidentally unplugged - cleaning staff knocked it loose."
                    },
                    {
                        question: "After restoring power, all cameras come back online. What should you recommend to prevent this?",
                        options: ["Install a lockable network cabinet and label critical cables", "Do nothing - it probably won't happen again", "Replace all equipment with wireless"],
                        correct: 0,
                        followup: "You install a lockable cabinet and add 'CRITICAL - DO NOT DISCONNECT' labels to all power cables."
                    }
                ],
                explanation: "Simultaneous failure of multiple devices almost always indicates a common failure point - either power (PoE switch, UPS) or network (main switch, router). Troubleshoot systematically: identify the pattern → find common point → check basics first (power, connections) before assuming equipment failure. Prevention: lockable cabinets, UPS backup power, clear labeling."
            },
            {
                type: "diagnosis",
                client: "One camera shows a pink/purple color cast during daytime. Everything looks magenta instead of normal colors.",
                site: "Outdoor camera - color reproduction issue",
                requirements: ["Daytime color problem only", "IR camera model", "Worked correctly before"],
                question: "What is causing the pink/purple color tint?",
                options: [
                    { title: "IR cut filter stuck in night mode position", desc: "Mechanical filter not switching between day/night modes" },
                    { title: "Camera white balance settings are wrong", desc: "Color temperature configuration issue" },
                    { title: "Lens needs cleaning", desc: "Dirt or debris affecting image" },
                    { title: "Monitor display settings incorrect", desc: "Viewing equipment calibration" }
                ],
                correct: 0,
                explanation: "Pink/purple daytime images are a classic symptom of IR cut filter failure. The IR cut filter blocks infrared light during day (correct colors) and physically moves away at night (allows IR for B&W night vision). If stuck in 'night' position during day, IR light mixes with visible light creating a pink/magenta cast. This is typically a mechanical failure requiring camera replacement or professional repair - not a settings issue."
            },
            {
                type: "fill-blank",
                client: "What regular maintenance should we schedule for our CCTV system to prevent problems?",
                site: "Preventive maintenance planning",
                requirements: ["System longevity", "Prevent failures", "Maintain evidence quality"],
                question: "Complete the recommended maintenance schedule:",
                blanks: [
                    { text: "Clean camera lenses every ", answer: ["month", "monthly", "1 month", "30 days"], hint: "frequency" },
                    { text: "Check HDD health status every ", answer: ["month", "monthly", "week", "weekly"], hint: "storage check" },
                    { text: "Update firmware every ", answer: ["6 months", "quarterly", "3 months", "6"], hint: "software updates" },
                    { text: "Test remote access/backup every ", answer: ["month", "monthly", "week"], hint: "verification" }
                ],
                explanation: "Recommended maintenance schedule: LENS CLEANING - monthly (dust, spider webs, water spots, bird droppings). HDD HEALTH - check S.M.A.R.T. status monthly, watch for reallocated sectors. FIRMWARE - update quarterly or when security patches released. REMOTE ACCESS - test monthly to ensure it works before you need it. RECORDING VERIFICATION - weekly spot-check that footage is actually being saved. Always document maintenance visits!"
            },
            {
                type: "component-select",
                client: "What are the common causes of CCTV image quality degradation over time?",
                site: "System quality assessment",
                requirements: ["Understanding quality issues", "Preventive awareness"],
                question: "Select ALL factors that commonly cause image quality to degrade:",
                options: [
                    { icon: "🕸️", name: "Spider webs on lens", correct: true },
                    { icon: "💧", name: "Condensation inside dome", correct: true },
                    { icon: "☀️", name: "Sun damage to sensor", correct: true },
                    { icon: "🔌", name: "Loose cable connections", correct: true },
                    { icon: "🎂", name: "Camera's age in years", correct: false },
                    { icon: "📡", name: "Network interference", correct: true },
                    { icon: "🌡️", name: "Extreme temperature damage", correct: true },
                    { icon: "🐦", name: "Bird droppings on housing", correct: true }
                ],
                explanation: "Image degradation causes: PHYSICAL - dirt, spider webs, bird droppings on lens, condensation inside housing. ENVIRONMENTAL - direct sun damage (sensor burn), extreme heat/cold affecting electronics. ELECTRICAL - loose connections causing signal issues, network interference (EMI). Age alone doesn't cause degradation if maintained properly - a well-maintained camera can last 10+ years. Regular inspection catches these issues early."
            },
            {
                type: "troubleshoot-tree",
                client: "SECURITY BREACH: We found our camera feeds being streamed on a public website! Someone hacked our system!",
                site: "Business premises - cameras exposed publicly online",
                requirements: ["Urgent security incident", "Cameras visible on public internet", "Privacy violation"],
                question: "Handle the security breach:",
                steps: [
                    {
                        question: "Client discovers their cameras are publicly visible on websites like Shodan or Insecam. Immediate first action?",
                        options: ["Ignore it - the damage is already done", "Disconnect the entire system from the internet IMMEDIATELY", "Just change the NVR admin password"],
                        correct: 1,
                        followup: "You immediately disconnect the internet connection to stop the public exposure while you investigate."
                    },
                    {
                        question: "What is the MOST common cause of CCTV systems being hacked and exposed?",
                        options: ["Advanced zero-day exploits by professional hackers", "Default passwords that were never changed", "Physical break-in to access the equipment"],
                        correct: 1,
                        followup: "You check the system and find: admin password is still 'admin', and multiple cameras use '12345' as password."
                    },
                    {
                        question: "To properly secure the system before reconnecting, what changes are needed?",
                        options: ["Change ALL passwords + update firmware + disable UPnP + review port forwarding", "Just change the admin password", "Buy completely new equipment"],
                        correct: 0,
                        followup: "You change all passwords to strong unique ones, update firmware, disable automatic UPnP, remove unnecessary port forwards, and enable only essential remote access."
                    }
                ],
                explanation: "CCTV hacking is almost always caused by: 1) DEFAULT PASSWORDS left unchanged - hackers scan for devices with admin/admin, 2) Outdated firmware with known vulnerabilities, 3) UPnP automatically exposing devices to internet. SECURITY CHECKLIST: Strong unique passwords on EVERY device, current firmware, disable UPnP, use P2P cloud OR proper port forwarding (not both), close unused ports. Most 'hacks' are simply accessing default credentials - not sophisticated attacks."
            },
            {
                type: "procedure",
                client: "How do I perform a complete system health check during a maintenance visit?",
                site: "Annual maintenance service call",
                requirements: ["Comprehensive system check", "Document system status", "Identify potential issues"],
                question: "Arrange the system health check steps in the CORRECT order:",
                steps: [
                    "Test playback - verify recordings are retrievable and not corrupted",
                    "Document all findings in written maintenance report",
                    "Check all camera images for quality issues (focus, exposure, obstructions)",
                    "Clean camera lenses and housings as needed",
                    "Verify HDD health status (S.M.A.R.T.) and available storage",
                    "Inspect all cable connections and network equipment"
                ],
                correctOrder: [2, 3, 5, 4, 0, 1],
                explanation: "Systematic health check order: 1) Visual check all camera feeds for obvious issues, 2) Clean any dirty lenses/housings found, 3) Inspect physical infrastructure (cables, connections, switches), 4) Check storage health and capacity, 5) Test that playback/retrieval works correctly, 6) DOCUMENT everything in a written report for the client. Always provide a maintenance report - this protects both you and the client."
            },
            {
                type: "diagnosis",
                client: "Camera image looks fine during the day but is completely black at night, even though it's supposed to have night vision.",
                site: "Outdoor camera - no night vision",
                requirements: ["IR camera", "Works during day", "Black image at night"],
                question: "What is the MOST LIKELY cause of night vision failure?",
                options: [
                    { title: "IR LEDs have failed or are disabled in settings", desc: "Infrared illumination not working" },
                    { title: "Camera resolution is too low", desc: "Insufficient pixels for dark conditions" },
                    { title: "Network bandwidth is insufficient", desc: "Data transmission bottleneck" },
                    { title: "Hard drive is full", desc: "Storage capacity issue" }
                ],
                correct: 0,
                explanation: "If daytime is fine but night is black: the IR LEDs are not working. Causes: 1) IR LEDs burned out (common after 3-5 years), 2) IR disabled in camera settings, 3) Photo sensor (that triggers night mode) is faulty or blocked, 4) Power supply issue - IR LEDs draw significant current. TROUBLESHOOT: Check settings first (ensure IR is enabled, auto day/night mode). Cover the lens - camera should switch to B&W night mode with IR LEDs glowing red. If LEDs don't light up, likely hardware failure."
            },
            {
                type: "diagnosis",
                client: "Video recording keeps stopping randomly. Sometimes it records for hours, sometimes it stops after 10 minutes.",
                site: "System with intermittent recording failures",
                requirements: ["Random recording stops", "No consistent pattern", "System restarts don't help permanently"],
                question: "What is the MOST LIKELY cause of intermittent recording failures?",
                options: [
                    { title: "Hard drive developing bad sectors - failing gradually", desc: "Storage hardware degradation causing write errors" },
                    { title: "Camera firmware needs update", desc: "Software bug in encoding" },
                    { title: "Internet connection is unstable", desc: "Network affecting local recording" },
                    { title: "Room temperature is too high", desc: "Environmental overheating" }
                ],
                correct: 0,
                explanation: "Intermittent, random recording failures strongly suggest HDD degradation. As drives develop bad sectors, write operations fail unpredictably. CHECK: NVR logs for HDD errors, S.M.A.R.T. status for reallocated sectors or pending sectors. If S.M.A.R.T. shows warnings, replace the drive IMMEDIATELY - complete failure is imminent. Also check: HDD temperature (overheating causes errors), power supply stability. Remember: surveillance drives (WD Purple, Seagate SkyHawk) are rated for this workload - desktop drives fail faster."
            }
        ];

        let answers = new Array(examData.length).fill(null);
        function init() { renderScenarios(); initDragDrop(); }
        function renderScenarios() { document.getElementById('scenarios').innerHTML = examData.map((s, i) => renderScenario(s, i)).join(''); }
        function renderScenario(scenario, idx) {
            let answerHTML = '';
            switch(scenario.type) {
                case 'diagnosis': answerHTML = `<div class="diagnostic-options">${scenario.options.map((opt, i) => `<div class="diagnostic-option" data-idx="${idx}" data-opt="${i}" onclick="selectOption(${idx}, ${i})"><div class="option-marker"></div><div class="option-content"><div class="option-title">${opt.title}</div><div class="option-desc">${opt.desc}</div></div></div>`).join('')}</div>`; break;
                case 'fill-blank': answerHTML = `<div class="fill-blanks">${scenario.blanks.map((b, i) => `<div class="blank-row"><span class="fill-text">${b.text}</span><input type="text" class="blank-input" data-idx="${idx}" data-blank="${i}" placeholder="${b.hint || '...'}" onchange="updateFillBlank(${idx})"></div>`).join('')}</div>`; break;
                case 'component-select': answerHTML = `<div class="component-grid">${scenario.options.map((opt, i) => `<div class="component-card" data-idx="${idx}" data-opt="${i}" onclick="toggleComponent(${idx}, ${i})"><div class="component-icon">${opt.icon}</div><div class="component-name">${opt.name}</div></div>`).join('')}</div>`; break;
                case 'troubleshoot-tree': answerHTML = `<div class="troubleshoot-tree">${scenario.steps.map((step, i) => `<div class="tree-step" id="step${idx}_${i}" ${i > 0 ? 'style="display:none;"' : ''}><div class="tree-question">${step.question}</div><div class="tree-options">${step.options.map((opt, oi) => `<button class="tree-btn" data-idx="${idx}" data-step="${i}" data-opt="${oi}" onclick="selectTreeOption(${idx}, ${i}, ${oi})">${opt}</button>`).join('')}</div><div class="tree-followup" id="followup${idx}_${i}" style="display:none;"></div></div>`).join('')}</div>`; break;
                case 'procedure': const shuffled = scenario.steps.map((s, i) => ({text: s, orig: i})).sort(() => Math.random() - 0.5); answerHTML = `<div class="procedure-list" id="proc${idx}">${shuffled.map((s, i) => `<div class="procedure-item" draggable="true" data-idx="${idx}" data-orig="${s.orig}"><span class="drag-handle">⋮⋮</span><div class="procedure-num">${i + 1}</div><div class="procedure-text">${s.text}</div></div>`).join('')}</div>`; break;
            }
            return `<div class="scenario-card" id="card${idx}"><div class="scenario-header"><div class="scenario-num"><strong>${idx + 1}</strong> of ${examData.length}</div><div class="scenario-type">${{'diagnosis':'🔍 Diagnosis','fill-blank':'✏️ Fill Blanks','procedure':'📋 Ordering','troubleshoot-tree':'🌳 Decision Tree','component-select':'🎯 Select All'}[scenario.type]}</div></div><div class="scenario-body">${scenario.client ? `<div class="job-brief"><div class="brief-label">🚨 Service Call</div><div class="brief-text">"${scenario.client}"</div>${scenario.site ? `<div class="site-info">📍 ${scenario.site}</div>` : ''}</div>` : ''}${scenario.requirements?.length ? `<div class="requirements-box"><div class="requirements-label">Situation Details</div><div class="requirements-list">${scenario.requirements.map(r => `<span class="req-tag">• ${r}</span>`).join('')}</div></div>` : ''}<div class="question-section"><div class="question-text">${scenario.question}</div>${answerHTML}</div><div class="feedback-box" id="feedback${idx}"><div class="feedback-header"><span class="feedback-icon"></span><span class="feedback-title"></span></div><div class="feedback-text">${scenario.explanation}</div><div class="correct-answer" id="correct${idx}"></div></div></div></div>`;
        }
        function selectOption(idx, opt) { if (document.querySelector(`.diagnostic-option[data-idx="${idx}"]`)?.classList.contains('disabled')) return; document.querySelectorAll(`.diagnostic-option[data-idx="${idx}"]`).forEach(el => el.classList.remove('selected')); document.querySelector(`.diagnostic-option[data-idx="${idx}"][data-opt="${opt}"]`).classList.add('selected'); answers[idx] = opt; }
        function updateFillBlank(idx) { answers[idx] = Array.from(document.querySelectorAll(`.blank-input[data-idx="${idx}"]`)).map(inp => inp.value.trim().toLowerCase()); }
        function toggleComponent(idx, opt) { const card = document.querySelector(`.component-card[data-idx="${idx}"][data-opt="${opt}"]`); if (card.classList.contains('disabled')) return; card.classList.toggle('selected'); answers[idx] = Array.from(document.querySelectorAll(`.component-card[data-idx="${idx}"].selected`)).map(c => parseInt(c.dataset.opt)); }
        function selectTreeOption(idx, step, opt) { const scenario = examData[idx]; const btns = document.querySelectorAll(`.tree-btn[data-idx="${idx}"][data-step="${step}"]`); if (btns[0].classList.contains('disabled')) return; btns.forEach(b => b.classList.remove('selected')); btns[opt].classList.add('selected'); if (!answers[idx]) answers[idx] = []; answers[idx][step] = opt; document.getElementById(`followup${idx}_${step}`).textContent = scenario.steps[step].followup; document.getElementById(`followup${idx}_${step}`).style.display = 'block'; if (step < scenario.steps.length - 1) setTimeout(() => document.getElementById(`step${idx}_${step + 1}`).style.display = 'block', 400); }
        let draggedItem = null;
        function initDragDrop() { document.querySelectorAll('.procedure-item').forEach(item => { item.addEventListener('dragstart', () => { draggedItem = item; item.classList.add('dragging'); }); item.addEventListener('dragend', () => { item.classList.remove('dragging'); document.querySelectorAll('.procedure-item').forEach(i => i.classList.remove('drag-over')); }); item.addEventListener('dragover', e => { e.preventDefault(); if (item !== draggedItem && !item.classList.contains('disabled')) item.classList.add('drag-over'); }); item.addEventListener('dragleave', () => item.classList.remove('drag-over')); item.addEventListener('drop', e => { e.preventDefault(); if (item !== draggedItem && !item.classList.contains('disabled')) { const container = item.parentNode, all = [...container.querySelectorAll('.procedure-item')]; if (all.indexOf(draggedItem) < all.indexOf(item)) item.after(draggedItem); else item.before(draggedItem); container.querySelectorAll('.procedure-item').forEach((el, i) => el.querySelector('.procedure-num').textContent = i + 1); answers[item.dataset.idx] = [...container.querySelectorAll('.procedure-item')].map(el => parseInt(el.dataset.orig)); } item.classList.remove('drag-over'); }); }); }
        function submitExam() {
            let correct = 0;
            examData.forEach((scenario, idx) => {
                const answer = answers[idx], card = document.getElementById(`card${idx}`), feedback = document.getElementById(`feedback${idx}`), correctDiv = document.getElementById(`correct${idx}`);
                let isCorrect = false;
                switch(scenario.type) {
                    case 'diagnosis': isCorrect = answer === scenario.correct; document.querySelectorAll(`.diagnostic-option[data-idx="${idx}"]`).forEach((el, i) => { el.classList.add('disabled'); if (i === scenario.correct) el.classList.add('correct'); else if (i === answer && !isCorrect) el.classList.add('incorrect'); }); correctDiv.textContent = `✓ ${scenario.options[scenario.correct].title}`; break;
                    case 'fill-blank': let allCorrect = true; document.querySelectorAll(`.blank-input[data-idx="${idx}"]`).forEach((inp, i) => { inp.disabled = true; const acceptable = scenario.blanks[i].answer.map(a => a.toLowerCase()); if (answer && acceptable.some(a => answer[i]?.includes(a) || a.includes(answer[i] || ''))) inp.classList.add('correct'); else { inp.classList.add('incorrect'); allCorrect = false; } }); isCorrect = allCorrect; correctDiv.textContent = `Answers: ${scenario.blanks.map(b => b.answer[0]).join(', ')}`; break;
                    case 'component-select': const correctSet = scenario.options.map((o, i) => o.correct ? i : -1).filter(i => i !== -1), selectedSet = answer || []; isCorrect = correctSet.length === selectedSet.length && correctSet.every(i => selectedSet.includes(i)); document.querySelectorAll(`.component-card[data-idx="${idx}"]`).forEach((el, i) => { el.classList.add('disabled'); if (scenario.options[i].correct) el.classList.add('correct'); else if (selectedSet.includes(i)) el.classList.add('incorrect'); }); correctDiv.textContent = `Correct: ${scenario.options.filter(o => o.correct).map(o => o.name).join(', ')}`; break;
                    case 'troubleshoot-tree': isCorrect = answer && answer.length === scenario.steps.length && scenario.steps.every((s, i) => answer[i] === s.correct); document.querySelectorAll(`.tree-btn[data-idx="${idx}"]`).forEach(btn => { btn.classList.add('disabled'); if (parseInt(btn.dataset.opt) === scenario.steps[parseInt(btn.dataset.step)].correct) btn.classList.add('correct'); else if (btn.classList.contains('selected')) btn.classList.add('incorrect'); }); scenario.steps.forEach((_, i) => { document.getElementById(`step${idx}_${i}`).style.display = 'block'; document.getElementById(`followup${idx}_${i}`).style.display = 'block'; }); break;
                    case 'procedure': isCorrect = JSON.stringify(answer || []) === JSON.stringify(scenario.correctOrder); document.querySelectorAll(`#proc${idx} .procedure-item`).forEach((el, i) => { el.classList.add('disabled'); el.draggable = false; if ((answer || [])[i] === scenario.correctOrder[i]) el.classList.add('correct'); else el.classList.add('incorrect'); }); correctDiv.textContent = `Correct order: ${scenario.correctOrder.map(i => i + 1).join(' → ')}`; break;
                }
                if (isCorrect) { correct++; card.classList.add('correct'); feedback.classList.add('correct', 'show'); feedback.querySelector('.feedback-header').classList.add('correct'); feedback.querySelector('.feedback-icon').textContent = '✓'; feedback.querySelector('.feedback-title').textContent = 'Correct!'; }
                else { card.classList.add('incorrect'); feedback.classList.add('incorrect', 'show'); feedback.querySelector('.feedback-header').classList.add('incorrect'); feedback.querySelector('.feedback-icon').textContent = '✗'; feedback.querySelector('.feedback-title').textContent = 'Incorrect'; }
            });
            const pct = Math.round((correct / examData.length) * 100);
            document.getElementById('currentScore').textContent = `${pct}%`; document.getElementById('finalScore').textContent = `${pct}%`; document.getElementById('correctCount').textContent = correct; document.getElementById('incorrectCount').textContent = examData.length - correct;
            const grade = document.getElementById('grade'); if (pct >= 90) { grade.textContent = 'Excellent!'; grade.className = 'results-grade excellent'; } else if (pct >= 70) { grade.textContent = 'Good Job!'; grade.className = 'results-grade good'; } else if (pct >= 50) { grade.textContent = 'Average'; grade.className = 'results-grade average'; } else { grade.textContent = 'Needs Practice'; grade.className = 'results-grade poor'; }
            document.getElementById('results').classList.add('show'); document.getElementById('submitBtn').disabled = true;
        }
        function resetExam() { answers = new Array(examData.length).fill(null); document.getElementById('currentScore').textContent = '0%'; document.getElementById('results').classList.remove('show'); document.getElementById('submitBtn').disabled = false; renderScenarios(); initDragDrop(); }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
