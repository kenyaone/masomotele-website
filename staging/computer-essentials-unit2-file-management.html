<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Management - Practical Exam | M.T.T.I</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'IBM Plex Sans', sans-serif; background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #1a1a2e 100%); color: #eee; min-height: 100vh; }
        
        .header { background: rgba(22, 33, 62, 0.95); border-bottom: 2px solid #e94560; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.2rem; font-weight: 700; color: #e94560; }
        .exam-info { text-align: center; }
        .exam-title { font-size: 0.85rem; color: #fff; }
        .exam-unit { font-size: 0.7rem; color: #aaa; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .timer { font-family: 'IBM Plex Mono', monospace; background: rgba(233, 69, 96, 0.1); padding: 8px 16px; border-radius: 20px; border: 1px solid #e94560; color: #e94560; }
        .timer.warning { animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .start-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .start-card { background: rgba(22, 33, 62, 0.9); border: 1px solid rgba(233, 69, 96, 0.3); border-radius: 16px; padding: 40px; max-width: 500px; width: 100%; text-align: center; }
        .start-icon { font-size: 4rem; margin-bottom: 20px; }
        .start-card h1 { font-size: 1.5rem; color: #fff; margin-bottom: 5px; }
        .start-card h2 { font-size: 1rem; color: #e94560; margin-bottom: 20px; font-weight: 500; }
        .exam-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .meta-item { background: rgba(233, 69, 96, 0.1); padding: 15px; border-radius: 10px; }
        .meta-item .value { font-size: 1.3rem; font-weight: 700; color: #e94560; }
        .meta-item .label { font-size: 0.75rem; color: #aaa; }
        .name-input { margin-bottom: 20px; }
        .name-input label { display: block; margin-bottom: 8px; color: #aaa; font-size: 0.9rem; text-align: left; }
        .name-input input { width: 100%; padding: 12px 16px; background: rgba(10, 10, 20, 0.8); border: 2px solid rgba(233, 69, 96, 0.3); border-radius: 8px; color: #fff; font-size: 1rem; }
        .name-input input:focus { outline: none; border-color: #e94560; }
        .start-btn { width: 100%; padding: 14px; font-size: 1.1rem; font-weight: 600; background: linear-gradient(135deg, #e94560, #c73e54); color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .start-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(233, 69, 96, 0.3); }
        .start-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .exam-container { display: none; }
        .main-content { display: flex; min-height: calc(100vh - 70px); }
        
        .sidebar { width: 200px; background: rgba(22, 33, 62, 0.5); border-right: 1px solid rgba(233, 69, 96, 0.1); padding: 20px; }
        .sidebar-header { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(233, 69, 96, 0.1); }
        .student-name { font-weight: 600; color: #fff; font-size: 0.9rem; }
        .question-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .nav-btn { width: 100%; aspect-ratio: 1; background: rgba(10, 10, 20, 0.8); border: 1px solid rgba(233, 69, 96, 0.2); border-radius: 8px; color: #888; font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
        .nav-btn:hover { border-color: #e94560; color: #e94560; }
        .nav-btn.active { background: rgba(233, 69, 96, 0.2); border-color: #e94560; color: #e94560; }
        .nav-btn.correct { background: rgba(0, 200, 100, 0.2); border-color: #00c864; color: #00c864; }
        .nav-btn.incorrect { background: rgba(255, 100, 100, 0.2); border-color: #ff6464; color: #ff6464; }
        
        .task-area { flex: 1; padding: 30px; overflow-y: auto; }
        .task-card { background: rgba(22, 33, 62, 0.6); border: 1px solid rgba(233, 69, 96, 0.15); border-radius: 16px; padding: 30px; max-width: 800px; margin: 0 auto; }
        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .task-number { font-family: 'IBM Plex Mono', monospace; color: #e94560; font-size: 0.85rem; }
        .task-points { background: rgba(233, 69, 96, 0.15); color: #e94560; padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
        .task-title { font-size: 1.3rem; color: #fff; margin-bottom: 15px; }
        .task-instruction { background: rgba(10, 10, 20, 0.6); border-left: 3px solid #e94560; padding: 15px 20px; border-radius: 0 8px 8px 0; margin-bottom: 20px; }
        .task-instruction p { color: #ccc; line-height: 1.6; }
        .target-text { background: rgba(233, 69, 96, 0.1); border: 1px dashed rgba(233, 69, 96, 0.3); padding: 12px 16px; border-radius: 8px; margin-top: 10px; font-family: 'IBM Plex Mono', monospace; color: #e94560; }
        
        .hint-toggle { background: none; border: 1px solid rgba(255, 193, 7, 0.4); color: #ffc107; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-bottom: 15px; }
        .hint-content { background: rgba(255, 193, 7, 0.1); border: 1px solid rgba(255, 193, 7, 0.3); padding: 12px 16px; border-radius: 8px; margin-bottom: 15px; color: #ffc107; font-size: 0.9rem; display: none; }
        .hint-content.show { display: block; }
        
        .input-area { margin-bottom: 20px; }
        .input-area label { display: block; color: #888; font-size: 0.85rem; margin-bottom: 8px; text-transform: uppercase; }
        .input-area textarea, .input-area input[type="text"] { width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.95); border: 2px solid rgba(233, 69, 96, 0.3); border-radius: 8px; font-size: 1rem; font-family: 'IBM Plex Mono', monospace; color: #222; }
        .input-area textarea:focus, .input-area input[type="text"]:focus { outline: none; border-color: #e94560; }
        
        .matching-area { margin-bottom: 20px; }
        .match-row { display: flex; align-items: center; gap: 15px; margin-bottom: 12px; padding: 12px; background: rgba(10, 10, 20, 0.4); border-radius: 8px; }
        .match-left { flex: 1; color: #ddd; font-size: 0.95rem; }
        .match-select { flex: 1; padding: 10px; background: #fff; border: 2px solid rgba(233, 69, 96, 0.3); border-radius: 6px; font-size: 0.9rem; color: #222; }
        
        .file-tree { background: rgba(10, 10, 20, 0.8); border-radius: 10px; padding: 20px; margin-bottom: 20px; font-family: 'IBM Plex Mono', monospace; }
        .file-tree-item { padding: 5px 0; color: #ccc; }
        .file-tree-item.folder { color: #e94560; }
        .file-tree-item.folder::before { content: "📁 "; }
        .file-tree-item.file::before { content: "📄 "; }
        .file-tree-item .indent-1 { margin-left: 20px; }
        .file-tree-item .indent-2 { margin-left: 40px; }
        
        .path-builder { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-bottom: 15px; }
        .path-segment { background: rgba(233, 69, 96, 0.2); border: 1px solid rgba(233, 69, 96, 0.4); padding: 8px 12px; border-radius: 6px; color: #e94560; font-family: 'IBM Plex Mono', monospace; cursor: pointer; transition: all 0.2s; }
        .path-segment:hover { background: rgba(233, 69, 96, 0.3); }
        .path-segment.selected { background: #e94560; color: #fff; }
        .path-separator { color: #666; font-size: 1.2rem; }
        
        .feedback-box { padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .feedback-box.show { display: block; }
        .feedback-box.correct { background: rgba(0, 200, 100, 0.15); border: 1px solid rgba(0, 200, 100, 0.4); }
        .feedback-box.incorrect { background: rgba(255, 100, 100, 0.15); border: 1px solid rgba(255, 100, 100, 0.4); }
        .feedback-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .feedback-title { font-weight: 600; }
        .feedback-box.correct .feedback-title { color: #00c864; }
        .feedback-box.incorrect .feedback-title { color: #ff6464; }
        .correct-answer { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
        .correct-answer strong { color: #888; font-size: 0.85rem; }
        .correct-answer p { color: #e94560; font-family: 'IBM Plex Mono', monospace; margin-top: 5px; }
        
        .action-buttons { display: flex; justify-content: space-between; padding-top: 20px; border-top: 1px solid rgba(233, 69, 96, 0.1); }
        .check-btn { padding: 12px 30px; background: linear-gradient(135deg, #e94560, #c73e54); color: #fff; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .check-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(233, 69, 96, 0.3); }
        .nav-buttons { display: flex; gap: 10px; }
        .nav-buttons button { padding: 12px 24px; background: rgba(233, 69, 96, 0.1); border: 1px solid rgba(233, 69, 96, 0.3); color: #e94560; border-radius: 8px; cursor: pointer; }
        .nav-buttons button:hover:not(:disabled) { background: rgba(233, 69, 96, 0.2); }
        .nav-buttons button:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .results-screen { display: none; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; }
        .results-card { background: rgba(22, 33, 62, 0.95); border: 1px solid rgba(233, 69, 96, 0.2); border-radius: 20px; padding: 40px; max-width: 500px; width: 100%; text-align: center; }
        .result-icon { font-size: 4rem; margin-bottom: 15px; }
        .result-status { font-size: 1.5rem; font-weight: 700; margin-bottom: 5px; }
        .result-status.passed { color: #00c864; }
        .result-status.failed { color: #ff6464; }
        .score-circle { width: 150px; height: 150px; margin: 0 auto 25px; position: relative; }
        .score-circle svg { transform: rotate(-90deg); }
        .score-circle .bg { fill: none; stroke: rgba(233, 69, 96, 0.1); stroke-width: 10; }
        .score-circle .progress { fill: none; stroke: #e94560; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s; }
        .score-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .score-percent { font-size: 2.5rem; font-weight: 700; color: #e94560; font-family: 'IBM Plex Mono', monospace; }
        .score-label { font-size: 0.8rem; color: #888; }
        .result-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .detail-box { background: rgba(10, 10, 20, 0.6); padding: 15px; border-radius: 10px; }
        .detail-value { font-size: 1.3rem; font-weight: 700; color: #e94560; }
        .detail-label { font-size: 0.75rem; color: #888; }
        .result-actions { display: flex; gap: 15px; }
        .result-actions button { flex: 1; padding: 14px; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; }
        .review-btn { background: rgba(233, 69, 96, 0.2); color: #e94560; border: 1px solid rgba(233, 69, 96, 0.4); }
        .retry-btn { background: linear-gradient(135deg, #e94560, #c73e54); color: #fff; border: none; }

        @media (max-width: 768px) {
            .main-content { flex-direction: column; }
            .sidebar { width: 100%; }
            .question-nav { grid-template-columns: repeat(5, 1fr); }
        }
    </style>
</head>
<body>
    <div id="startScreen" class="start-screen">
        <div class="start-card">
            <div class="start-icon">📁</div>
            <h1>Computer Essentials</h1>
            <h2>Unit 2: File Management</h2>
            <p style="color: #888; margin-bottom: 20px;">Masomotele Technical Training Institute</p>
            
            <div class="exam-meta">
                <div class="meta-item">
                    <div class="value">15</div>
                    <div class="label">Questions</div>
                </div>
                <div class="meta-item">
                    <div class="value">2 Hrs</div>
                    <div class="label">Duration</div>
                </div>
                <div class="meta-item">
                    <div class="value">50%</div>
                    <div class="label">Pass Mark</div>
                </div>
            </div>
            
            <div class="name-input">
                <label>Enter Your Full Name:</label>
                <input type="text" id="studentName" placeholder="e.g., John Kamau">
            </div>
            
            <button class="start-btn" id="startBtn" disabled>Start Examination</button>
        </div>
    </div>
    
    <div id="examContainer" class="exam-container">
        <header class="header">
            <div class="logo">📁 M.T.T.I</div>
            <div class="exam-info">
                <div class="exam-title">File Management</div>
                <div class="exam-unit">Computer Essentials - Unit 2</div>
            </div>
            <div class="header-right">
                <div class="timer" id="timer">02:00:00</div>
                <div style="color:#888;font-family:monospace;"><span id="currentQ">1</span>/15</div>
                <button onclick="showResults()" style="padding:8px 16px;background:rgba(233,69,96,0.2);border:1px solid #e94560;color:#e94560;border-radius:8px;cursor:pointer;">Finish</button>
            </div>
        </header>
        
        <div class="main-content">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <div class="student-name" id="displayName">Student</div>
                </div>
                <div class="question-nav" id="questionNav"></div>
            </aside>
            
            <main class="task-area">
                <div class="task-card" id="taskCard"></div>
            </main>
        </div>
    </div>
    
    <div id="resultsScreen" class="results-screen">
        <div class="results-card">
            <div class="result-icon" id="resultIcon">🎉</div>
            <div class="result-status" id="resultStatus">PASSED</div>
            <p style="color:#888;margin-bottom:25px;">File Management</p>
            
            <div class="score-circle">
                <svg width="150" height="150">
                    <circle class="bg" cx="75" cy="75" r="60"></circle>
                    <circle class="progress" id="scoreProgress" cx="75" cy="75" r="60" stroke-dasharray="377" stroke-dashoffset="377"></circle>
                </svg>
                <div class="score-text">
                    <div class="score-percent" id="scorePercent">0%</div>
                    <div class="score-label">Score</div>
                </div>
            </div>
            
            <div class="result-details">
                <div class="detail-box">
                    <div class="detail-value" id="correctCount">0</div>
                    <div class="detail-label">Correct</div>
                </div>
                <div class="detail-box">
                    <div class="detail-value" id="wrongCount">0</div>
                    <div class="detail-label">Wrong</div>
                </div>
                <div class="detail-box">
                    <div class="detail-value" id="timeUsed">00:00</div>
                    <div class="detail-label">Time</div>
                </div>
            </div>
            
            <div class="result-actions">
                <button class="review-btn" onclick="reviewAnswers()">📝 Review</button>
                <button class="retry-btn" onclick="retryExam()">🔄 Retry</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 1,
                type: "typing",
                title: "File Extension Recognition",
                instruction: "What file extension is used for Microsoft Word documents (newer format)?",
                targetText: ".docx",
                acceptableAnswers: [".docx", "docx", ".DOCX", "DOCX"],
                hint: "It starts with .doc and has an extra letter for the newer XML format",
                points: 10
            },
            {
                id: 2,
                type: "typing",
                title: "Create a Folder Path",
                instruction: "Type the complete path to a folder named 'Projects' inside 'Documents' on the C: drive in Windows:",
                targetText: "C:\\Documents\\Projects",
                acceptableAnswers: ["C:\\Documents\\Projects", "C:/Documents/Projects", "C:\\documents\\projects", "c:\\documents\\projects"],
                hint: "Windows paths start with drive letter, use backslash (\\) between folders",
                points: 10
            },
            {
                id: 3,
                type: "matching",
                title: "Match File Extensions",
                instruction: "Match each file extension to its file type:",
                pairs: [
                    { left: ".pdf", right: "Portable Document", id: "pdf" },
                    { left: ".xlsx", right: "Excel Spreadsheet", id: "xlsx" },
                    { left: ".jpg", right: "Image File", id: "jpg" },
                    { left: ".mp3", right: "Audio File", id: "mp3" }
                ],
                hint: "Think about what programs open each file type",
                points: 10
            },
            {
                id: 4,
                type: "typing",
                title: "Copy Shortcut",
                instruction: "Type the keyboard shortcut to COPY a selected file (use + between keys):",
                targetText: "Ctrl+C",
                acceptableAnswers: ["Ctrl+C", "ctrl+c", "CTRL+C", "Ctrl + C", "ctrl + c"],
                hint: "C stands for Copy",
                points: 10
            },
            {
                id: 5,
                type: "typing",
                title: "Paste Shortcut",
                instruction: "Type the keyboard shortcut to PASTE a copied file (use + between keys):",
                targetText: "Ctrl+V",
                acceptableAnswers: ["Ctrl+V", "ctrl+v", "CTRL+V", "Ctrl + V", "ctrl + v"],
                hint: "V is next to C on the keyboard",
                points: 10
            },
            {
                id: 6,
                type: "typing",
                title: "Cut Shortcut",
                instruction: "Type the keyboard shortcut to CUT (move) a selected file (use + between keys):",
                targetText: "Ctrl+X",
                acceptableAnswers: ["Ctrl+X", "ctrl+x", "CTRL+X", "Ctrl + X", "ctrl + x"],
                hint: "X looks like scissors cutting",
                points: 10
            },
            {
                id: 7,
                type: "matching",
                title: "File Operations",
                instruction: "Match each operation to its description:",
                pairs: [
                    { left: "Copy", right: "Creates a duplicate, keeps original", id: "copy" },
                    { left: "Cut", right: "Moves file, removes original", id: "cut" },
                    { left: "Delete", right: "Sends to Recycle Bin", id: "delete" },
                    { left: "Rename", right: "Changes the file name", id: "rename" }
                ],
                hint: "Think about what happens to the original file",
                points: 10
            },
            {
                id: 8,
                type: "typing",
                title: "Select All Shortcut",
                instruction: "Type the keyboard shortcut to SELECT ALL files in a folder:",
                targetText: "Ctrl+A",
                acceptableAnswers: ["Ctrl+A", "ctrl+a", "CTRL+A", "Ctrl + A"],
                hint: "A stands for All",
                points: 10
            },
            {
                id: 9,
                type: "typing",
                title: "Undo Shortcut",
                instruction: "Type the keyboard shortcut to UNDO the last action:",
                targetText: "Ctrl+Z",
                acceptableAnswers: ["Ctrl+Z", "ctrl+z", "CTRL+Z", "Ctrl + Z"],
                hint: "Z is at the end - undo takes you back",
                points: 10
            },
            {
                id: 10,
                type: "typing",
                title: "File Naming Rules",
                instruction: "Which character CANNOT be used in a Windows file name? Type one:",
                targetText: "\\",
                acceptableAnswers: ["\\", "/", ":", "*", "?", "\"", "<", ">", "|", "backslash", "slash", "colon", "asterisk"],
                hint: "Characters like \\ / : * ? \" < > | are not allowed",
                points: 10
            },
            {
                id: 11,
                type: "matching",
                title: "Storage Locations",
                instruction: "Match each location to its description:",
                pairs: [
                    { left: "Desktop", right: "Quick access screen area", id: "desktop" },
                    { left: "Documents", right: "Default folder for user files", id: "docs" },
                    { left: "Downloads", right: "Files from internet", id: "downloads" },
                    { left: "Recycle Bin", right: "Deleted files storage", id: "recycle" }
                ],
                hint: "Think about where you typically find each type of content",
                points: 10
            },
            {
                id: 12,
                type: "typing",
                title: "New Folder Shortcut",
                instruction: "Type the keyboard shortcut to create a NEW FOLDER in Windows Explorer:",
                targetText: "Ctrl+Shift+N",
                acceptableAnswers: ["Ctrl+Shift+N", "ctrl+shift+n", "CTRL+SHIFT+N", "Ctrl + Shift + N"],
                hint: "It uses Ctrl, Shift, and N (for New)",
                points: 10
            },
            {
                id: 13,
                type: "typing",
                title: "Rename Shortcut",
                instruction: "Which function key do you press to RENAME a selected file?",
                targetText: "F2",
                acceptableAnswers: ["F2", "f2"],
                hint: "It's one of the F keys at the top of the keyboard",
                points: 10
            },
            {
                id: 14,
                type: "typing",
                title: "Permanent Delete",
                instruction: "Type the key combination to PERMANENTLY delete a file (bypass Recycle Bin):",
                targetText: "Shift+Delete",
                acceptableAnswers: ["Shift+Delete", "shift+delete", "SHIFT+DELETE", "Shift + Delete", "Shift+Del", "shift+del"],
                hint: "Hold Shift while pressing Delete",
                points: 10
            },
            {
                id: 15,
                type: "matching",
                title: "File Size Units",
                instruction: "Arrange these storage units from smallest to largest by matching:",
                pairs: [
                    { left: "1 KB", right: "1,024 Bytes", id: "kb" },
                    { left: "1 MB", right: "1,024 KB", id: "mb" },
                    { left: "1 GB", right: "1,024 MB", id: "gb" },
                    { left: "1 TB", right: "1,024 GB", id: "tb" }
                ],
                hint: "Each unit is 1,024 times larger than the previous",
                points: 10
            }
        ];

        let state = {
            studentName: '',
            currentQuestion: 0,
            answers: {},
            results: {},
            timeRemaining: 2 * 60 * 60,
            timerInterval: null
        };

        document.getElementById('studentName').addEventListener('input', function() {
            state.studentName = this.value.trim();
            document.getElementById('startBtn').disabled = !state.studentName;
        });

        document.getElementById('startBtn').addEventListener('click', startExam);

        function startExam() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('examContainer').style.display = 'block';
            document.getElementById('displayName').textContent = state.studentName;
            buildNavigation();
            loadQuestion(0);
            startTimer();
        }

        function buildNavigation() {
            const nav = document.getElementById('questionNav');
            nav.innerHTML = '';
            questions.forEach((q, i) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn' + (i === 0 ? ' active' : '');
                btn.textContent = i + 1;
                btn.onclick = () => loadQuestion(i);
                nav.appendChild(btn);
            });
        }

        function updateNavigation() {
            document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                btn.classList.remove('active', 'correct', 'incorrect');
                if (i === state.currentQuestion) btn.classList.add('active');
                else if (state.results[i]?.correct) btn.classList.add('correct');
                else if (state.results[i]?.checked) btn.classList.add('incorrect');
            });
        }

        function startTimer() {
            state.timerInterval = setInterval(() => {
                state.timeRemaining--;
                const h = Math.floor(state.timeRemaining / 3600);
                const m = Math.floor((state.timeRemaining % 3600) / 60);
                const s = state.timeRemaining % 60;
                document.getElementById('timer').textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                if (state.timeRemaining <= 300) document.getElementById('timer').classList.add('warning');
                if (state.timeRemaining <= 0) { clearInterval(state.timerInterval); showResults(); }
            }, 1000);
        }

        function loadQuestion(index) {
            state.currentQuestion = index;
            const q = questions[index];
            document.getElementById('currentQ').textContent = index + 1;
            
            let html = `
                <div class="task-header">
                    <span class="task-number">Question ${index + 1} of ${questions.length}</span>
                    <span class="task-points">${q.points} pts</span>
                </div>
                <h2 class="task-title">${q.title}</h2>
                <div class="task-instruction">
                    <p>${q.instruction}</p>
                </div>
                <button class="hint-toggle" onclick="toggleHint()">💡 Show Hint</button>
                <div class="hint-content" id="hintContent">${q.hint}</div>
            `;

            if (q.type === 'typing') {
                html += `
                    <div class="input-area">
                        <label>Your Answer:</label>
                        <input type="text" id="userAnswer" placeholder="Type your answer..." value="${state.answers[index] || ''}">
                    </div>
                `;
            } else if (q.type === 'matching') {
                html += `<div class="matching-area">`;
                const shuffled = [...q.pairs].map(p => p.right).sort(() => Math.random() - 0.5);
                q.pairs.forEach(pair => {
                    const saved = state.answers[index]?.[pair.id] || '';
                    html += `
                        <div class="match-row">
                            <div class="match-left">${pair.left}</div>
                            <select class="match-select" data-id="${pair.id}">
                                <option value="">-- Select --</option>
                                ${shuffled.map(r => `<option value="${r}" ${saved === r ? 'selected' : ''}>${r}</option>`).join('')}
                            </select>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            html += `
                <div class="feedback-box" id="feedbackBox">
                    <div class="feedback-header">
                        <span class="feedback-title" id="feedbackTitle"></span>
                        <span style="color:#888;font-size:0.85rem;" id="feedbackScore"></span>
                    </div>
                    <div class="correct-answer" id="correctAnswerBox">
                        <strong>Correct Answer:</strong>
                        <p id="correctAnswerText"></p>
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="check-btn" onclick="checkAnswer()">✓ Check Answer</button>
                    <div class="nav-buttons">
                        <button onclick="prevQuestion()" ${index === 0 ? 'disabled' : ''}>← Previous</button>
                        <button onclick="nextQuestion()">${index === questions.length - 1 ? 'Finish →' : 'Next →'}</button>
                    </div>
                </div>
            `;

            document.getElementById('taskCard').innerHTML = html;
            if (state.results[index]?.checked) showFeedback(index);
            updateNavigation();
        }

        function toggleHint() {
            document.getElementById('hintContent').classList.toggle('show');
        }

        function saveAnswer() {
            const q = questions[state.currentQuestion];
            if (q.type === 'typing') {
                const input = document.getElementById('userAnswer');
                if (input) state.answers[state.currentQuestion] = input.value;
            } else if (q.type === 'matching') {
                state.answers[state.currentQuestion] = {};
                document.querySelectorAll('.match-select').forEach(sel => {
                    state.answers[state.currentQuestion][sel.dataset.id] = sel.value;
                });
            }
        }

        function checkAnswer() {
            saveAnswer();
            const q = questions[state.currentQuestion];
            let correct = false;
            let score = 0;

            if (q.type === 'typing') {
                const userAnswer = (state.answers[state.currentQuestion] || '').trim();
                correct = q.acceptableAnswers.some(ans => userAnswer.toLowerCase() === ans.toLowerCase());
                score = correct ? q.points : 0;
            } else if (q.type === 'matching') {
                let matchCount = 0;
                const answers = state.answers[state.currentQuestion] || {};
                q.pairs.forEach(pair => {
                    if (answers[pair.id] === pair.right) matchCount++;
                });
                correct = matchCount === q.pairs.length;
                score = Math.round((matchCount / q.pairs.length) * q.points);
            }

            state.results[state.currentQuestion] = { correct, score, maxScore: q.points, checked: true };
            showFeedback(state.currentQuestion);
            updateNavigation();
        }

        function showFeedback(index) {
            const result = state.results[index];
            const q = questions[index];
            const box = document.getElementById('feedbackBox');
            
            box.classList.remove('correct', 'incorrect');
            box.classList.add('show', result.correct ? 'correct' : 'incorrect');
            document.getElementById('feedbackTitle').textContent = result.correct ? '✅ Correct!' : '❌ Incorrect';
            document.getElementById('feedbackScore').textContent = `${result.score}/${result.maxScore} points`;
            
            if (!result.correct) {
                document.getElementById('correctAnswerBox').style.display = 'block';
                let text = q.type === 'typing' ? q.targetText : q.pairs.map(p => `${p.left} → ${p.right}`).join('<br>');
                document.getElementById('correctAnswerText').innerHTML = text;
            } else {
                document.getElementById('correctAnswerBox').style.display = 'none';
            }
        }

        function prevQuestion() { saveAnswer(); if (state.currentQuestion > 0) loadQuestion(state.currentQuestion - 1); }
        function nextQuestion() { saveAnswer(); if (state.currentQuestion < questions.length - 1) loadQuestion(state.currentQuestion + 1); else showResults(); }

        function showResults() {
            clearInterval(state.timerInterval);
            let total = 0, max = 0, correctCount = 0;
            questions.forEach((q, i) => {
                max += q.points;
                if (state.results[i]) { total += state.results[i].score; if (state.results[i].correct) correctCount++; }
            });
            
            const pct = Math.round((total / max) * 100);
            const passed = pct >= 50;
            const used = 2 * 60 * 60 - state.timeRemaining;
            
            document.getElementById('examContainer').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'flex';
            document.getElementById('resultIcon').textContent = passed ? '🎉' : '📚';
            document.getElementById('resultStatus').textContent = passed ? 'PASSED!' : 'Keep Practicing';
            document.getElementById('resultStatus').className = 'result-status ' + (passed ? 'passed' : 'failed');
            document.getElementById('scorePercent').textContent = pct + '%';
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = questions.length - correctCount;
            document.getElementById('timeUsed').textContent = `${Math.floor(used/60)}:${(used%60).toString().padStart(2,'0')}`;
            
            setTimeout(() => {
                document.getElementById('scoreProgress').style.strokeDashoffset = 377 - (pct / 100) * 377;
            }, 100);
            
            // Save results to MTTI system
            if (typeof submitExamToMTTI === 'function') {
                const questionResults = questions.map((q, i) => ({
                    question: q.question || q.title,
                    correct: state.results[i] ? state.results[i].correct : false
                }));
                
                submitExamToMTTI(
                    document.title.split('|')[0].trim(),
                    total,
                    max,
                    questionResults,
                    Math.floor(used / 60)
                ).then(result => {
                    if (result.success) console.log('✅ Results saved to MTTI:', result.data);
                    else console.error('❌ Failed to save results:', result.message);
                });
            }
        }

        function reviewAnswers() {
            document.getElementById('resultsScreen').style.display = 'none';
            document.getElementById('examContainer').style.display = 'block';
            loadQuestion(0);
        }

        function retryExam() {
            state = { studentName: state.studentName, currentQuestion: 0, answers: {}, results: {}, timeRemaining: 2*60*60, timerInterval: null };
            document.getElementById('resultsScreen').style.display = 'none';
            document.getElementById('examContainer').style.display = 'block';
            document.getElementById('timer').textContent = '02:00:00';
            document.getElementById('timer').classList.remove('warning');
            buildNavigation();
            loadQuestion(0);
            startTimer();
        }
    </script>
</body>
</html>
