<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 1: Google Ads | M.T.T.I</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4285f4; --secondary: #34a853; --success: #34a853; --error: #ea4335; --warning: #fbbc04; --bg-dark: #0a0a0f; --bg-card: #12121a; --bg-input: #1a1a24; --bg-hover: #22222e; --text-primary: #f5f5f7; --text-secondary: #a0a0b0; --text-muted: #6a6a7a; --border: #2a2a3a; --accent: #4285f4; --accent-glow: rgba(66, 133, 244, 0.15); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.7; }
        .header { background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-dark) 100%); border-bottom: 1px solid var(--border); padding: 1.5rem 2rem; position: sticky; top: 0; z-index: 100; }
        .header-content { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo { display: flex; align-items: center; gap: 0.75rem; }
        .logo-icon { width: 48px; height: 48px; background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .logo h1 { font-size: 1.1rem; font-weight: 700; background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo span { font-size: 0.65rem; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; display: block; }
        .score-display { background: var(--bg-card); border: 1px solid var(--border); padding: 0.75rem 1.5rem; border-radius: 10px; text-align: center; }
        .score-value { font-family: 'IBM Plex Mono', monospace; font-size: 1.5rem; font-weight: 700; color: var(--accent); }
        .score-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .main-container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        .exam-header { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; margin-bottom: 2rem; position: relative; overflow: hidden; }
        .exam-header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--accent) 0%, var(--secondary) 100%); }
        .unit-badge { display: inline-block; background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%); color: white; padding: 0.35rem 1rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1rem; }
        .exam-title { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; }
        .exam-desc { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1.5rem; }
        .exam-stats { display: flex; gap: 2rem; flex-wrap: wrap; }
        .stat-item { display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.9rem; }
        .scenarios { display: flex; flex-direction: column; gap: 1.5rem; }
        .scenario-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .scenario-card.correct { border-color: var(--success); }
        .scenario-card.incorrect { border-color: var(--error); }
        .scenario-header { background: var(--bg-input); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .scenario-num { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-secondary); }
        .scenario-num strong { background: var(--accent); color: white; padding: 0.25rem 0.65rem; border-radius: 5px; font-family: 'IBM Plex Mono', monospace; }
        .scenario-type { font-size: 0.7rem; padding: 0.3rem 0.75rem; background: var(--bg-hover); border-radius: 5px; color: var(--accent); text-transform: uppercase; font-weight: 600; }
        .scenario-body { padding: 1.5rem; }
        .job-brief { background: linear-gradient(135deg, rgba(66, 133, 244, 0.1) 0%, rgba(52, 168, 83, 0.1) 100%); border: 1px solid rgba(66, 133, 244, 0.3); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; }
        .brief-label { font-size: 0.7rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.75rem; font-weight: 600; }
        .brief-text { font-size: 0.95rem; line-height: 1.7; }
        .site-info { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--bg-dark); padding: 0.5rem 0.85rem; border-radius: 6px; font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.75rem; font-family: 'IBM Plex Mono', monospace; }
        .requirements-box { background: var(--bg-input); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
        .requirements-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.75rem; }
        .requirements-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .req-tag { background: var(--bg-hover); border: 1px solid var(--border); padding: 0.4rem 0.75rem; border-radius: 6px; font-size: 0.8rem; }
        .question-section { margin-top: 1.25rem; }
        .question-text { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
        .diagnostic-options { display: flex; flex-direction: column; gap: 0.6rem; }
        .diagnostic-option { display: flex; align-items: flex-start; gap: 0.75rem; padding: 1rem 1.25rem; background: var(--bg-input); border: 2px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .diagnostic-option:hover:not(.disabled) { border-color: var(--accent); background: var(--accent-glow); }
        .diagnostic-option.selected { border-color: var(--accent); background: var(--accent-glow); }
        .diagnostic-option.correct { border-color: var(--success); background: rgba(52, 168, 83, 0.15); }
        .diagnostic-option.incorrect { border-color: var(--error); background: rgba(234, 67, 53, 0.15); }
        .diagnostic-option.disabled { cursor: not-allowed; opacity: 0.7; }
        .option-marker { width: 24px; height: 24px; border: 2px solid var(--border); border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
        .diagnostic-option.selected .option-marker { border-color: var(--accent); background: var(--accent); color: white; }
        .diagnostic-option.correct .option-marker { border-color: var(--success); background: var(--success); color: white; }
        .diagnostic-option.incorrect .option-marker { border-color: var(--error); background: var(--error); color: white; }
        .option-content { flex: 1; }
        .option-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.25rem; }
        .option-desc { font-size: 0.8rem; color: var(--text-secondary); }
        .fill-blanks { background: var(--bg-input); border-radius: 10px; padding: 1.25rem; }
        .blank-row { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; line-height: 2.2; }
        .fill-text { font-size: 0.9rem; }
        .blank-input { width: 140px; padding: 0.5rem; background: var(--bg-dark); border: 2px solid var(--border); border-radius: 6px; color: var(--text-primary); font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; text-align: center; }
        .blank-input:focus { outline: none; border-color: var(--accent); }
        .blank-input.correct { border-color: var(--success); background: rgba(52, 168, 83, 0.1); }
        .blank-input.incorrect { border-color: var(--error); background: rgba(234, 67, 53, 0.1); }
        .procedure-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .procedure-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.875rem 1rem; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; cursor: grab; user-select: none; }
        .procedure-item:hover:not(.disabled) { border-color: var(--accent); }
        .procedure-item.dragging { opacity: 0.5; }
        .procedure-item.drag-over { border-color: var(--accent); background: var(--accent-glow); }
        .procedure-item.correct { border-color: var(--success); background: rgba(52, 168, 83, 0.1); }
        .procedure-item.incorrect { border-color: var(--error); background: rgba(234, 67, 53, 0.1); }
        .procedure-item.disabled { cursor: not-allowed; }
        .procedure-num { width: 28px; height: 28px; background: var(--bg-hover); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
        .procedure-item.correct .procedure-num { background: var(--success); color: white; }
        .procedure-item.incorrect .procedure-num { background: var(--error); color: white; }
        .drag-handle { color: var(--text-muted); }
        .procedure-text { flex: 1; font-size: 0.85rem; }
        .troubleshoot-tree { display: flex; flex-direction: column; gap: 1rem; }
        .tree-step { background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; }
        .tree-question { font-size: 0.9rem; margin-bottom: 0.875rem; font-weight: 500; }
        .tree-options { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .tree-btn { padding: 0.6rem 1rem; background: var(--bg-hover); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-family: inherit; font-size: 0.85rem; cursor: pointer; }
        .tree-btn:hover:not(.disabled) { border-color: var(--accent); }
        .tree-btn.selected { border-color: var(--accent); background: var(--accent-glow); }
        .tree-btn.correct { border-color: var(--success); background: rgba(52, 168, 83, 0.15); }
        .tree-btn.incorrect { border-color: var(--error); background: rgba(234, 67, 53, 0.15); }
        .tree-btn.disabled { cursor: not-allowed; opacity: 0.6; }
        .tree-followup { margin-top: 0.875rem; padding: 0.875rem; background: var(--bg-dark); border-radius: 8px; font-size: 0.85rem; color: var(--text-secondary); border-left: 3px solid var(--accent); }
        .component-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.75rem; }
        .component-card { background: var(--bg-input); border: 2px solid var(--border); border-radius: 10px; padding: 1rem; text-align: center; cursor: pointer; transition: all 0.2s; }
        .component-card:hover:not(.disabled) { border-color: var(--accent); transform: translateY(-2px); }
        .component-card.selected { border-color: var(--accent); background: var(--accent-glow); }
        .component-card.correct { border-color: var(--success); background: rgba(52, 168, 83, 0.1); }
        .component-card.incorrect { border-color: var(--error); background: rgba(234, 67, 53, 0.1); }
        .component-card.disabled { cursor: not-allowed; opacity: 0.7; }
        .component-icon { font-size: 2rem; margin-bottom: 0.5rem; }
        .component-name { font-size: 0.8rem; font-weight: 500; }
        .calc-group { background: var(--bg-input); border-radius: 10px; padding: 1.25rem; }
        .calc-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
        .calc-label { min-width: 200px; font-size: 0.85rem; color: var(--text-secondary); }
        .calc-input { width: 100px; padding: 0.6rem; background: var(--bg-dark); border: 2px solid var(--border); border-radius: 6px; color: var(--text-primary); font-family: 'IBM Plex Mono', monospace; text-align: center; }
        .calc-input:focus { outline: none; border-color: var(--accent); }
        .calc-input.correct { border-color: var(--success); }
        .calc-input.incorrect { border-color: var(--error); }
        .calc-unit { font-size: 0.85rem; color: var(--text-muted); }
        .calc-readonly { font-weight: 600; color: var(--text-primary); }
        .feedback-box { margin-top: 1.25rem; padding: 1.25rem; border-radius: 10px; display: none; }
        .feedback-box.show { display: block; }
        .feedback-box.correct { background: rgba(52, 168, 83, 0.1); border: 1px solid var(--success); }
        .feedback-box.incorrect { background: rgba(234, 67, 53, 0.1); border: 1px solid var(--error); }
        .feedback-header { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; margin-bottom: 0.5rem; }
        .feedback-header.correct { color: var(--success); }
        .feedback-header.incorrect { color: var(--error); }
        .feedback-text { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.7; }
        .correct-answer { margin-top: 0.75rem; padding: 0.625rem; background: var(--bg-dark); border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; }
        .actions { margin-top: 2rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
        .btn { padding: 1rem 2.5rem; border: none; border-radius: 10px; font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%); color: white; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: var(--error); color: var(--error); }
        .results-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; margin-top: 2rem; text-align: center; display: none; }
        .results-panel.show { display: block; }
        .results-score { font-size: 4.5rem; font-weight: 700; font-family: 'IBM Plex Mono', monospace; background: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .results-label { color: var(--text-secondary); margin-bottom: 1rem; }
        .results-grade { display: inline-block; padding: 0.6rem 2rem; border-radius: 25px; font-weight: 600; margin-bottom: 1.5rem; }
        .results-grade.excellent { background: rgba(52, 168, 83, 0.2); color: var(--success); }
        .results-grade.good { background: rgba(66, 133, 244, 0.2); color: var(--accent); }
        .results-grade.average { background: rgba(251, 188, 4, 0.2); color: var(--warning); }
        .results-grade.poor { background: rgba(234, 67, 53, 0.2); color: var(--error); }
        .results-stats { display: flex; justify-content: center; gap: 4rem; }
        .stat-box-value { font-size: 2rem; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
        .stat-box-value.correct { color: var(--success); }
        .stat-box-value.incorrect { color: var(--error); }
        .stat-box-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
        @media (max-width: 600px) { .main-container { padding: 1rem; } .component-grid { grid-template-columns: repeat(2, 1fr); } .calc-label { min-width: 100%; } }
    </style>
</head>
<body>
    <header class="header"><div class="header-content"><div class="logo"><div class="logo-icon">📊</div><div><h1>M.T.T.I</h1><span>Social Media Marketing</span></div></div><div class="score-display"><div class="score-value" id="currentScore">0%</div><div class="score-label">Score</div></div></div></header>
    <main class="main-container">
        <div class="exam-header"><div class="unit-badge">Unit 1</div><h2 class="exam-title">Google Ads</h2><p class="exam-desc">Master Google Ads campaign creation, keyword strategies, bidding optimization, and performance analysis for effective paid search marketing.</p><div class="exam-stats"><div class="stat-item"><span>📋</span> 8 Scenarios</div><div class="stat-item"><span>⏱️</span> ~25 minutes</div><div class="stat-item"><span>🎯</span> 70% to pass</div></div></div>
        <div class="scenarios" id="scenarios"></div>
        <div class="actions"><button class="btn btn-secondary" onclick="resetExam()">Reset Exam</button><button class="btn btn-primary" id="submitBtn" onclick="submitExam()">Submit Answers</button></div>
        <div class="results-panel" id="results"><div class="results-score" id="finalScore">0%</div><div class="results-label">Your Final Score</div><div class="results-grade" id="grade"></div><div class="results-stats"><div class="stat-box"><div class="stat-box-value correct" id="correctCount">0</div><div class="stat-box-label">Correct</div></div><div class="stat-box"><div class="stat-box-value incorrect" id="incorrectCount">0</div><div class="stat-box-label">Incorrect</div></div></div></div>
    </main>
    <script>
        const examData = [
            { type: "diagnosis", client: "I'm launching a new bakery in Eldoret. I want people to find me when they search online. Which campaign type should I start with?", site: "New local bakery business", requirements: ["Local customers", "Limited budget KES 20,000/month", "Brand new business"], question: "Which Google Ads campaign type is BEST for this client?", options: [{ title: "Search Campaign with local keywords", desc: "Text ads appearing when people search for bakeries nearby" },{ title: "Display Campaign with banner ads", desc: "Image ads shown across websites" },{ title: "Video Campaign on YouTube", desc: "Video ads before YouTube videos" },{ title: "Shopping Campaign", desc: "Product listings with images and prices" }], correct: 0, explanation: "Search campaigns are ideal for local businesses with limited budgets. They capture high-intent users actively searching for 'bakery near me' or 'cakes in Eldoret'. Display and Video are better for brand awareness with larger budgets." },
            { type: "fill-blank", client: "Help me understand the key metrics I should track in my Google Ads dashboard.", site: "Google Ads training session", requirements: ["Understanding KPIs", "Performance tracking"], question: "Complete the Google Ads metric definitions:", blanks: [{ text: "CTR stands for Click-Through ", answer: ["rate", "ratio"], hint: "____" },{ text: "CPC stands for Cost Per ", answer: ["click"], hint: "____" },{ text: "Quality Score ranges from 1 to ", answer: ["10"], hint: "number" },{ text: "ROAS stands for Return On Ad ", answer: ["spend", "spending"], hint: "____" }], explanation: "Key metrics: CTR (Click-Through Rate) = clicks ÷ impressions. CPC (Cost Per Click) = total cost ÷ clicks. Quality Score (1-10) affects ad rank and CPC. ROAS (Return On Ad Spend) = revenue ÷ ad spend." },
            { type: "procedure", client: "Walk me through setting up my first Google Search campaign from scratch.", site: "New advertiser onboarding", requirements: ["First campaign setup", "Search campaign"], question: "Arrange the campaign setup steps in CORRECT order:", steps: ["Set daily budget and bidding strategy", "Choose campaign goal and type (Search)", "Write compelling ad copy with headlines", "Add negative keywords to filter irrelevant traffic", "Select target location and language", "Research and add relevant keywords"], correctOrder: [1, 4, 5, 2, 0, 3], explanation: "Correct flow: Goal/Type → Location/Language → Keywords → Ad Copy → Budget/Bidding → Negative Keywords. Always define targeting before writing ads, and add negative keywords after seeing what triggers your ads." },
            { type: "diagnosis", client: "My ads are getting lots of clicks but nobody is buying. I'm spending KES 50,000 but only made 2 sales.", site: "E-commerce store - poor conversion", requirements: ["High CTR, low conversions", "KES 50,000 spend", "2 sales only"], question: "What is the MOST likely cause and solution?", options: [{ title: "Landing page doesn't match ad promise - optimize landing page", desc: "Users click expecting something different than what they find" },{ title: "Increase the budget to get more clicks", desc: "More traffic will bring more sales" },{ title: "Change to Display campaigns instead", desc: "Different campaign type might work better" },{ title: "Ads are too attractive - make them less appealing", desc: "Reduce expectations before clicking" }], correct: 0, explanation: "High CTR + low conversions = landing page problem. Check: Does the page match the ad? Is the CTA clear? Is checkout easy? Page speed? Mobile-friendly? Fix the landing page before spending more on ads." },
            { type: "component-select", client: "Which keyword match types should I understand for my campaigns?", site: "Keyword strategy training", requirements: ["Match type knowledge", "Campaign optimization"], question: "Select ALL valid Google Ads keyword match types:", options: [{ icon: "🎯", name: "Exact Match", correct: true },{ icon: "📝", name: "Phrase Match", correct: true },{ icon: "🌐", name: "Broad Match", correct: true },{ icon: "🚫", name: "Negative Match", correct: true },{ icon: "🔮", name: "Psychic Match", correct: false },{ icon: "⚡", name: "Instant Match", correct: false }], explanation: "Google Ads match types: Exact [keyword] - precise match only. Phrase \"keyword\" - contains phrase. Broad keyword - related searches. Negative -keyword - excludes terms. Use a mix for control and reach." },
            { type: "troubleshoot-tree", client: "My Quality Score is only 4/10 and my CPC is very high. Help me improve it.", site: "Campaign optimization - low Quality Score", requirements: ["Quality Score: 4/10", "High CPC", "Improve performance"], question: "Diagnose and fix the Quality Score issue:", steps: [{ question: "Quality Score has 3 components. Which should you check FIRST?", options: ["Ad Relevance", "Expected CTR", "Landing Page Experience"], correct: 0, followup: "Ad Relevance is 'Below Average' - your ads don't match user search intent." },{ question: "How do you improve Ad Relevance?", options: ["Include keywords in ad headlines and descriptions", "Increase your bid amount", "Add more keywords to ad group"], correct: 0, followup: "You rewrite ads to include exact keywords users search for. Ad Relevance improves to 'Average'." },{ question: "Landing Page Experience is also 'Below Average'. Best fix?", options: ["Ensure landing page content matches ad and loads fast", "Add more ads to the campaign", "Remove keywords"], correct: 0, followup: "You improve page speed, add relevant content, and make CTA clearer. Quality Score rises to 7/10!" }], explanation: "Quality Score = Ad Relevance + Expected CTR + Landing Page Experience. Higher QS = lower CPC and better ad positions. Always align keywords → ads → landing pages for best results." },
            { type: "calculation", client: "Help me calculate if my Google Ads campaign is profitable.", site: "ROI analysis for retail client", requirements: ["Track profitability", "Calculate ROAS"], question: "Calculate the campaign performance metrics:", calculations: [{ label: "Total ad spend", value: "10,000", unit: "KES", readonly: true },{ label: "Total clicks received", value: "500", unit: "clicks", readonly: true },{ label: "Total conversions (sales)", value: "25", unit: "sales", readonly: true },{ label: "Revenue generated", value: "50,000", unit: "KES", readonly: true },{ label: "Cost Per Click (CPC)", value: "", unit: "KES", answer: ["20"] },{ label: "Conversion Rate", value: "", unit: "%", answer: ["5"] },{ label: "ROAS (Return on Ad Spend)", value: "", unit: "x", answer: ["5", "5x", "500%"] }], explanation: "CPC = 10,000 ÷ 500 = KES 20. Conversion Rate = 25 ÷ 500 × 100 = 5%. ROAS = 50,000 ÷ 10,000 = 5x (or 500%). This campaign is profitable - every KES 1 spent returns KES 5!" },
            { type: "diagnosis", client: "I set up conversion tracking but it shows 0 conversions even though I know people are buying.", site: "Conversion tracking troubleshooting", requirements: ["Conversion tracking setup", "Shows 0 conversions", "Sales happening"], question: "What is the MOST likely cause of this issue?", options: [{ title: "Conversion tag not installed on thank-you/confirmation page", desc: "The tracking code is missing or on wrong page" },{ title: "Campaign budget is too low", desc: "Need more budget to track conversions" },{ title: "Using wrong campaign type", desc: "Search campaigns can't track conversions" },{ title: "Google Ads doesn't work in Kenya", desc: "Regional limitation" }], correct: 0, explanation: "Most common conversion tracking issue: tag placed on wrong page or not installed. The Google tag must fire on the THANK YOU or confirmation page AFTER purchase. Use Google Tag Assistant to verify installation." }
        ];
        let answers = new Array(examData.length).fill(null);
        function init() { renderScenarios(); initDragDrop(); }
        function renderScenarios() { document.getElementById('scenarios').innerHTML = examData.map((s, i) => renderScenario(s, i)).join(''); }
        function renderScenario(s, idx) {
            let html = '';
            if (s.type === 'diagnosis') html = `<div class="diagnostic-options">${s.options.map((o, i) => `<div class="diagnostic-option" data-idx="${idx}" data-opt="${i}" onclick="selectOption(${idx},${i})"><div class="option-marker"></div><div class="option-content"><div class="option-title">${o.title}</div><div class="option-desc">${o.desc}</div></div></div>`).join('')}</div>`;
            else if (s.type === 'fill-blank') html = `<div class="fill-blanks">${s.blanks.map((b, i) => `<div class="blank-row"><span class="fill-text">${b.text}</span><input type="text" class="blank-input" data-idx="${idx}" data-b="${i}" placeholder="${b.hint}" onchange="updateBlank(${idx})"></div>`).join('')}</div>`;
            else if (s.type === 'component-select') html = `<div class="component-grid">${s.options.map((o, i) => `<div class="component-card" data-idx="${idx}" data-opt="${i}" onclick="toggleComp(${idx},${i})"><div class="component-icon">${o.icon}</div><div class="component-name">${o.name}</div></div>`).join('')}</div>`;
            else if (s.type === 'calculation') html = `<div class="calc-group">${s.calculations.map((c, i) => `<div class="calc-row"><span class="calc-label">${c.label}:</span>${c.readonly ? `<span class="calc-readonly">${c.value}</span>` : `<input type="text" class="calc-input" data-idx="${idx}" data-c="${i}" placeholder="?" onchange="updateCalc(${idx})">`}<span class="calc-unit">${c.unit}</span></div>`).join('')}</div>`;
            else if (s.type === 'troubleshoot-tree') html = `<div class="troubleshoot-tree">${s.steps.map((st, i) => `<div class="tree-step" id="ts${idx}_${i}" ${i > 0 ? 'style="display:none"' : ''}><div class="tree-question">${st.question}</div><div class="tree-options">${st.options.map((o, oi) => `<button class="tree-btn" data-idx="${idx}" data-s="${i}" data-o="${oi}" onclick="selectTree(${idx},${i},${oi})">${o}</button>`).join('')}</div><div class="tree-followup" id="tf${idx}_${i}" style="display:none"></div></div>`).join('')}</div>`;
            else if (s.type === 'procedure') { const sh = s.steps.map((t, i) => ({text: t, orig: i})).sort(() => Math.random() - 0.5); html = `<div class="procedure-list" id="proc${idx}">${sh.map((t, i) => `<div class="procedure-item" draggable="true" data-idx="${idx}" data-orig="${t.orig}"><span class="drag-handle">⋮⋮</span><div class="procedure-num">${i + 1}</div><div class="procedure-text">${t.text}</div></div>`).join('')}</div>`; }
            return `<div class="scenario-card" id="card${idx}"><div class="scenario-header"><div class="scenario-num"><strong>${idx + 1}</strong> of ${examData.length}</div><div class="scenario-type">${{'diagnosis':'🔍 Analysis','fill-blank':'✏️ Fill Blanks','component-select':'🎯 Select All','calculation':'🧮 Calculation','troubleshoot-tree':'🌳 Decision Tree','procedure':'📋 Ordering'}[s.type]}</div></div><div class="scenario-body">${s.client ? `<div class="job-brief"><div class="brief-label">📋 Client Brief</div><div class="brief-text">"${s.client}"</div>${s.site ? `<div class="site-info">🏢 ${s.site}</div>` : ''}</div>` : ''}${s.requirements?.length ? `<div class="requirements-box"><div class="requirements-label">Context</div><div class="requirements-list">${s.requirements.map(r => `<span class="req-tag">• ${r}</span>`).join('')}</div></div>` : ''}<div class="question-section"><div class="question-text">${s.question}</div>${html}</div><div class="feedback-box" id="fb${idx}"><div class="feedback-header"><span class="feedback-icon"></span><span class="feedback-title"></span></div><div class="feedback-text">${s.explanation}</div><div class="correct-answer" id="ca${idx}"></div></div></div></div>`;
        }
        function selectOption(idx, opt) { if (document.querySelector(`.diagnostic-option[data-idx="${idx}"]`)?.classList.contains('disabled')) return; document.querySelectorAll(`.diagnostic-option[data-idx="${idx}"]`).forEach(e => e.classList.remove('selected')); document.querySelector(`.diagnostic-option[data-idx="${idx}"][data-opt="${opt}"]`).classList.add('selected'); answers[idx] = opt; }
        function updateBlank(idx) { answers[idx] = Array.from(document.querySelectorAll(`.blank-input[data-idx="${idx}"]`)).map(e => e.value.trim().toLowerCase()); }
        function toggleComp(idx, opt) { const c = document.querySelector(`.component-card[data-idx="${idx}"][data-opt="${opt}"]`); if (c.classList.contains('disabled')) return; c.classList.toggle('selected'); answers[idx] = Array.from(document.querySelectorAll(`.component-card[data-idx="${idx}"].selected`)).map(e => parseInt(e.dataset.opt)); }
        function updateCalc(idx) { answers[idx] = Array.from(document.querySelectorAll(`.calc-input[data-idx="${idx}"]`)).map(e => e.value.trim().toLowerCase()); }
        function selectTree(idx, step, opt) { const s = examData[idx]; const btns = document.querySelectorAll(`.tree-btn[data-idx="${idx}"][data-s="${step}"]`); if (btns[0].classList.contains('disabled')) return; btns.forEach(b => b.classList.remove('selected')); btns[opt].classList.add('selected'); if (!answers[idx]) answers[idx] = []; answers[idx][step] = opt; document.getElementById(`tf${idx}_${step}`).textContent = s.steps[step].followup; document.getElementById(`tf${idx}_${step}`).style.display = 'block'; if (step < s.steps.length - 1) setTimeout(() => document.getElementById(`ts${idx}_${step + 1}`).style.display = 'block', 400); }
        let draggedItem = null;
        function initDragDrop() { document.querySelectorAll('.procedure-item').forEach(item => { item.addEventListener('dragstart', () => { draggedItem = item; item.classList.add('dragging'); }); item.addEventListener('dragend', () => { item.classList.remove('dragging'); document.querySelectorAll('.procedure-item').forEach(i => i.classList.remove('drag-over')); }); item.addEventListener('dragover', e => { e.preventDefault(); if (item !== draggedItem && !item.classList.contains('disabled')) item.classList.add('drag-over'); }); item.addEventListener('dragleave', () => item.classList.remove('drag-over')); item.addEventListener('drop', e => { e.preventDefault(); if (item !== draggedItem && !item.classList.contains('disabled')) { const container = item.parentNode, all = [...container.querySelectorAll('.procedure-item')]; if (all.indexOf(draggedItem) < all.indexOf(item)) item.after(draggedItem); else item.before(draggedItem); container.querySelectorAll('.procedure-item').forEach((el, i) => el.querySelector('.procedure-num').textContent = i + 1); answers[item.dataset.idx] = [...container.querySelectorAll('.procedure-item')].map(el => parseInt(el.dataset.orig)); } item.classList.remove('drag-over'); }); }); }
        function submitExam() {
            let correct = 0;
            examData.forEach((s, idx) => {
                const ans = answers[idx], card = document.getElementById(`card${idx}`), fb = document.getElementById(`fb${idx}`), ca = document.getElementById(`ca${idx}`);
                let ok = false;
                if (s.type === 'diagnosis') { ok = ans === s.correct; document.querySelectorAll(`.diagnostic-option[data-idx="${idx}"]`).forEach((e, i) => { e.classList.add('disabled'); if (i === s.correct) e.classList.add('correct'); else if (i === ans && !ok) e.classList.add('incorrect'); }); ca.textContent = `✓ ${s.options[s.correct].title}`; }
                else if (s.type === 'fill-blank') { let all = true; document.querySelectorAll(`.blank-input[data-idx="${idx}"]`).forEach((e, i) => { e.disabled = true; const acc = s.blanks[i].answer.map(a => a.toLowerCase()); if (ans && acc.some(a => ans[i]?.includes(a) || a.includes(ans[i] || ''))) e.classList.add('correct'); else { e.classList.add('incorrect'); all = false; } }); ok = all; ca.textContent = `Answers: ${s.blanks.map(b => b.answer[0]).join(', ')}`; }
                else if (s.type === 'component-select') { const corr = s.options.map((o, i) => o.correct ? i : -1).filter(i => i !== -1), sel = ans || []; ok = corr.length === sel.length && corr.every(i => sel.includes(i)); document.querySelectorAll(`.component-card[data-idx="${idx}"]`).forEach((e, i) => { e.classList.add('disabled'); if (s.options[i].correct) e.classList.add('correct'); else if (sel.includes(i)) e.classList.add('incorrect'); }); ca.textContent = `Correct: ${s.options.filter(o => o.correct).map(o => o.name).join(', ')}`; }
                else if (s.type === 'calculation') { let cok = true, ci = 0; document.querySelectorAll(`.calc-input[data-idx="${idx}"]`).forEach(e => { e.disabled = true; const ed = s.calculations.filter(c => !c.readonly); if (ci < ed.length) { const acc = ed[ci].answer.map(a => a.toString().toLowerCase()); const ua = (ans && ans[ci]) ? ans[ci] : ''; if (acc.some(a => a === ua || a.includes(ua) || ua.includes(a))) e.classList.add('correct'); else { e.classList.add('incorrect'); cok = false; } ci++; } }); ok = cok; ca.textContent = `Answers: ${s.calculations.filter(c => !c.readonly).map(c => c.answer[0] + ' ' + c.unit).join(', ')}`; }
                else if (s.type === 'troubleshoot-tree') { ok = ans && ans.length === s.steps.length && s.steps.every((st, i) => ans[i] === st.correct); document.querySelectorAll(`.tree-btn[data-idx="${idx}"]`).forEach(b => { b.classList.add('disabled'); if (parseInt(b.dataset.o) === s.steps[parseInt(b.dataset.s)].correct) b.classList.add('correct'); else if (b.classList.contains('selected')) b.classList.add('incorrect'); }); s.steps.forEach((_, i) => { document.getElementById(`ts${idx}_${i}`).style.display = 'block'; document.getElementById(`tf${idx}_${i}`).style.display = 'block'; }); }
                else if (s.type === 'procedure') { ok = JSON.stringify(ans || []) === JSON.stringify(s.correctOrder); document.querySelectorAll(`#proc${idx} .procedure-item`).forEach((el, i) => { el.classList.add('disabled'); el.draggable = false; if ((ans || [])[i] === s.correctOrder[i]) el.classList.add('correct'); else el.classList.add('incorrect'); }); ca.textContent = `Correct order: ${s.correctOrder.map(i => i + 1).join(' → ')}`; }
                if (ok) { correct++; card.classList.add('correct'); fb.classList.add('correct', 'show'); fb.querySelector('.feedback-header').classList.add('correct'); fb.querySelector('.feedback-icon').textContent = '✓'; fb.querySelector('.feedback-title').textContent = 'Correct!'; }
                else { card.classList.add('incorrect'); fb.classList.add('incorrect', 'show'); fb.querySelector('.feedback-header').classList.add('incorrect'); fb.querySelector('.feedback-icon').textContent = '✗'; fb.querySelector('.feedback-title').textContent = 'Incorrect'; }
            });
            const pct = Math.round((correct / examData.length) * 100);
            document.getElementById('currentScore').textContent = `${pct}%`; document.getElementById('finalScore').textContent = `${pct}%`; document.getElementById('correctCount').textContent = correct; document.getElementById('incorrectCount').textContent = examData.length - correct;
            const g = document.getElementById('grade'); if (pct >= 90) { g.textContent = 'Excellent!'; g.className = 'results-grade excellent'; } else if (pct >= 70) { g.textContent = 'Good Job!'; g.className = 'results-grade good'; } else if (pct >= 50) { g.textContent = 'Average'; g.className = 'results-grade average'; } else { g.textContent = 'Needs Practice'; g.className = 'results-grade poor'; }
            document.getElementById('results').classList.add('show'); document.getElementById('submitBtn').disabled = true;
        }
        function resetExam() { answers = new Array(examData.length).fill(null); document.getElementById('currentScore').textContent = '0%'; document.getElementById('results').classList.remove('show'); document.getElementById('submitBtn').disabled = false; renderScenarios(); initDragDrop(); }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
