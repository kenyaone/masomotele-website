<body>
    <header class="header"><div class="header-content"><div class="logo"><div class="logo-icon">⭐</div><div><h1>M.T.T.I</h1><span>Social Media Marketing</span></div></div><div class="score-display"><div class="score-value" id="currentScore">0%</div><div class="score-label">Score</div></div></div></header>
    <main class="main-container">
        <div class="exam-header"><div class="unit-badge">Unit 3</div><h2 class="exam-title">Influencer Marketing</h2><p class="exam-desc">Identify the right influencers, negotiate partnerships, create authentic collaborations, and measure influencer campaign performance.</p><div class="exam-stats"><div class="stat-item"><span>📋</span> 8 Scenarios</div><div class="stat-item"><span>⏱️</span> ~25 minutes</div><div class="stat-item"><span>🎯</span> 70% to pass</div></div></div>
        <div class="scenarios" id="scenarios"></div>
        <div class="actions"><button class="btn btn-secondary" onclick="resetExam()">Reset Exam</button><button class="btn btn-primary" id="submitBtn" onclick="submitExam()">Submit Answers</button></div>
        <div class="results-panel" id="results"><div class="results-score" id="finalScore">0%</div><div class="results-label">Your Final Score</div><div class="results-grade" id="grade"></div><div class="results-stats"><div class="stat-box"><div class="stat-box-value correct" id="correctCount">0</div><div class="stat-box-label">Correct</div></div><div class="stat-box"><div class="stat-box-value incorrect" id="incorrectCount">0</div><div class="stat-box-label">Incorrect</div></div></div></div>
    </main>
    <script>
        const examData = [
            { type: "diagnosis", client: "I have a small skincare brand with KES 50,000 budget. Should I work with one big celebrity influencer or multiple smaller ones?", site: "Skincare startup - first influencer campaign", requirements: ["Budget: KES 50,000", "Skincare niche", "First influencer campaign"], question: "What is the BEST influencer strategy for this client?", options: [{ title: "Multiple micro-influencers (5K-50K followers) in the skincare niche", desc: "Higher engagement rates and more authentic connections with audience" },{ title: "One celebrity with 1M+ followers", desc: "Massive reach with single partnership" },{ title: "Only use company employees as influencers", desc: "Free content from internal team" },{ title: "Wait until budget is KES 500,000+", desc: "Influencer marketing requires big budgets" }], correct: 0, explanation: "Micro-influencers (5K-50K) are perfect for small budgets: Higher engagement (5-10% vs 1-2% for celebrities), More affordable (often accept free products + small fee), More authentic and trusted by niche audiences. KES 50K can get 5-10 micro-influencers vs 0 celebrities." },
            { type: "fill-blank", client: "Help me understand the key metrics for evaluating potential influencers.", site: "Influencer vetting training", requirements: ["Influencer evaluation", "Metric analysis"], question: "Complete the influencer evaluation metrics:", blanks: [{ text: "Engagement Rate = (Likes + Comments) ÷ ", answer: ["followers", "total followers"], hint: "____ × 100" },{ text: "A healthy engagement rate on Instagram is above ", answer: ["3", "3%", "2", "2%"], hint: "___%" },{ text: "Fake followers are often called ", answer: ["bots", "ghost", "fake"], hint: "____ followers" },{ text: "EMV stands for Earned Media ", answer: ["value"], hint: "____" }], explanation: "Key metrics: Engagement Rate (likes + comments ÷ followers × 100) - healthy is 3%+. Watch for bot/fake followers (sudden spikes, no comments, generic comments). EMV (Earned Media Value) estimates the PR value of influencer content." },
            { type: "component-select", client: "What red flags should I watch for when vetting influencers?", site: "Influencer fraud detection", requirements: ["Quality check", "Avoid scams"], question: "Select ALL red flags that indicate potential influencer fraud:", options: [{ icon: "📈", name: "Sudden follower spikes", correct: true },{ icon: "🤖", name: "Generic comments only", correct: true },{ icon: "💬", name: "High engagement rate", correct: false },{ icon: "👥", name: "Follower/following ratio 1:1", correct: true },{ icon: "📸", name: "Consistent posting", correct: false },{ icon: "🌍", name: "Followers from random countries", correct: true },{ icon: "💰", name: "Requests payment upfront", correct: false },{ icon: "📉", name: "Low story views vs followers", correct: true }], explanation: "Red flags: Sudden follower spikes (bought followers), Generic comments ('Nice!' 'Great!'), 1:1 follower/following ratio (follow-for-follow), Followers from irrelevant countries, Story views much lower than follower count. These indicate fake or low-quality audiences." },
            { type: "procedure", client: "Walk me through the process of running a successful influencer campaign.", site: "Influencer campaign management", requirements: ["End-to-end campaign", "Professional execution"], question: "Arrange the influencer campaign steps in CORRECT order:", steps: ["Send products and detailed brief to influencers", "Define campaign goals and target audience", "Track content performance and engagement", "Research and shortlist relevant influencers", "Negotiate terms and sign contracts", "Vet influencers (check engagement, authenticity)"], correctOrder: [1, 3, 5, 4, 0, 2], explanation: "Correct process: Define goals → Research influencers → Vet for authenticity → Negotiate & contract → Send brief/products → Track results. Never skip vetting (step 5) - it prevents fraud and ensures audience alignment!" },
            { type: "calculation", client: "Help me calculate if this influencer partnership is worth the cost.", site: "Influencer ROI analysis", requirements: ["Cost-benefit analysis", "Campaign evaluation"], question: "Calculate the influencer campaign metrics:", calculations: [{ label: "Influencer fee", value: "25,000", unit: "KES", readonly: true },{ label: "Influencer followers", value: "50,000", unit: "followers", readonly: true },{ label: "Post likes received", value: "2,500", unit: "likes", readonly: true },{ label: "Post comments received", value: "150", unit: "comments", readonly: true },{ label: "Engagement Rate", value: "", unit: "%", answer: ["5.3", "5", "5.30"] },{ label: "Cost Per Engagement (CPE)", value: "", unit: "KES", answer: ["9.4", "9", "10", "9.43"] }], explanation: "Engagement = 2,500 + 150 = 2,650. Engagement Rate = 2,650 ÷ 50,000 × 100 = 5.3%. CPE = 25,000 ÷ 2,650 = KES 9.43. This is GOOD: 5.3% engagement is excellent (above 3% benchmark), CPE under KES 10 is cost-effective." },
            { type: "troubleshoot-tree", client: "An influencer posted about our product but the post is getting negative comments about our brand!", site: "Influencer crisis management", requirements: ["Negative sentiment", "Live campaign", "Brand reputation risk"], question: "Handle the influencer post crisis:", steps: [{ question: "Negative comments are appearing under influencer's sponsored post. First action?", options: ["Ask influencer to delete the post immediately", "Monitor and assess if comments are legitimate concerns", "Ignore - it's the influencer's problem"], correct: 1, followup: "You find comments mention product quality issues that several customers experienced." },{ question: "The negative feedback is about real product issues. How do you respond?", options: ["Work with influencer to address concerns transparently in comments", "Delete all negative comments", "Blame the influencer for poor content"], correct: 0, followup: "You and the influencer respond professionally, acknowledging issues and offering solutions." },{ question: "How do you prevent this in future campaigns?", options: ["Never work with influencers again", "Better product briefing + allow influencers to give honest reviews", "Only allow fully scripted sponsored content"], correct: 1, followup: "You implement better product education for influencers and encourage authentic (but informed) reviews." }], explanation: "Crisis response: Monitor first (don't panic-delete), Address legitimate concerns transparently, Work WITH the influencer. Prevention: Better product briefing, honest reviews build trust. Deleting/hiding makes it worse!" },
            { type: "diagnosis", client: "An influencer wants KES 100,000 for one Instagram post but only has 30,000 followers. Is this reasonable?", site: "Influencer rate negotiation", requirements: ["Rate evaluation", "30K followers", "KES 100,000 ask"], question: "How should you evaluate this rate?", options: [{ title: "Request their media kit with engagement rates and audience demographics", desc: "Evaluate based on data, not just follower count" },{ title: "Immediately reject - too expensive for follower count", desc: "Pay should match follower numbers" },{ title: "Accept immediately to secure the partnership", desc: "Don't risk losing the influencer" },{ title: "Offer KES 5,000 - that's what followers are worth", desc: "Standard rate per 1000 followers" }], correct: 0, explanation: "Always request a media kit! Follower count alone means nothing. Evaluate: Engagement rate (niche influencers can have 10%+ ER), Audience demographics (are they YOUR customers?), Past campaign results, Content quality. A 30K influencer with 15% engagement and perfect-fit audience could be worth KES 100K." },
            { type: "diagnosis", client: "The influencer we're working with posted our content but didn't include #ad or #sponsored. What should we do?", site: "Influencer compliance issue", requirements: ["Missing disclosure", "Live post", "Legal requirement"], question: "What is the CORRECT action to take?", options: [{ title: "Immediately ask influencer to add proper disclosure (#ad, #sponsored, or Paid Partnership)", desc: "Comply with advertising disclosure regulations" },{ title: "Leave it - disclosures reduce engagement anyway", desc: "Better performance without disclosure" },{ title: "Report the influencer to Instagram", desc: "Let the platform handle it" },{ title: "Delete the partnership and demand refund", desc: "Terminate for breach of contract" }], correct: 0, explanation: "Disclosure is LEGALLY REQUIRED in most countries (including Kenya's CAK guidelines). Missing #ad or #sponsored can result in penalties for BOTH the brand and influencer. Always: Include disclosure requirements in contracts, Check posts before they go live, Request immediate correction if missed." }
        ];
        let answers = new Array(examData.length).fill(null);
        function init() { renderScenarios(); initDragDrop(); }
        function renderScenarios() { document.getElementById('scenarios').innerHTML = examData.map((s, i) => renderScenario(s, i)).join(''); }
        function renderScenario(s, idx) {
            let html = '';
            if (s.type === 'diagnosis') html = `<div class="diagnostic-options">${s.options.map((o, i) => `<div class="diagnostic-option" data-idx="${idx}" data-opt="${i}" onclick="selectOption(${idx},${i})"><div class="option-marker"></div><div class="option-content"><div class="option-title">${o.title}</div><div class="option-desc">${o.desc}</div></div></div>`).join('')}</div>`;
            else if (s.type === 'fill-blank') html = `<div class="fill-blanks">${s.blanks.map((b, i) => `<div class="blank-row"><span class="fill-text">${b.text}</span><input type="text" class="blank-input" data-idx="${idx}" data-b="${i}" placeholder="${b.hint}" onchange="updateBlank(${idx})"></div>`).join('')}</div>`;
            else if (s.type === 'component-select') html = `<div class="component-grid">${s.options.map((o, i) => `<div class="component-card" data-idx="${idx}" data-opt="${i}" onclick="toggleComp(${idx},${i})"><div class="component-icon">${o.icon}</div><div class="component-name">${o.name}</div></div>`).join('')}</div>`;
            else if (s.type === 'calculation') html = `<div class="calc-group">${s.calculations.map((c, i) => `<div class="calc-row"><span class="calc-label">${c.label}:</span>${c.readonly ? `<span class="calc-readonly">${c.value}</span>` : `<input type="text" class="calc-input" data-idx="${idx}" data-c="${i}" placeholder="?" onchange="updateCalc(${idx})">`}<span class="calc-unit">${c.unit}</span></div>`).join('')}</div>`;
            else if (s.type === 'troubleshoot-tree') html = `<div class="troubleshoot-tree">${s.steps.map((st, i) => `<div class="tree-step" id="ts${idx}_${i}" ${i > 0 ? 'style="display:none"' : ''}><div class="tree-question">${st.question}</div><div class="tree-options">${st.options.map((o, oi) => `<button class="tree-btn" data-idx="${idx}" data-s="${i}" data-o="${oi}" onclick="selectTree(${idx},${i},${oi})">${o}</button>`).join('')}</div><div class="tree-followup" id="tf${idx}_${i}" style="display:none"></div></div>`).join('')}</div>`;
            else if (s.type === 'procedure') { const sh = s.steps.map((t, i) => ({text: t, orig: i})).sort(() => Math.random() - 0.5); html = `<div class="procedure-list" id="proc${idx}">${sh.map((t, i) => `<div class="procedure-item" draggable="true" data-idx="${idx}" data-orig="${t.orig}"><span class="drag-handle">⋮⋮</span><div class="procedure-num">${i + 1}</div><div class="procedure-text">${t.text}</div></div>`).join('')}</div>`; }
            return `<div class="scenario-card" id="card${idx}"><div class="scenario-header"><div class="scenario-num"><strong>${idx + 1}</strong> of ${examData.length}</div><div class="scenario-type">${{'diagnosis':'🔍 Analysis','fill-blank':'✏️ Fill Blanks','component-select':'🎯 Select All','calculation':'🧮 Calculation','troubleshoot-tree':'🌳 Decision Tree','procedure':'📋 Ordering'}[s.type]}</div></div><div class="scenario-body">${s.client ? `<div class="job-brief"><div class="brief-label">📋 Client Brief</div><div class="brief-text">"${s.client}"</div>${s.site ? `<div class="site-info">🏢 ${s.site}</div>` : ''}</div>` : ''}${s.requirements?.length ? `<div class="requirements-box"><div class="requirements-label">Context</div><div class="requirements-list">${s.requirements.map(r => `<span class="req-tag">• ${r}</span>`).join('')}</div></div>` : ''}<div class="question-section"><div class="question-text">${s.question}</div>${html}</div><div class="feedback-box" id="fb${idx}"><div class="feedback-header"><span class="feedback-icon"></span><span class="feedback-title"></span></div><div class="feedback-text">${s.explanation}</div><div class="correct-answer" id="ca${idx}"></div></div></div></div>`;
        }
        function selectOption(idx, opt) { if (document.querySelector(`.diagnostic-option[data-idx="${idx}"]`)?.classList.contains('disabled')) return; document.querySelectorAll(`.diagnostic-option[data-idx="${idx}"]`).forEach(e => e.classList.remove('selected')); document.querySelector(`.diagnostic-option[data-idx="${idx}"][data-opt="${opt}"]`).classList.add('selected'); answers[idx] = opt; }
        function updateBlank(idx) { answers[idx] = Array.from(document.querySelectorAll(`.blank-input[data-idx="${idx}"]`)).map(e => e.value.trim().toLowerCase()); }
        function toggleComp(idx, opt) { const c = document.querySelector(`.component-card[data-idx="${idx}"][data-opt="${opt}"]`); if (c.classList.contains('disabled')) return; c.classList.toggle('selected'); answers[idx] = Array.from(document.querySelectorAll(`.component-card[data-idx="${idx}"].selected`)).map(e => parseInt(e.dataset.opt)); }
        function updateCalc(idx) { answers[idx] = Array.from(document.querySelectorAll(`.calc-input[data-idx="${idx}"]`)).map(e => e.value.trim().toLowerCase()); }
        function selectTree(idx, step, opt) { const s = examData[idx]; const btns = document.querySelectorAll(`.tree-btn[data-idx="${idx}"][data-s="${step}"]`); if (btns[0].classList.contains('disabled')) return; btns.forEach(b => b.classList.remove('selected')); btns[opt].classList.add('selected'); if (!answers[idx]) answers[idx] = []; answers[idx][step] = opt; document.getElementById(`tf${idx}_${step}`).textContent = s.steps[step].followup; document.getElementById(`tf${idx}_${step}`).style.display = 'block'; if (step < s.steps.length - 1) setTimeout(() => document.getElementById(`ts${idx}_${step + 1}`).style.display = 'block', 400); }
        let draggedItem = null;
        function initDragDrop() { document.querySelectorAll('.procedure-item').forEach(item => { item.addEventListener('dragstart', () => { draggedItem = item; item.classList.add('dragging'); }); item.addEventListener('dragend', () => { item.classList.remove('dragging'); document.querySelectorAll('.procedure-item').forEach(i => i.classList.remove('drag-over')); }); item.addEventListener('dragover', e => { e.preventDefault(); if (item !== draggedItem && !item.classList.contains('disabled')) item.classList.add('drag-over'); }); item.addEventListener('dragleave', () => item.classList.remove('drag-over')); item.addEventListener('drop', e => { e.preventDefault(); if (item !== draggedItem && !item.classList.contains('disabled')) { const container = item.parentNode, all = [...container.querySelectorAll('.procedure-item')]; if (all.indexOf(draggedItem) < all.indexOf(item)) item.after(draggedItem); else item.before(draggedItem); container.querySelectorAll('.procedure-item').forEach((el, i) => el.querySelector('.procedure-num').textContent = i + 1); answers[item.dataset.idx] = [...container.querySelectorAll('.procedure-item')].map(el => parseInt(el.dataset.orig)); } item.classList.remove('drag-over'); }); }); }
        function submitExam() {
            let correct = 0;
            examData.forEach((s, idx) => {
                const ans = answers[idx], card = document.getElementById(`card${idx}`), fb = document.getElementById(`fb${idx}`), ca = document.getElementById(`ca${idx}`);
                let ok = false;
                if (s.type === 'diagnosis') { ok = ans === s.correct; document.querySelectorAll(`.diagnostic-option[data-idx="${idx}"]`).forEach((e, i) => { e.classList.add('disabled'); if (i === s.correct) e.classList.add('correct'); else if (i === ans && !ok) e.classList.add('incorrect'); }); ca.textContent = `✓ ${s.options[s.correct].title}`; }
                else if (s.type === 'fill-blank') { let all = true; document.querySelectorAll(`.blank-input[data-idx="${idx}"]`).forEach((e, i) => { e.disabled = true; const acc = s.blanks[i].answer.map(a => a.toLowerCase()); if (ans && acc.some(a => ans[i]?.includes(a) || a.includes(ans[i] || ''))) e.classList.add('correct'); else { e.classList.add('incorrect'); all = false; } }); ok = all; ca.textContent = `Answers: ${s.blanks.map(b => b.answer[0]).join(', ')}`; }
                else if (s.type === 'component-select') { const corr = s.options.map((o, i) => o.correct ? i : -1).filter(i => i !== -1), sel = ans || []; ok = corr.length === sel.length && corr.every(i => sel.includes(i)); document.querySelectorAll(`.component-card[data-idx="${idx}"]`).forEach((e, i) => { e.classList.add('disabled'); if (s.options[i].correct) e.classList.add('correct'); else if (sel.includes(i)) e.classList.add('incorrect'); }); ca.textContent = `Correct: ${s.options.filter(o => o.correct).map(o => o.name).join(', ')}`; }
                else if (s.type === 'calculation') { let cok = true, ci = 0; document.querySelectorAll(`.calc-input[data-idx="${idx}"]`).forEach(e => { e.disabled = true; const ed = s.calculations.filter(c => !c.readonly); if (ci < ed.length) { const acc = ed[ci].answer.map(a => a.toString().toLowerCase()); const ua = (ans && ans[ci]) ? ans[ci] : ''; if (acc.some(a => a === ua || a.includes(ua) || ua.includes(a))) e.classList.add('correct'); else { e.classList.add('incorrect'); cok = false; } ci++; } }); ok = cok; ca.textContent = `Answers: ${s.calculations.filter(c => !c.readonly).map(c => c.answer[0] + ' ' + c.unit).join(', ')}`; }
                else if (s.type === 'troubleshoot-tree') { ok = ans && ans.length === s.steps.length && s.steps.every((st, i) => ans[i] === st.correct); document.querySelectorAll(`.tree-btn[data-idx="${idx}"]`).forEach(b => { b.classList.add('disabled'); if (parseInt(b.dataset.o) === s.steps[parseInt(b.dataset.s)].correct) b.classList.add('correct'); else if (b.classList.contains('selected')) b.classList.add('incorrect'); }); s.steps.forEach((_, i) => { document.getElementById(`ts${idx}_${i}`).style.display = 'block'; document.getElementById(`tf${idx}_${i}`).style.display = 'block'; }); }
                else if (s.type === 'procedure') { ok = JSON.stringify(ans || []) === JSON.stringify(s.correctOrder); document.querySelectorAll(`#proc${idx} .procedure-item`).forEach((el, i) => { el.classList.add('disabled'); el.draggable = false; if ((ans || [])[i] === s.correctOrder[i]) el.classList.add('correct'); else el.classList.add('incorrect'); }); ca.textContent = `Correct order: ${s.correctOrder.map(i => i + 1).join(' → ')}`; }
                if (ok) { correct++; card.classList.add('correct'); fb.classList.add('correct', 'show'); fb.querySelector('.feedback-header').classList.add('correct'); fb.querySelector('.feedback-icon').textContent = '✓'; fb.querySelector('.feedback-title').textContent = 'Correct!'; }
                else { card.classList.add('incorrect'); fb.classList.add('incorrect', 'show'); fb.querySelector('.feedback-header').classList.add('incorrect'); fb.querySelector('.feedback-icon').textContent = '✗'; fb.querySelector('.feedback-title').textContent = 'Incorrect'; }
            });
            const pct = Math.round((correct / examData.length) * 100);
            document.getElementById('currentScore').textContent = `${pct}%`; document.getElementById('finalScore').textContent = `${pct}%`; document.getElementById('correctCount').textContent = correct; document.getElementById('incorrectCount').textContent = examData.length - correct;
            const g = document.getElementById('grade'); if (pct >= 90) { g.textContent = 'Excellent!'; g.className = 'results-grade excellent'; } else if (pct >= 70) { g.textContent = 'Good Job!'; g.className = 'results-grade good'; } else if (pct >= 50) { g.textContent = 'Average'; g.className = 'results-grade average'; } else { g.textContent = 'Needs Practice'; g.className = 'results-grade poor'; }
            document.getElementById('results').classList.add('show'); document.getElementById('submitBtn').disabled = true;
        }
        function resetExam() { answers = new Array(examData.length).fill(null); document.getElementById('currentScore').textContent = '0%'; document.getElementById('results').classList.remove('show'); document.getElementById('submitBtn').disabled = false; renderScenarios(); initDragDrop(); }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
