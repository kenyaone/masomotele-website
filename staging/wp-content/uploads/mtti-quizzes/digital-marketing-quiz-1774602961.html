<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz — Digital Marketing</title>
<style>
:root{--pri:#0a5e2a;--acc:#f5a623;--ok:#2e7d32;--no:#c62828;--bg:#f0f4f0;--card:#fff;--radius:12px;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif;}
body{background:var(--bg);min-height:100vh;display:flex;flex-direction:column;}
#top-bar{background:var(--pri);color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;}
#top-bar h1{font-size:15px;font-weight:700;}
#top-bar .meta{font-size:11px;opacity:.8;}
#progress-bar{height:4px;background:rgba(255,255,255,.3);}
#progress-fill{height:4px;background:var(--acc);transition:width .4s;}
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
.q-card{background:var(--card);border-radius:var(--radius);padding:28px 26px;max-width:640px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.1);}
.q-counter{font-size:11px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.q-text{font-size:17px;font-weight:600;color:#1a1a1a;margin-bottom:22px;line-height:1.5;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 16px;border:2px solid #e0e0e0;border-radius:8px;background:#fff;font-size:14px;cursor:pointer;margin-bottom:10px;transition:all .2s;}
.opt-btn:hover{border-color:var(--pri);background:#f0f8f0;}
.opt-btn.selected{border-color:var(--pri);background:#e8f5e9;}
.opt-btn.correct{border-color:var(--ok);background:#e8f5e9;color:var(--ok);font-weight:700;}
.opt-btn.wrong{border-color:var(--no);background:#ffebee;color:var(--no);}
.fib-input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:15px;margin-bottom:14px;}
.fib-input:focus{outline:none;border-color:var(--pri);}
.short-input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;min-height:80px;resize:vertical;margin-bottom:14px;}
.feedback{padding:12px 16px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:16px;display:none;}
.feedback.correct{background:#e8f5e9;color:var(--ok);}
.feedback.wrong{background:#ffebee;color:var(--no);}
.feedback.info{background:#e3f2fd;color:#1565C0;}
.btn-next{background:var(--pri);color:#fff;border:none;border-radius:8px;padding:12px 28px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:6px;}
.btn-next:hover{background:#0d7a36;}
#results{display:none;text-align:center;padding:32px 24px;background:var(--card);border-radius:var(--radius);max-width:480px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.1);}
#results .score-ring{font-size:56px;font-weight:900;color:var(--pri);}
#results h2{margin:12px 0 6px;font-size:20px;}
#results .sub{font-size:13px;color:#666;margin-bottom:20px;}
.btn-retry{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:11px 26px;font-size:14px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<div id="top-bar">
  <h1>📝 Digital Marketing</h1>
  <span class="meta">Hard · 10 questions · 27 Mar 2026</span>
</div>
<div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>

<div id="stage">
  <div id="q-card-wrap"></div>
  <div id="results">
    <div class="score-ring" id="score-pct">0%</div>
    <h2 id="result-title"></h2>
    <p class="sub" id="result-sub"></p>
    <button class="btn-retry" onclick="initQuiz()">🔄 Try Again</button>
  </div>
</div>

<script>
const QUESTIONS = [{"question":"Analyze how social media algorithms affect organic reach for small businesses and propose two strategies to overcome these limitations.","options":[],"answer":"Social media algorithms prioritize content with high engagement rates, making it difficult for small businesses to reach their audience organically without paid promotion. Two effective strategies include creating highly shareable content that encourages user interaction and building community through consistent engagement with followers' comments and messages.","type":"short"},{"question":"Evaluate the effectiveness of influencer marketing versus traditional digital advertising for a startup launching a new product, considering budget constraints.","options":[],"answer":"Influencer marketing often provides better ROI for startups due to higher trust levels and targeted audiences, while traditional digital ads offer broader reach but lower engagement rates. For budget-conscious startups, micro-influencer partnerships typically deliver more authentic engagement at lower costs compared to broad-spectrum digital advertising campaigns.","type":"short"},{"question":"Design a content marketing strategy that addresses different stages of the customer journey for an e-commerce business selling fitness equipment.","options":[],"answer":"The strategy should include awareness-stage content like fitness tips and workout videos, consideration-stage content such as product comparison guides and customer testimonials, and decision-stage content including limited-time offers and detailed product demonstrations. Each stage requires different content formats and distribution channels to effectively nurture prospects through the sales funnel.","type":"short"},{"question":"Assess the impact of privacy regulations like GDPR on email marketing campaigns and recommend compliance strategies.","options":[],"answer":"GDPR significantly restricts data collection and requires explicit consent, reducing email list sizes but improving engagement quality from genuinely interested subscribers. Compliance strategies include implementing double opt-in procedures, providing clear privacy policies, and offering easy unsubscribe options while focusing on value-driven content to maintain subscriber interest.","type":"short"},{"question":"Compare the conversion potential of video marketing versus written content for B2B software companies, considering the target audience's preferences.","options":[],"answer":"Video marketing typically achieves higher engagement and conversion rates for B2B software as it effectively demonstrates complex features and builds trust through personal connection. However, written content remains crucial for SEO and detailed technical documentation, making a hybrid approach most effective for comprehensive lead nurturing.","type":"short"},{"question":"Develop a crisis management plan for a brand facing negative viral content on social media platforms.","options":[],"answer":"The plan should include immediate response protocols within 2-4 hours, transparent communication addressing concerns directly, and proactive engagement with constructive critics while avoiding defensive responses. Long-term recovery involves consistent positive content creation and community rebuilding through authentic brand storytelling and improved customer service.","type":"short"},{"question":"Analyze the role of artificial intelligence in personalizing customer experiences across digital marketing channels.","options":[],"answer":"AI enables real-time personalization through predictive analytics, behavioral tracking, and automated content delivery, significantly improving conversion rates and customer satisfaction. Implementation includes chatbots for customer service, recommendation engines for product suggestions, and dynamic email content based on user preferences and purchase history.","type":"short"},{"question":"Evaluate the cost-effectiveness of pay-per-click advertising versus search engine optimization for a local service business.","options":[],"answer":"PPC provides immediate visibility and measurable results but requires ongoing investment, while SEO offers sustainable long-term traffic at lower ongoing costs but requires more time to show results. Local businesses benefit most from a combined approach, using PPC for immediate leads while building SEO for long-term organic growth.","type":"short"},{"question":"Design a mobile-first digital marketing strategy for reaching Generation Z consumers in the fashion industry.","options":[],"answer":"The strategy should prioritize short-form video content on TikTok and Instagram Stories, user-generated content campaigns, and seamless mobile shopping experiences with one-click purchasing. Success requires authentic brand representation, social cause alignment, and interactive content that encourages sharing and community participation.","type":"short"},{"question":"Assess how marketing automation can improve lead nurturing efficiency while maintaining personalization at scale.","options":[],"answer":"Marketing automation enables systematic lead scoring, triggered email sequences based on user behavior, and personalized content delivery without manual intervention, increasing efficiency by 300-400%. Maintaining personalization requires sophisticated segmentation, dynamic content blocks, and continuous testing to ensure automated messages feel relevant and timely to each prospect.","type":"short"}];
let cur=0, score=0, answered=false;

function initQuiz(){
  cur=0; score=0; answered=false;
  document.getElementById('results').style.display='none';
  document.getElementById('q-card-wrap').style.display='block';
  showQ();
}

function showQ(){
  const q=QUESTIONS[cur];
  const pct=Math.round(cur/QUESTIONS.length*100);
  document.getElementById('progress-fill').style.width=pct+'%';
  const wrap=document.getElementById('q-card-wrap');

  let html=`<div class="q-card">
    <div class="q-counter">Question ${cur+1} of ${QUESTIONS.length}</div>
    <div class="q-text">${escHtml(q.question)}</div>`;

  if(q.type==='mcq'){
    for(const [k,v] of Object.entries(q.options||{})){
      html+=`<button class="opt-btn" id="opt-${k}" onclick="pickMCQ('${k}')">${k}) ${escHtml(v)}</button>`;
    }
  } else if(q.type==='fib'){
    html+=`<input class="fib-input" id="fib-in" type="text" placeholder="Type your answer…">`;
  } else {
    html+=`<textarea class="short-input" id="short-in" placeholder="Write your answer…"></textarea>`;
  }

  html+=`<div class="feedback" id="fb"></div>
    <button class="btn-next" id="btn-next" onclick="nextQ()">Check Answer ✓</button>
  </div>`;

  wrap.innerHTML=html;
  answered=false;
}

function pickMCQ(key){
  if(answered) return;
  document.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('opt-'+key).classList.add('selected');
}

function nextQ(){
  if(!answered){
    const q=QUESTIONS[cur];
    const fb=document.getElementById('fb');
    fb.style.display='block';

    if(q.type==='mcq'){
      const sel=document.querySelector('.opt-btn.selected');
      if(!sel){fb.className='feedback info';fb.innerText='Please select an option.';return;}
      const chosen=sel.id.replace('opt-','');
      const correct=q.answer.trim().toUpperCase()[0];
      if(chosen===correct){score++;sel.classList.add('correct');fb.className='feedback correct';fb.innerText='✅ Correct!';}
      else{sel.classList.add('wrong');fb.className='feedback wrong';fb.innerText='❌ Incorrect. Answer: '+correct+') '+((q.options||{})[correct]||q.answer);}
      document.querySelectorAll('.opt-btn').forEach(b=>b.style.pointerEvents='none');
    } else if(q.type==='fib'){
      const inp=document.getElementById('fib-in');
      if(!inp.value.trim()){fb.className='feedback info';fb.innerText='Please type an answer.';return;}
      const given=inp.value.trim().toLowerCase();
      const ans=q.answer.trim().toLowerCase();
      if(given===ans||ans.includes(given)){score++;fb.className='feedback correct';fb.innerText='✅ Correct! Answer: '+q.answer;}
      else{fb.className='feedback wrong';fb.innerText='❌ Model answer: '+q.answer;}
      inp.disabled=true;
    } else {
      const inp=document.getElementById('short-in');
      if(!inp.value.trim()){fb.className='feedback info';fb.innerText='Please write your answer.';return;}
      fb.className='feedback info';fb.innerText='📝 Model answer: '+q.answer;
      inp.disabled=true;
      score+=0.5; // partial credit for short answer attempts
    }

    document.getElementById('btn-next').innerText='Next →';
    answered=true;
    return;
  }

  cur++;
  if(cur>=QUESTIONS.length){ showResults(); return; }
  showQ();
}

function showResults(){
  document.getElementById('q-card-wrap').style.display='none';
  document.getElementById('progress-fill').style.width='100%';
  const res=document.getElementById('results');
  res.style.display='block';
  const maxScore=QUESTIONS.length;
  const pct=Math.round((score/maxScore)*100);
  document.getElementById('score-pct').innerText=pct+'%';
  let title,sub;
  if(pct>=80){title='Excellent! 🎉';sub='Outstanding performance. Well done!';}
  else if(pct>=60){title='Good effort! 👍';sub='You passed. Review the questions you missed.';}
  else if(pct>=40){title='Keep practising 📖';sub='Review the lesson and try again.';}
  else{title='Needs improvement 💪';sub='Go back to the lesson materials and try again.';}
  document.getElementById('result-title').innerText=title;
  document.getElementById('result-sub').innerText=sub+' ('+score.toFixed(1)+'/'+maxScore+')';

  // Report to MTTI LMS if available
  // Practice quiz — scores are not recorded in transcripts or unit results
}

function escHtml(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

initQuiz();
</script>
</body>
</html>
