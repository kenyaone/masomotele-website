<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz — Python Programing Notes</title>
<style>
:root{--pri:#0a5e2a;--acc:#f5a623;--ok:#2e7d32;--no:#c62828;--bg:#f0f4f0;--card:#fff;--radius:12px;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif;}
body{background:var(--bg);min-height:100vh;display:flex;flex-direction:column;}
#top-bar{background:var(--pri);color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;}
#top-bar h1{font-size:15px;font-weight:700;}
#top-bar .meta{font-size:11px;opacity:.8;}
#progress-bar{height:4px;background:rgba(255,255,255,.3);}
#progress-fill{height:4px;background:var(--acc);transition:width .4s;}
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
.q-card{background:var(--card);border-radius:var(--radius);padding:28px 26px;max-width:640px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.1);}
.q-counter{font-size:11px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.q-text{font-size:17px;font-weight:600;color:#1a1a1a;margin-bottom:22px;line-height:1.5;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 16px;border:2px solid #e0e0e0;border-radius:8px;background:#fff;font-size:14px;cursor:pointer;margin-bottom:10px;transition:all .2s;}
.opt-btn:hover{border-color:var(--pri);background:#f0f8f0;}
.opt-btn.selected{border-color:var(--pri);background:#e8f5e9;}
.opt-btn.correct{border-color:var(--ok);background:#e8f5e9;color:var(--ok);font-weight:700;}
.opt-btn.wrong{border-color:var(--no);background:#ffebee;color:var(--no);}
.fib-input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:15px;margin-bottom:14px;}
.fib-input:focus{outline:none;border-color:var(--pri);}
.short-input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;min-height:80px;resize:vertical;margin-bottom:14px;}
.feedback{padding:12px 16px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:16px;display:none;}
.feedback.correct{background:#e8f5e9;color:var(--ok);}
.feedback.wrong{background:#ffebee;color:var(--no);}
.feedback.info{background:#e3f2fd;color:#1565C0;}
.btn-next{background:var(--pri);color:#fff;border:none;border-radius:8px;padding:12px 28px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:6px;}
.btn-next:hover{background:#0d7a36;}
#results{display:none;text-align:center;padding:32px 24px;background:var(--card);border-radius:var(--radius);max-width:480px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.1);}
#results .score-ring{font-size:56px;font-weight:900;color:var(--pri);}
#results h2{margin:12px 0 6px;font-size:20px;}
#results .sub{font-size:13px;color:#666;margin-bottom:20px;}
.btn-retry{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:11px 26px;font-size:14px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<div id="top-bar">
  <h1>📝 Python Programing Notes</h1>
  <span class="meta">Hard · 10 questions · 27 Mar 2026</span>
</div>
<div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>

<div id="stage">
  <div id="q-card-wrap"></div>
  <div id="results">
    <div class="score-ring" id="score-pct">0%</div>
    <h2 id="result-title"></h2>
    <p class="sub" id="result-sub"></p>
    <button class="btn-retry" onclick="initQuiz()">🔄 Try Again</button>
  </div>
</div>

<script>
const QUESTIONS = [{"question":"Analyze why Python uses indentation instead of curly braces for code blocks and explain how this affects code readability and maintenance.","options":[],"answer":"Python uses indentation to enforce clean, readable code structure by making visual hierarchy match logical hierarchy. This reduces syntax errors and forces consistent formatting, making code easier to read and maintain compared to languages that use curly braces.","type":"short"},{"question":"Evaluate the performance implications of using lists versus tuples in Python when storing student records that won't change after creation.","options":[],"answer":"Tuples should be used for unchanging student records because they are immutable and more memory-efficient than lists. Tuples have faster access times and lower memory overhead, making them ideal for storing fixed data like student information that doesn't need modification.","type":"short"},{"question":"Design a solution using Python dictionaries to efficiently track inventory items in a school store, explaining why dictionaries are more suitable than lists for this application.","options":[],"answer":"Dictionaries provide O(1) lookup time using item names as keys, making inventory searches much faster than lists' O(n) sequential search. They naturally map item names to quantities\/details, eliminating the need for complex nested structures and making code more readable and maintainable.","type":"short"},{"question":"Analyze the difference between local and global variables in Python functions and predict what happens when both exist with the same name.","options":[],"answer":"Local variables exist only within their function scope and take precedence over global variables with the same name. When both exist, the function uses the local variable, creating shadowing that can lead to bugs if not properly managed using the global keyword when needed.","type":"short"},{"question":"Create a Python function that validates student email addresses and explain how you would handle different types of input errors that might occur.","options":[],"answer":"The function should use try-except blocks to handle ValueError for invalid formats and TypeError for non-string inputs. It should check for \"@\" symbol presence, domain validity, and use regular expressions or string methods to ensure proper email structure before returning True\/False.","type":"short"},{"question":"Compare and contrast the use of while loops versus for loops in Python when processing student grade data, providing scenarios where each is most appropriate.","options":[],"answer":"For loops are ideal when iterating over known collections like grade lists or ranges, providing cleaner syntax and automatic iteration control. While loops are better for conditional processing like reading grades until a sentinel value or when the number of iterations depends on user input or data conditions.","type":"short"},{"question":"Evaluate how Python's dynamic typing system affects error detection compared to statically typed languages and suggest best practices for TVET programming projects.","options":[],"answer":"Dynamic typing allows flexible development but postpones type errors until runtime, potentially causing issues in production. Best practices include using descriptive variable names, type hints for documentation, thorough testing, and input validation to catch type-related errors early in development.","type":"short"},{"question":"Design a Python class structure for managing student information in a TVET institution and justify your choice of attributes and methods.","options":[],"answer":"The class should include private attributes like __student_id, name, course, and grades with public methods for accessing and modifying data safely. Encapsulation protects data integrity while methods like calculate_average() and update_grade() provide controlled access following object-oriented principles.","type":"short"},{"question":"Analyze the importance of exception handling in Python programs and create a strategy for handling file operations when reading student data.","options":[],"answer":"Exception handling prevents program crashes and provides graceful error recovery, essential for robust applications. File operations should use try-except blocks to handle FileNotFoundError, PermissionError, and IOError, with finally blocks to ensure proper file closure and appropriate user feedback.","type":"short"},{"question":"Evaluate the role of Python modules and packages in organizing TVET programming projects and explain how they promote code reusability.","options":[],"answer":"Modules and packages organize related functions and classes into separate files, promoting code organization and reusability across multiple projects. They prevent naming conflicts, enable team collaboration, and allow importing specific functionality, making large TVET applications more maintainable and scalable.","type":"short"}];
let cur=0, score=0, answered=false;

function initQuiz(){
  cur=0; score=0; answered=false;
  document.getElementById('results').style.display='none';
  document.getElementById('q-card-wrap').style.display='block';
  showQ();
}

function showQ(){
  const q=QUESTIONS[cur];
  const pct=Math.round(cur/QUESTIONS.length*100);
  document.getElementById('progress-fill').style.width=pct+'%';
  const wrap=document.getElementById('q-card-wrap');

  let html=`<div class="q-card">
    <div class="q-counter">Question ${cur+1} of ${QUESTIONS.length}</div>
    <div class="q-text">${escHtml(q.question)}</div>`;

  if(q.type==='mcq'){
    for(const [k,v] of Object.entries(q.options||{})){
      html+=`<button class="opt-btn" id="opt-${k}" onclick="pickMCQ('${k}')">${k}) ${escHtml(v)}</button>`;
    }
  } else if(q.type==='fib'){
    html+=`<input class="fib-input" id="fib-in" type="text" placeholder="Type your answer…">`;
  } else {
    html+=`<textarea class="short-input" id="short-in" placeholder="Write your answer…"></textarea>`;
  }

  html+=`<div class="feedback" id="fb"></div>
    <button class="btn-next" id="btn-next" onclick="nextQ()">Check Answer ✓</button>
  </div>`;

  wrap.innerHTML=html;
  answered=false;
}

function pickMCQ(key){
  if(answered) return;
  document.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('opt-'+key).classList.add('selected');
}

function nextQ(){
  if(!answered){
    const q=QUESTIONS[cur];
    const fb=document.getElementById('fb');
    fb.style.display='block';

    if(q.type==='mcq'){
      const sel=document.querySelector('.opt-btn.selected');
      if(!sel){fb.className='feedback info';fb.innerText='Please select an option.';return;}
      const chosen=sel.id.replace('opt-','');
      const correct=q.answer.trim().toUpperCase()[0];
      if(chosen===correct){score++;sel.classList.add('correct');fb.className='feedback correct';fb.innerText='✅ Correct!';}
      else{sel.classList.add('wrong');fb.className='feedback wrong';fb.innerText='❌ Incorrect. Answer: '+correct+') '+((q.options||{})[correct]||q.answer);}
      document.querySelectorAll('.opt-btn').forEach(b=>b.style.pointerEvents='none');
    } else if(q.type==='fib'){
      const inp=document.getElementById('fib-in');
      if(!inp.value.trim()){fb.className='feedback info';fb.innerText='Please type an answer.';return;}
      const given=inp.value.trim().toLowerCase();
      const ans=q.answer.trim().toLowerCase();
      if(given===ans||ans.includes(given)){score++;fb.className='feedback correct';fb.innerText='✅ Correct! Answer: '+q.answer;}
      else{fb.className='feedback wrong';fb.innerText='❌ Model answer: '+q.answer;}
      inp.disabled=true;
    } else {
      const inp=document.getElementById('short-in');
      if(!inp.value.trim()){fb.className='feedback info';fb.innerText='Please write your answer.';return;}
      fb.className='feedback info';fb.innerText='📝 Model answer: '+q.answer;
      inp.disabled=true;
      score+=0.5; // partial credit for short answer attempts
    }

    document.getElementById('btn-next').innerText='Next →';
    answered=true;
    return;
  }

  cur++;
  if(cur>=QUESTIONS.length){ showResults(); return; }
  showQ();
}

function showResults(){
  document.getElementById('q-card-wrap').style.display='none';
  document.getElementById('progress-fill').style.width='100%';
  const res=document.getElementById('results');
  res.style.display='block';
  const maxScore=QUESTIONS.length;
  const pct=Math.round((score/maxScore)*100);
  document.getElementById('score-pct').innerText=pct+'%';
  let title,sub;
  if(pct>=80){title='Excellent! 🎉';sub='Outstanding performance. Well done!';}
  else if(pct>=60){title='Good effort! 👍';sub='You passed. Review the questions you missed.';}
  else if(pct>=40){title='Keep practising 📖';sub='Review the lesson and try again.';}
  else{title='Needs improvement 💪';sub='Go back to the lesson materials and try again.';}
  document.getElementById('result-title').innerText=title;
  document.getElementById('result-sub').innerText=sub+' ('+score.toFixed(1)+'/'+maxScore+')';

  // Report to MTTI LMS if available
  // Practice quiz — scores are not recorded in transcripts or unit results
}

function escHtml(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

initQuiz();
</script>
</body>
</html>
